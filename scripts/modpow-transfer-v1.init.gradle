// Optional research tasks; no production build or default task is changed.
// Usage and required -P arguments: docs/research/modpow-transfer-v1/result.md.
gradle.projectsEvaluated {
    def app = gradle.rootProject.project(':app')
    def required = { String key ->
        def value = gradle.rootProject.findProperty(key)
        if (value == null || value.toString().isBlank()) {
            throw new GradleException("Missing -P${key}")
        }
        value.toString()
    }
    app.tasks.register('modPowFrozenTrain', JavaExec) {
        group = 'verification'
        description = 'Run only the source-only TRAIN phase and create a new frozen model file.'
        dependsOn app.tasks.named('classes')
        classpath = app.sourceSets.main.runtimeClasspath
        mainClass = 'de.regelsuche.benchmark.ModPowFrozenTransfer'
        doFirst { setArgs(['train', required('transferTrain'), required('transferModel')]) }
    }
    app.tasks.register('modPowFrozenTest', JavaExec) {
        group = 'verification'
        description = 'Verify a frozen model hash before opening the separate TEST file.'
        dependsOn app.tasks.named('classes')
        classpath = app.sourceSets.main.runtimeClasspath
        mainClass = 'de.regelsuche.benchmark.ModPowFrozenTransfer'
        doFirst {
            setArgs(['test', required('transferModel'), required('transferSha'),
                required('transferTest'), required('transferResult')])
        }
    }
}
