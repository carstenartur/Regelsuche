// Opt-in pilot build adapter; does not modify any existing check or historical authority.
gradle.projectsEvaluated {
    def learning = gradle.rootProject.project(':regelsuche-learning')
    learning.tasks.register('externalPolynomialClasspath') {
        dependsOn learning.tasks.named('classes')
        def runtimeClasspath = learning.sourceSets.main.runtimeClasspath
        def destination = learning.layout.buildDirectory.file('external-polynomial-classpath.txt')
        inputs.files(runtimeClasspath).withPropertyName('runtimeClasspath')
        inputs.property('runtimeClasspathPaths', learning.provider { runtimeClasspath.asPath })
        outputs.file(destination)
        doLast {
            destination.get().asFile.text = runtimeClasspath.asPath
        }
    }
}
