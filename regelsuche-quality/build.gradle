plugins {
    id 'java-library'
}

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

dependencies {
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.22.3'
    implementation 'org.jacoco:org.jacoco.report:0.8.15'
    testImplementation libs.junit.jupiter
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    systemProperty 'regelsuche.repositoryRoot', rootProject.projectDir.absolutePath
}

// The existing coverage policy fails closed on every emitted JaCoCo XML and
// requires an evidence-backed floor for each declared module. This new module
// intentionally does not emit a coverage report in its bootstrap tranche: a
// guessed floor would violate the ratchet policy. A separate follow-up must
// measure a retained green run, declare the module floor and then enable JaCoCo.
def historyOutput = rootProject.layout.buildDirectory.dir(
    'reports/quality/jmh-history')

tasks.register('renderJmhHistory', JavaExec) {
    group = 'reporting'
    description = 'Validates and renders checksum-bound JMH history in Java.'
    dependsOn tasks.named('classes'), tasks.named('test')
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'de.regelsuche.quality.jmh.JmhHistoryMain'
    args rootProject.file('config/quality/jmh-history-policy.json'),
        rootProject.file('config/quality/jmh-regression-policy-v2.json'),
        historyOutput.get().asFile
    inputs.file rootProject.file('config/quality/jmh-history-policy.json')
    inputs.file rootProject.file('config/quality/jmh-regression-policy-v2.json')
    inputs.files rootProject.fileTree('config/quality/jmh-history') {
        include '*.json'
    }
    outputs.dir historyOutput
    outputs.upToDateWhen { false }
}

def slowTestJson = rootProject.layout.buildDirectory.file(
    'reports/quality/slow-tests.json')
def slowTestMarkdown = rootProject.layout.buildDirectory.file(
    'reports/quality/slow-tests.md')

tasks.register('reportSlowTests', JavaExec) {
    group = 'reporting'
    description = 'Transitional adapter that renders slow-test evidence with the Maven-tested Java implementation.'

    // Gradle remains only the temporary producer of the legacy checkout-wide
    // JUnit XML corpus. The aggregate root test task already owns every Test
    // task in the checkout. Keep this adapter deliberately free of additional
    // Gradle input modelling: it always executes, and the Java implementation
    // performs deterministic, fail-closed discovery after all tests complete.
    // This avoids creating a second Gradle reporting contract while issue #632
    // moves the authoritative lifecycle to Maven/JUnit.
    dependsOn rootProject.tasks.named('test'), tasks.named('classes')
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'de.regelsuche.quality.tests.SlowTestReportMain'
    args '--root', rootProject.projectDir.absolutePath,
        '--json-output', slowTestJson.get().asFile.absolutePath,
        '--markdown-output', slowTestMarkdown.get().asFile.absolutePath
    outputs.file slowTestJson
    outputs.file slowTestMarkdown
    outputs.upToDateWhen { false }
}

tasks.named('check') {
    dependsOn tasks.named('renderJmhHistory')
}

rootProject.tasks.named('check') {
    dependsOn tasks.named('renderJmhHistory')
}

// The Maven/JUnit-tested Java implementation owns policy, scanner provisioning,
// offline execution, retained outcomes and the failure decision. Gradle only
// provides the existing aggregate inventory and invokes that same authority.
tasks.register('verifySupplyChainVulnerabilities', JavaExec) {
    group = 'verification'
    description = 'Runs the required content-addressed offline Maven vulnerability gate.'
    dependsOn tasks.named('classes'), tasks.named('test'),
        rootProject.tasks.named('verifySupplyChainInventory')
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'de.regelsuche.quality.supplychain.VulnerabilityGateMain'
    args '--root', rootProject.projectDir.absolutePath,
        '--inventory', rootProject.file('build/reports/quality/supply-chain').absolutePath,
        '--output', rootProject.file('build/reports/quality/supply-chain/vulnerability').absolutePath
    outputs.upToDateWhen { false }
}

tasks.named('check') {
    dependsOn tasks.named('verifySupplyChainVulnerabilities')
}

rootProject.tasks.named('check') {
    dependsOn tasks.named('verifySupplyChainVulnerabilities')
}

// Stage the standard JaCoCo renderer and its small module-assembly adapter in
// the normal build. Convergence neither reruns tests nor resolves dependencies.
def coverageReportRuntime = tasks.register('coverageReportRuntime', Sync) {
    group = 'reporting'
    description = 'Retains the JaCoCo report runtime with the verification evidence.'
    from tasks.named('jar')
    from configurations.runtimeClasspath
    into rootProject.layout.buildDirectory.dir('reports/quality/coverage-report-runtime')
}

def coverageModules = new groovy.json.JsonSlurper().parse(
    rootProject.file('config/quality/coverage-policy.json')).modules.keySet()
rootProject.subprojects.findAll { it.name in coverageModules }.each { module ->
    module.plugins.withId('jacoco') {
        module.tasks.named('jacocoTestReport').configure { report ->
            def retainedInputs = module.layout.buildDirectory.dir('reports/jacoco/test/inputs')
            outputs.dir retainedInputs
            doLast {
                // Copy the actual report inputs, including its configured
                // exclusions and additional test data, rather than guessing
                // class paths or replacing one authority with another.
                module.sync {
                    into retainedInputs
                    duplicatesStrategy = DuplicatesStrategy.FAIL
                    from(report.executionData.filter { it.isFile() }) { into 'execution-data' }
                    from(module.files(report.classDirectories, report.additionalClassDirs)) { into 'classes' }
                    from(module.files(report.sourceDirectories, report.additionalSourceDirs)) { into 'sources' }
                }
            }
        }
    }
}

rootProject.tasks.named('generateCiPages').configure {
    dependsOn coverageReportRuntime
    inputs.file rootProject.file('config/quality/coverage-policy.json')
    outputs.upToDateWhen { false }
    def deferredSympy = providers.gradleProperty('separateSympyRuntimeAuthority').orNull == 'true' &&
        System.getenv('REGELSUCHE_SEPARATE_SYMPY_RUNTIME_AUTHORITY') == 'required-by-workflow'
    if (deferredSympy) {
        args '--tests-only'
    } else {
        dependsOn ':verifyCoverageRegression'
        dependsOn coverageModules.collect { ":${it}:jacocoTestReport" }
    }
}
