plugins {
    id 'java-library'
    id 'application'
    id 'jacoco'
}

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    mainClass = 'de.regelsuche.experiments.autopilot.AutonomousProductionCampaignMain'
}

dependencies {
    api project(':regelsuche-experiments')
    api project(':regelsuche-learning')
    api project(':regelsuche-discovery')

    testImplementation libs.junit.jupiter
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.register('runProductionGeneration', JavaExec) {
    group = 'verification'
    description = 'Runs the pinned target-free issue-348 production generation slice.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'de.regelsuche.experiments.autopilot.AutonomousProductionGenerationMain'
    args layout.buildDirectory.dir('reports/autopilot-production-generation')
        .get().asFile.absolutePath
}

tasks.register('runProductionMining', JavaExec) {
    group = 'verification'
    description = 'Runs pinned target-free generation and aggregate production mining.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'de.regelsuche.experiments.autopilot.AutonomousProductionMiningMain'
    args layout.buildDirectory.dir('reports/autopilot-production-mining')
        .get().asFile.absolutePath
}

tasks.register('runProductionLifecycle', JavaExec) {
    group = 'verification'
    description = 'Runs pinned generation, mining, validation, novelty, proof and lifecycle.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'de.regelsuche.experiments.autopilot.AutonomousProductionLifecycleMain'
    args layout.buildDirectory.dir('reports/autopilot-production-lifecycle')
        .get().asFile.absolutePath
}

tasks.register('runProductionCampaign', JavaExec) {
    group = 'verification'
    description = 'Runs the complete pinned issue-348 autonomous production campaign.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'de.regelsuche.experiments.autopilot.AutonomousProductionCampaignMain'
    args providers.gradleProperty('autopilotOutputDir').getOrElse(
        layout.buildDirectory.dir('reports/autopilot-production-campaign')
            .get().asFile.absolutePath)
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy tasks.named('jacocoTestReport')
}

jacoco {
    toolVersion = '0.8.13'
}

tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test')
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
}

tasks.named('check') {
    dependsOn tasks.named('jacocoTestReport')
}
