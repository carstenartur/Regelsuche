<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="830" viewBox="0 0 1000 830" role="img" aria-labelledby="title desc" xml:lang="de">
  <title id="title">AST-Regelradar: vom lokalen Zug zum neuen Ausdruck</title>
  <desc id="desc">Schematische Erklärung, kein protokollierter Suchlauf. Der Ausdruck (x + 1)² + 0 ist ein Zustand. Punkte an seinen AST-Knoten stehen für konkrete Regelanwendungen. Die ausgewählte Grundregel A + 0 → A am Wurzelknoten erzeugt (x + 1)². Eine andere Regel am Potenzknoten kann einen anderen vollständigen Ausdruck erzeugen. Jeder neue Ausdruck wird wieder als AST untersucht.</desc>
  <defs>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#172033}
      .heading{font-size:28px;font-weight:700}.section{font-size:21px;font-weight:700}
      .label{font-size:18px}.formula{font-family:monospace;font-size:22px}
      .small{font-size:16px}.nodeText{font-family:monospace;font-size:24px;text-anchor:middle;dominant-baseline:middle}
      .panel{fill:#f7f8fa;stroke:#c5cad3;stroke-width:1.5}
      .edge{stroke:#758096;stroke-width:2;fill:none}
      .arrow{stroke:#34445f;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
      .node{fill:white;stroke:#34445f;stroke-width:2}
      .halo{fill:none;stroke:#aeb5c2;stroke-width:1.5;stroke-dasharray:5 4}
      .baseMove{fill:#2f6fed;stroke:white;stroke-width:2}
      .learnedMove{fill:#8b5cf6;stroke:white;stroke-width:2}
      .selectedMove{fill:#0f9d70;stroke:white;stroke-width:3}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#34445f"/>
    </marker>
  </defs>
  <rect width="1000" height="830" fill="white"/>
  <text class="heading" x="32" y="44">Jeder Teilausdruck bietet konkrete Züge</text>
  <text class="label" x="32" y="76">Ein Ausdruck ist ein Zustand. Eine Regelanwendung erzeugt den nächsten.</text>

  <rect class="panel" x="24" y="104" width="484" height="390" rx="12"/>
  <text class="section" x="48" y="139">1. Ausdruck als Syntaxbaum (AST)</text>
  <text class="formula" x="48" y="171">(x + 1)² + 0</text>
  <!-- Edges are painted before nodes and labels. -->
  <path class="edge" d="M270 234 L174 316 M270 234 L372 316 M174 316 L110 394 M174 316 L258 394 M110 394 L68 456 M110 394 L152 456"/>
  <circle class="halo" cx="270" cy="234" r="43"/>
  <circle class="selectedMove" cx="270" cy="191" r="9"/>
  <circle class="baseMove" cx="311" cy="246" r="8"/>
  <circle class="node" cx="270" cy="234" r="24"/>
  <text class="nodeText" x="270" y="234">+</text>
  <circle class="halo" cx="174" cy="316" r="43"/>
  <circle class="baseMove" cx="153" cy="279" r="8"/>
  <circle class="learnedMove" cx="213" cy="298" r="8"/>
  <circle class="node" cx="174" cy="316" r="24"/>
  <text class="nodeText" x="174" y="316">^</text>
  <circle class="node" cx="372" cy="316" r="24"/>
  <text class="nodeText" x="372" y="316">0</text>
  <circle class="node" cx="110" cy="394" r="24"/>
  <text class="nodeText" x="110" y="394">+</text>
  <circle class="node" cx="258" cy="394" r="24"/>
  <text class="nodeText" x="258" y="394">2</text>
  <circle class="node" cx="68" cy="456" r="24"/>
  <text class="nodeText" x="68" y="456">x</text>
  <circle class="node" cx="152" cy="456" r="24"/>
  <text class="nodeText" x="152" y="456">1</text>
  <text class="small" x="310" y="414">Punkte = mögliche Züge</text>
  <text class="small" x="310" y="440">am jeweiligen Knoten</text>

  <rect class="panel" x="532" y="104" width="444" height="390" rx="12"/>
  <text class="section" x="556" y="139">2. Einen Zug auswählen</text>
  <circle class="selectedMove" cx="565" cy="180" r="9"/>
  <text class="label" x="586" y="186">A + 0 → A, am Wurzelknoten</text>
  <text class="small" x="556" y="222">Regel: ast_add_zero_right</text>
  <text class="small" x="556" y="248">Bindung: A = (x + 1)²</text>
  <text class="label" x="556" y="292">Vorher</text>
  <text class="formula" x="556" y="323">(x + 1)² + 0</text>
  <path class="arrow" d="M754 337 V365"/>
  <text class="label" x="556" y="390">Nachher</text>
  <text class="formula" x="556" y="421">(x + 1)²</text>
  <text class="small" x="556" y="463">Position, Bindung und Ergebnis bleiben prüfbar.</text>

  <circle class="baseMove" cx="42" cy="526" r="8"/>
  <text class="label" x="60" y="532">Grundregel</text>
  <circle class="learnedMove" cx="236" cy="526" r="8"/>
  <text class="label" x="254" y="532">Gelernte Regel</text>
  <circle class="selectedMove" cx="479" cy="526" r="9"/>
  <text class="label" x="498" y="532">Ausgewählter Zug</text>

  <text class="section" x="32" y="580">3. Andere Züge erzeugen andere vollständige Ausdruckszustände</text>
  <!-- Reserve a separate band for the graph, below its heading. -->
  <path class="arrow" d="M302 680 C380 680 384 644 470 644"/>
  <path class="arrow" d="M302 694 C380 694 384 731 470 731"/>
  <rect x="32" y="637" width="270" height="100" rx="12" fill="white" stroke="#34445f"/>
  <text class="label" x="56" y="670">Ausgangszustand</text>
  <text class="formula" x="56" y="710">(x + 1)² + 0</text>
  <rect x="470" y="610" width="506" height="74" rx="12" fill="#eefaf6" stroke="#0f9d70"/>
  <text class="label" x="494" y="638">Gewählte Grundregel am Wurzelknoten</text>
  <text class="formula" x="494" y="666">(x + 1)²</text>
  <rect x="470" y="700" width="506" height="74" rx="12" fill="#f4f0fc" stroke="#8b5cf6"/>
  <text class="label" x="494" y="728">Andere Regel am Potenzknoten</text>
  <text class="formula" x="494" y="756">x² + 2x + 1 + 0</text>
  <text class="small" x="32" y="810">Schema, kein protokollierter Suchlauf. Jeder neue Zustand bietet wieder lokale Regelanwendungen.</text>
</svg>
