<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">AST-Regelradar von Regelsuche</title>
  <desc id="desc">Ein mathematischer Ausdruck wird als abstrakter Syntaxbaum dargestellt. Um jeden Baumknoten liegt ein Kreis, auf dem konkrete anwendbare Umformungen als gleichmäßig verteilte Punkte erscheinen. Ein angewandter Punkt erzeugt durch einen lokalen Subtree-Rewrite einen neuen vollständigen Ausdruckszustand im globalen Suchgraphen.</desc>
  <defs>
    <style>
      .background { fill: #ffffff; }
      .panel { fill: #f7f8fa; stroke: #c5cad3; stroke-width: 1.5; rx: 14; }
      .title { font: 700 27px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .subtitle { font: 500 15px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #455066; }
      .section { font: 700 18px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .label { font: 600 14px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #273247; }
      .small { font: 500 12px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #4d586c; }
      .tiny { font: 500 11px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #4d586c; }
      .edge { stroke: #758096; stroke-width: 2; fill: none; }
      .search-edge { stroke: #34445f; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .node { fill: #ffffff; stroke: #34445f; stroke-width: 2; }
      .nodeText { font: 700 17px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #172033; text-anchor: middle; dominant-baseline: middle; }
      .halo { fill: none; stroke: #aeb5c2; stroke-width: 1.5; stroke-dasharray: 5 4; }
      .baseMove { fill: #2f6fed; stroke: #ffffff; stroke-width: 2; }
      .learnedMove { fill: #8b5cf6; stroke: #ffffff; stroke-width: 2; }
      .selectedMove { fill: #0f9d70; stroke: #ffffff; stroke-width: 3; }
      .inactiveMove { fill: #c9ced7; stroke: #ffffff; stroke-width: 2; }
      .callout { fill: #ffffff; stroke: #c5cad3; stroke-width: 1.2; rx: 8; }
      .step { fill: #ffffff; stroke: #8590a4; stroke-width: 1.5; rx: 10; }
      .state { fill: #ffffff; stroke: #34445f; stroke-width: 1.7; rx: 10; }
      .stateHighlight { fill: #eefaf6; stroke: #0f9d70; stroke-width: 2; rx: 10; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#34445f"/>
    </marker>
  </defs>

  <rect class="background" width="1200" height="760"/>
  <text class="title" x="40" y="46">AST-Regelradar: lokale Züge im mathematischen Spiel</text>
  <text class="subtitle" x="40" y="74">Ein Baum zeigt einen Ausdruckszustand. Punkte am Kreis zeigen konkrete, an dieser Position ausführbare Regelanwendungen.</text>

  <rect class="panel" x="30" y="100" width="650" height="470"/>
  <text class="section" x="54" y="132">1. Ein Ausdruckszustand als AST: (x + 1)² + 0</text>

  <!-- AST edges -->
  <path class="edge" d="M310 210 L205 290"/>
  <path class="edge" d="M310 210 L430 290"/>
  <path class="edge" d="M205 290 L130 380"/>
  <path class="edge" d="M205 290 L285 380"/>
  <path class="edge" d="M130 380 L85 475"/>
  <path class="edge" d="M130 380 L170 475"/>

  <!-- Root plus node with halo -->
  <circle class="halo" cx="310" cy="210" r="49"/>
  <circle class="node" cx="310" cy="210" r="25"/>
  <text class="nodeText" x="310" y="210">+</text>
  <circle class="selectedMove" cx="310" cy="161" r="8"/>
  <circle class="baseMove" cx="353" cy="186" r="7"/>
  <circle class="inactiveMove" cx="267" cy="186" r="7"/>

  <!-- Power node with halo -->
  <circle class="halo" cx="205" cy="290" r="55"/>
  <circle class="node" cx="205" cy="290" r="25"/>
  <text class="nodeText" x="205" y="290">^</text>
  <circle class="baseMove" cx="205" cy="235" r="8"/>
  <circle class="learnedMove" cx="253" cy="262" r="8"/>
  <circle class="baseMove" cx="157" cy="262" r="8"/>
  <circle class="inactiveMove" cx="205" cy="345" r="7"/>

  <!-- Inner plus node with halo -->
  <circle class="halo" cx="130" cy="380" r="43"/>
  <circle class="node" cx="130" cy="380" r="25"/>
  <text class="nodeText" x="130" y="380">+</text>
  <circle class="baseMove" cx="130" cy="337" r="7"/>
  <circle class="inactiveMove" cx="167" cy="401" r="7"/>
  <circle class="inactiveMove" cx="93" cy="401" r="7"/>

  <!-- Remaining nodes -->
  <circle class="node" cx="430" cy="290" r="24"/>
  <text class="nodeText" x="430" y="290">0</text>
  <circle class="node" cx="285" cy="380" r="24"/>
  <text class="nodeText" x="285" y="380">2</text>
  <circle class="node" cx="85" cy="475" r="24"/>
  <text class="nodeText" x="85" y="475">x</text>
  <circle class="node" cx="170" cy="475" r="24"/>
  <text class="nodeText" x="170" y="475">1</text>

  <!-- Callouts -->
  <rect class="callout" x="390" y="154" width="248" height="78"/>
  <text class="label" x="406" y="178">Konkrete Regelanwendung</text>
  <text class="small" x="406" y="199">ast_add_zero_right, Position root</text>
  <text class="small" x="406" y="217">Ergebnis: (x + 1)²</text>
  <path class="edge" d="M390 190 L320 164"/>

  <rect class="callout" x="360" y="350" width="278" height="105"/>
  <text class="label" x="376" y="374">Am selben Knoten mehrere Züge</text>
  <circle class="baseMove" cx="380" cy="397" r="6"/>
  <text class="small" x="394" y="401">atomare Grundregel</text>
  <circle class="learnedMove" cx="380" cy="421" r="6"/>
  <text class="small" x="394" y="425">validierte, gelernte Makroregel</text>
  <circle class="inactiveMove" cx="380" cy="445" r="6"/>
  <text class="small" x="394" y="449">gefiltert / nicht ausgewählt</text>
  <path class="edge" d="M360 389 L259 274"/>

  <text class="tiny" x="54" y="548">Der Kreis gehört zur Baumposition. Jeder Punkt enthält Regel-ID, Herkunft, Bindungen, Annahmen, Vorschau und Validierungsstatus.</text>

  <!-- Pipeline panel -->
  <rect class="panel" x="705" y="100" width="465" height="470"/>
  <text class="section" x="729" y="132">2. Was beim Expandieren eines Zustands geschieht</text>

  <rect class="step" x="745" y="160" width="385" height="55"/>
  <text class="label" x="765" y="184">1 · Enumerieren</text>
  <text class="small" x="765" y="203">Alle AST-Positionen × alle aktiven Regelquellen</text>

  <path class="search-edge" d="M938 215 L938 235"/>
  <rect class="step" x="745" y="235" width="385" height="55"/>
  <text class="label" x="765" y="259">2 · Bewerten und auswählen</text>
  <text class="small" x="765" y="278">Strategie, Ziel, Kosten, Budgets, Annahmen</text>

  <path class="search-edge" d="M938 290 L938 310"/>
  <rect class="step" x="745" y="310" width="385" height="55"/>
  <text class="label" x="765" y="334">3 · Lokal anwenden</text>
  <text class="small" x="765" y="353">Subtree ersetzen, unveränderte Eltern neu aufbauen</text>

  <path class="search-edge" d="M938 365 L938 385"/>
  <rect class="step" x="745" y="385" width="385" height="55"/>
  <text class="label" x="765" y="409">4 · Kanonisieren und prüfen</text>
  <text class="small" x="765" y="428">Duplikate, Wachstum, Proof-/Validation-Metadaten</text>

  <path class="search-edge" d="M938 440 L938 460"/>
  <rect class="step" x="745" y="460" width="385" height="70"/>
  <text class="label" x="765" y="485">5 · Suchkante erzeugen</text>
  <text class="small" x="765" y="504">vollständiger Ausdruck vorher → nachher</text>
  <text class="small" x="765" y="521">plus Position, Regel, Bindungen und Replay-Evidence</text>

  <!-- Global search graph -->
  <text class="section" x="40" y="617">3. Der AST ist ein Zustand; angewandte Punkte erzeugen den globalen Suchgraphen</text>

  <rect class="state" x="55" y="650" width="215" height="68"/>
  <text class="label" x="72" y="676">E₀</text>
  <text class="small" x="72" y="699">(x + 1)² + 0</text>

  <rect class="stateHighlight" x="390" y="615" width="215" height="68"/>
  <text class="label" x="407" y="641">E₁ · Grundregel</text>
  <text class="small" x="407" y="664">(x + 1)²</text>

  <rect class="state" x="390" y="695" width="215" height="48"/>
  <text class="label" x="407" y="718">E₂ · gelernte Regel</text>
  <text class="small" x="407" y="737">x² + 2x + 1 + 0</text>

  <rect class="state" x="760" y="650" width="250" height="68"/>
  <text class="label" x="777" y="676">weitere Zustände …</text>
  <text class="small" x="777" y="699">erneut AST + lokales Regelradar</text>

  <path class="search-edge" d="M270 680 C325 680 325 649 390 649"/>
  <path class="search-edge" d="M270 689 C325 703 330 719 390 719"/>
  <path class="search-edge" d="M605 649 C665 649 690 674 760 680"/>
  <path class="search-edge" d="M605 719 C670 719 690 694 760 688"/>

  <text class="tiny" x="1025" y="679">Suche = wiederholtes</text>
  <text class="tiny" x="1025" y="696">Anwenden dieses Zyklus</text>
</svg>
