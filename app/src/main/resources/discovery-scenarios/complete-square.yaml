id: complete-square-factorization
displayName: Complete-square factorization
inputExpression: "x ^ 2 + 6 * x + 5"
targetExpression: "(x + 1) * (x + 5)"
expectations:
  - BRIDGE_REQUIRED
  - CONVERGENCE_REQUIRED
enabledOperators:
  - complete_square_bridge
enabledRulePacks:
  - sympy-polynomial-basic
requiredBridgeEffects:
  - BRIDGING
requiredRuleFamilies:
  - complete_square
  - factor
requiredBridgeRules:
  - complete_square_bridge
  - ast_square_difference_factor
budgets:
  maxDepth: 6
  maxStates: 120
  timeoutMillis: 5000
gallery:
  generateSvg: true
  preferredPathCount: 2
  minVisibleNodes: 8
