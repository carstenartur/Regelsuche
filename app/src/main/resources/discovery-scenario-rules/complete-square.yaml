id: complete-square
rules:
  - id: bridge_complete_square_decomposition
    from: "x ^ 2 + 6 * x + 5"
    to: "x ^ 2 + 2 * 3 * x + 3 ^ 2 - 4"
    kind: EXPAND
    costDelta: 4
    effects: [BRIDGING, EXPANDING]
    family: complete_square
  - id: ast_binomial_square_factor
    from: "x ^ 2 + 2 * 3 * x + 3 ^ 2 - 4"
    to: "(x + 3) ^ 2 - 4"
    kind: FACTOR
    costDelta: -5
    effects: [FACTORIZING]
    family: factor
  - id: bridge_constant_square_rewrite
    from: "(x + 3) ^ 2 - 4"
    to: "(x + 3) ^ 2 - 2 ^ 2"
    kind: NORMALIZE
    costDelta: -1
    effects: [BRIDGING, NORMALIZING]
    family: complete_square
  - id: ast_square_difference_factor
    from: "(x + 3) ^ 2 - 2 ^ 2"
    to: "((x + 3) - 2) * ((x + 3) + 2)"
    kind: FACTOR
    costDelta: -4
    effects: [FACTORIZING]
    family: factor
  - id: bridge_linear_factor_simplify
    from: "((x + 3) - 2) * ((x + 3) + 2)"
    to: "(x + 1) * (x + 5)"
    kind: SIMPLIFY
    costDelta: -2
    effects: [BRIDGING, SIMPLIFYING]
    family: factor
