plugins {
    id 'application'
    id 'jacoco'
    id 'me.champeau.jmh' version '0.7.3'
}

repositories {
    mavenCentral()
}

def vendorWebRoot = layout.projectDirectory.dir('src/main/resources/web/vendor')
def vendorKatexDir = vendorWebRoot.dir('katex')
def vendorCytoscapeDir = vendorWebRoot.dir('cytoscape')

dependencies {
    implementation project(':regelsuche-core')
    implementation project(':regelsuche-egraph')
    implementation project(':regelsuche-search')
    implementation project(':regelsuche-validation')
    implementation project(':regelsuche-math-algorithms')
    implementation project(':regelsuche-persistence')
    implementation project(':regelsuche-persistence-hibernate')
    implementation project(':regelsuche-learning')
    implementation project(':regelsuche-experiments')
    implementation project(':regelsuche-cli')
    implementation project(':regelsuche-discovery')
    implementation 'org.neo4j.driver:neo4j-java-driver:6.1.0'
    implementation 'jakarta.persistence:jakarta.persistence-api:3.2.0'
    implementation 'org.graalvm.polyglot:polyglot:24.2.1'
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:2.20.1'

    testImplementation libs.junit.jupiter
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    mainClass = 'de.regelsuche.App'
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy tasks.named('jacocoTestReport')
    systemProperty 'regelsuche.recordDocs',
        providers.gradleProperty('regelsuche.recordDocs').getOrElse('false')
}

// ─── Coverage (JaCoCo) ────────────────────────────────────────────────
//
// Generates HTML + XML reports under `app/build/reports/jacoco/test/`.
// XML feeds the shields.io endpoint badge built by the CI workflow.
jacoco {
    toolVersion = '0.8.13'
}

tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test')
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
}

tasks.named('check') {
    dependsOn tasks.named('jacocoTestReport')
}

// ─── JMH micro-benchmarks ─────────────────────────────────────────────
//
// Source set `src/jmh/java`. Run with `./gradlew :app:jmh`. CI publishes the
// JSON result via benchmark-action/github-action-benchmark to gh-pages.
jmh {
    resultFormat = 'JSON'
    resultsFile = layout.buildDirectory.file('reports/jmh/result.json')
    fork = 1
    warmupIterations = 2
    iterations = 3
    timeOnIteration = '1s'
    warmup = '1s'
    failOnError = true
}

// ─── Professional end-to-end demo tests ────────────────────────────────
//
// A dedicated source set so the browser stack (Playwright, Testcontainers,
// screenshot/video recording) is not pulled into the normal unit-test
// classpath. The `e2eTest` task is opt-in: `./gradlew e2eTest` runs the
// flows headlessly; `./gradlew e2eTest -Pregelsuche.recordDocs=true` also
// updates the screenshots / videos under `docs/assets/`.
sourceSets {
    e2eTest {
        java.srcDir 'src/e2eTest/java'
        resources.srcDir 'src/e2eTest/resources'
        compileClasspath += sourceSets.main.output + sourceSets.test.output + configurations.testRuntimeClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.test.output + configurations.testRuntimeClasspath
    }
    dockerE2eTest {
        java.srcDir 'src/dockerE2eTest/java'
        resources.srcDir 'src/dockerE2eTest/resources'
        compileClasspath += sourceSets.main.output + configurations.runtimeClasspath
        runtimeClasspath += sourceSets.main.output + configurations.runtimeClasspath
    }
}

configurations {
    e2eTestImplementation.extendsFrom testImplementation
    e2eTestRuntimeOnly.extendsFrom testRuntimeOnly
    dockerE2eTestImplementation.extendsFrom testImplementation
    dockerE2eTestRuntimeOnly.extendsFrom testRuntimeOnly
    webAssets
}

def vendorJar = { String artifact ->
    def jar = configurations.webAssets.resolve().find { it.name.startsWith(artifact + '-') }
    if (jar == null) {
        throw new GradleException("Missing web asset jar for ${artifact}")
    }
    jar
}

tasks.register('vendorKatexAssets', Sync) {
    from({ zipTree(vendorJar('katex')) }) {
        include 'META-INF/resources/webjars/katex/*/dist/katex.min.css'
        include 'META-INF/resources/webjars/katex/*/dist/katex.min.js'
        include 'META-INF/resources/webjars/katex/*/dist/contrib/auto-render.min.js'
        include 'META-INF/resources/webjars/katex/*/dist/fonts/**'
        include 'META-INF/resources/webjars/katex/*/LICENSE'
        include 'META-INF/resources/webjars/katex/*/README.md'
        eachFile { file ->
            file.path = file.path.replaceFirst(
                /^META-INF\/resources\/webjars\/katex\/[^\/]+\/dist\//, '')
            file.path = file.path.replaceFirst(
                /^META-INF\/resources\/webjars\/katex\/[^\/]+\//, '')
        }
        includeEmptyDirs = false
    }
    into(vendorKatexDir)
}

tasks.register('vendorCytoscapeAssets', Sync) {
    from({ zipTree(vendorJar('cytoscape')) }) {
        include 'META-INF/resources/webjars/cytoscape/*/dist/cytoscape.min.js'
        include 'META-INF/resources/webjars/cytoscape/*/LICENSE'
        include 'META-INF/resources/webjars/cytoscape/*/README.md'
        eachFile { file ->
            file.path = file.path.replaceFirst(
                /^META-INF\/resources\/webjars\/cytoscape\/[^\/]+\/dist\//, '')
            file.path = file.path.replaceFirst(
                /^META-INF\/resources\/webjars\/cytoscape\/[^\/]+\//, '')
        }
        includeEmptyDirs = false
    }
    into(vendorCytoscapeDir)
}

tasks.register('vendorWebAssets') {
    description = 'Vendors KaTeX and Cytoscape assets from WebJars into src/main/resources/web/vendor.'
    group = 'build setup'
    dependsOn tasks.named('vendorKatexAssets'), tasks.named('vendorCytoscapeAssets')
}

tasks.named('processResources') {
    dependsOn tasks.named('vendorWebAssets')
}

tasks.named('processE2eTestResources') {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

dependencies {
    e2eTestImplementation 'com.microsoft.playwright:playwright:1.60.0'
    e2eTestImplementation platform(libs.testcontainers.bom)
    e2eTestImplementation libs.testcontainers.core
    e2eTestImplementation libs.testcontainers.junit
    dockerE2eTestImplementation platform(libs.testcontainers.bom)
    dockerE2eTestImplementation libs.testcontainers.core
    dockerE2eTestImplementation libs.testcontainers.junit
    dockerE2eTestImplementation 'com.microsoft.playwright:playwright:1.60.0'
    dockerE2eTestImplementation libs.junit.jupiter
    dockerE2eTestRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    webAssets 'org.webjars.npm:katex:0.16.47'
    // 3.28.1 is not published as a WebJar on Maven Central; 3.27.0 is the
    // closest available self-hostable npm WebJar.
    webAssets 'org.webjars.npm:cytoscape:3.27.0'
}

tasks.register('installPlaywrightBrowsers', JavaExec) {
    description = 'Downloads the Chromium browser that Playwright drives.'
    group = 'verification'
    classpath = sourceSets.e2eTest.runtimeClasspath
    mainClass = 'com.microsoft.playwright.CLI'
    args 'install', 'chromium'
    // Fail fast in CI/local runs when browser install fails, so the error is
    // surfaced at this step.
}

tasks.register('installPlaywrightHostDependencies', JavaExec) {
    description = 'Installs Linux host libraries required by Playwright Chromium.'
    group = 'verification'
    classpath = sourceSets.e2eTest.runtimeClasspath
    mainClass = 'com.microsoft.playwright.CLI'
    args 'install-deps', 'chromium'
}

tasks.register('benchmarkReport', JavaExec) {
    description = 'Runs the benchmark suite and writes docs/benchmark-report.md ' +
        '+ docs/assets/benchmark-summary.json (the quality dashboard).'
    group = 'documentation'
    dependsOn tasks.named('classes')
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'de.regelsuche.App'
    args 'benchmark',
        '--report=' + rootProject.file('docs/benchmark-report.md').absolutePath,
        '--summary=' + rootProject.file('docs/assets/benchmark-summary.json').absolutePath,
        '--quiet'
}

tasks.register('generateDiscoveryGallery', JavaExec) {
    description = 'Generates public discovery evidence gallery assets under docs/generated/discovery.'
    group = 'documentation'
    dependsOn tasks.named('classes')
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'de.regelsuche.docs.DocsDiscoveryGalleryGenerator'
    args rootProject.projectDir.absolutePath
}

tasks.register('runDiscoveryCampaign1', JavaExec) {
    description = 'Runs Discovery Campaign 1 and writes reports under app/build/reports/discovery-campaign-1.'
    group = 'documentation'
    dependsOn tasks.named('classes')
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'de.regelsuche.docs.DiscoveryCampaignOneRunner'
    args rootProject.projectDir.absolutePath
}


tasks.register('runDiscoveryCampaign2', JavaExec) {
    description = 'Runs Discovery Campaign 2 and writes reports under app/build/reports/discovery-campaign-2.'
    group = 'documentation'
    dependsOn tasks.named('classes')
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'de.regelsuche.docs.DiscoveryCampaignTwoRunner'
    args rootProject.projectDir.absolutePath
}

tasks.register('e2eTest', Test) {
    description = 'Browser-driven end-to-end demo flows (Playwright). Use ' +
        '-Pregelsuche.recordDocs=true to refresh docs/assets/{screenshots,videos}.'
    group = 'verification'
    if (!providers.gradleProperty('regelsuche.skipPlaywrightInstall')
        .map { it.toBoolean() }
        .getOrElse(false)) {
        dependsOn tasks.named('installPlaywrightBrowsers')
    }
    testClassesDirs = sourceSets.e2eTest.output.classesDirs
    classpath = sourceSets.e2eTest.runtimeClasspath
    useJUnitPlatform()
    shouldRunAfter tasks.named('test')
    // System property is consumed by BrowserDemoFlowTest.
    systemProperty 'regelsuche.recordDocs',
        providers.gradleProperty('regelsuche.recordDocs').getOrElse('false')
    systemProperty 'regelsuche.updateScreenshots',
        providers.gradleProperty('regelsuche.updateScreenshots').getOrElse('false')
    // Visual-regression suite (MathRenderingVisualTest) is opt-in: pixel
    // baselines drift across rendering environments, so CI keeps it off
    // by default. Run locally with -Pregelsuche.runVisualTests=true and
    // refresh baselines with -Pregelsuche.updateScreenshots=true.
    systemProperty 'regelsuche.runVisualTests',
        providers.gradleProperty('regelsuche.runVisualTests').getOrElse('false')
    // Surface useful Playwright output during long-running browser runs.
    testLogging {
        events 'passed', 'skipped', 'failed'
        showStandardStreams = true
    }
}

tasks.named('processDockerE2eTestResources') {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.register('dockerE2eTest', Test) {
    description = 'Docker-image-based integration tests using Testcontainers. ' +
        'Builds the project Docker image and verifies asset serving and rendering in the real container.'
    group = 'verification'
    testClassesDirs = sourceSets.dockerE2eTest.output.classesDirs
    classpath = sourceSets.dockerE2eTest.runtimeClasspath
    useJUnitPlatform()
    shouldRunAfter tasks.named('test')
    // Pass the project root so ImageFromDockerfile can find the Dockerfile.
    systemProperty 'regelsuche.projectRoot', rootProject.projectDir.absolutePath
    systemProperty 'regelsuche.discoveryArtifactsDir',
        layout.buildDirectory.dir('discovery-artifacts').get().asFile.absolutePath
    testLogging {
        events 'passed', 'skipped', 'failed'
        showStandardStreams = true
    }
    // Do NOT wire into 'check' — run explicitly or in CI docker-image-e2e job.
}
