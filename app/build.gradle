plugins {
    id 'application'
    id 'jacoco'
    id 'me.champeau.jmh' version '0.7.3'
}

repositories {
    mavenCentral()
}

def vendorWebRoot = layout.projectDirectory.dir('src/main/resources/web/vendor')
def vendorKatexDir = vendorWebRoot.dir('katex')
def vendorCytoscapeDir = vendorWebRoot.dir('cytoscape')

dependencies {
    implementation project(':regelsuche-core')
    implementation project(':regelsuche-egraph')
    implementation project(':regelsuche-search')
    implementation project(':regelsuche-validation')
    implementation project(':regelsuche-math-algorithms')
    implementation project(':regelsuche-persistence')
    implementation project(':regelsuche-persistence-hibernate')
    implementation project(':regelsuche-learning')
    implementation project(':regelsuche-experiments')
    implementation project(':regelsuche-cli')
    implementation project(':regelsuche-discovery')
    implementation 'org.neo4j.driver:neo4j-java-driver:6.1.0'
    implementation 'jakarta.persistence:jakarta.persistence-api:3.2.0'
    implementation 'org.graalvm.polyglot:polyglot:24.2.1'
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:2.22.0'

    testImplementation project(':regelsuche-solver-portfolio')
    testImplementation libs.junit.jupiter
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    mainClass = 'de.regelsuche.App'
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy tasks.named('jacocoTestReport')
    systemProperty 'regelsuche.recordDocs',
        providers.gradleProperty('regelsuche.recordDocs').getOrElse('false')
}

// ─── Coverage (JaCoCo) ────────────────────────────────────────────────
//
// Generates HTML + XML reports under `app/build/reports/jacoco/test/`.
// XML feeds the shields.io endpoint badge built by the CI workflow.
jacoco {
    toolVersion = '0.8.13'
}

tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test')
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
}

tasks.named('check') {
    dependsOn tasks.named('jacocoTestReport')
}

// ─── JMH micro-benchmarks ─────────────────────────────────────────────
//
// Source set `src/jmh/java`. Run with `./gradlew :app:jmh`. CI publishes the
// JSON result via benchmark-action/github-action-benchmark to gh-pages.
jmh {
    resultFormat = 'JSON'
    resultsFile = layout.buildDirectory.file('reports/jmh/result.json')
}
