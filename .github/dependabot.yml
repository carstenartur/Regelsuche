version: 2

registries:
  gradle-plugin-portal:
    type: maven-repository
    url: https://plugins.gradle.org/m2
    username: dummy # Required by Dependabot for a declared Maven registry.
    password: dummy # The public plugin portal does not authenticate this value.

updates:
  # The root Gradle build includes every subproject through settings.gradle.
  # Bundle only routine minor/patch maintenance with similar risk. Dependencies
  # not matched by these groups remain eligible for their own reviewable PRs,
  # including major, UI-sensitive, GraalVM and Playwright updates.
  - package-ecosystem: gradle
    directory: /
    registries:
      - gradle-plugin-portal
    schedule:
      interval: weekly
    groups:
      runtime-maintenance:
        patterns:
          - "com.fasterxml.jackson.*:*"
          - "org.neo4j.driver:*"
          - "com.google.guava:*"
          - "org.junit.jupiter:*"
          - "org.postgresql:*"
          - "org.hibernate.*:*"
          - "org.eclipse:yasson"
        update-types:
          - "minor"
          - "patch"
      build-tooling-maintenance:
        patterns:
          - "gradle-wrapper"
        update-types:
          - "minor"
          - "patch"

  # Keep all action families used by the ordinary CI and release workflows in
  # scope, including actions/*, gradle/actions, peaceiris/actions-gh-pages and
  # peter-evans/create-pull-request. Immutable SHA pins remain visible and are
  # updated together with their readable version comments.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      workflow-actions:
        patterns:
          - "*"

  # Keep the declared Java major explicit. Java-25 image patch/minor updates are
  # grouped; a Java-major migration remains intentionally blocked until the
  # project itself changes its Java contract. Other Docker images, especially
  # Playwright, remain eligible for separate PRs. The visual-regression contract
  # then fails closed until a Playwright image update is synchronized with the
  # matching Java dependency update.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "eclipse-temurin"
        update-types:
          - "version-update:semver-major"
    groups:
      java-base-images:
        patterns:
          - "eclipse-temurin"
        update-types:
          - "minor"
          - "patch"
