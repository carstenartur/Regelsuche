version: 2

registries:
  gradle-plugin-portal:
    type: maven-repository
    url: https://plugins.gradle.org/m2
    username: dummy # Required by Dependabot for a declared Maven registry.
    password: dummy # The public plugin portal does not authenticate this value.

updates:
  # The root Gradle build includes every subproject through settings.gradle.
  # No allow-list is used: public plugins and libraries actually referenced by
  # the checkout must not silently fall outside dependency update coverage.
  - package-ecosystem: gradle
    directory: /
    registries:
      - gradle-plugin-portal
    schedule:
      interval: weekly
    groups:
      gradle-dependencies:
        patterns:
          - "*"

  # Keep all action families used by the ordinary CI and release workflows in
  # scope, including actions/*, gradle/actions, peaceiris/actions-gh-pages and
  # peter-evans/create-pull-request. Immutable SHA pins remain visible and are
  # updated together with their readable version comments.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      workflow-actions:
        patterns:
          - "*"

  # Keep the root Dockerfile base images current.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      docker-base-images:
        patterns:
          - "*"
