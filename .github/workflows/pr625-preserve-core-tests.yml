name: Preserve PR 625 core test contracts

on:
  push:
    branches:
      - research/historical-rediscovery-atlas-v1

permissions:
  contents: write

jobs:
  preserve:
    name: Restore main tests and remove only duplicate atlas fixtures
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: research/historical-rediscovery-atlas-v1
          fetch-depth: 0

      - name: Preserve the dedicated core contracts
        shell: bash
        run: |
          set -euo pipefail

          git checkout origin/main -- \
            regelsuche-core/src/test/java/de/regelsuche/transform/BoundedRewriteReachabilityOracleTest.java \
            regelsuche-core/src/test/java/de/regelsuche/transform/KnownDerivationBenchmarkTest.java \
            regelsuche-core/src/test/resources/de/regelsuche/transform/known-derivation-corpus.json

          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "regelsuche-experiments/src/test/java/de/regelsuche/benchmark/"
              "HistoricalRediscoveryAtlasTest.java"
          )
          text = path.read_text(encoding="utf-8")

          def remove_between(source: str, start_marker: str, end_marker: str) -> str:
              start = source.find(start_marker)
              end = source.find(end_marker, start + len(start_marker))
              if start < 0 or end < 0:
                  raise SystemExit(
                      f"cannot remove duplicate block: start={start}, end={end}, "
                      f"marker={start_marker!r}"
                  )
              return source[:start] + source[end:]

          text = remove_between(
              text,
              "    @Test\n    void broaderRecognitionStrictlyIncreasesKnownDerivationCoverage() {\n",
              "    @Test\n    void boundedOracleDistinguishesWitnessClosureAndBudget() {\n",
          )
          text = remove_between(
              text,
              "    @Test\n    void boundedOracleDistinguishesWitnessClosureAndBudget() {\n",
              "    @Test\n    void targetBlindStructuralCellsRetainAStarvedExpansion() {\n",
          )
          text = remove_between(
              text,
              "    private RecognitionSummary runRecognitionCorpus(\n",
              "    private static Transformation transformation(\n",
          )

          records_start = text.find("    private enum RecognitionLayer {\n")
          if records_start < 0 or not text.rstrip().endswith("}"):
              raise SystemExit("cannot locate duplicate recognition helper records")
          text = text[:records_start] + "}\n"

          obsolete_lines = {
              "import static de.regelsuche.ast.BinaryOperator.ADD;",
              "import static de.regelsuche.ast.BinaryOperator.MUL;",
              "import static de.regelsuche.ast.BinaryOperator.POW;",
              "import static de.regelsuche.ast.BinaryOperator.SUB;",
              "import de.regelsuche.parse.ExpressionFormatter;",
              "import de.regelsuche.parse.ExpressionParser;",
              "import de.regelsuche.transform.AstRewriteTransformationEngine;",
              "import de.regelsuche.transform.BoundedRewriteReachabilityOracle;",
              "import de.regelsuche.transform.PatternExpr;",
              "import de.regelsuche.transform.PatternRewriteRule;",
              "import de.regelsuche.transform.RecognitionProfile;",
              "import de.regelsuche.transform.RewriteRule;",
              "import java.util.ArrayDeque;",
              "import java.util.ArrayList;",
              "import java.util.EnumMap;",
              "    private static final int MAX_RECOGNITION_STATES = 1_000;",
              "    private final ExpressionParser parser = new ExpressionParser();",
          }
          lines = text.splitlines()
          present = obsolete_lines.intersection(lines)
          missing = obsolete_lines - present
          if missing:
              raise SystemExit("expected obsolete lines are missing: " + repr(sorted(missing)))
          lines = [line for line in lines if line not in obsolete_lines]
          text = "\n".join(lines) + "\n"

          forbidden = (
              "broaderRecognitionStrictlyIncreasesKnownDerivationCoverage",
              "boundedOracleDistinguishesWitnessClosureAndBudget",
              "RecognitionSummary",
              "RecognitionLayer",
              "private static TransformationEngine graph",
          )
          leftovers = [value for value in forbidden if value in text]
          if leftovers:
              raise SystemExit("duplicate helpers remain: " + repr(leftovers))
          path.write_text(text, encoding="utf-8")
          PY

          git diff --check
          test -f regelsuche-core/src/test/java/de/regelsuche/transform/BoundedRewriteReachabilityOracleTest.java
          test -f regelsuche-core/src/test/java/de/regelsuche/transform/KnownDerivationBenchmarkTest.java
          test -f regelsuche-core/src/test/resources/de/regelsuche/transform/known-derivation-corpus.json

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add \
            regelsuche-core/src/test/java/de/regelsuche/transform/BoundedRewriteReachabilityOracleTest.java \
            regelsuche-core/src/test/java/de/regelsuche/transform/KnownDerivationBenchmarkTest.java \
            regelsuche-core/src/test/resources/de/regelsuche/transform/known-derivation-corpus.json \
            regelsuche-experiments/src/test/java/de/regelsuche/benchmark/HistoricalRediscoveryAtlasTest.java
          git rm -- .github/workflows/pr625-preserve-core-tests.yml
          git commit -m "Preserve dedicated reachability test contracts"
          git push origin HEAD:research/historical-rediscovery-atlas-v1
