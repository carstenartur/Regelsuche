name: Typed ModPow replay development tests
on:
  push:
    branches: ['qa/1026-conditional-replay']
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '25'
          verify-signature: true
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          cache-read-only: true
      - name: Run actual contextual arithmetic integration
        run: ./gradlew --no-daemon --no-configuration-cache :app:test --tests 'de.regelsuche.benchmark.TypedModPowTransferIntegrationTest' --console=plain
      - name: Record exact source and JUnit outcome
        if: always()
        run: |
          git rev-parse HEAD
          python3 - <<'PY'
          import json, pathlib, xml.etree.ElementTree as ET
          path = pathlib.Path('app/build/test-results/test/TEST-de.regelsuche.benchmark.TypedModPowTransferIntegrationTest.xml')
          root = ET.parse(path).getroot()
          report = {key: root.attrib[key] for key in ('tests', 'failures', 'errors', 'skipped')}
          report['failedCases'] = [{'name': case.attrib['name'], 'messages': [failure.attrib.get('message', '') for failure in case.findall('failure')]} for case in root.findall('testcase') if case.find('failure') is not None]
          print('TYPED_MODPOW_REPLAY_JUNIT=' + json.dumps(report, sort_keys=True))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: typed-modpow-replay-development
          path: |
            app/build/test-results/test/**
            app/build/reports/tests/test/**
          if-no-files-found: error
