name: Typed ModPow replay development tests
on:
  push:
    branches: ['qa/1026-conditional-replay']
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '25'
          verify-signature: true
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          cache-read-only: true
      - name: Run actual contextual arithmetic integration
        run: ./gradlew --no-daemon --no-configuration-cache :app:test --tests 'de.regelsuche.benchmark.TypedModPowTransferIntegrationTest' --console=plain
      - name: Run complete learning and experiments module suites
        run: ./gradlew --no-daemon --no-configuration-cache :regelsuche-learning:test :regelsuche-experiments:test --console=plain
      - name: Record exact source and JUnit outcomes
        if: always()
        run: |
          git rev-parse HEAD
          git diff --exit-code
          python3 - <<'PY'
          import json, pathlib, xml.etree.ElementTree as ET
          keys = ('tests', 'failures', 'errors', 'skipped')
          for module in ('app', 'regelsuche-learning', 'regelsuche-experiments'):
              paths = sorted(pathlib.Path(module, 'build/test-results/test').glob('TEST-*.xml'))
              if not paths:
                  raise SystemExit('Missing JUnit results: ' + module)
              totals = {key: 0 for key in keys}
              failed = []
              for path in paths:
                  root = ET.parse(path).getroot()
                  for key in keys:
                      totals[key] += int(root.attrib[key])
                  for case in root.findall('testcase'):
                      messages = [failure.attrib.get('message', '') for failure in case.findall('failure') + case.findall('error')]
                      if messages:
                          failed.append({'suite': path.name, 'name': case.attrib['name'], 'messages': messages})
              print('TYPED_MODPOW_REPLAY_JUNIT=' + json.dumps({'module': module, 'suites': len(paths), **totals, 'failedCases': failed}, sort_keys=True))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: typed-modpow-replay-development
          path: |
            app/build/test-results/test/**
            app/build/reports/tests/test/**
            regelsuche-learning/build/test-results/test/**
            regelsuche-learning/build/reports/tests/test/**
            regelsuche-experiments/build/test-results/test/**
            regelsuche-experiments/build/reports/tests/test/**
          if-no-files-found: error
