name: AI Knowledge

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'ai-knowledge/**'
      - 'docs/generated/discovery/**'
      - '**/src/main/java/**'
      - '**/src/test/java/**'
      - '**/src/jmh/java/**'
      - '**/build.gradle'
      - 'settings.gradle'
      - '.github/workflows/ai-knowledge.yml'
  push:
    branches: [ main ]
    paths:
      - 'ai-knowledge/**'
      - 'docs/generated/discovery/**'
      - '**/src/main/java/**'
      - '**/src/test/java/**'
      - '**/src/jmh/java/**'
      - '**/build.gradle'
      - 'settings.gradle'
      - '.github/workflows/ai-knowledge.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    name: Generate AI knowledge index
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Regelsuche
        uses: actions/checkout@v7
        with:
          path: Regelsuche

      - name: Checkout AI knowledge extractor
        uses: actions/checkout@v7
        with:
          repository: carstenartur/ai-knowledge-extractor
          path: ai-knowledge-extractor

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.1.0
        with:
          gradle-home-cache-cleanup: true

      - name: Build extractor plugin jars
        run: |
          mkdir -p Regelsuche/build/ai-knowledge
          cd ai-knowledge-extractor
          set +e
          ./gradlew --no-daemon --stacktrace :core:jar :gradle-plugin:jar -x test > ../Regelsuche/build/ai-knowledge/plugin-build.out 2> ../Regelsuche/build/ai-knowledge/plugin-build.err
          status=$?
          echo "$status" > ../Regelsuche/build/ai-knowledge/plugin-build.exit
          cat ../Regelsuche/build/ai-knowledge/plugin-build.out
          cat ../Regelsuche/build/ai-knowledge/plugin-build.err
          test "$status" = "0"

      - name: Generate AI knowledge artifacts
        working-directory: Regelsuche
        env:
          AI_KNOWLEDGE_EXTRACTOR_ENABLED: 'true'
        run: |
          mkdir -p build/ai-knowledge
          set +e
          ./gradlew --no-daemon --no-configuration-cache --stacktrace generateAiKnowledgeIndex analyzeAiComplexity optimizeAiKnowledge benchmarkAiKnowledge > build/ai-knowledge/extractor.out 2> build/ai-knowledge/extractor.err
          status=$?
          echo "$status" > build/ai-knowledge/extractor.exit
          cat build/ai-knowledge/extractor.out
          cat build/ai-knowledge/extractor.err
          test "$status" = "0"

      - name: Upload AI knowledge artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ai-knowledge-index
          path: Regelsuche/build/ai-knowledge/**

      - name: Summary
        if: always()
        run: |
          echo '### AI knowledge artifacts' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo 'Generated artifacts are uploaded as the `ai-knowledge-index` workflow artifact.' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          find Regelsuche/build/ai-knowledge -maxdepth 1 -type f -printf '- `%f`\n' | sort >> "$GITHUB_STEP_SUMMARY" || true
