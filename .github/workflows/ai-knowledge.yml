name: AI Knowledge

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'ai-knowledge/**'
      - 'docs/generated/discovery/**'
      - '**/src/main/java/**'
      - '**/src/test/java/**'
      - '**/src/jmh/java/**'
      - '**/build.gradle'
      - 'settings.gradle'
      - '.github/workflows/ai-knowledge.yml'
  push:
    branches: [ main ]
    paths:
      - 'ai-knowledge/**'
      - 'docs/generated/discovery/**'
      - '**/src/main/java/**'
      - '**/src/test/java/**'
      - '**/src/jmh/java/**'
      - '**/build.gradle'
      - 'settings.gradle'
      - '.github/workflows/ai-knowledge.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    name: Generate AI knowledge index
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Regelsuche
        uses: actions/checkout@v7
        with:
          path: Regelsuche

      - name: Checkout AI knowledge extractor
        uses: actions/checkout@v7
        with:
          repository: carstenartur/ai-knowledge-extractor
          ref: v0.1.4
          path: ai-knowledge-extractor

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.1.0
        with:
          gradle-home-cache-cleanup: true

      - name: Build extractor plugin jars
        run: |
          mkdir -p Regelsuche/build/ai-knowledge
          cd ai-knowledge-extractor
          set +e
          ./gradlew --no-daemon --stacktrace :core:jar :gradle-plugin:jar -x test > ../Regelsuche/build/ai-knowledge/plugin-build.out 2> ../Regelsuche/build/ai-knowledge/plugin-build.err
          status=$?
          echo "$status" > ../Regelsuche/build/ai-knowledge/plugin-build.exit
          cat ../Regelsuche/build/ai-knowledge/plugin-build.out
          cat ../Regelsuche/build/ai-knowledge/plugin-build.err
          test "$status" = "0"

      - name: Generate AI knowledge artifacts
        working-directory: Regelsuche
        env:
          AI_KNOWLEDGE_EXTRACTOR_ENABLED: 'true'
        run: |
          mkdir -p build/ai-knowledge
          set +e
          ./gradlew --no-daemon --no-configuration-cache --stacktrace generateAiKnowledgeIndex analyzeAiComplexity optimizeAiKnowledge benchmarkAiKnowledge > build/ai-knowledge/extractor.out 2> build/ai-knowledge/extractor.err
          status=$?
          echo "$status" > build/ai-knowledge/extractor.exit
          cat build/ai-knowledge/extractor.out
          cat build/ai-knowledge/extractor.err
          test "$status" = "0"

      - name: Check AI knowledge index
        working-directory: Regelsuche
        env:
          AI_KNOWLEDGE_EXTRACTOR_ENABLED: 'true'
        run: |
          mkdir -p build/ai-knowledge
          set +e
          ./gradlew --no-daemon --no-configuration-cache --stacktrace checkAiKnowledgeIndex > build/ai-knowledge/check.out 2> build/ai-knowledge/check.err
          status=$?
          echo "$status" > build/ai-knowledge/check.exit
          cat build/ai-knowledge/check.out
          cat build/ai-knowledge/check.err
          test "$status" = "0"

      - name: Validate artifact file presence
        working-directory: Regelsuche
        run: |
          python3 - <<'PY'
          import sys
          from pathlib import Path

          ai_dir = Path('build/ai-knowledge')
          required = [
              'index.json',
              'modules.json',
              'classes.json',
              'tests.json',
              'docs.json',
              'dependencies.json',
              'capabilities.json',
              'claims.json',
              'evidence.json',
              'review-context.md',
              'context-packs/index.json',
          ]
          missing = [f for f in required if not (ai_dir / f).exists()]
          if missing:
              print('Missing required ai-knowledge-index artifacts:')
              for f in missing:
                  print(f'  - {f}')
              sys.exit(1)
          print('All required ai-knowledge-index artifacts are present.')
          PY

      - name: Validate artifact quality
        working-directory: Regelsuche
        run: |
          python3 - <<'PY'
          import json
          import sys
          from pathlib import Path

          ai_dir = Path('build/ai-knowledge')
          warnings = []
          errors = []

          # Check evidence.json contains useful entries
          evidence_path = ai_dir / 'evidence.json'
          try:
              evidence = json.loads(evidence_path.read_text(encoding='utf-8')).get('evidence', [])
          except Exception as exc:
              errors.append(f'Could not parse evidence.json: {exc}')
              evidence = []
          if not evidence:
              errors.append('evidence.json is empty; expected repository evidence artifacts.')

          # Check class/test facts are linked to method facts
          classes = json.loads((ai_dir / 'classes.json').read_text(encoding='utf-8')).get('classes', [])
          if not any(c.get('methodFacts') for c in classes):
              warnings.append('classes.json contains no methodFacts; Java extraction may be too shallow.')

          # Check complexity report contains method-level and AI-cost metrics from ai-knowledge-extractor 0.1.4
          complexity = json.loads((ai_dir / 'complexity.json').read_text(encoding='utf-8'))
          code_complexity = complexity.get('codeComplexity', {})
          cost_drivers = complexity.get('aiCostDrivers', {})
          if 'maxMethodCognitiveComplexity' not in code_complexity:
              errors.append('complexity.json lacks codeComplexity.maxMethodCognitiveComplexity.')
          if 'tokenCostDrivers' not in cost_drivers:
              errors.append('complexity.json lacks aiCostDrivers.tokenCostDrivers.')

          for warning in warnings:
              print(f'WARNING: {warning}')
          for error in errors:
              print(f'ERROR: {error}', file=sys.stderr)
          if errors:
              sys.exit(1)
          print('AI knowledge artifacts passed basic quality checks.')
          PY
