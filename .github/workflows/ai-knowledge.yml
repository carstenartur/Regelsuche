name: AI Knowledge

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'ai-knowledge/**'
      - 'docs/generated/discovery/**'
      - '**/src/main/java/**'
      - '**/src/test/java/**'
      - '**/src/jmh/java/**'
      - '**/build.gradle'
      - 'settings.gradle'
      - '.github/workflows/ai-knowledge.yml'
  push:
    branches: [ main ]
    paths:
      - 'ai-knowledge/**'
      - 'docs/generated/discovery/**'
      - '**/src/main/java/**'
      - '**/src/test/java/**'
      - '**/src/jmh/java/**'
      - '**/build.gradle'
      - 'settings.gradle'
      - '.github/workflows/ai-knowledge.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    name: Generate AI knowledge index
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Regelsuche
        uses: actions/checkout@v7
        with:
          path: Regelsuche

      - name: Checkout AI knowledge extractor
        uses: actions/checkout@v7
        with:
          repository: carstenartur/ai-knowledge-extractor
          path: ai-knowledge-extractor

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.1.0
        with:
          gradle-home-cache-cleanup: true

      - name: Publish extractor plugin to local Maven
        continue-on-error: true
        run: |
          mkdir -p Regelsuche/build/ai-knowledge
          cd ai-knowledge-extractor
          ./gradlew --no-daemon --stacktrace :core:publishToMavenLocal :gradle-plugin:publishToMavenLocal -x test -x javadoc -x javadocJar > ../Regelsuche/build/ai-knowledge/publish.out 2> ../Regelsuche/build/ai-knowledge/publish.err
          echo $? > ../Regelsuche/build/ai-knowledge/publish.exit
          cat ../Regelsuche/build/ai-knowledge/publish.out
          cat ../Regelsuche/build/ai-knowledge/publish.err

      - name: Generate core AI knowledge index
        continue-on-error: true
        working-directory: Regelsuche
        env:
          AI_KNOWLEDGE_EXTRACTOR_ENABLED: 'true'
        run: |
          mkdir -p build/ai-knowledge
          ./gradlew --no-daemon --stacktrace generateAiKnowledgeIndex > build/ai-knowledge/generate.out 2> build/ai-knowledge/generate.err
          echo $? > build/ai-knowledge/generate.exit
          cat build/ai-knowledge/generate.out
          cat build/ai-knowledge/generate.err

      - name: Generate AI knowledge reports
        continue-on-error: true
        working-directory: Regelsuche
        env:
          AI_KNOWLEDGE_EXTRACTOR_ENABLED: 'true'
        run: |
          ./gradlew --no-daemon analyzeAiComplexity > build/ai-knowledge/analyze.out 2> build/ai-knowledge/analyze.err
          echo $? > build/ai-knowledge/analyze.exit
          ./gradlew --no-daemon optimizeAiKnowledge > build/ai-knowledge/optimize.out 2> build/ai-knowledge/optimize.err
          echo $? > build/ai-knowledge/optimize.exit
          ./gradlew --no-daemon benchmarkAiKnowledge > build/ai-knowledge/benchmark.out 2> build/ai-knowledge/benchmark.err
          echo $? > build/ai-knowledge/benchmark.exit

      - name: Upload AI knowledge artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ai-knowledge-index
          path: Regelsuche/build/ai-knowledge/**

      - name: Summary
        if: always()
        run: |
          echo '### AI knowledge artifacts' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo 'Generated artifacts are uploaded as the `ai-knowledge-index` workflow artifact.' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          find Regelsuche/build/ai-knowledge -maxdepth 1 -type f -printf '- `%f`\n' | sort >> "$GITHUB_STEP_SUMMARY" || true
