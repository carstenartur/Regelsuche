name: AI Knowledge

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'ai-knowledge/**'
      - 'ai-knowledge-verification/**'
      - 'docs/generated/discovery/**'
      - '**/src/main/java/**'
      - '**/src/test/java/**'
      - '**/src/jmh/java/**'
      - '**/build.gradle'
      - 'gradle.properties'
      - 'gradle/ai-knowledge-verification.gradle'
      - 'scripts/verify-ai-knowledge-artifacts.py'
      - 'settings.gradle'
      - '.github/workflows/ai-knowledge.yml'
  push:
    branches: [ main ]
    paths:
      - 'ai-knowledge/**'
      - 'ai-knowledge-verification/**'
      - 'docs/generated/discovery/**'
      - '**/src/main/java/**'
      - '**/src/test/java/**'
      - '**/src/jmh/java/**'
      - '**/build.gradle'
      - 'gradle.properties'
      - 'gradle/ai-knowledge-verification.gradle'
      - 'scripts/verify-ai-knowledge-artifacts.py'
      - 'settings.gradle'
      - '.github/workflows/ai-knowledge.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  extract:
    name: Generate and verify AI knowledge index
    runs-on: ubuntu-latest
    env:
      AI_KNOWLEDGE_EXTRACTOR_ENABLED: 'true'
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.1.0
        with:
          gradle-home-cache-cleanup: true

      - name: Run the repository-owned AI knowledge lifecycle
        run: >-
          ./gradlew
          --no-daemon
          --no-configuration-cache
          --stacktrace
          aiKnowledgeCheck
          --console=plain

      - name: Upload AI knowledge artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ai-knowledge-index
          path: build/ai-knowledge/**
          if-no-files-found: warn

      - name: Upload AI knowledge review reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ai-knowledge-review-reports
          path: |
            build/ai-knowledge/review-context.md
            build/ai-knowledge/context-packs/**
            build/ai-knowledge/check.json
            build/ai-knowledge/complexity.json
          if-no-files-found: warn

      - name: Summary
        if: always()
        run: |
          echo '### AI knowledge artifacts' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo 'Generation and validation are implemented by the checkout-local `aiKnowledgeCheck` Gradle lifecycle.' >> "$GITHUB_STEP_SUMMARY"
          echo 'The complete index and focused review reports are retained as workflow artifacts.' >> "$GITHUB_STEP_SUMMARY"
