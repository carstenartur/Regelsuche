name: Mathematics SDK repaired distribution (scoped)

on:
  push:
    branches: [fix/math-variable-candidates-20261009]

permissions:
  contents: read

concurrency:
  group: math-variable-repair-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sdk-distribution:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ed968b9c3c140a6a6d0e585e0cfd33a7e368a60b
          path: regelsuche
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '25'
          verify-signature: true
      - name: Qualify two clean SDK builds and fresh consumers using Maven and JUnit
        working-directory: regelsuche
        run: |
          set -o pipefail
          mvn --batch-mode --no-transfer-progress -Psdk-release -pl maven-build-contract \
            -Dtest=MavenOptimizationSdkDistributionTest test 2>&1 | tee sdk-distribution.log
      - name: Retain portable dependencies for offline consumer verification
        if: always()
        run: |
          set -euo pipefail
          mkdir -p offline
          tar -czf offline/maven-repository.tar.gz -C "$HOME/.m2" repository
          sha256sum offline/maven-repository.tar.gz > offline/SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: repaired-sdk-ed968b9c-${{ github.run_id }}
          retention-days: 7
          compression-level: 0
          path: |
            regelsuche/sdk-distribution.log
            regelsuche/maven-build-contract/target/surefire-reports/**
            offline/**
