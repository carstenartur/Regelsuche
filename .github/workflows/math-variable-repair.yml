name: Mathematics SDK repaired distribution (scoped)

on:
  push:
    branches: [fix/math-variable-candidates-20261009]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: math-variable-repair-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sdk-distribution:
    if: github.ref == 'refs/heads/fix/math-variable-candidates-20261009'
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Apply the locally tested proof repair on its isolated branch
        run: |
          set -euo pipefail
          if [ -f .github/math-proof-fix.patch ]; then
            echo '146b68754a466cb273ff6b4e31724ae696619784bb7914c3b99821a37508e5ff  .github/math-proof-fix.patch' | sha256sum -c -
            git apply --check .github/math-proof-fix.patch
            git apply .github/math-proof-fix.patch
            rm .github/math-proof-fix.patch
            git add .github/math-proof-fix.patch regelsuche-optimization-sdk/src/main/java/de/regelsuche/sdk/optimization/SemanticChecker.java
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: retain the universal bitvector proof receipt for contextual normalization'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
          test -z "$(git status --porcelain)"
          git rev-parse HEAD > "$RUNNER_TEMP/sdk-source-commit.txt"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '25'
          verify-signature: true
      - name: Qualify two clean SDK builds and fresh consumers using Maven and JUnit
        run: |
          set -o pipefail
          mvn --batch-mode --no-transfer-progress -Psdk-release -pl maven-build-contract \
            -Dtest=MavenOptimizationSdkDistributionTest test 2>&1 | tee "$RUNNER_TEMP/sdk-distribution.log"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: repaired-sdk-${{ github.run_id }}
          retention-days: 7
          compression-level: 0
          path: |
            ${{ runner.temp }}/sdk-distribution.log
            ${{ runner.temp }}/sdk-source-commit.txt
            maven-build-contract/target/surefire-reports/**
