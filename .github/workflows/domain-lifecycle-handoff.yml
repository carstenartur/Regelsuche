name: Domain Lifecycle Handoff

on:
  push:
    branches: [ "main" ]
    paths:
      - 'regelsuche-discovery/src/main/java/de/regelsuche/discovery/domain/DiscoveryLifecycleHandoff.java'
      - 'regelsuche-discovery/src/test/java/de/regelsuche/discovery/domain/DiscoveryLifecycleHandoffTest.java'
      - 'regelsuche-autopilot/src/main/java/de/regelsuche/experiments/autopilot/AutonomousProductionDomainHandoffAdapter.java'
      - 'regelsuche-autopilot/src/main/java/de/regelsuche/experiments/autopilot/AutonomousProductionGenerationExport.java'
      - 'regelsuche-autopilot/src/main/java/de/regelsuche/experiments/autopilot/AutonomousProductionGenerationMain.java'
      - 'regelsuche-autopilot/src/test/java/de/regelsuche/experiments/autopilot/AutonomousProductionDomainHandoffAdapterTest.java'
      - 'regelsuche-autopilot/build.gradle'
      - 'docs/domain-lifecycle-handoff.md'
      - 'docs/schemas/regelsuche-discovery-lifecycle-handoff-v1.schema.json'
      - 'docs/schemas/regelsuche-autonomous-production-generation-export-v1.schema.json'
      - '.github/workflows/domain-lifecycle-handoff.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'regelsuche-discovery/src/main/java/de/regelsuche/discovery/domain/DiscoveryLifecycleHandoff.java'
      - 'regelsuche-discovery/src/test/java/de/regelsuche/discovery/domain/DiscoveryLifecycleHandoffTest.java'
      - 'regelsuche-autopilot/src/main/java/de/regelsuche/experiments/autopilot/AutonomousProductionDomainHandoffAdapter.java'
      - 'regelsuche-autopilot/src/main/java/de/regelsuche/experiments/autopilot/AutonomousProductionGenerationExport.java'
      - 'regelsuche-autopilot/src/main/java/de/regelsuche/experiments/autopilot/AutonomousProductionGenerationMain.java'
      - 'regelsuche-autopilot/src/test/java/de/regelsuche/experiments/autopilot/AutonomousProductionDomainHandoffAdapterTest.java'
      - 'regelsuche-autopilot/build.gradle'
      - 'docs/domain-lifecycle-handoff.md'
      - 'docs/schemas/regelsuche-discovery-lifecycle-handoff-v1.schema.json'
      - 'docs/schemas/regelsuche-autonomous-production-generation-export-v1.schema.json'
      - '.github/workflows/domain-lifecycle-handoff.yml'
  workflow_dispatch:

concurrency:
  group: domain-lifecycle-handoff-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  handoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0

      - name: Verify generic and committed production handoffs
        run: |
          ./gradlew \
            :regelsuche-discovery:test \
            :regelsuche-autopilot:test \
            --tests de.regelsuche.discovery.domain.DiscoveryLifecycleHandoffTest \
            --tests de.regelsuche.experiments.autopilot.AutonomousProductionDomainHandoffAdapterTest \
            --rerun-tasks

      - name: Require retained handoff and export evidence
        run: |
          test -s regelsuche-discovery/build/reports/domain-lifecycle-handoff/expression-handoff.json
          test -s regelsuche-discovery/build/reports/domain-lifecycle-handoff/sequence-handoff.json
          test -s regelsuche-autopilot/build/reports/domain-lifecycle-handoff/production-generation-handoff.json
          export_dir=regelsuche-autopilot/build/reports/domain-lifecycle-handoff/production-generation-export
          test -s "$export_dir/export-manifest.json"
          for name in \
            brief-v2.json \
            seeds.json \
            observations.json \
            generation-receipt.json \
            discovery-report.json \
            generation-run.json \
            lifecycle-handoff.json; do
            test -s "$export_dir/$name"
          done

      - name: Require byte-identical repeated handoffs and export
        shell: bash
        run: |
          first=/tmp/domain-lifecycle-handoff-first
          export_dir=regelsuche-autopilot/build/reports/domain-lifecycle-handoff/production-generation-export
          mkdir -p "$first/production-generation-export"
          cp regelsuche-discovery/build/reports/domain-lifecycle-handoff/*.json "$first/"
          cp regelsuche-autopilot/build/reports/domain-lifecycle-handoff/*.json "$first/"
          cp "$export_dir"/*.json "$first/production-generation-export/"
          ./gradlew \
            :regelsuche-discovery:test \
            :regelsuche-autopilot:test \
            --tests de.regelsuche.discovery.domain.DiscoveryLifecycleHandoffTest \
            --tests de.regelsuche.experiments.autopilot.AutonomousProductionDomainHandoffAdapterTest \
            --rerun-tasks
          cmp "$first/expression-handoff.json" \
            regelsuche-discovery/build/reports/domain-lifecycle-handoff/expression-handoff.json
          cmp "$first/sequence-handoff.json" \
            regelsuche-discovery/build/reports/domain-lifecycle-handoff/sequence-handoff.json
          cmp "$first/production-generation-handoff.json" \
            regelsuche-autopilot/build/reports/domain-lifecycle-handoff/production-generation-handoff.json
          for name in \
            export-manifest.json \
            brief-v2.json \
            seeds.json \
            observations.json \
            generation-receipt.json \
            discovery-report.json \
            generation-run.json \
            lifecycle-handoff.json; do
            cmp "$first/production-generation-export/$name" "$export_dir/$name"
          done

      - name: Validate schemas, balances, byte bindings and representation boundary
        shell: bash
        run: |
          python3 -m pip install \
            --disable-pip-version-check \
            --quiet \
            jsonschema==4.25.1
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from jsonschema.validators import validator_for

          def load_validator(path):
              schema = json.loads(path.read_text(encoding='utf-8'))
              validator_for(schema).check_schema(schema)
              assert schema.get('additionalProperties') is False
              return validator_for(schema)(schema)

          def sha256(data):
              return 'sha256:' + hashlib.sha256(data).hexdigest()

          handoff_validator = load_validator(Path(
              'docs/schemas/regelsuche-discovery-lifecycle-handoff-v1.schema.json'))
          export_validator = load_validator(Path(
              'docs/schemas/regelsuche-autonomous-production-generation-export-v1.schema.json'))

          export_dir = Path(
              'regelsuche-autopilot/build/reports/domain-lifecycle-handoff/production-generation-export')
          handoff_files = [
              Path('regelsuche-discovery/build/reports/domain-lifecycle-handoff/expression-handoff.json'),
              Path('regelsuche-discovery/build/reports/domain-lifecycle-handoff/sequence-handoff.json'),
              Path('regelsuche-autopilot/build/reports/domain-lifecycle-handoff/production-generation-handoff.json'),
              export_dir / 'lifecycle-handoff.json',
          ]
          reports = [json.loads(path.read_text(encoding='utf-8'))
                     for path in handoff_files]
          for report in reports:
              handoff_validator.validate(report)
              assert report['proofStatus'] == 'NOT_EVALUATED'
              assert report['externalNoveltyStatus'] == 'NOT_EVALUATED'
              assert report['promotionStatus'] == 'NOT_EVALUATED'
              assert report['publicEvidenceStatus'] == 'NOT_EVALUATED'
              for resource in report['resources']:
                  assert resource['configured'] == (
                      resource['executed']
                      + resource['skipped']
                      + resource['remaining'])

          expression, sequence, production, exported = reports
          assert expression['sourceKind'] == 'DOMAIN_DISCOVERY_EVIDENCE'
          assert sequence['sourceKind'] == 'DOMAIN_DISCOVERY_EVIDENCE'
          assert expression['stage'] == sequence['stage'] == 'DISCOVERY_VALIDATION'
          assert expression['disposition'] == sequence['disposition'] == 'CONFIRMED'
          for report in (production, exported):
              assert report['sourceKind'] == 'PRODUCTION_GENERATION_RUN'
              assert report['stage'] == 'GENERATION'
              assert report['disposition'] == 'COMPLETED'
              assert report['selectedCandidateHash'] == ''
              assert report['certificateHash'] == ''
          assert production == exported

          manifest_path = export_dir / 'export-manifest.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          export_validator.validate(manifest)
          assert manifest['commitProtocol'] == 'MANIFEST_LAST_ATOMIC_RENAME'
          assert len(manifest['artifacts']) == 7
          assert not list(export_dir.glob('*.tmp'))

          by_role = {}
          materials = []
          for artifact in manifest['artifacts']:
              assert artifact['role'] not in by_role
              by_role[artifact['role']] = artifact
              path = export_dir / artifact['fileName']
              assert path.parent == export_dir
              data = path.read_bytes()
              assert len(data) == artifact['byteLength']
              assert sha256(data) == artifact['byteHash']
              materials.append(
                  artifact['fileName'] + '|'
                  + artifact['role'] + '|'
                  + artifact['sourceContentHash'] + '|'
                  + artifact['byteHash'] + '|'
                  + str(artifact['byteLength']))

          generation_run = json.loads(
              (export_dir / 'generation-run.json').read_text(encoding='utf-8'))
          lifecycle_handoff = json.loads(
              (export_dir / 'lifecycle-handoff.json').read_text(encoding='utf-8'))
          assert generation_run['contentHash'] == manifest['generationRunHash']
          assert lifecycle_handoff['contentHash'] == manifest['lifecycleHandoffHash']
          assert lifecycle_handoff['sourceEvidenceHash'] == manifest['generationRunHash']
          assert by_role['GENERATION_RUN']['sourceContentHash'] == \
              manifest['generationRunHash']
          assert by_role['LIFECYCLE_HANDOFF']['sourceContentHash'] == \
              manifest['lifecycleHandoffHash']

          manifest_material = (
              manifest['schema']
              + '\nexportId=' + manifest['exportId']
              + '\ngenerationRunHash=' + manifest['generationRunHash']
              + '\nlifecycleHandoffHash=' + manifest['lifecycleHandoffHash']
              + '\nartifacts=[' + ', '.join(materials) + ']'
              + '\ncommitProtocol=' + manifest['commitProtocol'])
          assert sha256(manifest_material.encode('utf-8')) == manifest['contentHash']

          forbidden_keys = {
              'payload',
              'expression',
              'seedExpression',
              'selectedExpression',
              'states',
              'path',
              'sequenceTerms',
          }
          def keys(value):
              if isinstance(value, dict):
                  for key, nested in value.items():
                      yield key
                      yield from keys(nested)
              elif isinstance(value, list):
                  for nested in value:
                      yield from keys(nested)
          for report in reports:
              assert forbidden_keys.isdisjoint(set(keys(report)))
          assert forbidden_keys.isdisjoint(set(keys(manifest)))
          PY

      - name: Upload handoff evidence and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: domain-lifecycle-handoff-evidence
          path: |
            regelsuche-discovery/build/reports/domain-lifecycle-handoff/**
            regelsuche-autopilot/build/reports/domain-lifecycle-handoff/**
            regelsuche-discovery/build/reports/tests/**
            regelsuche-autopilot/build/reports/tests/**
            regelsuche-discovery/build/test-results/**
            regelsuche-autopilot/build/test-results/**
            docs/schemas/regelsuche-discovery-lifecycle-handoff-v1.schema.json
            docs/schemas/regelsuche-autonomous-production-generation-export-v1.schema.json
          if-no-files-found: warn
