name: Temporary PR 728 self-repair
# Existing-workflow push deliberately triggers the one-shot repair.

on:
  push:
    branches:
      - agent/pattern-targeted-local-bridge-search

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/pattern-targeted-local-bridge-search
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb

      - name: Apply boundedness and JSON review fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one match in {path}, found {count}")
              file.write_text(text.replace(old, new), encoding="utf-8")

          planner = (
              "regelsuche-search/src/main/java/de/regelsuche/search/"
              "reachability/PatternTargetedLocalBridgeSearch.java"
          )
          replace_once(
              planner,
              """        this.preparationEngine = new AstRewriteTransformationEngine(
                      this.preparationRules,
                      Integer.MAX_VALUE,
                      Integer.MAX_VALUE);
              """,
              """        this.preparationEngine = new AstRewriteTransformationEngine(
                      this.preparationRules,
                      Integer.MAX_VALUE,
                      engineCandidateObservationLimit(this.budget));
              """,
          )
          replace_once(
              planner,
              """    /** Runs target-free formation for one local AST subtree. */
              """,
              """    private static int engineCandidateObservationLimit(
                  Budget budget
              ) {
                  int tighterLimit = Math.min(
                      budget.maxSuccessorsPerState(),
                      budget.maxGeneratedTransitions());
                  if (tighterLimit == Integer.MAX_VALUE) {
                      return Integer.MAX_VALUE;
                  }
                  return Math.max(1, tighterLimit + 1);
              }

              /** Runs target-free formation for one local AST subtree. */
              """,
          )

          planner_test = (
              "regelsuche-search/src/test/java/de/regelsuche/search/"
              "reachability/PatternTargetedLocalBridgeSearchTest.java"
          )
          replace_once(
              planner_test,
              """    @Test
                  void corruptedCertificateAndInvalidInventoriesFailClosed() {
              """,
              """    @Test
                  void observesOnlyOneCandidateBeyondTheTighterEngineBudget() {
                      PatternRewriteRule principal = new PatternRewriteRule(
                          "principal-z",
                          PatternExpr.variable("z"),
                          PatternExpr.num(1));
                      List<RewriteRule> rules = java.util.stream.IntStream
                          .range(0, 100)
                          .mapToObj(index -> (RewriteRule) pattern(
                              "a-to-b-" + index,
                              "a",
                              "b" + index))
                          .toList();
                      PatternTargetedLocalBridgeSearch search = search(
                          principal,
                          rules,
                          new PatternTargetedLocalBridgeSearch.Budget(
                              1, 32, 100, 8, 32, 2,
                              8, 128, 64));

                      PatternTargetedLocalBridgeSearch.Attempt attempt =
                          search.analyze(
                              "a",
                              AssumptionSignature.ofExpressions(List.of()));

                      assertEquals(
                          PatternTargetedLocalBridgeSearch.Status
                              .BUDGET_INCONCLUSIVE,
                          attempt.status());
                      assertEquals(3, attempt.work().generatedTransitions());
                      assertTrue(attempt.reachedLimits().contains(
                          "SUCCESSORS_PER_STATE"));
                  }

                  @Test
                  void corruptedCertificateAndInvalidInventoriesFailClosed() {
              """,
          )

          experiment = (
              "regelsuche-experiments/src/main/java/de/regelsuche/benchmark/"
              "SymPyRuleAmplificationExperiment.java"
          )
          replace_once(
              experiment,
              """    private static String json(String value) {
                  return "\"" + value.replace("\\", "\\\\")
                      .replace("\"", "\\\"")
                      .replace("\n", "\\n")
                      .replace("\r", "\\r") + "\"";
              }
              """,
              """    static String json(String value) {
                  return "\"" + value.replace("\\", "\\\\")
                      .replace("\"", "\\\"")
                      .replace("\n", "\\n")
                      .replace("\r", "\\r")
                      .replace("\t", "\\t") + "\"";
              }
              """,
          )

          experiment_test = (
              "regelsuche-experiments/src/test/java/de/regelsuche/benchmark/"
              "SymPyRuleAmplificationExperimentTest.java"
          )
          replace_once(
              experiment_test,
              """import de.regelsuche.search.reachability.PatternTargetedLocalBridgeSearch;
              """,
              """import com.fasterxml.jackson.databind.ObjectMapper;
              import de.regelsuche.search.reachability.PatternTargetedLocalBridgeSearch;
              """,
          )
          replace_once(
              experiment_test,
              """    @Test
                  void canonicalReportIsDeterministicAndWritten(@TempDir Path directory)
              """,
              """    @Test
                  void jsonEncodingEscapesTabs() throws Exception {
                      String encoded = SymPyRuleAmplificationExperiment.json(
                          "left\tright");

                      assertEquals("\"left\\tright\"", encoded);
                      assertEquals(
                          "left\tright",
                          new ObjectMapper().readTree(encoded).asText());
                  }

                  @Test
                  void canonicalReportIsDeterministicAndWritten(@TempDir Path directory)
              """,
          )
          PY

      - name: Run focused Gradle characterization
        run: >-
          ./gradlew --no-configuration-cache
          :regelsuche-search:test
          --tests 'de.regelsuche.search.reachability.PatternTargetedLocalBridgeSearchTest'
          :regelsuche-experiments:test
          --tests 'de.regelsuche.benchmark.SymPyRuleAmplificationExperimentTest'

      - name: Run focused Maven characterization
        run: >-
          mvn --batch-mode --no-transfer-progress
          -pl regelsuche-search,regelsuche-experiments -am
          -Dtest=PatternTargetedLocalBridgeSearchTest,SymPyRuleAmplificationExperimentTest
          test

      - name: Commit verified fixes and remove temporary workflow
        shell: bash
        run: |
          git config user.name "Carsten Hammer"
          git config user.email "carsten.hammer@t-online.de"
          git rm .github/workflows/pr-728-self-repair.yml
          git add \
            regelsuche-search/src/main/java/de/regelsuche/search/reachability/PatternTargetedLocalBridgeSearch.java \
            regelsuche-search/src/test/java/de/regelsuche/search/reachability/PatternTargetedLocalBridgeSearchTest.java \
            regelsuche-experiments/src/main/java/de/regelsuche/benchmark/SymPyRuleAmplificationExperiment.java \
            regelsuche-experiments/src/test/java/de/regelsuche/benchmark/SymPyRuleAmplificationExperimentTest.java
          git commit -m "Bound local bridge candidate generation"
          git push origin HEAD:agent/pattern-targeted-local-bridge-search
