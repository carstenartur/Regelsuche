name: Apply Gradle 9.7 reproduction contract

on:
  push:
    branches:
      - dependabot/gradle/build-tooling-maintenance-7b8f202699
    paths:
      - .github/workflows/apply-gradle-97-reproduction-contract.yml

permissions:
  contents: write

jobs:
  update-contract:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Update all frozen Gradle identities
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          old_distribution = "gradle-9.5.1-bin.zip"
          new_distribution = "gradle-9.7.0-bin.zip"
          old_sha = "bafc141b619ad6350fd975fc903156dd5c151998cc8b058e8c1044ab5f7b031f"
          new_sha = "84fbba45c7f4c64abc77460e1c00f541e9f960e3c7ed2538f1ede19eacd873ae"
          files = [
              Path("scripts/build-independent-reproduction-artifact.py"),
              Path("scripts/verify-independent-reproduction.py"),
              Path("scripts/verify-independent-reproduction-lifecycle.py"),
              Path("docs/schemas/regelsuche-independent-reproduction-artifact-v1.schema.json"),
              Path("reproduction/run-self-test.sh"),
          ]
          distribution_replacements = 0
          checksum_replacements = 0
          for path in files:
              text = path.read_text(encoding="utf-8")
              distribution_replacements += text.count(old_distribution)
              checksum_replacements += text.count(old_sha)
              text = text.replace(old_distribution, new_distribution)
              text = text.replace(old_sha, new_sha)
              path.write_text(text, encoding="utf-8")
          if distribution_replacements != 4:
              raise SystemExit(
                  f"expected 4 frozen distribution replacements, got {distribution_replacements}"
              )
          if checksum_replacements != 6:
              raise SystemExit(
                  f"expected 6 frozen checksum replacements, got {checksum_replacements}"
              )
          PY

          ! git grep -n -E 'gradle-9\.5\.1-bin\.zip|bafc141b619ad6350fd975fc903156dd5c151998cc8b058e8c1044ab5f7b031f'
          grep -qx 'distributionUrl=https\\://services.gradle.org/distributions/gradle-9.7.0-bin.zip' gradle/wrapper/gradle-wrapper.properties
          grep -qx 'distributionSha256Sum=84fbba45c7f4c64abc77460e1c00f541e9f960e3c7ed2538f1ede19eacd873ae' gradle/wrapper/gradle-wrapper.properties
          python3 -m py_compile \
            scripts/build-independent-reproduction-artifact.py \
            scripts/verify-independent-reproduction.py \
            scripts/verify-independent-reproduction-lifecycle.py
          python3 -m json.tool docs/schemas/regelsuche-independent-reproduction-artifact-v1.schema.json >/dev/null
          bash -n reproduction/run-self-test.sh
          git diff --check

      - name: Commit the verified contract and remove this transfer workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/apply-gradle-97-reproduction-contract.yml
          git add \
            scripts/build-independent-reproduction-artifact.py \
            scripts/verify-independent-reproduction.py \
            scripts/verify-independent-reproduction-lifecycle.py \
            docs/schemas/regelsuche-independent-reproduction-artifact-v1.schema.json \
            reproduction/run-self-test.sh
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Bind independent reproduction to Gradle 9.7'
          git push origin HEAD:dependabot/gradle/build-tooling-maintenance-7b8f202699
