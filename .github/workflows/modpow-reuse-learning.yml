name: Validate modPow reuse learning

on:
  push:
    branches:
      - 'research/1026-modpow-reuse-learning'
    paths:
      - 'regelsuche-learning/src/main/java/de/regelsuche/mining/ParameterRelationMiner.java'
      - 'regelsuche-learning/src/test/java/de/regelsuche/mining/ParameterRelationMinerBivariateTest.java'
      - 'regelsuche-learning/src/test/java/de/regelsuche/mining/PatternGeneralizerBivariateProductTest.java'
      - 'regelsuche-experiments/**'
      - 'regelsuche-learning/**'
      - 'docs/research/modpow-reuse-learning-split.json'
      - '.github/workflows/modpow-reuse-learning.yml'

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '25'
          verify-signature: true
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
      - name: Run learning relation tests
        run: |
          ./gradlew --no-daemon --no-configuration-cache \
            :regelsuche-learning:test \
            --tests 'de.regelsuche.mining.ParameterRelationMinerBivariateTest' \
            --tests 'de.regelsuche.mining.PatternGeneralizerBivariateProductTest' \
            --console=plain --stacktrace

      - name: Form TRAIN-only learned artifact
        run: |
          ./gradlew --no-daemon --no-configuration-cache \
            :regelsuche-experiments:modPowReuseLearningFormation \
            --console=plain --stacktrace

      - name: Retain TRAIN-only learned artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: modpow-reuse-learning-formation
          path: regelsuche-experiments/build/reports/modpow-reuse-learning-formation/**
          if-no-files-found: error
          retention-days: 30
