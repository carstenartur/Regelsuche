name: External polynomial comparison

on:
  pull_request:
    paths:
      - 'config/benchmarks/external-polynomial-v1.json'
      - 'scripts/external_polynomial_comparison/**'
      - 'scripts/external-polynomial-classpath.gradle'
      - 'regelsuche-learning/src/**'
      - 'regelsuche-search/src/**'
      - '.github/workflows/external-polynomial-comparison.yml'
  workflow_dispatch:

permissions: { contents: read, packages: read }
concurrency:
  group: external-polynomial-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PYTHONPATH: scripts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with: { distribution: temurin, java-version: '25' }
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with: { cache-cleanup: on-success }
      - name: Prepare pinned native baseline
        run: |
          python3 -m venv build/external-polynomial-venv
          build/external-polynomial-venv/bin/python -m pip install sympy==1.14.0 mpmath==1.3.0
      - name: Test independent judge, protocol and process boundaries
        run: build/external-polynomial-venv/bin/python -m unittest discover -s scripts/external_polynomial_comparison -p 'test_*.py' -v
      - name: Build actual Java worker and exercise fixture controls
        run: |
          env -u GITHUB_SHA ./gradlew --no-daemon --no-configuration-cache \
            -I scripts/external-polynomial-classpath.gradle \
            :regelsuche-learning:externalPolynomialClasspath \
            :regelsuche-learning:test --tests de.regelsuche.evolution.ExternalPolynomialComparisonWorkerTest \
            --console=plain --stacktrace
      - name: Execute complete preregistered matrix
        run: |
          build/external-polynomial-venv/bin/python -m external_polynomial_comparison.run \
            --classpath regelsuche-learning/build/external-polynomial-classpath.txt \
            --output build/reports/external-polynomial-comparison
      - name: Independently verify retained evidence
        run: |
          build/external-polynomial-venv/bin/python -m external_polynomial_comparison.run \
            --verify --output build/reports/external-polynomial-comparison
      - name: Retain complete evidence including negative outcomes
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: external-polynomial-comparison-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            build/reports/external-polynomial-comparison/**
            regelsuche-learning/build/test-results/**
          if-no-files-found: error
