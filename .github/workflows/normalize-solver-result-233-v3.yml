name: Normalize Solver Result 233 v3

on:
  push:
    branches: [ "feature/233-solver-neutral-ir" ]

permissions:
  contents: write

concurrency:
  group: solver-ir-normalize-233-v3
  cancel-in-progress: false

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/233-solver-neutral-ir
          fetch-depth: 0

      - name: Execute corrected normalization
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/normalize-solver-result-233-v2.yml')
          text = workflow.read_text()
          marker = "          python3 - <<'PY'\n"
          start = text.index(marker) + len(marker)
          end = text.index("\n          PY", start)
          script = textwrap.dedent(text[start:end])
          script = script.replace(
              "['resultStatus', 'backendStatus', 'ResultStatus.CONFIRMED']",
              "['status', 'resultStatus', 'backendStatus', 'ResultStatus.CONFIRMED']")
          exec(compile(script, str(workflow), 'exec'))
          PY

      - name: Verify normalized source contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          java = Path('regelsuche-solver-ir/src/main/java/de/regelsuche/solver/ir/SolverIr.java').read_text()
          result = java[java.index('public record SolverResult('):java.index('public static String sha256(')]
          assert 'translationStatus' not in result
          assert 'translationIssues' not in result
          schema = Path('docs/schemas/regelsuche-solver-result-v1.schema.json').read_text()
          assert 'translationStatus' not in schema
          assert 'translationIssues' not in schema
          test = Path('regelsuche-learning/src/test/java/de/regelsuche/mining/OpenTargetConjectureProofGateTest.java').read_text()
          assert 'status,\n                TranslationStatus.LOSSLESS,\n                List.of(' not in test
          PY

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0

      - name: Compile normalized contracts
        run: |
          ./gradlew --no-daemon \
            :regelsuche-solver-ir:test \
            :regelsuche-learning:test \
            :regelsuche-autopilot:test

      - name: Commit normalized contracts
        shell: bash
        run: |
          rm -f \
            .github/workflows/normalize-solver-result-233.yml \
            .github/workflows/normalize-solver-result-233-v2.yml \
            .github/workflows/normalize-solver-result-233-v3.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Separate solver translations from backend results"
          git push origin HEAD:feature/233-solver-neutral-ir
