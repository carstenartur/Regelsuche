# Temporary bootstrap; removed after the verified implementation commit.
name: Apply Autonomous Discovery Walkthrough

on:
  push:
    branches: [ "issue-386-result-card" ]
    paths:
      - '.github/workflows/branch-apply-issue386.yml'
      - '.github/issue-386-patch/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - '.github/workflows/branch-apply-issue386.yml'
      - '.github/issue-386-patch/**'
  workflow_dispatch:

concurrency:
  group: apply-autonomous-discovery-walkthrough-${{ github.repository }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: issue-386-result-card
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0

      - name: Decode and authenticate implementation archive
        shell: bash
        run: |
          set -euo pipefail
          cat .github/issue-386-patch/chunk-* | base64 --decode > /tmp/issue386-implementation.tar.gz
          actual="$(sha256sum /tmp/issue386-implementation.tar.gz | cut -d' ' -f1)"
          test "$actual" = e82f34396d9b075110e79cc6fc6e70cbc2a71f94a6a89a518a0dbf72eb423dde
          tar -tzf /tmp/issue386-implementation.tar.gz > /tmp/issue386-files.txt
          grep -qx './regelsuche-release/src/main/java/de/regelsuche/release/AutonomousDiscoveryResultCard.java' /tmp/issue386-files.txt
          grep -qx './regelsuche-release/src/main/java/de/regelsuche/release/AutonomousDiscoveryWalkthroughRunner.java' /tmp/issue386-files.txt
          grep -qx './scripts/verify-autonomous-discovery-walkthrough.py' /tmp/issue386-files.txt
          grep -qx './docs/schemas/regelsuche-autonomous-discovery-result-card-v1.schema.json' /tmp/issue386-files.txt
          grep -qx './.github/autonomous-discovery-walkthrough.yml.pending' /tmp/issue386-files.txt
          grep -qx './.github/issue-386-apply.sh' /tmp/issue386-files.txt

      - name: Apply, reproduce and verify result-card walkthrough
        shell: bash
        run: |
          set -o pipefail
          tar -xzf /tmp/issue386-implementation.tar.gz -C .
          rm -f .github/autonomous-discovery-walkthrough.yml.pending
          bash -x .github/issue-386-apply.sh 2>&1 | tee /tmp/issue386-bootstrap.log

      - name: Upload walkthrough bootstrap diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: autonomous-discovery-walkthrough-bootstrap
          path: |
            /tmp/issue386-bootstrap.log
            /tmp/issue386-files.txt
            /tmp/issue386-walkthrough-a/**
            /tmp/issue386-walkthrough-b/**
            regelsuche-release/build/test-results/**
            regelsuche-release/build/reports/tests/**
          if-no-files-found: warn
