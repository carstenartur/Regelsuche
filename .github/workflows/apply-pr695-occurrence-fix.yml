name: Fix PR 695 budget contract

on:
  push:
    branches:
      - automation/pr695-occurrence-fix
    paths:
      - '.github/automation/fix_pr695_budget_contract.py'
      - '.github/workflows/apply-pr695-occurrence-fix.yml'

permissions:
  contents: write

concurrency:
  group: fix-pr695-budget-contract
  cancel-in-progress: false

jobs:
  fix-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Check out automation source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Prepare the corrected PR head
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          cp .github/automation/fix_pr695_budget_contract.py \
            /tmp/fix_pr695_budget_contract.py
          git fetch origin agent/pr693-pre-freeze-hardening
          test "$(git rev-parse origin/agent/pr693-pre-freeze-hardening)" = \
            '674bd26094827257372ac2c416dae9c7bc7c0b16'
          git config user.name 'github-actions[bot]'
          git config user.email \
            '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -C agent/pr693-pre-freeze-hardening \
            origin/agent/pr693-pre-freeze-hardening
          python3 /tmp/fix_pr695_budget_contract.py
          git diff --check
          git add \
            docs/target-free-representation-evaluation.md \
            regelsuche-discovery/src/main/java/de/regelsuche/discovery/representation/TargetFreeRepresentationEvaluationPlan.java \
            regelsuche-discovery/src/main/resources/de/regelsuche/discovery/representation/target-free-representation-formation-v1.json \
            regelsuche-discovery/src/main/resources/de/regelsuche/discovery/representation/target-free-representation-preregistration-v1.json
          git commit -m 'Remove unenforced target-free v1 work ceilings'
          target_sha="$(git rev-parse HEAD)"
          echo "target_sha=$target_sha" >> "$GITHUB_OUTPUT"
          echo "VERIFIED_REVISION=$target_sha" >> "$GITHUB_ENV"

      - name: Set up Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          cache-read-only: true

      - name: Verify the affected contracts
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --no-configuration-cache \
            -PregelsucheRepositoryRevision="$VERIFIED_REVISION" \
            :regelsuche-core:test \
            --tests de.regelsuche.knowledge.KnowledgePackRegistryTest \
            :regelsuche-search:test \
            --tests de.regelsuche.search.strategy.SearchStrategyTest \
            :regelsuche-discovery:test \
            --tests de.regelsuche.discovery.representation.TargetFreeRepresentationEvaluationPlanTest \
            :regelsuche-discovery:generateTargetFreeRepresentationEvaluationPlan \
            --console=plain 2>&1 | tee /tmp/pr695-budget-contract.log
          python3 - <<'PY'
          import json
          from pathlib import Path

          formation_path = Path(
              'regelsuche-discovery/src/main/resources/de/regelsuche/'
              'discovery/representation/'
              'target-free-representation-formation-v1.json'
          )
          formation = json.loads(formation_path.read_text(encoding='utf-8'))
          assert len(formation['cases']) == 6
          for case in formation['cases']:
              budget = case['budget']
              assert 'maxEngineCalls' not in budget
              assert 'maxAdmittedPrimitiveSteps' not in budget
              assert case['ruleProfile'] == 'MINIMAL_KERNEL'
          plan = Path(
              'regelsuche-discovery/build/reports/representation-discovery/'
              'evaluation-plan/representation-discovery-plan.json'
          )
          data = json.loads(plan.read_text(encoding='utf-8'))
          assert len(data['content']['entries']) == 24
          assert data['content']['qualificationDisclosure'] == 'NOT_DISCLOSED'
          PY
          git diff --check

      - name: Publish the verified PR head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$VERIFIED_REVISION"
          test -z "$(git status --porcelain --untracked-files=normal)"
          git push origin HEAD:agent/pr693-pre-freeze-hardening

      - name: Persist automation outcome
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          target_head="$(git ls-remote origin refs/heads/agent/pr693-pre-freeze-hardening | cut -f1)"
          git reset --hard
          git clean -fd
          git switch automation/pr695-occurrence-fix
          mkdir -p debug
          {
            echo '{'
            echo '  "workflowRunId": "${{ github.run_id }}",'
            echo '  "workflowRunAttempt": "${{ github.run_attempt }}",'
            echo '  "status": "'"$JOB_STATUS"'",'
            echo '  "targetHead": "'"$target_head"'",'
            echo '  "expectedOldHead": "674bd26094827257372ac2c416dae9c7bc7c0b16"'
            echo '}'
          } > debug/pr695-budget-contract-status.json
          if test -f /tmp/pr695-budget-contract.log; then
            tail -n 250 /tmp/pr695-budget-contract.log \
              > debug/pr695-budget-contract.log
          fi
          git config user.name 'github-actions[bot]'
          git config user.email \
            '41898282+github-actions[bot]@users.noreply.github.com'
          git add debug/pr695-budget-contract-status.json
          if test -f debug/pr695-budget-contract.log; then
            git add debug/pr695-budget-contract.log
          fi
          if ! git diff --cached --quiet; then
            git commit -m 'Record PR 695 budget-contract outcome'
            git push origin HEAD:automation/pr695-occurrence-fix
          fi
