name: Integrate target-free matrix

on:
  push:
    branches:
      - automation/pr695-occurrence-fix
    paths:
      - '.github/automation/apply_target_free_integration.py.gz.b64'
      - '.github/workflows/apply-pr695-occurrence-fix.yml'

permissions:
  contents: write

concurrency:
  group: integrate-target-free-matrix
  cancel-in-progress: false

jobs:
  integrate-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Check out automation source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Build the stacked execution branch
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .github/automation/apply_target_free_integration.py.gz.b64 \
            | gzip -d > /tmp/apply_target_free_integration.py
          chmod +x /tmp/apply_target_free_integration.py
          git fetch origin \
            main \
            agent/pr693-pre-freeze-hardening \
            agent/target-free-candidate-freeze
          test "$(git rev-parse origin/main)" = \
            'ab4f62edc8fcbc26e8328cc3142cc682ced432ca'
          test "$(git rev-parse origin/agent/pr693-pre-freeze-hardening)" = \
            '674bd26094827257372ac2c416dae9c7bc7c0b16'
          test "$(git rev-parse origin/agent/target-free-candidate-freeze)" = \
            '897982c4e0ba9f2e99458d555e2b8f7a9d86f96f'
          git config user.name 'github-actions[bot]'
          git config user.email \
            '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -C agent/target-free-candidate-freeze \
            origin/agent/target-free-candidate-freeze
          git merge --no-ff \
            -m 'Merge target-free hardening into execution branch' \
            origin/agent/pr693-pre-freeze-hardening
          python3 /tmp/apply_target_free_integration.py
          git diff --check
          git add \
            regelsuche-discovery/src/main/java/de/regelsuche/discovery/representation/TargetFreeRepresentationCandidateFreeze.java \
            regelsuche-discovery/src/main/java/de/regelsuche/discovery/representation/TargetFreeRepresentationSearch.java \
            regelsuche-discovery/src/test/java/de/regelsuche/discovery/representation/TargetFreeRepresentationCandidateFreezeTest.java \
            regelsuche-discovery/src/test/java/de/regelsuche/discovery/representation/TargetFreeRepresentationSearchTest.java
          git commit -m 'Enforce frozen target-free work budgets'
          target_sha="$(git rev-parse HEAD)"
          echo "target_sha=$target_sha" >> "$GITHUB_OUTPUT"
          echo "VERIFIED_REVISION=$target_sha" >> "$GITHUB_ENV"

      - name: Set up Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          cache-read-only: true

      - name: Verify the execution and freeze contracts
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --no-configuration-cache \
            -PregelsucheRepositoryRevision="$VERIFIED_REVISION" \
            :regelsuche-search:test \
            --tests de.regelsuche.search.strategy.SearchStrategyTest \
            :regelsuche-discovery:test \
            --tests de.regelsuche.discovery.representation.TargetFreeRepresentationEvaluationPlanTest \
            --tests de.regelsuche.discovery.representation.TargetFreeRepresentationSearchTest \
            --tests de.regelsuche.discovery.representation.TargetFreeRepresentationCandidateFreezeTest \
            :regelsuche-discovery:generateTargetFreeRepresentationCandidateFreeze \
            --console=plain 2>&1 | tee /tmp/target-free-integration.log
          ./gradlew --no-daemon --no-configuration-cache \
            -PregelsucheRepositoryRevision="$VERIFIED_REVISION" \
            :regelsuche-discovery:check \
            --console=plain 2>&1 | tee -a /tmp/target-free-integration.log
          python3 - <<'PY'
          import json
          from pathlib import Path

          artifact = Path(
              'regelsuche-discovery/build/reports/representation-discovery/'
              'candidate-freeze/representation-discovery-candidate-freeze.json'
          )
          data = json.loads(artifact.read_text(encoding='utf-8'))
          content = data['content']
          assert content['qualificationDisclosure'] == 'NOT_DISCLOSED'
          assert len(content['entries']) == 24
          assert len({entry['configurationId'] for entry in content['entries']}) == 24
          assert {entry['caseId'] for entry in content['entries']} == {
              'assumption-sensitive-cancellation-control',
              'catalog-blind-trigonometric-bridge',
              'neutral-element-compression',
              'occurrence-local-trigonometric-bridge',
              'repeated-term-compression',
              'telescoping-capability-bridge',
          }
          for entry in content['entries']:
              budget = entry['configuredBudget']
              work = entry['work']
              assert work['engineCalls'] <= budget['maxEngineCalls']
              assert work['generatedPrimitiveSteps'] <= budget[
                  'maxAdmittedPrimitiveSteps'
              ]
              assert work['exploredStates'] <= budget['maxExploredStates']
              assert work['retainedStates'] <= budget['maxRetainedStates']
              assert work['generatedTransitions'] <= budget[
                  'maxGeneratedTransitions'
              ]
          canonical = artifact.read_text(encoding='utf-8')
          for forbidden in (
              '"referenceExpressions"',
              '"requiredCapabilities"',
              '"acceptedCandidateTypes"',
          ):
              assert forbidden not in canonical
          PY

      - name: Publish the verified execution branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$VERIFIED_REVISION"
          test -z "$(git status --porcelain --untracked-files=normal)"
          git push origin HEAD:agent/target-free-candidate-freeze

      - name: Persist automation outcome
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          target_head="$(git ls-remote origin refs/heads/agent/target-free-candidate-freeze | cut -f1)"
          git reset --hard
          git clean -fd
          git switch automation/pr695-occurrence-fix
          mkdir -p debug
          {
            echo '{'
            echo '  "workflowRunId": "${{ github.run_id }}",'
            echo '  "workflowRunAttempt": "${{ github.run_attempt }}",'
            echo '  "status": "'"$JOB_STATUS"'",'
            echo '  "targetHead": "'"$target_head"'",'
            echo '  "expectedOldHead": "897982c4e0ba9f2e99458d555e2b8f7a9d86f96f"'
            echo '}'
          } > debug/target-free-integration-status.json
          if test -f /tmp/target-free-integration.log; then
            tail -n 300 /tmp/target-free-integration.log \
              > debug/target-free-integration.log
          fi
          git config user.name 'github-actions[bot]'
          git config user.email \
            '41898282+github-actions[bot]@users.noreply.github.com'
          git add debug/target-free-integration-status.json
          if test -f debug/target-free-integration.log; then
            git add debug/target-free-integration.log
          fi
          if ! git diff --cached --quiet; then
            git commit -m 'Record target-free integration outcome'
            git push origin HEAD:automation/pr695-occurrence-fix
          fi
