name: Apply PR 695 occurrence fix

on:
  push:
    branches:
      - automation/pr695-occurrence-fix
    paths:
      - '.github/patches/pr695-occurrence-fix.patch'
      - '.github/workflows/apply-pr695-occurrence-fix.yml'

permissions:
  contents: write

concurrency:
  group: apply-pr695-occurrence-fix
  cancel-in-progress: false

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Check out automation source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Materialize the audited fix
        shell: bash
        run: |
          set -euo pipefail
          cp .github/patches/pr695-occurrence-fix.patch /tmp/pr695-occurrence-fix.patch
          echo '713026f19cf3a41b9e862262efc1855c127a53b644a84ff125d9cbcf8eef6559  /tmp/pr695-occurrence-fix.patch' \
            | sha256sum --check --strict
          git fetch origin agent/pr693-pre-freeze-hardening
          test "$(git rev-parse origin/agent/pr693-pre-freeze-hardening)" = \
            'a64d1556fb732b9172105abfd780ad0dbd613cfe'
          git switch --detach origin/agent/pr693-pre-freeze-hardening
          git apply --check /tmp/pr695-occurrence-fix.patch
          git apply /tmp/pr695-occurrence-fix.patch
          python3 - <<'PY'
          from pathlib import Path

          path = Path('docs/target-free-representation-evaluation.md')
          text = path.read_text(encoding='utf-8')
          replacements = [
              (
                  'sha256:74dc8849481a1a9dcff2e5935154a352cbf49fe857dc8eaa56866ceb737d7778',
                  'sha256:aae56e8ae14b2df8b9929f9e0a554205f7438e7ec8386a8a8520da03342fd223',
              ),
              (
                  'sha256:c20d3ae748fca3509927f41da9c607f8a14353467a530b83d4c9fab93804d833',
                  'sha256:b87239dcc3a3bed26cee1db87240cb6d7587f0f9a551e5a279f9738cd8866835',
              ),
              (
                  'sha256:0097cd62f529bb61b623106eafb05ac9fe86e6186026e2eca1cbe0cd183a84e1',
                  'sha256:1ce6d02d7d87161de274a88bbc2bcfe92816dbb182287397176805a47e274610',
              ),
              (
                  '4. occurrence-lokale trigonometrische Brücke innerhalb eines größeren\n'
                  '   Ausdrucks;',
                  '4. occurrence-lokale trigonometrische Brücke in einem nichtassoziativen\n'
                  '   Multiplikationskontext, der die bekannte Summenstruktur als eigenen\n'
                  '   AST-Teilbaum erhält;',
              ),
              (
                  '- die occurrence-lokale Brücke qualifiziert die bekannte trigonometrische\n'
                  '  Struktur und die konkrete Konsequenz `rule:sympy.trig.pythagorean`;',
                  '- die occurrence-lokale Brücke liegt unter einer äußeren Multiplikation; die\n'
                  '  trigonometrische Summe bleibt daher trotz kanonischer AC-Normalisierung ein\n'
                  '  echter AST-Teilbaum und qualifiziert die konkrete Konsequenz\n'
                  '  `rule:sympy.trig.pythagorean`;',
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f'expected exactly one documentation occurrence, found {count}: {old!r}'
                  )
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check

      - name: Set up Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb

      - name: Verify the affected contracts
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon \
            :regelsuche-core:test \
            --tests de.regelsuche.knowledge.KnowledgePackRegistryTest \
            :regelsuche-search:test \
            --tests de.regelsuche.search.strategy.SearchStrategyTest \
            :regelsuche-discovery:test \
            --tests de.regelsuche.discovery.representation.TargetFreeRepresentationEvaluationPlanTest \
            :regelsuche-discovery:generateTargetFreeRepresentationEvaluationPlan \
            --console=plain 2>&1 | tee /tmp/pr695-occurrence-verify.log

      - name: Publish the verified fix to PR 695
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            docs/target-free-representation-evaluation.md \
            regelsuche-discovery/src/main/java/de/regelsuche/discovery/representation/TargetFreeRepresentationEvaluationPlan.java \
            regelsuche-discovery/src/main/resources/de/regelsuche/discovery/representation/target-free-representation-formation-v1.json \
            regelsuche-discovery/src/main/resources/de/regelsuche/discovery/representation/target-free-representation-preregistration-v1.json \
            regelsuche-discovery/src/main/resources/de/regelsuche/discovery/representation/target-free-representation-qualification-v1.json \
            regelsuche-discovery/src/test/java/de/regelsuche/discovery/representation/TargetFreeRepresentationEvaluationPlanTest.java
          git commit -m 'Preserve the occurrence-local bridge after normalization'
          git push origin HEAD:agent/pr693-pre-freeze-hardening

      - name: Persist automation outcome
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          target_head="$(git ls-remote origin refs/heads/agent/pr693-pre-freeze-hardening | cut -f1)"
          git reset --hard
          git clean -fd
          git switch automation/pr695-occurrence-fix
          mkdir -p debug
          {
            echo '{'
            echo '  "workflowRunId": "${{ github.run_id }}",'
            echo '  "workflowRunAttempt": "${{ github.run_attempt }}",'
            echo '  "status": "'"$JOB_STATUS"'",'
            echo '  "targetHead": "'"$target_head"'",'
            echo '  "expectedOldHead": "a64d1556fb732b9172105abfd780ad0dbd613cfe"'
            echo '}'
          } > debug/pr695-occurrence-fix-status.json
          if test -f /tmp/pr695-occurrence-verify.log; then
            tail -n 250 /tmp/pr695-occurrence-verify.log \
              > debug/pr695-occurrence-fix-verify.log
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add debug/pr695-occurrence-fix-status.json
          if test -f debug/pr695-occurrence-fix-verify.log; then
            git add debug/pr695-occurrence-fix-verify.log
          fi
          if ! git diff --cached --quiet; then
            git commit -m 'Record PR 695 occurrence fix automation outcome'
            git push origin HEAD:automation/pr695-occurrence-fix
          fi
