name: Discovery Challenge Development Pilots

on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/run-discovery-challenge-development-pilots.py'
      - 'research/challenges/**'
      - 'regelsuche-discovery/**'
      - 'regelsuche-solver-portfolio/**'
      - 'app/src/test/java/de/regelsuche/learning/MacroLearningPipelineReplayIntegrationTest.java'
      - '.github/workflows/discovery-challenge-development-pilots.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'scripts/run-discovery-challenge-development-pilots.py'
      - 'research/challenges/**'
      - 'regelsuche-discovery/**'
      - 'regelsuche-solver-portfolio/**'
      - 'app/src/test/java/de/regelsuche/learning/MacroLearningPipelineReplayIntegrationTest.java'
      - '.github/workflows/discovery-challenge-development-pilots.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  development-pilots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6.1.0
      - name: Execute repository-owned development pilots
        run: python3 scripts/run-discovery-challenge-development-pilots.py
      - name: Upload development-only pilot receipt
        uses: actions/upload-artifact@v7
        with:
          name: discovery-challenge-development-pilots
          path: build/reports/discovery-challenge-pilots/report.json
