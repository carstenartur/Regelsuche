name: Generic Discovery Domains

on:
  push:
    branches: [ "main" ]
    paths:
      - 'regelsuche-discovery/**'
      - 'docs/generic-discovery-domains.md'
      - 'docs/generic-discovery-domain-verification.md'
      - 'docs/schemas/regelsuche-discovery-domain-descriptor-v1.schema.json'
      - 'docs/schemas/regelsuche-domain-discovery-evidence-v1.schema.json'
      - 'scripts/run-generic-discovery-domains-verification.sh'
      - 'scripts/verify-generic-discovery-domains.py'
      - '.github/workflows/generic-discovery-domains.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'regelsuche-discovery/**'
      - 'docs/generic-discovery-domains.md'
      - 'docs/generic-discovery-domain-verification.md'
      - 'docs/schemas/regelsuche-discovery-domain-descriptor-v1.schema.json'
      - 'docs/schemas/regelsuche-domain-discovery-evidence-v1.schema.json'
      - 'scripts/run-generic-discovery-domains-verification.sh'
      - 'scripts/verify-generic-discovery-domains.py'
      - '.github/workflows/generic-discovery-domains.yml'
  workflow_dispatch:

concurrency:
  group: generic-discovery-domains-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  domains:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6.1.0
      - name: Run repository-owned generic discovery-domain verification
        run: bash scripts/run-generic-discovery-domains-verification.sh
      - name: Upload domain evidence and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: generic-discovery-domain-evidence
          path: |
            regelsuche-discovery/build/reports/domain-discovery/**
            regelsuche-discovery/build/reports/tests/**
            regelsuche-discovery/build/test-results/**
            build/reports/generic-discovery-domains-ci/**
            docs/generic-discovery-domain-verification.md
          if-no-files-found: warn
