name: Typed external development comparison
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: typed-external-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  compare:
    name: Typed source-only learning comparison
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with: { distribution: temurin, java-version: '25', verify-signature: true }
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with: { cache-cleanup: on-success }
      - name: Run typed comparison and independent verification
        run: bash gradle/run-typed-external-polynomial-comparison.sh
      - name: Retain every outcome and test receipt
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: typed-external-polynomial-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            build/reports/typed-external-polynomial-comparison/**
            regelsuche-search/build/test-results/**
            regelsuche-learning/build/test-results/**
          if-no-files-found: error
