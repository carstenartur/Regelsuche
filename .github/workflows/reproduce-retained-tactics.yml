name: Retained tactic study
on:
  push:
    branches: [research/retained-tactics-reproduction]
    paths: ['.github/workflows/reproduce-retained-tactics.yml']
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: '06d0075774b139bfe7f8c9eee35d5d50f202bb97'
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Compile and test retained proofs and admission
        run: mvn -B -ntp -pl regelsuche-learning -am -Dtest=ProofDepthChallengeTest,CheckedSchemaRetentionTest,CostAwareTacticRouterTest,CheckedSchemaSelectionDifferentialTest -Dsurefire.failIfNoSpecifiedTests=false test
      - name: Reproduce acquisition and training
        shell: bash
        run: |
          for pass in 0 1; do
            mvn -B -ntp -pl regelsuche-learning -am -Dtest=RetainedTacticStudyTest -Dsurefire.failIfNoSpecifiedTests=false -Dretained.phase=train "-Dretained.research=$PWD/docs/research" "-Dretained.output=$RUNNER_TEMP/train-$pass" test
          done
          diff -rq "$RUNNER_TEMP/train-0" "$RUNNER_TEMP/train-1"
          sha256sum "$RUNNER_TEMP"/train-0/*
      - name: Audit acquisition and calibration without creating final cases
        shell: bash
        run: |
          mkdir -p docs/research/prospective-retained-tactics/training
          cp "$RUNNER_TEMP"/train-0/* docs/research/prospective-retained-tactics/training/
          python3 - <<'PY'
          import runpy, sys
          from pathlib import Path
          path=Path("docs/research/prospective-retained-tactics").resolve()
          sys.path.insert(0,str(path))
          v=runpy.run_path(str(path/"verify.py"))
          models, receipt, sources = v["materials"]()
          print("Checked purchased models", [(k,len(m[1])) for k,m in models.items()], "calibration",len(receipt["calibrationSources"]))
          PY
      - name: Make the independently reproducible measurements available
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: retained-tactic-development-06d007577
          retention-days: 90
          path: |
            ${{ runner.temp }}/train-0/
            ${{ runner.temp }}/dev-0/
            ${{ runner.temp }}/dev-1/
            ${{ runner.temp }}/final-0/
            ${{ runner.temp }}/final-1/
            ${{ runner.temp }}/development.json
            ${{ runner.temp }}/verification.json
      - name: Print machine-readable deterministic receipts
        if: always()
        shell: python
        run: |
          from pathlib import Path
          import base64, hashlib, os
          root = Path(os.environ["RUNNER_TEMP"])
          files = [root/"development.json",root/"verification.json",*sorted((root/"train-0").glob("*.json"))]
          for path in files:
              if not path.is_file(): continue
              data = path.read_bytes()
              print("RECEIPT",path.name,len(data),hashlib.sha256(data).hexdigest())
              for i in range(0,len(data),6000):
                  print("RETAINED-DATA",path.name,str(i//6000),base64.b64encode(data[i:i+6000]).decode())
