name: Autonomous Discovery Walkthrough

on:
  push:
    branches: [ "main" ]
    paths:
      - 'README.md'
      - 'docs/README.md'
      - 'docs/demo-gallery.md'
      - 'docs/autonomous-discovery-walkthrough.md'
      - 'docs/generated/autonomous-discovery-walkthrough/**'
      - 'docs/schemas/regelsuche-autonomous-discovery-result-card-v1.schema.json'
      - 'scripts/verify-autonomous-discovery-walkthrough.py'
      - 'regelsuche-autopilot/**'
      - 'regelsuche-release/**'
      - 'Dockerfile'
      - '.github/workflows/autonomous-discovery-walkthrough.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'README.md'
      - 'docs/README.md'
      - 'docs/demo-gallery.md'
      - 'docs/autonomous-discovery-walkthrough.md'
      - 'docs/generated/autonomous-discovery-walkthrough/**'
      - 'docs/schemas/regelsuche-autonomous-discovery-result-card-v1.schema.json'
      - 'scripts/verify-autonomous-discovery-walkthrough.py'
      - 'regelsuche-autopilot/**'
      - 'regelsuche-release/**'
      - 'Dockerfile'
      - '.github/workflows/autonomous-discovery-walkthrough.yml'
  workflow_dispatch:

concurrency:
  group: autonomous-discovery-walkthrough-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  walkthrough:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0

      - name: Generate two clean local walkthroughs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/walkthrough-local-a build/walkthrough-local-b
          REGELSUCHE_REPOSITORY_REVISION="$GITHUB_SHA" ./gradlew \
            :regelsuche-release:runAutonomousDiscoveryWalkthrough \
            -PwalkthroughOutput="$PWD/build/walkthrough-local-a" \
            --rerun-tasks --console=plain 2>&1 | tee walkthrough-local-a.log
          REGELSUCHE_REPOSITORY_REVISION="$GITHUB_SHA" ./gradlew \
            :regelsuche-release:runAutonomousDiscoveryWalkthrough \
            -PwalkthroughOutput="$PWD/build/walkthrough-local-b" \
            --rerun-tasks --console=plain 2>&1 | tee walkthrough-local-b.log
          diff -ru build/walkthrough-local-a build/walkthrough-local-b

      - name: Validate schema and independently recompute the card
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet jsonschema==4.25.1
          python3 scripts/verify-autonomous-discovery-walkthrough.py \
            --root build/walkthrough-local-a \
            --schema docs/schemas/regelsuche-autonomous-discovery-result-card-v1.schema.json
          python3 scripts/verify-autonomous-discovery-walkthrough.py \
            --root build/walkthrough-local-b \
            --schema docs/schemas/regelsuche-autonomous-discovery-result-card-v1.schema.json

      - name: Build pinned walkthrough container
        shell: bash
        run: |
          set -euo pipefail
          docker build \
            --target walkthrough \
            --build-arg REGELSUCHE_REPOSITORY_REVISION="$GITHUB_SHA" \
            -t regelsuche-autonomous-walkthrough .

      - name: Reproduce the complete walkthrough in the container
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/walkthrough-container
          mkdir -p build/walkthrough-container
          chmod 0777 build/walkthrough-container
          docker run --rm \
            -v "$PWD/build/walkthrough-container:/out" \
            regelsuche-autonomous-walkthrough \
            2>&1 | tee walkthrough-container.log
          diff -ru build/walkthrough-local-a build/walkthrough-container
          python3 scripts/verify-autonomous-discovery-walkthrough.py \
            --root build/walkthrough-container \
            --schema docs/schemas/regelsuche-autonomous-discovery-result-card-v1.schema.json

      - name: Require generated gallery figures to be current
        shell: bash
        run: |
          set -euo pipefail
          diff -ru \
            build/walkthrough-local-a/figures \
            docs/generated/autonomous-discovery-walkthrough

      - name: Upload result cards, evidence and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: autonomous-discovery-walkthrough
          path: |
            walkthrough-local-a.log
            walkthrough-local-b.log
            walkthrough-container.log
            build/walkthrough-local-a/**
            build/walkthrough-local-b/**
            build/walkthrough-container/**
            regelsuche-release/build/test-results/**
            regelsuche-release/build/reports/tests/**
          if-no-files-found: warn
