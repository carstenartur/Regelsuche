name: Apply Domain Generic Qualification Source

on:
  push:
    branches: [ "issue-224-domain-generic-qualification" ]
    paths:
      - '.github/workflows/branch-source-snapshot.yml'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: issue-224-domain-generic-qualification
          fetch-depth: 0

      - name: Decode, validate and commit qualification source
        shell: bash
        run: |
          set -euo pipefail
          cat .github/domain-generic-patch/chunk-* \
            | base64 --decode > /tmp/domain-generic-changes.tar.gz
          tar -tzf /tmp/domain-generic-changes.tar.gz > /tmp/domain-generic-files.txt
          grep -qx '.github/workflows/domain-generic-qualification.yml' \
            /tmp/domain-generic-files.txt
          grep -qx 'regelsuche-release/src/main/java/de/regelsuche/release/DomainGenericDiscoveryQualification.java' \
            /tmp/domain-generic-files.txt
          grep -qx 'regelsuche-release/src/test/java/de/regelsuche/release/DomainGenericQualificationRunnerTest.java' \
            /tmp/domain-generic-files.txt
          tar -xzf /tmp/domain-generic-changes.tar.gz

          rm -rf .github/domain-generic-patch
          rm -f .github/workflows/branch-apply-domain-generic.yml
          rm -f .github/workflows/branch-source-snapshot.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat(release): qualify reproducible domain-generic discovery'
          git push origin HEAD:issue-224-domain-generic-qualification
