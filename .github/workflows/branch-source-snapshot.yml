name: Apply Domain Generic Qualification Source

on:
  push:
    branches: [ "issue-224-domain-generic-qualification" ]
    paths:
      - '.github/workflows/branch-source-snapshot.yml'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: issue-224-domain-generic-qualification
          fetch-depth: 0

      - name: Decode and authenticate source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .github/domain-generic-patch/chunk-* \
            | base64 --decode > /tmp/domain-generic-changes.tar.gz
          actual="$(sha256sum /tmp/domain-generic-changes.tar.gz | cut -d' ' -f1)"
          test "$actual" = c029497c2618b337e9f0ae110f124f0b52f3ecaad9fa3d24df6625620b734875
          tar -tzf /tmp/domain-generic-changes.tar.gz \
            > /tmp/domain-generic-files.txt
          test "$(wc -l < /tmp/domain-generic-files.txt)" -eq 12

      - name: Extract non-workflow qualification source
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf /tmp/domain-generic-changes.tar.gz
          rm -f .github/workflows/domain-generic-qualification.yml
          test -s regelsuche-release/src/main/java/de/regelsuche/release/DomainGenericDiscoveryQualification.java
          test -s regelsuche-release/src/test/java/de/regelsuche/release/DomainGenericQualificationRunnerTest.java

      - name: Stage qualification documentation and schemas
        shell: bash
        run: |
          set -euo pipefail
          git add \
            docs/README.md \
            docs/domain-generic-qualification.md \
            docs/schemas/regelsuche-domain-generic-evidence-profile-catalog-v1.schema.json \
            docs/schemas/regelsuche-domain-generic-discovery-qualification-v1.schema.json \
            docs/schemas/regelsuche-domain-generic-discovery-qualification-run-v1.schema.json

      - name: Stage qualification Java source
        shell: bash
        run: |
          set -euo pipefail
          git add \
            regelsuche-release/build.gradle \
            regelsuche-release/src/main/java/de/regelsuche/release/DomainGenericEvidenceProfile.java \
            regelsuche-release/src/main/java/de/regelsuche/release/DomainGenericDiscoveryQualification.java \
            regelsuche-release/src/main/java/de/regelsuche/release/DomainGenericQualificationRunner.java \
            regelsuche-release/src/main/java/de/regelsuche/release/DomainGenericQualificationMain.java \
            regelsuche-release/src/test/java/de/regelsuche/release/DomainGenericQualificationRunnerTest.java

      - name: Validate staged qualification source
        shell: bash
        run: |
          set -euo pipefail
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 11

      - name: Commit non-workflow qualification source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(release): qualify reproducible domain-generic discovery'

      - name: Push non-workflow qualification source
        shell: bash
        run: git push origin HEAD:issue-224-domain-generic-qualification
