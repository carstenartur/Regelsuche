name: Apply streaming JSON compatibility follow-up

on:
  push:
    branches:
      - feature/streaming-json-request-bodies
    paths:
      - .github/workflows/apply-streaming-json-followup.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Check out the implementation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb

      - name: Reassemble and apply the reviewed follow-up patch
        shell: bash
        run: |
          set -euo pipefail
          echo 'c60447e12df9f43089da98ab4a7af0411ac7f197cf3c8ad6898bcfcb1497426b  .github/bootstrap/streaming-json-followup/part-0' | sha256sum --check --strict
          echo '3caf724b6d07963ecbc9f71584b6f05805aa0271ab29cb7c160b200808a361a0  .github/bootstrap/streaming-json-followup/part-1' | sha256sum --check --strict
          cat \
            .github/bootstrap/streaming-json-followup/part-0 \
            .github/bootstrap/streaming-json-followup/part-1 \
            | base64 --decode \
            | gzip --decompress > /tmp/streaming-json-followup.patch
          echo 'c8ccfa91e4b1979ed1b70e9031b144371be06787585b124818d80af7576729d1  /tmp/streaming-json-followup.patch' | sha256sum --check --strict
          git apply --check /tmp/streaming-json-followup.patch
          git apply --index /tmp/streaming-json-followup.patch
          git diff --cached --check

      - name: Run focused streaming and proof compatibility tests
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --no-configuration-cache \
            :app:test \
            --tests de.regelsuche.web.BoundedRequestBodyTest \
            --tests de.regelsuche.web.StreamingJsonRequestBodyTest \
            --tests de.regelsuche.web.WebWorkbenchServerRequestLimitTest \
            --tests de.regelsuche.web.OpenApiStaticReferenceTest \
            --tests de.regelsuche.web.RuleRadarApiTest \
            --tests de.regelsuche.radar.RuleRadarRequestBodyTest \
            --tests de.regelsuche.web.ProofJobsApiTest \
            --console=plain

      - name: Commit the verified follow-up and remove bootstrap files
        shell: bash
        run: |
          set -euo pipefail
          git rm --ignore-unmatch \
            .github/bootstrap/streaming-json-followup/part-* \
            .github/workflows/apply-streaming-json-followup.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Preserve structured proof assumptions in streaming requests'
          git push origin HEAD:feature/streaming-json-request-bodies
