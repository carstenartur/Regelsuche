name: Domain Discovery Export

on:
  push:
    branches: [ "main" ]
    paths:
      - 'regelsuche-discovery/build.gradle'
      - 'regelsuche-discovery/src/main/java/de/regelsuche/discovery/domain/DomainDiscoveryExport.java'
      - 'regelsuche-discovery/src/main/java/de/regelsuche/discovery/domain/DomainDiscoveryExportVerifier.java'
      - 'regelsuche-discovery/src/main/java/de/regelsuche/discovery/domain/DomainDiscoveryEvidence.java'
      - 'regelsuche-discovery/src/main/java/de/regelsuche/discovery/domain/DiscoveryLifecycleHandoff.java'
      - 'regelsuche-discovery/src/main/java/de/regelsuche/discovery/domain/DiscoveryDomainDescriptor.java'
      - 'regelsuche-discovery/src/main/java/de/regelsuche/discovery/domain/ExpressionRewriteDiscoveryDomain.java'
      - 'regelsuche-discovery/src/main/java/de/regelsuche/discovery/domain/FiniteDifferenceSequenceDomain.java'
      - 'regelsuche-discovery/src/test/java/de/regelsuche/discovery/domain/DomainDiscoveryExportTest.java'
      - 'regelsuche-discovery/src/test/java/de/regelsuche/discovery/domain/DomainDiscoveryExportVerifierTest.java'
      - 'docs/README.md'
      - 'docs/generic-discovery-domains.md'
      - 'docs/domain-discovery-export.md'
      - 'docs/domain-discovery-export-verification.md'
      - 'docs/schemas/regelsuche-discovery-domain-descriptor-v1.schema.json'
      - 'docs/schemas/regelsuche-domain-discovery-evidence-v1.schema.json'
      - 'docs/schemas/regelsuche-discovery-lifecycle-handoff-v1.schema.json'
      - 'docs/schemas/regelsuche-domain-discovery-export-v1.schema.json'
      - 'docs/schemas/regelsuche-domain-discovery-export-verification-v1.schema.json'
      - '.github/workflows/domain-discovery-export.yml'
  pull_request:
    branches: [ "main", "issue-224-generic-domain-export" ]
    paths:
      - 'regelsuche-discovery/build.gradle'
      - 'regelsuche-discovery/src/main/java/de/regelsuche/discovery/domain/DomainDiscoveryExport.java'
      - 'regelsuche-discovery/src/main/java/de/regelsuche/discovery/domain/DomainDiscoveryExportVerifier.java'
      - 'regelsuche-discovery/src/main/java/de/regelsuche/discovery/domain/DomainDiscoveryEvidence.java'
      - 'regelsuche-discovery/src/main/java/de/regelsuche/discovery/domain/DiscoveryLifecycleHandoff.java'
      - 'regelsuche-discovery/src/main/java/de/regelsuche/discovery/domain/DiscoveryDomainDescriptor.java'
      - 'regelsuche-discovery/src/main/java/de/regelsuche/discovery/domain/ExpressionRewriteDiscoveryDomain.java'
      - 'regelsuche-discovery/src/main/java/de/regelsuche/discovery/domain/FiniteDifferenceSequenceDomain.java'
      - 'regelsuche-discovery/src/test/java/de/regelsuche/discovery/domain/DomainDiscoveryExportTest.java'
      - 'regelsuche-discovery/src/test/java/de/regelsuche/discovery/domain/DomainDiscoveryExportVerifierTest.java'
      - 'docs/README.md'
      - 'docs/generic-discovery-domains.md'
      - 'docs/domain-discovery-export.md'
      - 'docs/domain-discovery-export-verification.md'
      - 'docs/schemas/regelsuche-discovery-domain-descriptor-v1.schema.json'
      - 'docs/schemas/regelsuche-domain-discovery-evidence-v1.schema.json'
      - 'docs/schemas/regelsuche-discovery-lifecycle-handoff-v1.schema.json'
      - 'docs/schemas/regelsuche-domain-discovery-export-v1.schema.json'
      - 'docs/schemas/regelsuche-domain-discovery-export-verification-v1.schema.json'
      - '.github/workflows/domain-discovery-export.yml'
  workflow_dispatch:

concurrency:
  group: domain-discovery-export-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.1.0

      - name: Verify generic domain export and snapshot contracts
        run: |
          ./gradlew :regelsuche-discovery:test \
            --tests de.regelsuche.discovery.domain.DomainDiscoveryExportTest \
            --tests de.regelsuche.discovery.domain.DomainDiscoveryExportVerifierTest \
            --rerun-tasks

      - name: Require complete expression and sequence evidence
        run: |
          for domain in expression sequence; do
            for name in domain evidence lifecycle-handoff export-manifest; do
              test -s "regelsuche-discovery/build/reports/domain-discovery-export/${domain}/${name}.json"
              test -s "regelsuche-discovery/build/reports/domain-discovery-export-verification/${domain}/${name}.json"
            done
            test -s "regelsuche-discovery/build/reports/domain-discovery-export-verification/${domain}/verification.json"
          done

      - name: Require byte-identical repeated exports and verification receipts
        run: |
          cp -a \
            regelsuche-discovery/build/reports/domain-discovery-export \
            /tmp/domain-discovery-export-first
          cp -a \
            regelsuche-discovery/build/reports/domain-discovery-export-verification \
            /tmp/domain-discovery-export-verification-first
          ./gradlew :regelsuche-discovery:test \
            --tests de.regelsuche.discovery.domain.DomainDiscoveryExportTest \
            --tests de.regelsuche.discovery.domain.DomainDiscoveryExportVerifierTest \
            --rerun-tasks
          diff -ru \
            /tmp/domain-discovery-export-first \
            regelsuche-discovery/build/reports/domain-discovery-export
          diff -ru \
            /tmp/domain-discovery-export-verification-first \
            regelsuche-discovery/build/reports/domain-discovery-export-verification

      - name: Validate schemas, roots, bytes, receipts and representation boundary
        shell: bash
        run: |
          python3 -m venv .venv-domain-discovery-export
          .venv-domain-discovery-export/bin/python -m pip install \
            --disable-pip-version-check \
            --quiet \
            jsonschema==4.25.1
          .venv-domain-discovery-export/bin/python - <<'PY'
          import copy
          import hashlib
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          from jsonschema.exceptions import ValidationError

          def sha256(data):
              return 'sha256:' + hashlib.sha256(data).hexdigest()

          def canonical_map(values):
              return '|'.join(
                  f'{len(key)}:{key}={len(value)}:{value}'
                  for key, value in sorted(values.items())
              )

          def canonical_list(values):
              return '|'.join(f'{len(value)}:{value}' for value in values)

          def expect_rejection(validator, value, label):
              try:
                  validator.validate(value)
              except ValidationError:
                  return
              raise AssertionError(f'{label} unexpectedly passed schema validation')

          schema_root = Path('docs/schemas')
          schemas = {
              'descriptor': 'regelsuche-discovery-domain-descriptor-v1.schema.json',
              'evidence': 'regelsuche-domain-discovery-evidence-v1.schema.json',
              'handoff': 'regelsuche-discovery-lifecycle-handoff-v1.schema.json',
              'manifest': 'regelsuche-domain-discovery-export-v1.schema.json',
              'verification': 'regelsuche-domain-discovery-export-verification-v1.schema.json',
          }
          validators = {}
          for name, file_name in schemas.items():
              schema = json.loads((schema_root / file_name).read_text(encoding='utf-8'))
              Draft202012Validator.check_schema(schema)
              assert schema.get('additionalProperties') is False
              validators[name] = Draft202012Validator(schema)

          expected_domains = {
              'expression': 'expression-rewrite',
              'sequence': 'integer-sequence-finite-difference',
          }
          forbidden_keys = {
              'payload',
              'canonicalState',
              'seedExpression',
              'selectedExpression',
              'sequenceTerms',
              'states',
              'path',
          }
          role_order = [
              'DOMAIN_DESCRIPTOR',
              'DISCOVERY_EVIDENCE',
              'LIFECYCLE_HANDOFF',
          ]

          def nested_keys(value):
              if isinstance(value, dict):
                  for key, nested in value.items():
                      yield key
                      yield from nested_keys(nested)
              elif isinstance(value, list):
                  for nested in value:
                      yield from nested_keys(nested)

          def validate_export(directory, expected_domain):
              paths = {
                  'descriptor': directory / 'domain.json',
                  'evidence': directory / 'evidence.json',
                  'handoff': directory / 'lifecycle-handoff.json',
                  'manifest': directory / 'export-manifest.json',
              }
              documents = {
                  name: json.loads(path.read_text(encoding='utf-8'))
                  for name, path in paths.items()
              }
              for name, document in documents.items():
                  validators[name].validate(document)

              descriptor = documents['descriptor']
              evidence = documents['evidence']
              handoff = documents['handoff']
              manifest = documents['manifest']
              assert descriptor == evidence['domain']
              assert descriptor['domainId'] == expected_domain
              assert evidence['campaignId'] == manifest['campaignId']
              assert descriptor['domainId'] == manifest['domainId']
              assert descriptor['revision'] == manifest['domainRevision']
              assert descriptor['contentHash'] == manifest['domainDescriptorHash']
              assert evidence['contentHash'] == manifest['discoveryEvidenceHash']
              assert handoff['contentHash'] == manifest['lifecycleHandoffHash']
              assert handoff['sourceKind'] == 'DOMAIN_DISCOVERY_EVIDENCE'
              assert handoff['stage'] == 'DISCOVERY_VALIDATION'
              assert handoff['campaignId'] == evidence['campaignId']
              assert handoff['domainId'] == descriptor['domainId']
              assert handoff['domainRevision'] == descriptor['revision']
              assert handoff['domainContractHash'] == descriptor['contentHash']
              assert handoff['inputHash'] == evidence['seed']['contentHash']
              assert handoff['sourceEvidenceHash'] == evidence['contentHash']
              for report in (evidence, handoff):
                  for status in (
                      'proofStatus',
                      'externalNoveltyStatus',
                      'promotionStatus',
                      'publicEvidenceStatus',
                  ):
                      assert report[status] == 'NOT_EVALUATED'

              artifacts = manifest['artifacts']
              assert [item['fileName'] for item in artifacts] == sorted(
                  item['fileName'] for item in artifacts)
              by_role = {item['role']: item for item in artifacts}
              assert set(by_role) == set(role_order)
              expected = {
                  'DOMAIN_DESCRIPTOR': (paths['descriptor'], descriptor['contentHash']),
                  'DISCOVERY_EVIDENCE': (paths['evidence'], evidence['contentHash']),
                  'LIFECYCLE_HANDOFF': (paths['handoff'], handoff['contentHash']),
              }
              for role, (path, source_hash) in expected.items():
                  artifact = by_role[role]
                  retained = path.read_bytes()
                  assert artifact['sourceContentHash'] == source_hash
                  assert artifact['byteHash'] == sha256(retained)
                  assert artifact['byteLength'] == len(retained)

              artifact_material = '[' + ', '.join(
                  f"{item['fileName']}|{item['role']}|"
                  f"{item['sourceContentHash']}|{item['byteHash']}|"
                  f"{item['byteLength']}"
                  for item in artifacts
              ) + ']'
              manifest_material = (
                  'regelsuche.domain-discovery-export/v1'
                  + '\ncampaignId=' + manifest['campaignId']
                  + '\ndomainId=' + manifest['domainId']
                  + '\ndomainRevision=' + manifest['domainRevision']
                  + '\ndomainDescriptorHash=' + manifest['domainDescriptorHash']
                  + '\ndiscoveryEvidenceHash=' + manifest['discoveryEvidenceHash']
                  + '\nlifecycleHandoffHash=' + manifest['lifecycleHandoffHash']
                  + '\nartifacts=' + artifact_material
                  + '\ncommitProtocol=' + manifest['commitProtocol']
              ).encode('utf-8')
              assert manifest['contentHash'] == sha256(manifest_material)
              assert manifest['commitProtocol'] == 'MANIFEST_LAST_ATOMIC_RENAME'
              assert forbidden_keys.isdisjoint(set(nested_keys(handoff)))
              assert forbidden_keys.isdisjoint(set(nested_keys(manifest)))

              invalid_manifest = copy.deepcopy(manifest)
              invalid_manifest['artifacts'][0] = copy.deepcopy(
                  invalid_manifest['artifacts'][1])
              expect_rejection(
                  validators['manifest'],
                  invalid_manifest,
                  'manifest with duplicate/missing role',
              )
              invalid_handoff = copy.deepcopy(handoff)
              invalid_handoff['payload'] = 'representation leak'
              expect_rejection(
                  validators['handoff'],
                  invalid_handoff,
                  'handoff with representation payload',
              )
              return paths, manifest, by_role

          writer_root = Path(
              'regelsuche-discovery/build/reports/domain-discovery-export')
          verification_root = Path(
              'regelsuche-discovery/build/reports/domain-discovery-export-verification')

          for directory_name, expected_domain in expected_domains.items():
              validate_export(writer_root / directory_name, expected_domain)
              paths, manifest, by_role = validate_export(
                  verification_root / directory_name,
                  expected_domain,
              )
              verification_path = (
                  verification_root / directory_name / 'verification.json')
              verification = json.loads(
                  verification_path.read_text(encoding='utf-8'))
              validators['verification'].validate(verification)
              assert verification['manifestContentHash'] == manifest['contentHash']
              assert verification['manifestByteHash'] == sha256(
                  paths['manifest'].read_bytes())
              assert verification['campaignId'] == manifest['campaignId']
              assert verification['domainId'] == manifest['domainId']
              assert verification['domainRevision'] == manifest['domainRevision']
              assert verification['domainDescriptorHash'] == \
                  manifest['domainDescriptorHash']
              assert verification['discoveryEvidenceHash'] == \
                  manifest['discoveryEvidenceHash']
              assert verification['lifecycleHandoffHash'] == \
                  manifest['lifecycleHandoffHash']
              snapshot_material = [
                  f"{role}|{by_role[role]['byteHash']}|"
                  f"{by_role[role]['byteLength']}"
                  for role in role_order
              ]
              assert verification['artifactSetHash'] == sha256(
                  canonical_list(snapshot_material).encode('utf-8'))
              assert verification['verifiedArtifactCount'] == 3
              assert verification['identityBindingStatus'] == 'VERIFIED'
              assert verification['mathematicalValidationStatus'] == \
                  'NOT_EVALUATED'
              verification_values = {
                  key: str(value).lower() if isinstance(value, bool) else str(value)
                  for key, value in verification.items()
                  if key != 'contentHash'
              }
              assert verification['contentHash'] == sha256(
                  canonical_map(verification_values).encode('utf-8'))
              assert forbidden_keys.isdisjoint(set(nested_keys(verification)))
          PY

      - name: Upload domain export evidence and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: domain-discovery-export-evidence
          path: |
            regelsuche-discovery/build/reports/domain-discovery-export/**
            regelsuche-discovery/build/reports/domain-discovery-export-verification/**
            regelsuche-discovery/build/reports/tests/**
            regelsuche-discovery/build/test-results/**
            docs/schemas/regelsuche-domain-discovery-export-v1.schema.json
            docs/schemas/regelsuche-domain-discovery-export-verification-v1.schema.json
            docs/schemas/regelsuche-discovery-lifecycle-handoff-v1.schema.json
          if-no-files-found: warn
