name: Capability and Claim Status

on:
  push:
    branches: [ "main" ]
    paths:
      - 'README.md'
      - 'docs/README.md'
      - 'docs/discovery-status.md'
      - 'docs/capability-status.md'
      - 'docs/generated/capability-status.*'
      - 'docs/schemas/regelsuche-capability-status-v1.schema.json'
      - 'scripts/generate-capability-status.py'
      - 'regelsuche-release/**'
      - 'app/src/main/java/de/regelsuche/plugin/**'
      - 'docs/schemas/regelsuche-plugin-*.schema.json'
      - '.github/workflows/plugin-*.yml'
      - '.github/workflows/capability-status.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'README.md'
      - 'docs/README.md'
      - 'docs/discovery-status.md'
      - 'docs/capability-status.md'
      - 'docs/generated/capability-status.*'
      - 'docs/schemas/regelsuche-capability-status-v1.schema.json'
      - 'scripts/generate-capability-status.py'
      - 'regelsuche-release/**'
      - 'app/src/main/java/de/regelsuche/plugin/**'
      - 'docs/schemas/regelsuche-plugin-*.schema.json'
      - '.github/workflows/plugin-*.yml'
      - '.github/workflows/capability-status.yml'
  workflow_dispatch:

concurrency:
  group: capability-status-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0

      - name: Reproduce authoritative release and domain evidence
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew \
            :regelsuche-release:runQualifiedReleaseReadinessWithHiddenRuleEvidence \
            :regelsuche-release:runDomainGenericQualification \
            --rerun-tasks \
            --console=plain

      - name: Regenerate and compare public capability status
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/generate-capability-status.py \
            --repository-root . \
            --release-report regelsuche-release/build/reports/release-readiness-qualified/release-readiness-report.json \
            --release-run regelsuche-release/build/reports/release-readiness-qualified/release-readiness-run.json \
            --domain-report regelsuche-release/build/reports/domain-generic-qualification/qualification-report.json \
            --domain-run regelsuche-release/build/reports/domain-generic-qualification/qualification-run.json \
            --repository-revision WORKTREE \
            --json-output docs/generated/capability-status.json \
            --markdown-output docs/generated/capability-status.md \
            --check \
            --check-docs

      - name: Validate capability status schema and content hash
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet jsonschema==4.25.1
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          schema = json.loads(Path('docs/schemas/regelsuche-capability-status-v1.schema.json').read_text(encoding='utf-8'))
          status = json.loads(Path('docs/generated/capability-status.json').read_text(encoding='utf-8'))
          Draft202012Validator.check_schema(schema)
          Draft202012Validator(schema).validate(status)
          claimed = status.pop('contentHash')
          encoded = json.dumps(status, ensure_ascii=False, sort_keys=True, separators=(',', ':')).encode('utf-8')
          actual = 'sha256:' + hashlib.sha256(encoded).hexdigest()
          assert claimed == actual, (claimed, actual)
          assert status['policy'] == 'EVIDENCE_DERIVED_FAIL_CLOSED'
          by_name = {item['capability']: item for item in status['capabilities']}
          assert by_name['AUTONOMOUS_CAMPAIGN']['status'] == 'QUALIFIED'
          assert by_name['DOMAIN_GENERIC_DISCOVERY']['status'] == 'QUALIFIED'
          assert by_name['EXTERNAL_NOVELTY_REVIEW']['status'] == 'BLOCKED'
          assert by_name['FORMAL_PROOF_OF_RETAINED_CANDIDATE']['status'] == 'NOT_EVALUATED'
          assert by_name['PUBLIC_PLUGIN_DISTRIBUTION']['status'] == 'BLOCKED'
          assert by_name['PROMOTION']['status'] == 'NOT_EVALUATED'
          assert by_name['PUBLIC_EVIDENCE']['status'] == 'NOT_EVALUATED'
          PY

      - name: Upload capability status evidence and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: capability-and-claim-status
          path: |
            docs/generated/capability-status.*
            docs/schemas/regelsuche-capability-status-v1.schema.json
            regelsuche-release/build/reports/release-readiness-qualified/**
            regelsuche-release/build/reports/domain-generic-qualification/**
            regelsuche-release/build/reports/tests/**
            regelsuche-release/build/test-results/**
          if-no-files-found: warn
