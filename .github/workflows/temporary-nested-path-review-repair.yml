name: Temporary nested path review repair

on:
  push:
    branches:
      - feature/nested-exact-factorization-transformation-v1-ready
    paths:
      - .github/workflows/temporary-nested-path-review-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '25'
      - name: Apply the reviewed typed-path contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          pipeline_path = Path(
              'app/src/main/java/de/regelsuche/polynomial/'
              'ExactNestedFactorizationTransformationPipeline.java')
          source = pipeline_path.read_text(encoding='utf-8')

          old_entry = '''        requireAttemptInputs(root, position, engine);
                  Optional<Result> positionFailure = validatePosition(position);
                  if (positionFailure.isPresent()) {
                      return positionFailure.orElseThrow();
                  }
          
                  Outcome<PreflightContext> preflight = preflight(root, position);'''
          new_entry = '''        requireAttemptInputs(root, position, engine);
                  Outcome<PreflightContext> preflight = preflight(root, position);'''
          if source.count(old_entry) != 1:
              raise SystemExit('unexpected nested pipeline entry contract')
          source = source.replace(old_entry, new_entry)

          old_validation = '''    private Optional<Result> validatePosition(TreePosition position) {
                  if (position.path().stream().anyMatch(
                          index -> index == null || index < 0)) {
                      return Optional.of(emptyFailure(
                          Status.UNSUPPORTED,
                          "INVALID_TREE_POSITION_PATH",
                          position));
                  }
                  if (position.path().size() > policy.maxPathDepth()) {
                      return Optional.of(emptyFailure(
                          Status.BUDGET_INCONCLUSIVE,
                          "MAX_NESTED_PATH_DEPTH_EXCEEDED",
                          position));
                  }
                  return Optional.empty();
              }
          
          '''
          if source.count(old_validation) != 1:
              raise SystemExit('unexpected nested path validator')
          source = source.replace(old_validation, '')

          old_preflight = '''    private Outcome<PreflightContext> preflight(
                  ExactParsedTerm root,
                  TreePosition position
              ) {
                  Work work = new Work(policy.maxTotalWorkUnits());
                  try {
                      countNodes('''
          new_preflight = '''    private Outcome<PreflightContext> preflight(
                  ExactParsedTerm root,
                  TreePosition position
              ) {
                  Work work = new Work(policy.maxTotalWorkUnits());
                  if (position.path().size() > policy.maxPathDepth()) {
                      return Outcome.failure(failure(
                          Status.BUDGET_INCONCLUSIVE,
                          "MAX_NESTED_PATH_DEPTH_EXCEEDED",
                          position,
                          work.ledger()));
                  }
                  try {
                      TreePosition.SelectionResult selection = position.selectAt(
                          root.expression());
                      work.consume(
                          "nested.position-preflight-path-navigation",
                          position.path().size());
                      switch (selection.status()) {
                          case SELECTED -> {
                              // The shared TreePosition authority accepted this path.
                          }
                          case INVALID_PATH -> {
                              return Outcome.failure(failure(
                                  Status.UNSUPPORTED,
                                  "INVALID_TREE_POSITION_PATH",
                                  position,
                                  work.ledger()));
                          }
                          case POSITION_NOT_PRESENT -> {
                              return Outcome.failure(failure(
                                  Status.POSITION_NOT_PRESENT,
                                  "SELECTED_PATH_IS_NOT_PRESENT",
                                  position,
                                  work.ledger()));
                          }
                          case REPLACED -> throw invariant(
                              "TREE_POSITION_SELECTION_RETURNED_REPLACED_STATUS");
                      }
                      countNodes('''
          if source.count(old_preflight) != 1:
              raise SystemExit('unexpected nested preflight contract')
          source = source.replace(old_preflight, new_preflight)
          pipeline_path.write_text(source, encoding='utf-8')

          test_path = Path(
              'app/src/test/java/de/regelsuche/polynomial/'
              'ExactNestedFactorizationTransformationPipelineTest.java')
          test = test_path.read_text(encoding='utf-8')
          old_test = '''    @Test
              void invalidChildIndexDoesNotReachTheProjector() {
                  ExactParsedTerm root = parser.parseExactTerm("x^2 - 1");
                  TreePosition invalid = new TreePosition(
                      List.of(-1),
                      "x");
          
                  var result = pipeline.transform(
                      root,
                      invalid,
                      NativeUnivariateFactorizationEngine.boundedRationals());
          
                  assertEquals(
                      ExactNestedFactorizationTransformationPipeline.Status.UNSUPPORTED,
                      result.status());
                  assertEquals("INVALID_TREE_POSITION_PATH", result.detailCode());
                  assertTrue(result.projection().isEmpty());
              }
          }'''
          new_test = '''    @Test
              void negativeChildIndexDoesNotReachTheProjector() {
                  ExactParsedTerm root = parser.parseExactTerm("x^2 - 1");
                  TreePosition invalid = new TreePosition(
                      List.of(-1),
                      "x");
          
                  var result = pipeline.transform(
                      root,
                      invalid,
                      NativeUnivariateFactorizationEngine.boundedRationals());
          
                  assertInvalidBeforeProjection(result, 1);
              }
          
              @Test
              void outOfRangeBinaryChildIndexDoesNotReachTheProjector() {
                  ExactParsedTerm root = parser.parseExactTerm("x + 1");
                  TreePosition invalid = new TreePosition(
                      List.of(2),
                      "unused");
          
                  var result = pipeline.transform(
                      root,
                      invalid,
                      NativeUnivariateFactorizationEngine.boundedRationals());
          
                  assertInvalidBeforeProjection(result, 1);
              }
          
              @Test
              void descentPastLeafRemainsDistinctFromAnInvalidPath() {
                  ExactParsedTerm root = parser.parseExactTerm("x + 1");
                  TreePosition missing = new TreePosition(
                      List.of(0, 0),
                      "x");
          
                  var result = pipeline.transform(
                      root,
                      missing,
                      NativeUnivariateFactorizationEngine.boundedRationals());
          
                  assertEquals(
                      ExactNestedFactorizationTransformationPipeline.Status
                          .POSITION_NOT_PRESENT,
                      result.status());
                  assertEquals("SELECTED_PATH_IS_NOT_PRESENT", result.detailCode());
                  assertTrue(result.projection().isEmpty());
                  assertEquals(
                      2,
                      result.totalWork().units(
                          "nested.position-preflight-path-navigation"));
                  assertEquals(
                      0,
                      result.totalWork().units(
                          "nested.root-preflight-node-visits"));
              }
          
              private static void assertInvalidBeforeProjection(
                  ExactNestedFactorizationTransformationPipeline.Result result,
                  long pathLength
              ) {
                  assertEquals(
                      ExactNestedFactorizationTransformationPipeline.Status.UNSUPPORTED,
                      result.status());
                  assertEquals("INVALID_TREE_POSITION_PATH", result.detailCode());
                  assertTrue(result.projection().isEmpty());
                  assertEquals(
                      pathLength,
                      result.totalWork().units(
                          "nested.position-preflight-path-navigation"));
                  assertEquals(
                      0,
                      result.totalWork().units(
                          "nested.root-preflight-node-visits"));
              }
          }'''
          if test.count(old_test) != 1:
              raise SystemExit('unexpected nested pipeline test tail')
          test = test.replace(old_test, new_test)
          test_path.write_text(test, encoding='utf-8')
          PY
      - name: Verify the focused contract
        run: >-
          ./gradlew --no-daemon :app:test
          --tests de.regelsuche.polynomial.ExactNestedFactorizationTransformationPipelineTest
      - name: Commit the repair and remove this temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/temporary-nested-path-review-repair.yml
          git config user.name 'Carsten Hammer'
          git config user.email 'carsten.hammer@t-online.de'
          git add --all
          git diff --cached --check
          git commit -m 'Classify invalid nested paths before projection' -m 'Route nested factorization preflight through the shared typed TreePosition selection authority. Preserve invalid versus absent outcomes before projection, account path navigation, and characterize negative, out-of-range and leaf-descent paths.'
          git push origin HEAD:feature/nested-exact-factorization-transformation-v1-ready
