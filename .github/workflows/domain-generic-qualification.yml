name: Domain Generic Qualification

on:
  push:
    branches: [ "main" ]
    paths:
      - 'regelsuche-release/build.gradle'
      - 'regelsuche-release/src/main/java/de/regelsuche/release/DomainGeneric*.java'
      - 'regelsuche-release/src/test/java/de/regelsuche/release/DomainGeneric*.java'
      - 'regelsuche-discovery/src/main/java/de/regelsuche/discovery/domain/**'
      - 'docs/domain-generic-qualification.md'
      - 'docs/domain-generic-verification.md'
      - 'docs/README.md'
      - 'docs/schemas/regelsuche-domain-generic-*.schema.json'
      - 'scripts/run-domain-generic-qualification-verification.sh'
      - 'scripts/verify-domain-generic-qualification.py'
      - '.github/workflows/domain-generic-qualification.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'regelsuche-release/build.gradle'
      - 'regelsuche-release/src/main/java/de/regelsuche/release/DomainGeneric*.java'
      - 'regelsuche-release/src/test/java/de/regelsuche/release/DomainGeneric*.java'
      - 'regelsuche-discovery/src/main/java/de/regelsuche/discovery/domain/**'
      - 'docs/domain-generic-qualification.md'
      - 'docs/domain-generic-verification.md'
      - 'docs/README.md'
      - 'docs/schemas/regelsuche-domain-generic-*.schema.json'
      - 'scripts/run-domain-generic-qualification-verification.sh'
      - 'scripts/verify-domain-generic-qualification.py'
      - '.github/workflows/domain-generic-qualification.yml'
  workflow_dispatch:

concurrency:
  group: domain-generic-qualification-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0
      - name: Run repository-owned domain-generic qualification verification
        run: bash scripts/run-domain-generic-qualification-verification.sh
      - name: Upload qualification evidence and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: domain-generic-qualification-evidence
          path: |
            regelsuche-release/build/reports/domain-generic-qualification/**
            regelsuche-release/build/reports/tests/**
            regelsuche-release/build/test-results/**
            build/reports/domain-generic-qualification-ci/**
            docs/domain-generic-qualification.md
            docs/domain-generic-verification.md
            docs/schemas/regelsuche-domain-generic-*.schema.json
          if-no-files-found: warn
