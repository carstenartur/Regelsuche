              recordCandidateOutcome(problem, current, transformations.get(index), outcome);
          }
      }

      private void recordCandidateOutcome(
          SearchProblem problem,
          SearchState current,
          Transformation transformation,
          CandidateOutcome outcome
      ) {
          if (problem.engine() instanceof CandidateOrderedTransformationEngine ordered) {
              ordered.candidateOutcome(current.expression(), transformation, outcome);
          }
      }

