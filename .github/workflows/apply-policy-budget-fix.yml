          test.write_text('''package de.regelsuche.search.strategy;

import static org.junit.jupiter.api.Assertions.assertEquals;
import static org.junit.jupiter.api.Assertions.assertTrue;

import de.regelsuche.canonical.ExpressionCanonicalizer;
import de.regelsuche.scoring.ExpressionScorer;
import de.regelsuche.search.SearchHeuristic;
import de.regelsuche.search.policy.SearchPolicy;
import de.regelsuche.search.policy.SearchPolicy.PolicyContext;
import de.regelsuche.search.policy.SearchPolicy.PolicyDecision;
import de.regelsuche.search.strategy.PolicyAwareBestFirstSearchStrategy.CandidateDisposition;
import de.regelsuche.transform.RewriteKind;
import de.regelsuche.transform.Transformation;
import de.regelsuche.transform.TransformationEngine;
import java.util.List;
import java.util.Map;
import org.junit.jupiter.api.Test;

class PolicyCandidateBudgetSemanticsTest {
    @Test
    void guardRejectedTopRankDoesNotConsumeTheRealCandidateBudget() {
        TransformationEngine engine = expression -> switch (expression) {
            case "start" -> List.of(step("seed", "middle", "shared-key"));
            case "middle" -> List.of(
                step("repeat", "ignored", "shared-key"),
                step("good", "goal", "good-key"),
                step("extra", "other", "extra-key"));
            default -> List.of();
        };
        SearchPolicy policy = new OrderedTestPolicy(Map.of(
            "seed", 0,
            "repeat", 0,
            "good", 1,
            "extra", 2));
        SearchProblem problem = new SearchProblem(
            "start",
            engine,
            new ExpressionScorer(),
            new ExpressionCanonicalizer(),
            new SearchHeuristic(3, 20, 1, 4, 1, 5))
            .withTarget(SearchProblem.SearchTarget.syntaxExact("goal"));

        var result = new PolicyAwareBestFirstSearchStrategy(policy)
            .searchWithDiagnostics(problem);

        assertTrue(result.reached(), result.search().toString());
        assertEquals(List.of("seed", "good"),
            result.search().reachedState().appliedRuleIds());
        assertEquals(CandidateDisposition.SKIPPED_GUARD,
            disposition(result, "middle", "repeat"));
        assertEquals(CandidateDisposition.ENQUEUED,
            disposition(result, "middle", "good"));
        assertEquals(CandidateDisposition.NOT_CONSIDERED_BUDGET,
            disposition(result, "middle", "extra"));
        assertTrue(result.search().metrics().candidateBudgetPrunes() >= 1);
    }

    private static CandidateDisposition disposition(
        PolicyAwareBestFirstSearchStrategy.PolicySearchResult result,
        String parent,
        String rule
    ) {
        return result.policyEvents().stream()
            .filter(event -> event.parentExpression().equals(parent) && event.ruleId().equals(rule))
            .findFirst().orElseThrow().disposition();
    }

    private static Transformation step(String rule, String output, String applicationKey) {
        return new Transformation(
            rule, output, RewriteKind.NORMALIZE,
            false, 0, true, applicationKey);
    }

    private record OrderedTestPolicy(Map<String, Integer> priorities) implements SearchPolicy {
        @Override
        public String id() {
            return "ordered-test/v1";
        }

        @Override
        public PolicyDecision score(PolicyContext context, Transformation transformation) {
            int priority = priorities.getOrDefault(transformation.rule(), 1000);
            return new PolicyDecision(
                id(), priority, 1000, false,
                Map.of("testPriority", priority), "deterministic test ordering");
        }
    }
}
