          ranking_types = '''    /** One deterministic, explainable candidate-ranking decision. */
      public record RankingEvent(
          long decisionGroup,
          String parentExpression,
          String ruleId,
          String transformedExpression,
          String applicationKey,
          String policyId,
          int priority,
          int confidencePermille,
          boolean fallback,
          Map<String, Integer> contributions,
          String explanation,
          int deterministicRank,
          CandidateDisposition disposition
      ) {
          public RankingEvent {
              parentExpression = parentExpression == null ? "" : parentExpression;
              ruleId = ruleId == null ? "" : ruleId;
              transformedExpression = transformedExpression == null ? "" : transformedExpression;
              applicationKey = applicationKey == null ? "" : applicationKey;
              policyId = policyId == null ? "" : policyId;
              contributions = contributions == null ? Map.of() : Map.copyOf(contributions);
              explanation = explanation == null ? "" : explanation;
              disposition = disposition == null ? CandidateDisposition.PENDING : disposition;
          }

          private RankingEvent withDisposition(CandidateDisposition updated) {
              return new RankingEvent(
                  decisionGroup, parentExpression, ruleId, transformedExpression, applicationKey,
                  policyId, priority, confidencePermille, fallback, contributions, explanation,
                  deterministicRank, updated);
          }
      }

      public enum CandidateDisposition {
          PENDING,
          ENQUEUED,
          SKIPPED_GUARD,
          PRUNED_DUPLICATE,
          NOT_CONSIDERED_BUDGET
      }

'''
          text = text[:start] + ranking_types + text[end:]

          start = text.index('    private static final class RankingEngine')
          end = text.index('    private static final class PolicyTrace')
          ranking_engine = '''    private static final class RankingEngine
              implements BestFirstSearchStrategy.CandidateOrderedTransformationEngine {
          private final TransformationEngine delegate;
          private final SearchPolicy policy;
          private final PolicyTrace trace;
          private final TargetDistance distance;
          private final ExpressionCanonicalizer canonicalizer;
          private long decisionGroup;

          private RankingEngine(
              TransformationEngine delegate,
              SearchPolicy policy,
              PolicyTrace trace,
              TargetDistance distance,
              ExpressionCanonicalizer canonicalizer
          ) {
              this.delegate = delegate;
              this.policy = policy;
              this.trace = trace;
              this.distance = distance;
              this.canonicalizer = canonicalizer;
          }

          @Override
          public List<Transformation> transform(String expression) {
              List<Transformation> applicable = new ArrayList<>(delegate.transform(expression));
              Comparator<RankedTransformation> deterministic = Comparator
                  .comparing((RankedTransformation ranked) -> ranked.transformation().rule())
                  .thenComparing(ranked -> ranked.transformation().transformedExpression())
                  .thenComparing(ranked -> ranked.transformation().applicationKey());
              List<RankedTransformation> scored = applicable.stream()
                  .map(transformation -> new RankedTransformation(
                      transformation,
                      policy.score(
                          new PolicyContext(
                              expression,
                              distance.distance(transformation.transformedExpression()),
                              distance.enabled(),
                              canonicalizer),
                          transformation)))
                  .toList();

              boolean completeFallback = !scored.isEmpty()
                  && scored.stream().allMatch(item -> item.decision().fallback());
              Comparator<RankedTransformation> ordering;
              if (completeFallback) {
                  ordering = distance.enabled()
                      ? Comparator.comparingInt((RankedTransformation item) ->
                          distance.distance(item.transformation().transformedExpression()))
                          .thenComparing(deterministic)
                      : deterministic;
              } else {
                  ordering = Comparator
                      .comparingInt((RankedTransformation item) -> item.decision().priority())
                      .thenComparing(deterministic);
              }
              List<RankedTransformation> ranked = scored.stream().sorted(ordering).toList();
              long group = decisionGroup++;
              for (int index = 0; index < ranked.size(); index++) {
                  RankedTransformation item = ranked.get(index);
                  trace.record(group, expression, item.transformation(), item.decision(), index);
              }
              return ranked.stream().map(RankedTransformation::transformation).toList();
          }

          @Override
          public void candidateOutcome(
              String parentExpression,
              Transformation transformation,
              BestFirstSearchStrategy.CandidateOutcome outcome
          ) {
              trace.recordOutcome(
                  parentExpression,
                  transformation.applicationKey(),
                  CandidateDisposition.valueOf(outcome.name()));
          }
      }

'''
