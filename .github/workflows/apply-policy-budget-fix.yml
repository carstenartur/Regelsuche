          trace = '''    private static final class PolicyTrace {
          private final List<RankingEvent> events = new ArrayList<>();

          private void record(
              long decisionGroup,
              String parentExpression,
              Transformation transformation,
              PolicyDecision decision,
              int deterministicRank
          ) {
              events.add(new RankingEvent(
                  decisionGroup,
                  parentExpression,
                  transformation.rule(),
                  transformation.transformedExpression(),
                  transformation.applicationKey(),
                  decision.policyId(),
                  decision.priority(),
                  decision.confidencePermille(),
                  decision.fallback(),
                  decision.contributions(),
                  decision.explanation(),
                  deterministicRank,
                  CandidateDisposition.PENDING));
          }

          private void recordOutcome(
              String parentExpression,
              String applicationKey,
              CandidateDisposition disposition
          ) {
              for (int index = events.size() - 1; index >= 0; index--) {
                  RankingEvent event = events.get(index);
                  if (event.disposition() == CandidateDisposition.PENDING
                          && event.parentExpression().equals(parentExpression)
                          && event.applicationKey().equals(applicationKey)) {
                      events.set(index, event.withDisposition(disposition));
                      return;
                  }
              }
              throw new IllegalStateException(
                  "missing pending policy event for candidate " + applicationKey);
          }

          private List<RankingEvent> events() {
              return List.copyOf(events);
          }
      }

'''
