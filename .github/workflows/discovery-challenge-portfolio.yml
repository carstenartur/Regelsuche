name: Discovery Challenge Portfolio

on:
  push:
    branches: [ "main" ]
    paths:
      - 'research/challenges/**'
      - 'scripts/generate-discovery-challenge-portfolio.py'
      - 'docs/discovery-challenge-portfolio.md'
      - 'docs/schemas/regelsuche-discovery-challenge-*.schema.json'
      - '.github/workflows/discovery-challenge-portfolio.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'research/challenges/**'
      - 'scripts/generate-discovery-challenge-portfolio.py'
      - 'docs/discovery-challenge-portfolio.md'
      - 'docs/schemas/regelsuche-discovery-challenge-*.schema.json'
      - '.github/workflows/discovery-challenge-portfolio.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portfolio:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install schema validator
        run: python3 -m pip install --disable-pip-version-check --quiet jsonschema==4.25.1

      - name: Generate the frozen challenge portfolio twice
        shell: bash
        run: |
          rm -rf /tmp/challenge-first /tmp/challenge-second
          python3 scripts/generate-discovery-challenge-portfolio.py \
            --source research/challenges/challenge-plan-source.json \
            --output /tmp/challenge-first
          python3 scripts/generate-discovery-challenge-portfolio.py \
            --source research/challenges/challenge-plan-source.json \
            --output /tmp/challenge-second
          diff -ru /tmp/challenge-first /tmp/challenge-second
          diff -ru /tmp/challenge-first research/challenges/generated

      - name: Validate schemas, roots and scientific boundaries
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          def load(path):
              def hook(pairs):
                  result = {}
                  for key, value in pairs:
                      if key in result:
                          raise AssertionError(f'duplicate field {key} in {path}')
                      result[key] = value
                  return result
              return json.loads(
                  Path(path).read_text(encoding='utf-8'),
                  object_pairs_hook=hook,
              )

          def digest(value):
              payload = json.dumps(
                  value,
                  ensure_ascii=False,
                  separators=(',', ':'),
                  sort_keys=True,
              ).encode('utf-8')
              return 'sha256:' + hashlib.sha256(payload).hexdigest()

          source_schema = load(
              'docs/schemas/regelsuche-discovery-challenge-plan-source-v1.schema.json'
          )
          artifact_schema = load(
              'docs/schemas/regelsuche-discovery-challenge-artifact-v1.schema.json'
          )
          Draft202012Validator.check_schema(source_schema)
          Draft202012Validator.check_schema(artifact_schema)
          source = load('research/challenges/challenge-plan-source.json')
          Draft202012Validator(source_schema).validate(source)

          root = Path('research/challenges/generated')
          names = [
              'challenge-landscape.json',
              'challenge-feasibility-report.json',
              'challenge-split-policy.json',
              'challenge-baseline-plan.json',
              'challenge-run-budget.json',
              'challenge-portfolio.json',
          ]
          artifacts = {}
          for name in names:
              value = load(root / name)
              Draft202012Validator(artifact_schema).validate(value)
              without = dict(value)
              content_hash = without.pop('contentHash')
              assert content_hash == digest(without), name
              artifacts[name] = value

          landscape = artifacts['challenge-landscape.json']
          feasibility = artifacts['challenge-feasibility-report.json']
          split = artifacts['challenge-split-policy.json']
          baselines = artifacts['challenge-baseline-plan.json']
          budget = artifacts['challenge-run-budget.json']
          portfolio = artifacts['challenge-portfolio.json']

          assert landscape['assessedChallengeCount'] == 5
          assert landscape['selectedChallengeCount'] == 3
          assert landscape['deferredChallengeCount'] == 2
          assert len(portfolio['selectedChallengeIds']) == 3
          assert set(portfolio['selectedChallengeIds']) == {
              'rational-assumption-rewrites',
              'finite-difference-recurrences',
              'reusable-search-macros',
          }
          assert portfolio['landscapeHash'] == landscape['contentHash']
          assert portfolio['feasibilityHash'] == feasibility['contentHash']
          assert portfolio['splitPolicyHash'] == split['contentHash']
          assert portfolio['baselinePlanHash'] == baselines['contentHash']
          assert portfolio['runBudgetHash'] == budget['contentHash']
          assert portfolio['pilotEvidenceStatus'] == 'DEVELOPMENT_ONLY'
          assert portfolio['evaluatedCampaignStatus'] == 'NOT_STARTED'
          assert portfolio['externalNoveltyStatus'] == 'NOT_EVALUATED'
          assert split['externalSearchVisibility'] == 'POST_FORMATION_ONLY'
          assert baselines['universalScorePolicy'] == (
              'NO_UNIVERSAL_SCORE_TRACK_SCOPED_CLAIMS_ONLY'
          )

          source_by_id = {
              item['challengeId']: item for item in source['challenges']
          }
          for challenge_id in portfolio['selectedChallengeIds']:
              item = source_by_id[challenge_id]
              assert item['complexityTier'] in {'INTERMEDIATE', 'ADVANCED'}
              assert item['independentEvaluator']['evaluatorId']
              assert len(item['baselineProfiles']) >= 2
              assert item['budget']['maximumCampaigns'] > 0
              assert item['budget']['maximumCandidateEvaluations'] > 0
              prohibited = ' '.join(
                  item['prohibitedFormationInformation']
              ).lower()
              assert 'target' in prohibited or 'expected' in prohibited
          PY

      - name: Reject post-hoc or inflated portfolio mutations
        shell: bash
        run: |
          python3 - <<'PY'
          import copy
          import json
          import subprocess
          import tempfile
          from pathlib import Path

          source = json.loads(
              Path('research/challenges/challenge-plan-source.json').read_text()
          )
          mutations = []
          visible_test = copy.deepcopy(source)
          visible_test['challenges'][0]['formationInformation'].append(
              'final TEST target'
          )
          visible_test['challenges'][0]['prohibitedFormationInformation'] = [
              'hidden reference rule'
          ]
          mutations.append(('missing target prohibition', visible_test))
          no_evaluator = copy.deepcopy(source)
          no_evaluator['challenges'][0]['independentEvaluator']['method'] = ''
          mutations.append(('blank evaluator', no_evaluator))
          unbounded = copy.deepcopy(source)
          unbounded['challenges'][0]['budget']['maximumCampaigns'] = 0
          mutations.append(('no campaign budget', unbounded))

          for label, mutation in mutations:
              with tempfile.TemporaryDirectory() as directory:
                  path = Path(directory) / 'source.json'
                  output = Path(directory) / 'out'
                  path.write_text(json.dumps(mutation), encoding='utf-8')
                  result = subprocess.run(
                      [
                          'python3',
                          'scripts/generate-discovery-challenge-portfolio.py',
                          '--source',
                          str(path),
                          '--output',
                          str(output),
                      ],
                      check=False,
                  )
                  if result.returncode == 0:
                      raise AssertionError(f'{label} unexpectedly passed')
          PY

      - name: Upload challenge portfolio evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: discovery-challenge-portfolio
          path: |
            research/challenges/**
            docs/discovery-challenge-portfolio.md
            docs/schemas/regelsuche-discovery-challenge-*.schema.json
          if-no-files-found: error
