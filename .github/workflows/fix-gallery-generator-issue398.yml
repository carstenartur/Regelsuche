name: Fix Gallery Generator Consistency

on:
  push:
    branches: [ "issue-387-reproduction-artifact" ]
    paths:
      - '.github/workflows/fix-gallery-generator-issue398.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - '.github/workflows/fix-gallery-generator-issue398.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: issue-387-reproduction-artifact
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6.1.0
      - name: Bind the walkthrough entry into the gallery generator
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/de/regelsuche/docs/DocsDiscoveryGalleryGenerator.java')
          text = path.read_text(encoding='utf-8')
          needle = '''                Public entries are admitted only after `PublicBenchmarkEvidenceGate` accepts their generated search evidence. Rejections are written to `generated/discovery/public-scenario-rejections.md`.

                ## Complete-square factorization
'''
          replacement = '''                Public entries are admitted only after `PublicBenchmarkEvidenceGate` accepts their generated search evidence. Rejections are written to `generated/discovery/public-scenario-rejections.md`.

                ## Qualified autonomous discovery result card

                This entry is generated by the supported one-command qualified production run.
                It presents project evidence only and carries a visible
                `NO EXTERNAL NOVELTY CLAIM` boundary.

                ```bash
                ./gradlew :regelsuche-release:runAutonomousDiscoveryWalkthrough
                ```

                - [Walkthrough contract and container command](autonomous-discovery-walkthrough.md)
                - [Result-card schema](schemas/regelsuche-autonomous-discovery-result-card-v1.schema.json)
                - Generated sequence: [SVG](generated/autonomous-discovery-walkthrough/sequence.svg)
                - Generated candidate lineage: [SVG](generated/autonomous-discovery-walkthrough/candidate-lineage.svg)
                - Generated paired utility: [SVG](generated/autonomous-discovery-walkthrough/paired-utility.svg)
                - Generated representative search: [SVG](generated/autonomous-discovery-walkthrough/representative-search.svg)

                <img src="generated/autonomous-discovery-walkthrough/sequence.svg" alt="Generated autonomous discovery evidence sequence with claim boundary">

                <img src="generated/autonomous-discovery-walkthrough/paired-utility.svg" alt="Generated paired held-out baseline and candidate utility comparison">

                ## Complete-square factorization
'''
          if text.count(needle) != 1:
              raise SystemExit('gallery template marker is missing or ambiguous')
          path.write_text(text.replace(needle, replacement), encoding='utf-8')
          PY
          env -u GITHUB_SHA ./gradlew :app:generateDiscoveryGallery --console=plain
          grep -q '^## Qualified autonomous discovery result card$' docs/demo-gallery.md
          grep -q 'NO EXTERNAL NOVELTY CLAIM' docs/demo-gallery.md
      - name: Commit permanent fix and remove bootstrap
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/de/regelsuche/docs/DocsDiscoveryGalleryGenerator.java \
            docs/demo-gallery.md docs/generated/discovery
          git rm .github/workflows/fix-gallery-generator-issue398.yml
          git commit -m 'Keep qualified walkthrough in generated gallery'
          git push origin HEAD:issue-387-reproduction-artifact
