name: Autopilot Evidence

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: autopilot-evidence-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evidence:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0

      - name: Generate current Autopilot evidence
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :regelsuche-experiments:test \
            --tests de.regelsuche.experiments.autopilot.AutonomousResearchBriefV2Test \
            --tests de.regelsuche.experiments.autopilot.AutonomousAggregateDecisionV2Test \
            --tests de.regelsuche.experiments.autopilot.AutonomousAggregateReceiptV2Test \
            --tests de.regelsuche.experiments.autopilot.AutonomousEvidenceDagSnapshotV2Test \
            2>&1 | tee autopilot-build.log
          ./gradlew :regelsuche-autopilot:test \
            --tests de.regelsuche.experiments.autopilot.OpenTargetAutopilotV2BindingTest \
            --tests de.regelsuche.experiments.autopilot.AutonomousCandidateLifecycleV2Test \
            --tests de.regelsuche.experiments.autopilot.AutonomousCampaignArtifactsV2Test \
            --tests de.regelsuche.experiments.autopilot.AutonomousProductionGenerationRunnerTest \
            --tests de.regelsuche.experiments.autopilot.AutonomousProductionMiningRunnerTest \
            --tests de.regelsuche.experiments.autopilot.AutonomousProductionLifecycleRunnerTest \
            --tests de.regelsuche.experiments.autopilot.AutonomousProductionCampaignRunnerTest \
            2>&1 | tee -a autopilot-build.log
          ./gradlew :regelsuche-autopilot:runProductionCampaign \
            2>&1 | tee -a autopilot-build.log

      - name: Require complete Gradle campaign artifacts
        run: |
          test -s regelsuche-experiments/build/reports/autopilot-v2-dag/brief-v2.json
          test -s regelsuche-experiments/build/reports/autopilot-v2-dag/aggregate-decision.json
          test -s regelsuche-experiments/build/reports/autopilot-v2-dag/aggregate-receipt.json
          test -s regelsuche-experiments/build/reports/autopilot-v2-dag/dag.json
          test -s regelsuche-autopilot/build/reports/autopilot-v2-dag/production-binding.json
          test -s regelsuche-autopilot/build/reports/autopilot-v2-dag/lifecycle-decision.json
          test -s regelsuche-autopilot/build/reports/autopilot-v2-dag/plan-v2.json
          test -s regelsuche-autopilot/build/reports/autopilot-v2-dag/execution-v2.json
          test -s regelsuche-autopilot/build/reports/autopilot-v2-dag/lineage-v2.json
          test -s regelsuche-autopilot/build/reports/autopilot-v2-dag/round-v2.json
          test -s regelsuche-autopilot/build/reports/autopilot-v2-dag/next-plan-v2.json
          DIR=regelsuche-autopilot/build/reports/autopilot-production-campaign
          test -s "$DIR/brief-v2.json"
          test -s "$DIR/seeds.json"
          test -s "$DIR/observations.json"
          test -s "$DIR/generation-receipt.json"
          test -s "$DIR/discovery-report.json"
          test -s "$DIR/generation-run.json"
          test -s "$DIR/plan-v2.json"
          test -s "$DIR/full-decision.json"
          test -s "$DIR/full-mining-evidence.json"
          test -s "$DIR/full-binding.json"
          test -s "$DIR/full-receipt.json"
          test -s "$DIR/full-execution-v2.json"
          test -s "$DIR/full-lineage-v2.json"
          test -s "$DIR/rejection-decision.json"
          test -s "$DIR/rejection-mining-evidence.json"
          test -s "$DIR/rejection-binding.json"
          test -s "$DIR/rejection-receipt.json"
          test -s "$DIR/rejection-execution-v2.json"
          test -s "$DIR/rejection-lineage-v2.json"
          test -s "$DIR/candidate-formation-receipt.json"
          test -s "$DIR/evidence-dag.json"
          test -s "$DIR/production-mining-run.json"
          test -s "$DIR/validation-report.json"
          test -s "$DIR/counterexample-report.json"
          test -s "$DIR/project-novelty-report.json"
          test -s "$DIR/proof-report.json"
          test -s "$DIR/solver-obligation.json"
          test -s "$DIR/solver-result.json"
          test ! -e "$DIR/proof-obligation.json"
          test -s "$DIR/lifecycle-candidate.json"
          test -s "$DIR/lifecycle-decision.json"
          test -s "$DIR/stage-resource-ledger.json"
          test -s "$DIR/production-lifecycle-run.json"
          test -s "$DIR/next-plan-v2.json"
          test -s "$DIR/campaign-round-v2.json"
          test -s "$DIR/feedback-reallocation.json"
          test -s "$DIR/campaign-resource-ledger.json"
          test -s "$DIR/production-campaign-manifest.json"

      - name: Validate solver IR production artifacts
        shell: bash
        run: |
          python3 -m pip install --disable-pip-version-check --quiet jsonschema==4.25.1
          python3 - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          root = Path("regelsuche-autopilot/build/reports/autopilot-production-campaign")
          schemas = Path("docs/schemas")
          pairs = [
              (schemas / "regelsuche-solver-obligation-v1.schema.json", root / "solver-obligation.json"),
              (schemas / "regelsuche-solver-result-v1.schema.json", root / "solver-result.json"),
              (schemas / "regelsuche-open-target-conjecture-proof-v2.schema.json", root / "proof-report.json"),
              (schemas / "regelsuche-autonomous-production-lifecycle-v3.schema.json", root / "production-lifecycle-run.json"),
          ]
          for schema_path, artifact_path in pairs:
              schema = json.loads(schema_path.read_text())
              artifact = json.loads(artifact_path.read_text())
              Draft202012Validator.check_schema(schema)
              Draft202012Validator(schema).validate(artifact)
          obligation = json.loads((root / "solver-obligation.json").read_text())
          result = json.loads((root / "solver-result.json").read_text())
          proof = json.loads((root / "proof-report.json").read_text())
          lifecycle = json.loads((root / "production-lifecycle-run.json").read_text())
          assert result["obligationHash"] == obligation["contentHash"]
          assert proof["solverObligationHash"] == obligation["contentHash"]
          assert proof["solverResultHash"] == result["contentHash"]
          assert lifecycle["solverObligationHash"] == obligation["contentHash"]
          assert lifecycle["solverResultHash"] == result["contentHash"]
          assert result["status"] == "CONFIRMED"
          assert result["translationStatus"] == "LOSSLESS"
          PY

      - name: Reproduce complete campaign in Docker
        shell: bash
        run: |
          set -o pipefail
          docker build -f Dockerfile.autopilot -t regelsuche-autopilot-campaign . \
            2>&1 | tee -a autopilot-build.log
          mkdir -p build/autopilot-docker-output
          chmod 0777 build/autopilot-docker-output
          docker run --rm \
            -v "$PWD/build/autopilot-docker-output:/output" \
            regelsuche-autopilot-campaign \
            2>&1 | tee -a autopilot-build.log
          test -s build/autopilot-docker-output/production-campaign-manifest.json
          diff -ru \
            regelsuche-autopilot/build/reports/autopilot-production-campaign \
            build/autopilot-docker-output

      - name: Upload Autopilot evidence and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: autopilot-evidence
          path: |
            autopilot-build.log
            regelsuche-experiments/build/test-results/**
            regelsuche-experiments/build/reports/tests/**
            regelsuche-experiments/build/reports/autopilot-v2-dag/**
            regelsuche-autopilot/build/test-results/**
            regelsuche-autopilot/build/reports/tests/**
            regelsuche-autopilot/build/reports/autopilot-v2-dag/**
            regelsuche-autopilot/build/reports/autopilot-production-campaign/**
            build/autopilot-docker-output/**
          if-no-files-found: warn
