name: Autopilot Evidence

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: autopilot-evidence-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evidence:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0

      - name: Generate deterministic planning, execution and v2 DAG evidence
        run: |
          ./gradlew :regelsuche-experiments:test \
            --tests de.regelsuche.experiments.autopilot.DeterministicCampaignPlannerTest \
            --tests de.regelsuche.experiments.autopilot.AutonomousCampaignExecutionAdapterTest \
            --tests de.regelsuche.experiments.autopilot.AutonomousCampaignExecutionReceiptContractTest \
            --tests de.regelsuche.experiments.autopilot.AutonomousCampaignV1CompatibilityTest \
            --tests de.regelsuche.experiments.autopilot.AutonomousResearchBriefV2Test \
            --tests de.regelsuche.experiments.autopilot.AutonomousAggregateDecisionV2Test \
            --tests de.regelsuche.experiments.autopilot.AutonomousAggregateReceiptV2Test \
            --tests de.regelsuche.experiments.autopilot.AutonomousEvidenceDagSnapshotV2Test \
            --tests de.regelsuche.experiments.autopilot.OpenTargetAutopilotV2BindingTest

      - name: Require evidence artifacts
        run: |
          test -s regelsuche-experiments/build/reports/autopilot-planner/brief.json
          test -s regelsuche-experiments/build/reports/autopilot-planner/ledger.json
          test -s regelsuche-experiments/build/reports/autopilot-planner/plan.json
          test -s regelsuche-experiments/build/reports/autopilot-execution/execution.json
          test -s regelsuche-experiments/build/reports/autopilot-execution/updated-ledger.json
          test -s regelsuche-experiments/build/reports/autopilot-execution/next-plan.json
          test -s regelsuche-experiments/build/reports/autopilot-execution/round.json
          test -s regelsuche-experiments/build/reports/autopilot-v2-dag/v1-compatibility.json
          test -s regelsuche-experiments/build/reports/autopilot-v2-dag/brief-v2.json
          test -s regelsuche-experiments/build/reports/autopilot-v2-dag/aggregate-decision.json
          test -s regelsuche-experiments/build/reports/autopilot-v2-dag/aggregate-receipt.json
          test -s regelsuche-experiments/build/reports/autopilot-v2-dag/dag.json
          test -s regelsuche-experiments/build/reports/autopilot-v2-dag/production-binding.json

      - name: Upload Autopilot evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: autopilot-evidence
          path: |
            regelsuche-experiments/build/reports/autopilot-planner/**
            regelsuche-experiments/build/reports/autopilot-execution/**
            regelsuche-experiments/build/reports/autopilot-v2-dag/**
          if-no-files-found: warn
