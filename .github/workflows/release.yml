name: Release

# One checkout-owned release path. The ordinary project verification remains in
# Gradle; this workflow only provisions the pinned environment and performs the
# GitHub-specific tag, release, maintenance-branch and follow-up-PR mutations.

on:
  workflow_dispatch:
    inputs:
      next_development_version:
        description: 'Optional exact next version (X.Y.Z-SNAPSHOT); leave empty to use the increment choice'
        required: false
        type: string
        default: ''
      next_version_increment:
        description: 'Select the conventional next version when no exact version is supplied'
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
      skip_tests:
        description: 'Skip the checkout-owned ciCheck before packaging'
        required: false
        type: boolean
        default: false
      dry_run:
        description: 'Build and validate release artifacts without pushing a tag, release, branch or pull request'
        required: false
        type: boolean
        default: false
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write
  pull-requests: write
  packages: read

env:
  GH_TOKEN: ${{ github.token }}

concurrency:
  group: regelsuche-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  release:
    name: Verify, package and publish
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    env:
      AI_KNOWLEDGE_EXTRACTOR_ENABLED: 'true'
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout authoritative source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'main' }}

      - name: Resolve versions and remote state
        id: release-state
        env:
          INPUT_EXACT_NEXT: ${{ inputs.next_development_version }}
          INPUT_NEXT_INCREMENT: ${{ inputs.next_version_increment }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_SKIP_TESTS: ${{ inputs.skip_tests }}
        run: |
          set -euo pipefail

          next_from_increment() {
            local release="$1"
            local increment="$2"
            local major minor patch
            IFS='.' read -r major minor patch <<< "$release"
            case "$increment" in
              patch) printf '%s.%s.%s-SNAPSHOT' "$major" "$minor" "$((patch + 1))" ;;
              minor) printf '%s.%s.0-SNAPSHOT' "$major" "$((minor + 1))" ;;
              major) printf '%s.0.0-SNAPSHOT' "$((major + 1))" ;;
              *)
                echo "::error::Unsupported next_version_increment '$increment'" >&2
                return 1
                ;;
            esac
          }

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            MANAGED_RELEASE=false
            TAG="${GITHUB_REF_NAME}"
            RELEASE_VERSION="${TAG#v}"
            EXACT_NEXT=''
            INCREMENT=patch
            DRY_RUN=false
            SKIP_TESTS=false
          else
            MANAGED_RELEASE=true
            CURRENT=$(sed -n 's/^version=//p' release.properties | head -n 1 | tr -d '[:space:]')
            if [[ -z "$CURRENT" || "$CURRENT" != *-SNAPSHOT ]]; then
              echo "::error::release.properties must contain exactly one development SNAPSHOT version"
              exit 1
            fi
            RELEASE_VERSION="${CURRENT%-SNAPSHOT}"
            TAG="v${RELEASE_VERSION}"
            EXACT_NEXT=$(python3 - <<'PY'
          import os
          print(os.environ.get('INPUT_EXACT_NEXT', '').strip())
          PY
            )
            INCREMENT="${INPUT_NEXT_INCREMENT:-patch}"
            DRY_RUN="${INPUT_DRY_RUN:-false}"
            SKIP_TESTS="${INPUT_SKIP_TESTS:-false}"
          fi

          if ! [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid release version '$RELEASE_VERSION'; expected X.Y.Z"
            exit 1
          fi

          if [[ -n "$EXACT_NEXT" ]]; then
            NEXT_VERSION="$EXACT_NEXT"
          else
            NEXT_VERSION=$(next_from_increment "$RELEASE_VERSION" "$INCREMENT")
          fi
          if ! [[ "$NEXT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-SNAPSHOT$ ]]; then
            echo "::error::Invalid next development version '$NEXT_VERSION'"
            exit 1
          fi

          RELEASE_VERSION="$RELEASE_VERSION" NEXT_VERSION="$NEXT_VERSION" python3 - <<'PY'
          import os
          release = tuple(map(int, os.environ['RELEASE_VERSION'].split('.')))
          next_version = tuple(map(int, os.environ['NEXT_VERSION'].removesuffix('-SNAPSHOT').split('.')))
          if next_version <= release:
              raise SystemExit(
                  f"::error::Next development version {os.environ['NEXT_VERSION']} "
                  f"must be newer than release {os.environ['RELEASE_VERSION']}"
              )
          PY

          TAG_EXISTS=false
          RELEASE_EXISTS=false
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            TAG_EXISTS=true
            git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            RELEASE_EXISTS=true
          fi

          if [[ "$TAG_EXISTS" == true ]]; then
            git checkout --detach "$TAG"
            TAG_VERSION=$(git show "${TAG}^{commit}:release.properties" |
              sed -n 's/^version=//p' | head -n 1 | tr -d '[:space:]')
            if [[ "$TAG_VERSION" != "$RELEASE_VERSION" ]]; then
              echo "::error::Tag $TAG contains version '$TAG_VERSION', expected '$RELEASE_VERSION'"
              exit 1
            fi
          fi

          SERIES="${RELEASE_VERSION%.*}"
          {
            echo "managed_release=$MANAGED_RELEASE"
            echo "release_version=$RELEASE_VERSION"
            echo "next_version=$NEXT_VERSION"
            echo "tag=$TAG"
            echo "tag_exists=$TAG_EXISTS"
            echo "release_exists=$RELEASE_EXISTS"
            echo "maintenance_branch=maintenance/${SERIES}.x"
            echo "dry_run=$DRY_RUN"
            echo "skip_tests=$SKIP_TESTS"
          } >> "$GITHUB_OUTPUT"

      - name: Validate development metadata
        if: steps.release-state.outputs.managed_release == 'true' && steps.release-state.outputs.tag_exists != 'true'
        env:
          RELEASE_VERSION: ${{ steps.release-state.outputs.release_version }}
        run: |
          set -euo pipefail
          CURRENT="${RELEASE_VERSION}-SNAPSHOT"
          test "$(sed -n 's/^version=//p' release.properties | head -n 1 | tr -d '[:space:]')" = "$CURRENT"
          grep -Fq "version: \"${CURRENT}\"" CITATION.cff
          grep -Fq "Version ${CURRENT}." CITATION.md
          grep -Fq "version      = {${CURRENT}}," CITATION.md
          grep -Fq "\"version\": \"${CURRENT}\"" .zenodo.json
          grep -Fq "\"version\": \"${CURRENT}\"" codemeta.json

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-cleanup: on-success

      - name: Install checkout prerequisites
        if: steps.release-state.outputs.skip_tests != 'true'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-venv \
            z3=4.8.12-1
          ./gradlew --no-daemon \
            :app:installPlaywrightHostDependencies \
            --console=plain

      - name: Run checkout-owned verification
        if: steps.release-state.outputs.skip_tests != 'true'
        run: |
          set -euo pipefail
          mkdir -p build/logs
          set -o pipefail
          env -u GITHUB_SHA ./gradlew \
            --no-daemon \
            --no-configuration-cache \
            ciCheck \
            --console=plain \
            --stacktrace \
            2>&1 | tee build/logs/release-ci-check.log
          test -z "$(git status --porcelain)"

      - name: Run assembly-only verification
        if: steps.release-state.outputs.skip_tests == 'true'
        run: |
          set -euo pipefail
          ./gradlew \
            --no-daemon \
            --no-configuration-cache \
            assemble \
            --console=plain
          test -z "$(git status --porcelain)"

      - name: Prepare release metadata commit
        if: steps.release-state.outputs.tag_exists != 'true'
        env:
          VERSION: ${{ steps.release-state.outputs.release_version }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          python3 .github/scripts/update-release-metadata.py "$VERSION" --release
          git add CITATION.cff CITATION.md .zenodo.json codemeta.json release.properties
          git diff --cached --check
          git commit -m "Release version ${VERSION}"

      - name: Validate release metadata
        env:
          VERSION: ${{ steps.release-state.outputs.release_version }}
        run: |
          set -euo pipefail
          test "$(sed -n 's/^version=//p' release.properties | head -n 1 | tr -d '[:space:]')" = "$VERSION"
          grep -Fq "version: \"${VERSION}\"" CITATION.cff
          grep -Fq "Version ${VERSION}." CITATION.md
          grep -Fq "version      = {${VERSION}}," CITATION.md
          grep -Fq "\"version\": \"${VERSION}\"" .zenodo.json
          grep -Fq "\"version\": \"${VERSION}\"" codemeta.json
          test -z "$(git status --porcelain)"

      - name: Build release distributions from release metadata
        run: |
          set -euo pipefail
          ./gradlew \
            --no-daemon \
            --no-configuration-cache \
            :app:distZip \
            :app:distTar \
            :app:jar \
            --console=plain

      - name: Collect release artifacts
        id: artifacts
        env:
          VERSION: ${{ steps.release-state.outputs.release_version }}
          TAG: ${{ steps.release-state.outputs.tag }}
        run: |
          set -euo pipefail
          rm -rf release-artifacts
          mkdir -p release-artifacts
          shopt -s nullglob
          files=(app/build/distributions/*.zip app/build/distributions/*.tar app/build/libs/*.jar)
          if (( ${#files[@]} == 0 )); then
            echo "::error::No release artifacts were produced"
            exit 1
          fi
          cp "${files[@]}" release-artifacts/
          {
            echo "version=${VERSION}"
            echo "tag=${TAG}"
            echo "source_commit=$(git rev-parse HEAD)"
            echo "release_properties_sha256=$(sha256sum release.properties | awk '{print $1}')"
          } > release-artifacts/RELEASE-MANIFEST.txt
          (cd release-artifacts && sha256sum -- * > SHA256SUMS.txt)
          echo "name=regelsuche-${VERSION}-artifacts" >> "$GITHUB_OUTPUT"

      - name: Retain release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.artifacts.outputs.name }}
          path: release-artifacts/**
          if-no-files-found: error

      - name: Create and push release tag
        if: steps.release-state.outputs.dry_run != 'true' && steps.release-state.outputs.tag_exists != 'true'
        env:
          TAG: ${{ steps.release-state.outputs.tag }}
          VERSION: ${{ steps.release-state.outputs.release_version }}
        run: |
          set -euo pipefail
          git tag -a "$TAG" -m "Release $VERSION"
          git push origin "$TAG"

      - name: Update maintenance branch
        if: steps.release-state.outputs.dry_run != 'true'
        env:
          TAG: ${{ steps.release-state.outputs.tag }}
          BRANCH: ${{ steps.release-state.outputs.maintenance_branch }}
          VERSION: ${{ steps.release-state.outputs.release_version }}
        run: |
          set -euo pipefail
          if ! git rev-parse --verify "${TAG}^{commit}" >/dev/null 2>&1; then
            git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
          fi
          TARGET_SHA=$(git rev-parse "${TAG}^{commit}")
          OLD_SHA=$(git ls-remote --heads origin "refs/heads/${BRANCH}" | awk '{print $1}')
          if [[ -z "$OLD_SHA" ]]; then
            git push origin "${TARGET_SHA}:refs/heads/${BRANCH}"
          elif [[ "$OLD_SHA" == "$TARGET_SHA" ]]; then
            echo "Maintenance branch ${BRANCH} already points to ${TAG}"
          else
            SERIES="${VERSION%.*}"
            git fetch --force --tags origin
            if ! git tag --contains "$OLD_SHA" --list "v${SERIES}.*" | grep -q .; then
              echo "::error::Refusing to replace ${BRANCH}: ${OLD_SHA} is not preserved by a v${SERIES}.* tag"
              exit 1
            fi
            git push \
              --force-with-lease="refs/heads/${BRANCH}:${OLD_SHA}" \
              origin "${TARGET_SHA}:refs/heads/${BRANCH}"
          fi

      - name: Create GitHub Release
        if: steps.release-state.outputs.dry_run != 'true' && steps.release-state.outputs.release_exists != 'true'
        env:
          TAG: ${{ steps.release-state.outputs.tag }}
          VERSION: ${{ steps.release-state.outputs.release_version }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Regelsuche ${VERSION}" \
            --generate-notes \
            release-artifacts/*

      - name: Restore authoritative main for follow-up
        if: steps.release-state.outputs.dry_run != 'true' && steps.release-state.outputs.managed_release == 'true'
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          git reset --hard origin/main
          git clean -fd

      - name: Prepare next development metadata
        id: next-development
        if: steps.release-state.outputs.dry_run != 'true' && steps.release-state.outputs.managed_release == 'true'
        env:
          RELEASE_VERSION: ${{ steps.release-state.outputs.release_version }}
          NEXT_VERSION: ${{ steps.release-state.outputs.next_version }}
        run: |
          set -euo pipefail
          CURRENT=$(sed -n 's/^version=//p' release.properties | head -n 1 | tr -d '[:space:]')
          if [[ "$CURRENT" == "$NEXT_VERSION" ]]; then
            echo "required=false" >> "$GITHUB_OUTPUT"
            echo "Main already contains ${NEXT_VERSION}"
          elif [[ "$CURRENT" == "${RELEASE_VERSION}-SNAPSHOT" ]]; then
            python3 .github/scripts/update-release-metadata.py "$NEXT_VERSION"
            git diff --check
            echo "required=true" >> "$GITHUB_OUTPUT"
          else
            echo "required=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Main is at ${CURRENT}; not creating a follow-up version PR"
          fi

      - name: Open next development metadata PR
        if: steps.next-development.outputs.required == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          branch: release/prepare-next-${{ steps.release-state.outputs.next_version }}
          base: main
          delete-branch: false
          commit-message: Prepare next development version ${{ steps.release-state.outputs.next_version }}
          title: Prepare next development version ${{ steps.release-state.outputs.next_version }}
          body: |
            Automated follow-up after release ${{ steps.release-state.outputs.release_version }}.

            Changes:
            - update release.properties
            - update CITATION.cff
            - update CITATION.md
            - update .zenodo.json
            - update codemeta.json
            - remove release-only date metadata from the development snapshot
          add-paths: |
            CITATION.cff
            CITATION.md
            .zenodo.json
            codemeta.json
            release.properties

      - name: Release summary
        if: always()
        run: |
          {
            echo "## Release workflow";
            echo "";
            echo "| Field | Value |";
            echo "|-------|-------|";
            echo "| Version | ${{ steps.release-state.outputs.release_version }} |";
            echo "| Tag | ${{ steps.release-state.outputs.tag }} |";
            echo "| Existing tag at start | ${{ steps.release-state.outputs.tag_exists }} |";
            echo "| Existing GitHub Release at start | ${{ steps.release-state.outputs.release_exists }} |";
            echo "| Next development version | ${{ steps.release-state.outputs.next_version }} |";
            echo "| Maintenance branch | ${{ steps.release-state.outputs.maintenance_branch }} |";
            echo "| Dry run | ${{ steps.release-state.outputs.dry_run }} |";
            echo "| Tests skipped | ${{ steps.release-state.outputs.skip_tests }} |";
          } >> "$GITHUB_STEP_SUMMARY"
