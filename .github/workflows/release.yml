name: Release

# Inspired by the release workflow of the sibling Taxonomy project
# (https://github.com/carstenartur/Taxonomy/blob/main/.github/workflows/deploy-release.yml),
# adapted for Regelsuche's Gradle build (no Maven SNAPSHOT versioning).
#
# Trigger: manual via "Actions → Release → Run workflow", or by pushing a
# semver tag (e.g. `git tag v1.2.0 && git push --tags`).

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version in semver, e.g. 1.0.0 (no leading "v")'
        required: true
        type: string
      skip_tests:
        description: 'Skip ./gradlew test during the release build'
        required: false
        type: boolean
        default: false
      dry_run:
        description: 'Dry run – build & validate but do not create a tag or release'
        required: false
        type: boolean
        default: false
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  preflight:
    name: Preflight Checks
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.resolve.outputs.release_version }}
      tag_name: ${{ steps.resolve.outputs.tag_name }}
      dry_run: ${{ steps.resolve.outputs.dry_run }}
      skip_tests: ${{ steps.resolve.outputs.skip_tests }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: resolve
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "push" ]]; then
            TAG_NAME="${GITHUB_REF_NAME}"
            RELEASE_VERSION="${TAG_NAME#v}"
            DRY_RUN="false"
            SKIP_TESTS="false"
          else
            RELEASE_VERSION="${{ inputs.release_version }}"
            TAG_NAME="v${RELEASE_VERSION}"
            DRY_RUN="${{ inputs.dry_run }}"
            SKIP_TESTS="${{ inputs.skip_tests }}"
          fi

          if ! [[ "${RELEASE_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version format: '${RELEASE_VERSION}' (expected X.Y.Z)"
            exit 1
          fi

          echo "release_version=${RELEASE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${TAG_NAME}"              >> "$GITHUB_OUTPUT"
          echo "dry_run=${DRY_RUN}"                >> "$GITHUB_OUTPUT"
          echo "skip_tests=${SKIP_TESTS}"          >> "$GITHUB_OUTPUT"

      - name: Reject if tag already exists (workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          TAG="${{ steps.resolve.outputs.tag_name }}"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::Tag ${TAG} already exists on origin"
            exit 1
          fi
          echo "Tag ${TAG} is free ✅"

      - name: Preflight summary
        run: |
          {
            echo "## Preflight";
            echo "";
            echo "| Field | Value |";
            echo "|-------|-------|";
            echo "| Trigger | ${{ github.event_name }} |";
            echo "| Release version | ${{ steps.resolve.outputs.release_version }} |";
            echo "| Tag | ${{ steps.resolve.outputs.tag_name }} |";
            echo "| Dry run | ${{ steps.resolve.outputs.dry_run }} |";
            echo "| Skip tests | ${{ steps.resolve.outputs.skip_tests }} |";
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build & Verify
    needs: preflight
    runs-on: ubuntu-latest
    outputs:
      artifact_name: ${{ steps.collect.outputs.artifact_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.1.0

      - name: Gradle build
        run: |
          if [[ "${{ needs.preflight.outputs.skip_tests }}" == "true" ]]; then
            ./gradlew --no-daemon assemble
          else
            ./gradlew --no-daemon build
          fi

      - name: Collect distribution artifacts
        id: collect
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          # Application plugin produces tar/zip distributions under app/build/distributions.
          shopt -s nullglob
          for f in app/build/distributions/*.zip app/build/distributions/*.tar; do
            cp "$f" release-artifacts/
          done
          # Also include the plain JAR for convenience.
          for f in app/build/libs/*.jar; do
            cp "$f" release-artifacts/
          done
          ls -la release-artifacts/
          echo "artifact_name=regelsuche-${{ needs.preflight.outputs.release_version }}-artifacts" >> "$GITHUB_OUTPUT"

      - name: Upload release artifacts (workflow run)
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.collect.outputs.artifact_name }}
          path: release-artifacts/**

  release:
    name: Tag & GitHub Release
    needs: [preflight, build]
    if: needs.preflight.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download release artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: release-artifacts

      - name: Create git tag (workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          TAG="${{ needs.preflight.outputs.tag_name }}"
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git tag -a "${TAG}" -m "Release ${{ needs.preflight.outputs.release_version }}"
          git push origin "${TAG}"

      - name: Create GitHub Release
        run: |
          set -euo pipefail
          TAG="${{ needs.preflight.outputs.tag_name }}"
          VERSION="${{ needs.preflight.outputs.release_version }}"
          gh release create "${TAG}" \
            --title  "Regelsuche ${VERSION}" \
            --generate-notes \
            release-artifacts/*

  dry-run-summary:
    name: Dry-run summary
    needs: [preflight, build]
    if: needs.preflight.outputs.dry_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Report dry run
        run: |
          {
            echo "## Dry run completed";
            echo "";
            echo "Would have created tag **${{ needs.preflight.outputs.tag_name }}** and a GitHub Release";
            echo "with artifacts uploaded from job *Build & Verify* (artifact name:";
            echo "\`${{ needs.build.outputs.artifact_name }}\`).";
          } >> "$GITHUB_STEP_SUMMARY"
