name: Release

# Gradle-native, resumable release workflow for Regelsuche.
# It keeps release metadata aligned, publishes artifacts, updates the maintenance
# branch and opens a follow-up PR for the next development version.

on:
  workflow_dispatch:
    inputs:
      next_development_version:
        description: 'Optional exact next version (X.Y.Z-SNAPSHOT); leave empty to use the increment choice'
        required: false
        type: string
        default: ''
      next_version_increment:
        description: 'Select the conventional next version when no exact version is supplied'
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
      skip_tests:
        description: 'Skip ./gradlew test during the release build'
        required: false
        type: boolean
        default: false
      dry_run:
        description: 'Dry run: build and validate but do not create a tag, release or follow-up PR'
        required: false
        type: boolean
        default: false
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release.yml'
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write
  pull-requests: write

env:
  GH_TOKEN: ${{ github.token }}

concurrency:
  group: regelsuche-release
  cancel-in-progress: false

jobs:
  preflight:
    name: Preflight Checks
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/') ||
      (github.event_name == 'push' &&
       github.ref == 'refs/heads/main' &&
       contains(github.event.head_commit.message, '[release]'))
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.resolve.outputs.release_version }}
      next_development_version: ${{ steps.resolve.outputs.next_development_version }}
      tag_name: ${{ steps.resolve.outputs.tag_name }}
      maintenance_branch: ${{ steps.resolve.outputs.maintenance_branch }}
      dry_run: ${{ steps.resolve.outputs.dry_run }}
      skip_tests: ${{ steps.resolve.outputs.skip_tests }}
      managed_release: ${{ steps.resolve.outputs.managed_release }}
      tag_exists: ${{ steps.state.outputs.tag_exists }}
      github_release_exists: ${{ steps.state.outputs.github_release_exists }}
      build_ref: ${{ steps.state.outputs.build_ref }}
      needs_next_pr: ${{ steps.metadata.outputs.needs_next_pr }}
    steps:
      - name: Checkout authoritative main or immutable tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'main' }}

      - name: Resolve release version from repository state
        id: resolve
        env:
          INPUT_EXACT_NEXT: ${{ inputs.next_development_version }}
          INPUT_NEXT_INCREMENT: ${{ inputs.next_version_increment }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_SKIP_TESTS: ${{ inputs.skip_tests }}
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail

          next_from_increment() {
            local release="$1"
            local increment="$2"
            local major minor patch
            IFS='.' read -r major minor patch <<< "$release"
            case "$increment" in
              patch) printf '%s.%s.%s-SNAPSHOT' "$major" "$minor" "$((patch + 1))" ;;
              minor) printf '%s.%s.0-SNAPSHOT' "$major" "$((minor + 1))" ;;
              major) printf '%s.0.0-SNAPSHOT' "$((major + 1))" ;;
              *)
                echo "::error::Unsupported next_version_increment '$increment'" >&2
                return 1
                ;;
            esac
          }

          MANAGED_RELEASE="false"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF_NAME}"
            RELEASE_VERSION="${TAG_NAME#v}"
            DRY_RUN="false"
            SKIP_TESTS="false"
            NEXT_VERSION=""
          else
            CURRENT=$(grep -E '^version=' release.properties | head -n 1 | cut -d'=' -f2 | tr -d '[:space:]')
            if [[ -z "${CURRENT}" || "${CURRENT}" != *-SNAPSHOT ]]; then
              echo "::error::release.properties must contain a development SNAPSHOT version"
              exit 1
            fi
            RELEASE_VERSION="${CURRENT%-SNAPSHOT}"
            TAG_NAME="v${RELEASE_VERSION}"
            MANAGED_RELEASE="true"

            if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
              EXACT_NEXT=$(python3 - <<'PY'
          import os
          print(os.environ.get('INPUT_EXACT_NEXT', '').strip())
          PY
              )
              if [[ -n "$EXACT_NEXT" ]]; then
                NEXT_VERSION="$EXACT_NEXT"
              else
                NEXT_VERSION=$(next_from_increment "${RELEASE_VERSION}" "${INPUT_NEXT_INCREMENT}")
              fi
              DRY_RUN="${INPUT_DRY_RUN}"
              SKIP_TESTS="${INPUT_SKIP_TESTS}"
            else
              if [[ "${HEAD_COMMIT_MESSAGE}" =~ \[next=([0-9]+\.[0-9]+\.[0-9]+-SNAPSHOT)\] ]]; then
                NEXT_VERSION="${BASH_REMATCH[1]}"
              else
                NEXT_VERSION=""
              fi
              DRY_RUN="false"
              SKIP_TESTS="false"
            fi
          fi

          if ! [[ "${RELEASE_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid repository release version: '${RELEASE_VERSION}' (expected X.Y.Z)"
            exit 1
          fi

          if [[ -z "${NEXT_VERSION}" ]]; then
            NEXT_VERSION=$(next_from_increment "${RELEASE_VERSION}" patch)
          fi
          if ! [[ "${NEXT_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+-SNAPSHOT$ ]]; then
            echo "::error::Invalid next development version: '${NEXT_VERSION}'"
            exit 1
          fi
          RELEASE_VERSION="$RELEASE_VERSION" NEXT_VERSION="$NEXT_VERSION" python3 - <<'PY'
          import os
          release = tuple(map(int, os.environ['RELEASE_VERSION'].split('.')))
          next_version = tuple(
              map(int, os.environ['NEXT_VERSION'].removesuffix('-SNAPSHOT').split('.'))
          )
          if next_version <= release:
              raise SystemExit(
                  f"::error::Next development version {os.environ['NEXT_VERSION']} "
                  f"must be newer than release {os.environ['RELEASE_VERSION']}"
              )
          PY

          MAJOR_MINOR="${RELEASE_VERSION%.*}"
          echo "release_version=${RELEASE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "next_development_version=${NEXT_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "maintenance_branch=maintenance/${MAJOR_MINOR}.x" >> "$GITHUB_OUTPUT"
          echo "dry_run=${DRY_RUN}" >> "$GITHUB_OUTPUT"
          echo "skip_tests=${SKIP_TESTS}" >> "$GITHUB_OUTPUT"
          echo "managed_release=${MANAGED_RELEASE}" >> "$GITHUB_OUTPUT"
          echo "build_ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Inspect remote release state
        id: state
        env:
          TAG: ${{ steps.resolve.outputs.tag_name }}
          RESOLVED_HEAD: ${{ steps.resolve.outputs.build_ref }}
        run: |
          set -euo pipefail

          TAG_EXISTS="false"
          GITHUB_RELEASE_EXISTS="false"
          BUILD_REF="${RESOLVED_HEAD}"

          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            TAG_EXISTS="true"
            BUILD_REF="${TAG}"
            git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
          fi

          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            GITHUB_RELEASE_EXISTS="true"
          fi

          echo "tag_exists=${TAG_EXISTS}" >> "$GITHUB_OUTPUT"
          echo "github_release_exists=${GITHUB_RELEASE_EXISTS}" >> "$GITHUB_OUTPUT"
          echo "build_ref=${BUILD_REF}" >> "$GITHUB_OUTPUT"

      - name: Validate release metadata
        id: metadata
        env:
          MANAGED_RELEASE: ${{ steps.resolve.outputs.managed_release }}
          TAG_EXISTS: ${{ steps.state.outputs.tag_exists }}
          TAG: ${{ steps.resolve.outputs.tag_name }}
          RELEASE_VERSION: ${{ steps.resolve.outputs.release_version }}
          NEXT_VERSION: ${{ steps.resolve.outputs.next_development_version }}
          DRY_RUN: ${{ steps.resolve.outputs.dry_run }}
        run: |
          set -euo pipefail
          echo "needs_next_pr=false" >> "$GITHUB_OUTPUT"

          if [[ "${MANAGED_RELEASE}" != "true" ]]; then
            exit 0
          fi

          CURRENT=$(grep -E '^version=' release.properties | head -n 1 | cut -d'=' -f2 | tr -d '[:space:]')
          if [[ -z "${CURRENT}" ]]; then
            echo "::error::release.properties must contain version=..."
            exit 1
          fi

          if [[ "${TAG_EXISTS}" == "true" ]]; then
            TAG_VERSION=$(git show "${TAG}^{commit}:release.properties" |
              grep -E '^version=' | head -n 1 | cut -d'=' -f2 | tr -d '[:space:]')
            if [[ "${TAG_VERSION}" != "${RELEASE_VERSION}" ]]; then
              echo "::error::Existing tag ${TAG} contains release version '${TAG_VERSION}', expected '${RELEASE_VERSION}'"
              exit 1
            fi

            if [[ "${CURRENT}" == "${RELEASE_VERSION}-SNAPSHOT" ]]; then
              echo "needs_next_pr=true" >> "$GITHUB_OUTPUT"
            elif [[ "${CURRENT}" == "${NEXT_VERSION}" ]]; then
              echo "Next development metadata is already present on main"
            else
              echo "Main is at ${CURRENT}; release recovery will not rewrite development metadata"
            fi
            exit 0
          fi

          if [[ "${CURRENT}" != *-SNAPSHOT ]]; then
            echo "::error::release.properties must contain a development SNAPSHOT version"
            exit 1
          fi
          if [[ "${CURRENT%-SNAPSHOT}" != "${RELEASE_VERSION}" && "${DRY_RUN}" != "true" ]]; then
            echo "::error::Derived release version does not match release.properties base version (${CURRENT%-SNAPSHOT})"
            exit 1
          fi

          grep -q "version: \"${CURRENT}\"" CITATION.cff
          grep -q "Version ${CURRENT}." CITATION.md
          grep -q "version      = {${CURRENT}}," CITATION.md
          grep -q "\"version\": \"${CURRENT}\"" .zenodo.json
          grep -q "\"version\": \"${CURRENT}\"" codemeta.json
          echo "needs_next_pr=true" >> "$GITHUB_OUTPUT"

      - name: Preflight summary
        run: |
          {
            echo "## Preflight";
            echo "";
            echo "| Field | Value |";
            echo "|-------|-------|";
            echo "| Trigger | ${{ github.event_name }} |";
            echo "| Release version | ${{ steps.resolve.outputs.release_version }} |";
            echo "| Next development version | ${{ steps.resolve.outputs.next_development_version }} |";
            echo "| Tag | ${{ steps.resolve.outputs.tag_name }} |";
            echo "| Tag exists | ${{ steps.state.outputs.tag_exists }} |";
            echo "| GitHub Release exists | ${{ steps.state.outputs.github_release_exists }} |";
            echo "| Build ref | ${{ steps.state.outputs.build_ref }} |";
            echo "| Maintenance branch | ${{ steps.resolve.outputs.maintenance_branch }} |";
            echo "| Follow-up metadata required | ${{ steps.metadata.outputs.needs_next_pr }} |";
            echo "| Dry run | ${{ steps.resolve.outputs.dry_run }} |";
            echo "| Skip tests | ${{ steps.resolve.outputs.skip_tests }} |";
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build & Verify
    needs: preflight
    if: >-
      needs.preflight.outputs.dry_run == 'true' ||
      needs.preflight.outputs.github_release_exists != 'true'
    runs-on: ubuntu-latest
    outputs:
      artifact_name: ${{ steps.collect.outputs.artifact_name }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.preflight.outputs.build_ref }}

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.1.0

      - name: Gradle build
        run: |
          if [[ "${{ needs.preflight.outputs.skip_tests }}" == "true" ]]; then
            ./gradlew --no-daemon assemble
          else
            ./gradlew --no-daemon build
          fi

      - name: Collect distribution artifacts
        id: collect
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          shopt -s nullglob
          for f in app/build/distributions/*.zip app/build/distributions/*.tar app/build/libs/*.jar; do
            cp "$f" release-artifacts/
          done
          shopt -u nullglob
          if ! compgen -G 'release-artifacts/*' > /dev/null; then
            echo "::error::No release artifacts were found"
            exit 1
          fi
          (cd release-artifacts && sha256sum * > SHA256SUMS.txt)
          ls -la release-artifacts/
          echo "artifact_name=regelsuche-${{ needs.preflight.outputs.release_version }}-artifacts" >> "$GITHUB_OUTPUT"

      - name: Upload release artifacts (workflow run)
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.collect.outputs.artifact_name }}
          path: release-artifacts/**

  release:
    name: Complete GitHub Release
    needs: [preflight, build]
    if: >-
      always() &&
      needs.preflight.result == 'success' &&
      needs.preflight.outputs.dry_run != 'true' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main release controller
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main

      - name: Download release artifacts
        if: needs.preflight.outputs.github_release_exists != 'true'
        uses: actions/download-artifact@v8.0.1
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: release-artifacts

      - name: Create release metadata commit
        if: >-
          needs.preflight.outputs.managed_release == 'true' &&
          needs.preflight.outputs.tag_exists != 'true'
        run: |
          set -euo pipefail
          VERSION="${{ needs.preflight.outputs.release_version }}"
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          python3 .github/scripts/update-release-metadata.py "${VERSION}" --release
          git add CITATION.cff CITATION.md .zenodo.json codemeta.json release.properties
          git commit -m "Release version ${VERSION}"

      - name: Create git tag
        if: >-
          needs.preflight.outputs.managed_release == 'true' &&
          needs.preflight.outputs.tag_exists != 'true'
        run: |
          set -euo pipefail
          TAG="${{ needs.preflight.outputs.tag_name }}"
          git tag -a "${TAG}" -m "Release ${{ needs.preflight.outputs.release_version }}"
          git push origin "${TAG}"

      - name: Update maintenance branch
        if: needs.preflight.outputs.managed_release == 'true'
        env:
          TAG: ${{ needs.preflight.outputs.tag_name }}
          BRANCH: ${{ needs.preflight.outputs.maintenance_branch }}
          RELEASE_VERSION: ${{ needs.preflight.outputs.release_version }}
        run: |
          set -euo pipefail
          SERIES="${RELEASE_VERSION%.*}"

          if ! git rev-parse --verify "${TAG}^{commit}" >/dev/null 2>&1; then
            git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
          fi
          TARGET_SHA=$(git rev-parse "${TAG}^{commit}")
          OLD_SHA=$(git ls-remote --heads origin "refs/heads/${BRANCH}" | awk '{print $1}')

          if [[ -z "${OLD_SHA}" ]]; then
            git push origin "${TARGET_SHA}:refs/heads/${BRANCH}"
            exit 0
          fi

          if [[ "${OLD_SHA}" == "${TARGET_SHA}" ]]; then
            echo "Maintenance branch ${BRANCH} already points to ${TAG}"
            exit 0
          fi

          git fetch --force --tags origin
          if ! git tag --contains "${OLD_SHA}" --list "v${SERIES}.*" | grep -q .; then
            echo "::error::Refusing to replace ${BRANCH}: its current tip ${OLD_SHA} is not preserved by a v${SERIES}.* tag"
            exit 1
          fi

          git push \
            --force-with-lease="refs/heads/${BRANCH}:${OLD_SHA}" \
            origin "${TARGET_SHA}:refs/heads/${BRANCH}"

      - name: Create GitHub Release
        if: needs.preflight.outputs.github_release_exists != 'true'
        env:
          TAG: ${{ needs.preflight.outputs.tag_name }}
          VERSION: ${{ needs.preflight.outputs.release_version }}
        run: |
          set -euo pipefail
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "GitHub Release ${TAG} already exists"
          else
            gh release create "${TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "Regelsuche ${VERSION}" \
              --generate-notes \
              release-artifacts/*
          fi

      - name: Prepare next development metadata
        if: >-
          needs.preflight.outputs.managed_release == 'true' &&
          needs.preflight.outputs.needs_next_pr == 'true'
        run: |
          python3 .github/scripts/update-release-metadata.py "${{ needs.preflight.outputs.next_development_version }}"

      - name: Open next development metadata PR
        if: >-
          needs.preflight.outputs.managed_release == 'true' &&
          needs.preflight.outputs.needs_next_pr == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          branch: release/prepare-next-${{ needs.preflight.outputs.next_development_version }}
          base: main
          delete-branch: false
          commit-message: Prepare next development version ${{ needs.preflight.outputs.next_development_version }}
          title: Prepare next development version ${{ needs.preflight.outputs.next_development_version }}
          body: |
            Automated follow-up after release ${{ needs.preflight.outputs.release_version }}.

            Changes:
            - update release.properties
            - update CITATION.cff
            - update CITATION.md
            - update .zenodo.json
            - update codemeta.json
            - remove release-only date metadata from the development snapshot
          add-paths: |
            CITATION.cff
            CITATION.md
            .zenodo.json
            codemeta.json
            release.properties

  complete-summary:
    name: Release completion summary
    needs: [preflight, build, release]
    if: >-
      always() &&
      needs.preflight.result == 'success' &&
      needs.preflight.outputs.dry_run != 'true' &&
      needs.release.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Report completion
        run: |
          {
            echo "## Release completed";
            echo "";
            echo "Tag: **${{ needs.preflight.outputs.tag_name }}**";
            echo "GitHub Release, artifacts and maintenance branch are complete.";
          } >> "$GITHUB_STEP_SUMMARY"

  dry-run-summary:
    name: Dry-run summary
    needs: [preflight, build]
    if: needs.preflight.outputs.dry_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Report dry run
        run: |
          {
            echo "## Dry run completed";
            echo "";
            echo "Would have completed tag **${{ needs.preflight.outputs.tag_name }}** and its GitHub Release";
            echo "with artifacts uploaded from job *Build & Verify* (artifact name:";
            echo "`${{ needs.build.outputs.artifact_name }}`).";
            echo "Would have updated **${{ needs.preflight.outputs.maintenance_branch }}**.";
          } >> "$GITHUB_STEP_SUMMARY"
