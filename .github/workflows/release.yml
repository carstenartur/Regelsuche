name: Release

# The checkout owns verification, metadata alignment and Maven packaging. This
# workflow only provisions the pinned environment and performs the GitHub-side
# tag, release, maintenance-branch and follow-up-PR mutations.

on:
  workflow_dispatch:
    inputs:
      next_development_version:
        description: 'Optional exact next version (X.Y.Z-SNAPSHOT); leave empty to use the increment choice'
        required: false
        type: string
        default: ''
      next_version_increment:
        description: 'Select the conventional next version when no exact version is supplied'
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
      skip_tests:
        description: 'Emergency only: package without repeating the full checkout verification'
        required: false
        type: boolean
        default: false
      dry_run:
        description: 'Build and validate release artifacts without publishing or opening a follow-up PR'
        required: false
        type: boolean
        default: false
  push:
    branches:
      - 'release/dry-run-v*-next-v*-SNAPSHOT'
      - 'release/run-v*-next-v*-SNAPSHOT'
    paths:
      - '.github/release-request'
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write
  pull-requests: write
  packages: read

env:
  GH_TOKEN: ${{ github.token }}

concurrency:
  group: regelsuche-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  release:
    name: Verify, package and publish
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    env:
      AI_KNOWLEDGE_EXTRACTOR_ENABLED: 'true'
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout authoritative source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'main' }}

      - name: Resolve versions, trigger and remote state
        id: release-state
        env:
          INPUT_EXACT_NEXT: ${{ inputs.next_development_version }}
          INPUT_NEXT_INCREMENT: ${{ inputs.next_version_increment }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_SKIP_TESTS: ${{ inputs.skip_tests }}
        run: |
          set -euo pipefail

          trim() {
            local value="$1"
            value="${value#"${value%%[![:space:]]*}"}"
            value="${value%"${value##*[![:space:]]}"}"
            printf '%s' "$value"
          }

          current_development_version() {
            sed -n 's/^version=//p' release.properties | head -n 1 | tr -d '[:space:]'
          }

          next_from_increment() {
            local release="$1"
            local increment="$2"
            local major minor patch
            IFS='.' read -r major minor patch <<< "$release"
            case "$increment" in
              patch) printf '%s.%s.%s-SNAPSHOT' "$major" "$minor" "$((10#$patch + 1))" ;;
              minor) printf '%s.%s.0-SNAPSHOT' "$major" "$((10#$minor + 1))" ;;
              major) printf '%s.0.0-SNAPSHOT' "$((10#$major + 1))" ;;
              *)
                echo "::error::Unsupported next_version_increment '$increment'" >&2
                return 1
                ;;
            esac
          }

          next_is_newer() {
            local release="$1"
            local next="${2%-SNAPSHOT}"
            local release_major release_minor release_patch
            local next_major next_minor next_patch
            IFS='.' read -r release_major release_minor release_patch <<< "$release"
            IFS='.' read -r next_major next_minor next_patch <<< "$next"
            if (( 10#$next_major != 10#$release_major )); then
              (( 10#$next_major > 10#$release_major ))
            elif (( 10#$next_minor != 10#$release_minor )); then
              (( 10#$next_minor > 10#$release_minor ))
            else
              (( 10#$next_patch > 10#$release_patch ))
            fi
          }

          resolve_branch_request() {
            local mode="$1"
            local prefix="release/${mode}-v"
            local request="${GITHUB_REF_NAME#${prefix}}"
            local trigger_sha main_sha
            local -a commit_parts changed_files request_lines

            RELEASE_VERSION="${request%%-next-v*}"
            EXACT_NEXT="${request#*-next-v}"
            TAG="v${RELEASE_VERSION}"
            MANAGED_RELEASE=true
            INCREMENT=patch
            SKIP_TESTS=false
            RELEASE_TRIGGER="branch:${mode}"
            if [[ "$mode" == 'dry-run' ]]; then
              DRY_RUN=true
            else
              DRY_RUN=false
            fi

            git fetch --no-tags origin \
              '+refs/heads/main:refs/remotes/origin/main' \
              "+${GITHUB_REF}:refs/remotes/origin/release-request-trigger"
            trigger_sha=$(git rev-parse refs/remotes/origin/release-request-trigger)
            main_sha=$(git rev-parse refs/remotes/origin/main)
            if [[ "$trigger_sha" != "$GITHUB_SHA" ]]; then
              echo "::error::Release request ref moved while the workflow was starting"
              exit 1
            fi

            read -r -a commit_parts <<< "$(git rev-list --parents -n 1 "$trigger_sha")"
            if (( ${#commit_parts[@]} != 2 )); then
              echo "::error::A release request must be one non-merge commit on top of main"
              exit 1
            fi
            if [[ "${commit_parts[1]}" != "$main_sha" ]]; then
              echo "::error::Release request parent ${commit_parts[1]} is not current main ${main_sha}"
              exit 1
            fi

            mapfile -t changed_files < <(
              git diff-tree --no-commit-id --name-only -r "$trigger_sha"
            )
            if (( ${#changed_files[@]} != 1 )) || \
               [[ "${changed_files[0]}" != '.github/release-request' ]]; then
              echo "::error::A release request commit may change only .github/release-request"
              printf 'Changed path: %s\n' "${changed_files[@]:-<none>}"
              exit 1
            fi

            mapfile -t request_lines < <(
              git show "${trigger_sha}:.github/release-request" | tr -d '\r'
            )
            if (( ${#request_lines[@]} != 3 )) || \
               [[ "${request_lines[0]}" != "mode=${mode}" ]] || \
               [[ "${request_lines[1]}" != "release=${RELEASE_VERSION}" ]] || \
               [[ "${request_lines[2]}" != "next=${EXACT_NEXT}" ]]; then
              echo "::error::Release request payload does not match its branch name"
              exit 1
            fi

            CURRENT=$(current_development_version)
            if [[ "$CURRENT" != "${RELEASE_VERSION}-SNAPSHOT" ]]; then
              echo "::error::Branch requests ${RELEASE_VERSION}, but main is at ${CURRENT}"
              exit 1
            fi
          }

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            MANAGED_RELEASE=false
            TAG="$GITHUB_REF_NAME"
            RELEASE_VERSION="${TAG#v}"
            EXACT_NEXT=''
            INCREMENT=patch
            DRY_RUN=false
            SKIP_TESTS=false
            RELEASE_TRIGGER='tag-recovery'
          elif [[ "$GITHUB_REF_NAME" == release/dry-run-v*-next-v*-SNAPSHOT ]]; then
            resolve_branch_request 'dry-run'
          elif [[ "$GITHUB_REF_NAME" == release/run-v*-next-v*-SNAPSHOT ]]; then
            resolve_branch_request 'run'
          elif [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' ]]; then
            if [[ "$GITHUB_REF_NAME" != 'main' ]]; then
              echo "::error::Manual releases must be dispatched from main"
              exit 1
            fi
            MANAGED_RELEASE=true
            CURRENT=$(current_development_version)
            if [[ -z "$CURRENT" || "$CURRENT" != *-SNAPSHOT ]]; then
              echo "::error::release.properties must contain exactly one development SNAPSHOT version"
              exit 1
            fi
            RELEASE_VERSION="${CURRENT%-SNAPSHOT}"
            TAG="v${RELEASE_VERSION}"
            EXACT_NEXT=$(trim "${INPUT_EXACT_NEXT:-}")
            INCREMENT="${INPUT_NEXT_INCREMENT:-patch}"
            DRY_RUN="${INPUT_DRY_RUN:-false}"
            SKIP_TESTS="${INPUT_SKIP_TESTS:-false}"
            RELEASE_TRIGGER='workflow-dispatch'
          else
            echo "::error::Unsupported release trigger: ${GITHUB_EVENT_NAME} ${GITHUB_REF}"
            exit 1
          fi

          if ! [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid release version '$RELEASE_VERSION'; expected X.Y.Z"
            exit 1
          fi
          if [[ "$DRY_RUN" != 'true' && "$DRY_RUN" != 'false' ]]; then
            echo "::error::Invalid dry_run value '$DRY_RUN'"
            exit 1
          fi
          if [[ "$SKIP_TESTS" != 'true' && "$SKIP_TESTS" != 'false' ]]; then
            echo "::error::Invalid skip_tests value '$SKIP_TESTS'"
            exit 1
          fi

          if [[ -n "$EXACT_NEXT" ]]; then
            NEXT_VERSION="$EXACT_NEXT"
          else
            NEXT_VERSION=$(next_from_increment "$RELEASE_VERSION" "$INCREMENT")
          fi
          if ! [[ "$NEXT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-SNAPSHOT$ ]]; then
            echo "::error::Invalid next development version '$NEXT_VERSION'"
            exit 1
          fi
          if ! next_is_newer "$RELEASE_VERSION" "$NEXT_VERSION"; then
            echo "::error::Next development version ${NEXT_VERSION} must be newer than release ${RELEASE_VERSION}"
            exit 1
          fi

          TAG_EXISTS=false
          RELEASE_EXISTS=false
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            TAG_EXISTS=true
            git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            RELEASE_EXISTS=true
          fi
          if [[ "$RELEASE_EXISTS" == true && "$TAG_EXISTS" != true ]]; then
            echo "::error::GitHub Release ${TAG} exists without its required Git tag"
            exit 1
          fi

          if [[ "$TAG_EXISTS" == true ]]; then
            git checkout --detach "$TAG"
            TAG_VERSION=$(git show "${TAG}^{commit}:release.properties" |
              sed -n 's/^version=//p' | head -n 1 | tr -d '[:space:]')
            if [[ "$TAG_VERSION" != "$RELEASE_VERSION" ]]; then
              echo "::error::Tag $TAG contains version '$TAG_VERSION', expected '$RELEASE_VERSION'"
              exit 1
            fi
          fi

          if [[ "$RELEASE_EXISTS" == true ]]; then
            PUBLICATION_REQUIRED=false
          else
            PUBLICATION_REQUIRED=true
          fi
          SERIES="${RELEASE_VERSION%.*}"
          {
            echo "managed_release=$MANAGED_RELEASE"
            echo "release_trigger=$RELEASE_TRIGGER"
            echo "release_version=$RELEASE_VERSION"
            echo "next_version=$NEXT_VERSION"
            echo "tag=$TAG"
            echo "tag_exists=$TAG_EXISTS"
            echo "release_exists=$RELEASE_EXISTS"
            echo "publication_required=$PUBLICATION_REQUIRED"
            echo "maintenance_branch=maintenance/${SERIES}.x"
            echo "dry_run=$DRY_RUN"
            echo "skip_tests=$SKIP_TESTS"
            echo "source_commit=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

      - name: Validate development metadata and Maven versions
        if: >-
          steps.release-state.outputs.publication_required == 'true'
          && steps.release-state.outputs.tag_exists != 'true'
        env:
          DEVELOPMENT_VERSION: ${{ steps.release-state.outputs.release_version }}-SNAPSHOT
        run: |
          set -euo pipefail
          python3 .github/scripts/update-release-metadata.py \
            "$DEVELOPMENT_VERSION" --check

      - name: Set up JDK 21
        if: steps.release-state.outputs.publication_required == 'true'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Gradle compatibility gate
        if: >-
          steps.release-state.outputs.publication_required == 'true'
          && steps.release-state.outputs.skip_tests != 'true'
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-cleanup: on-success

      - name: Install checkout prerequisites
        if: >-
          steps.release-state.outputs.publication_required == 'true'
          && steps.release-state.outputs.skip_tests != 'true'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-venv \
            z3=4.8.12-1
          ./gradlew --no-daemon \
            :app:installPlaywrightHostDependencies \
            --console=plain

      - name: Run checkout-owned compatibility verification
        if: >-
          steps.release-state.outputs.publication_required == 'true'
          && steps.release-state.outputs.skip_tests != 'true'
        run: |
          set -euo pipefail
          mkdir -p build/logs
          set -o pipefail
          env -u GITHUB_SHA ./gradlew \
            --no-daemon \
            --no-configuration-cache \
            ciCheck \
            --console=plain \
            --stacktrace \
            2>&1 | tee build/logs/release-ci-check.log

      - name: Verify the complete Maven product reactor
        if: >-
          steps.release-state.outputs.publication_required == 'true'
          && steps.release-state.outputs.skip_tests != 'true'
        run: |
          set -euo pipefail
          mvn --batch-mode --no-transfer-progress test

      - name: Run emergency assembly-only verification
        if: >-
          steps.release-state.outputs.publication_required == 'true'
          && steps.release-state.outputs.skip_tests == 'true'
        env:
          VERSION: ${{ steps.release-state.outputs.release_version }}
        run: |
          set -euo pipefail
          mvn --batch-mode --no-transfer-progress \
            -DreleaseVersion="$VERSION" \
            -DskipTests \
            package

      - name: Verify checkout remains unchanged
        if: steps.release-state.outputs.publication_required == 'true'
        run: |
          set -euo pipefail
          STATUS=$(git status --porcelain --untracked-files=all)
          if [[ -n "$STATUS" ]]; then
            echo "::error::Verification changed checkout-owned files"
            printf '%s\n' "$STATUS"
            git diff --stat
            git diff --check
            exit 1
          fi

      - name: Prepare release metadata commit
        if: >-
          steps.release-state.outputs.publication_required == 'true'
          && steps.release-state.outputs.tag_exists != 'true'
        env:
          VERSION: ${{ steps.release-state.outputs.release_version }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          python3 .github/scripts/update-release-metadata.py "$VERSION" --release
          git add -- \
            CITATION.cff \
            CITATION.md \
            .zenodo.json \
            codemeta.json \
            release.properties \
            pom.xml \
            */pom.xml
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "::error::Release metadata update produced no commit"
            exit 1
          fi
          git commit -m "Release version ${VERSION}"

      - name: Validate release metadata and Maven versions
        if: >-
          steps.release-state.outputs.publication_required == 'true'
          || steps.release-state.outputs.tag_exists == 'true'
        env:
          VERSION: ${{ steps.release-state.outputs.release_version }}
        run: |
          set -euo pipefail
          python3 .github/scripts/update-release-metadata.py "$VERSION" --check
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Build Maven release distributions
        if: steps.release-state.outputs.publication_required == 'true'
        env:
          VERSION: ${{ steps.release-state.outputs.release_version }}
        run: |
          set -euo pipefail
          mvn --batch-mode --no-transfer-progress \
            -DreleaseVersion="$VERSION" \
            -DskipTests \
            package

      - name: Collect and inspect release artifacts
        if: steps.release-state.outputs.publication_required == 'true'
        id: artifacts
        env:
          VERSION: ${{ steps.release-state.outputs.release_version }}
          TAG: ${{ steps.release-state.outputs.tag }}
          SOURCE_COMMIT: ${{ steps.release-state.outputs.source_commit }}
        run: |
          set -euo pipefail

          validate_archive_root() {
            local format="$1"
            local archive="$2"
            local expected_prefix="$3"
            local entries entry
            if [[ "$format" == 'zip' ]]; then
              entries=$(unzip -Z1 "$archive")
            else
              entries=$(tar -tf "$archive")
            fi
            if [[ -z "$entries" ]]; then
              echo "::error::Archive is empty: $archive"
              return 1
            fi
            while IFS= read -r entry; do
              if [[ "$entry" != "${expected_prefix}"* ]]; then
                echo "::error::Archive entry outside ${expected_prefix}: ${entry}"
                return 1
              fi
            done <<< "$entries"
          }

          rm -rf release-artifacts
          mkdir -p release-artifacts

          JAR="app/target/regelsuche-${VERSION}.jar"
          TAR="app/target/regelsuche-${VERSION}.tar"
          ZIP="app/target/regelsuche-${VERSION}.zip"
          for file in "$JAR" "$TAR" "$ZIP"; do
            if [[ ! -s "$file" ]]; then
              echo "::error::Missing Maven release artifact: $file"
              exit 1
            fi
          done

          if ! unzip -p "$JAR" META-INF/MANIFEST.MF | tr -d '\r' |
               grep -Fqx "Implementation-Version: ${VERSION}"; then
            echo "::error::Application JAR does not expose Implementation-Version ${VERSION}"
            exit 1
          fi
          validate_archive_root zip "$ZIP" "regelsuche-${VERSION}/"
          validate_archive_root tar "$TAR" "regelsuche-${VERSION}/"

          cp "$JAR" "$TAR" "$ZIP" release-artifacts/
          {
            echo "version=${VERSION}"
            echo "tag=${TAG}"
            echo "build_system=maven"
            echo "source_main_commit=${SOURCE_COMMIT}"
            echo "release_commit=$(git rev-parse HEAD)"
            echo "release_properties_sha256=$(sha256sum release.properties | awk '{print $1}')"
            echo "root_pom_sha256=$(sha256sum pom.xml | awk '{print $1}')"
          } > release-artifacts/RELEASE-MANIFEST.txt
          (
            cd release-artifacts
            sha256sum -- \
              RELEASE-MANIFEST.txt \
              "regelsuche-${VERSION}.jar" \
              "regelsuche-${VERSION}.tar" \
              "regelsuche-${VERSION}.zip" \
              > SHA256SUMS.txt
          )
          echo "name=regelsuche-${VERSION}-artifacts" >> "$GITHUB_OUTPUT"

      - name: Retain release artifacts
        if: steps.release-state.outputs.publication_required == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.artifacts.outputs.name }}
          path: release-artifacts/**
          if-no-files-found: error

      - name: Create and push release tag
        if: >-
          steps.release-state.outputs.publication_required == 'true'
          && steps.release-state.outputs.dry_run != 'true'
          && steps.release-state.outputs.tag_exists != 'true'
        env:
          TAG: ${{ steps.release-state.outputs.tag }}
          VERSION: ${{ steps.release-state.outputs.release_version }}
        run: |
          set -euo pipefail
          git tag -a "$TAG" -m "Release $VERSION"
          git push origin "$TAG"

      - name: Update maintenance branch
        if: steps.release-state.outputs.dry_run != 'true'
        env:
          TAG: ${{ steps.release-state.outputs.tag }}
          BRANCH: ${{ steps.release-state.outputs.maintenance_branch }}
          VERSION: ${{ steps.release-state.outputs.release_version }}
        run: |
          set -euo pipefail
          if ! git rev-parse --verify "${TAG}^{commit}" >/dev/null 2>&1; then
            git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
          fi
          TARGET_SHA=$(git rev-parse "${TAG}^{commit}")
          OLD_SHA=$(git ls-remote --heads origin "refs/heads/${BRANCH}" | awk '{print $1}')
          if [[ -z "$OLD_SHA" ]]; then
            git push origin "${TARGET_SHA}:refs/heads/${BRANCH}"
          elif [[ "$OLD_SHA" == "$TARGET_SHA" ]]; then
            echo "Maintenance branch ${BRANCH} already points to ${TAG}"
          else
            SERIES="${VERSION%.*}"
            git fetch --force --tags origin
            PRESERVING_TAGS=$(git tag --contains "$OLD_SHA" --list "v${SERIES}.*")
            if [[ -z "$PRESERVING_TAGS" ]]; then
              echo "::error::Refusing to replace ${BRANCH}: ${OLD_SHA} is not preserved by a v${SERIES}.* tag"
              exit 1
            fi
            git push \
              --force-with-lease="refs/heads/${BRANCH}:${OLD_SHA}" \
              origin "${TARGET_SHA}:refs/heads/${BRANCH}"
          fi

      - name: Create GitHub Release
        if: >-
          steps.release-state.outputs.publication_required == 'true'
          && steps.release-state.outputs.dry_run != 'true'
          && steps.release-state.outputs.release_exists != 'true'
        env:
          TAG: ${{ steps.release-state.outputs.tag }}
          VERSION: ${{ steps.release-state.outputs.release_version }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Regelsuche ${VERSION}" \
            --generate-notes \
            release-artifacts/*

      - name: Verify published GitHub Release
        if: steps.release-state.outputs.dry_run != 'true'
        id: published-release
        env:
          TAG: ${{ steps.release-state.outputs.tag }}
          VERSION: ${{ steps.release-state.outputs.release_version }}
        run: |
          set -euo pipefail
          EXPECTED=$(printf '%s\n' \
            RELEASE-MANIFEST.txt \
            SHA256SUMS.txt \
            "regelsuche-${VERSION}.jar" \
            "regelsuche-${VERSION}.tar" \
            "regelsuche-${VERSION}.zip" | sort)

          ACTUAL=''
          for attempt in {1..10}; do
            if CANDIDATE=$(gh release view "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --json assets \
              --jq '.assets[].name' 2>/dev/null); then
              ACTUAL=$(printf '%s\n' "$CANDIDATE" | sort)
              if [[ "$ACTUAL" == "$EXPECTED" ]]; then
                break
              fi
            else
              ACTUAL=''
            fi
            sleep 2
          done
          if [[ "$ACTUAL" != "$EXPECTED" ]]; then
            echo "::error::Published asset set differs from the release contract"
            echo 'Expected:'
            printf '%s\n' "$EXPECTED"
            echo 'Actual:'
            printf '%s\n' "$ACTUAL"
            exit 1
          fi

          if [[ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')" != false ]]; then
            echo "::error::Release ${TAG} is still a draft"
            exit 1
          fi
          if [[ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq '.isPrerelease')" != false ]]; then
            echo "::error::Release ${TAG} was unexpectedly marked as a prerelease"
            exit 1
          fi
          URL=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url --jq '.url')
          echo "release_url=$URL" >> "$GITHUB_OUTPUT"

      - name: Restore authoritative main for follow-up
        if: >-
          steps.release-state.outputs.dry_run != 'true'
          && steps.release-state.outputs.managed_release == 'true'
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          git reset --hard origin/main
          git clean -fdx

      - name: Prepare next development metadata
        id: next-development
        if: >-
          steps.release-state.outputs.dry_run != 'true'
          && steps.release-state.outputs.managed_release == 'true'
        env:
          RELEASE_VERSION: ${{ steps.release-state.outputs.release_version }}
          NEXT_VERSION: ${{ steps.release-state.outputs.next_version }}
        run: |
          set -euo pipefail
          CURRENT=$(sed -n 's/^version=//p' release.properties | head -n 1 | tr -d '[:space:]')
          if [[ "$CURRENT" == "$NEXT_VERSION" ]]; then
            echo "required=false" >> "$GITHUB_OUTPUT"
            echo "Main already contains ${NEXT_VERSION}"
          elif [[ "$CURRENT" == "${RELEASE_VERSION}-SNAPSHOT" ]]; then
            python3 .github/scripts/update-release-metadata.py "$NEXT_VERSION"
            python3 .github/scripts/update-release-metadata.py "$NEXT_VERSION" --check
            git diff --check
            echo "required=true" >> "$GITHUB_OUTPUT"
          else
            echo "required=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Main is at ${CURRENT}; not creating a follow-up version PR"
          fi

      - name: Open next development metadata PR
        if: steps.next-development.outputs.required == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          branch: release/prepare-next-${{ steps.release-state.outputs.next_version }}
          base: main
          delete-branch: false
          commit-message: Prepare next development version ${{ steps.release-state.outputs.next_version }}
          title: Prepare next development version ${{ steps.release-state.outputs.next_version }}
          body: |
            Automated follow-up after release ${{ steps.release-state.outputs.release_version }}.

            Changes:
            - update release.properties
            - update CITATION.cff
            - update CITATION.md
            - update .zenodo.json
            - update codemeta.json
            - update the Maven reactor and every module POM
            - remove release-only date metadata from the development snapshot
          add-paths: |
            CITATION.cff
            CITATION.md
            .zenodo.json
            codemeta.json
            release.properties
            pom.xml
            */pom.xml

      - name: Release summary
        if: always()
        run: |
          {
            echo "## Release workflow";
            echo "";
            echo "| Field | Value |";
            echo "|-------|-------|";
            echo "| Trigger | ${{ steps.release-state.outputs.release_trigger }} |";
            echo "| Version | ${{ steps.release-state.outputs.release_version }} |";
            echo "| Tag | ${{ steps.release-state.outputs.tag }} |";
            echo "| Existing tag at start | ${{ steps.release-state.outputs.tag_exists }} |";
            echo "| Existing GitHub Release at start | ${{ steps.release-state.outputs.release_exists }} |";
            echo "| Publication required | ${{ steps.release-state.outputs.publication_required }} |";
            echo "| Next development version | ${{ steps.release-state.outputs.next_version }} |";
            echo "| Maintenance branch | ${{ steps.release-state.outputs.maintenance_branch }} |";
            echo "| Dry run | ${{ steps.release-state.outputs.dry_run }} |";
            echo "| Tests skipped | ${{ steps.release-state.outputs.skip_tests }} |";
            echo "| GitHub Release | ${{ steps.published-release.outputs.release_url }} |";
          } >> "$GITHUB_STEP_SUMMARY"
