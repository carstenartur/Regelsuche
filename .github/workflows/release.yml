name: Release

# Gradle-native release workflow for Regelsuche.
# It keeps CITATION.cff, CITATION.md, .zenodo.json and codemeta.json aligned
# with the released version and opens a follow-up PR for the next development version.

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version in semver, e.g. 0.1.0 (no leading "v")'
        required: true
        type: string
      next_development_version:
        description: 'Next development version, e.g. 0.1.1-SNAPSHOT. Leave empty to increment patch.'
        required: false
        type: string
        default: ''
      dry_run:
        description: 'Dry run: build and validate but do not create a tag, release or follow-up PR'
        required: false
        type: boolean
        default: false
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write
  pull-requests: write
  packages: read

env:
  GH_TOKEN: ${{ github.token }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  AI_KNOWLEDGE_EXTRACTOR_ENABLED: 'true'

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Preflight Checks
    runs-on: ubuntu-22.04
    outputs:
      release_version: ${{ steps.resolve.outputs.release_version }}
      next_development_version: ${{ steps.resolve.outputs.next_development_version }}
      tag_name: ${{ steps.resolve.outputs.tag_name }}
      maintenance_branch: ${{ steps.resolve.outputs.maintenance_branch }}
      dry_run: ${{ steps.resolve.outputs.dry_run }}
      release_date: ${{ steps.resolve.outputs.release_date }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: resolve
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "push" ]]; then
            TAG_NAME="${GITHUB_REF_NAME}"
            RELEASE_VERSION="${TAG_NAME#v}"
            DRY_RUN="false"
            NEXT_VERSION=""
          else
            RELEASE_VERSION="${{ inputs.release_version }}"
            TAG_NAME="v${RELEASE_VERSION}"
            DRY_RUN="${{ inputs.dry_run }}"
            NEXT_VERSION="${{ inputs.next_development_version }}"
          fi

          if ! [[ "${RELEASE_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version format: '${RELEASE_VERSION}' (expected X.Y.Z)"
            exit 1
          fi

          if [[ -z "${NEXT_VERSION}" ]]; then
            IFS='.' read -r MAJOR MINOR PATCH <<< "${RELEASE_VERSION}"
            NEXT_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))-SNAPSHOT"
          fi
          if ! [[ "${NEXT_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+-SNAPSHOT$ ]]; then
            echo "::error::Invalid next development version: '${NEXT_VERSION}'"
            exit 1
          fi

          MAJOR_MINOR="${RELEASE_VERSION%.*}"
          echo "release_version=${RELEASE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "next_development_version=${NEXT_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "maintenance_branch=maintenance/${MAJOR_MINOR}.x" >> "$GITHUB_OUTPUT"
          echo "dry_run=${DRY_RUN}" >> "$GITHUB_OUTPUT"
          echo "release_date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Validate release source branch
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          EXPECTED_MAINTENANCE="${{ steps.resolve.outputs.maintenance_branch }}"
          if [[ "${GITHUB_REF_NAME}" != "main" && "${GITHUB_REF_NAME}" != "${EXPECTED_MAINTENANCE}" ]]; then
            echo "::error::Release workflow must run from main or ${EXPECTED_MAINTENANCE}; found ${GITHUB_REF_NAME}"
            exit 1
          fi

      - name: Validate release metadata base version
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          CURRENT=$(grep -E '^version=' release.properties | head -n 1 | cut -d'=' -f2 | tr -d '[:space:]')
          if [[ -z "${CURRENT}" ]]; then
            echo "::error::release.properties must contain version=..."
            exit 1
          fi
          if [[ "${CURRENT}" != *-SNAPSHOT ]]; then
            echo "::error::release.properties must contain a development SNAPSHOT version"
            exit 1
          fi
          if [[ "${CURRENT%-SNAPSHOT}" != "${{ steps.resolve.outputs.release_version }}" ]]; then
            echo "::error::release_version must match release.properties base version (${CURRENT%-SNAPSHOT})"
            exit 1
          fi
          grep -Fq "version: \"${CURRENT}\"" CITATION.cff
          grep -Fq "Version ${CURRENT}." CITATION.md
          grep -Fq "version      = {${CURRENT}}," CITATION.md
          grep -Fq "\"version\": \"${CURRENT}\"" .zenodo.json
          grep -Fq "\"version\": \"${CURRENT}\"" codemeta.json

      - name: Inspect existing tag (workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          TAG="${{ steps.resolve.outputs.tag_name }}"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists; the release job will require exact verified-tree parity before reuse"
          else
            echo "Tag ${TAG} is free"
          fi

      - name: Preflight summary
        run: |
          {
            echo "## Preflight";
            echo "";
            echo "| Field | Value |";
            echo "|-------|-------|";
            echo "| Trigger | ${{ github.event_name }} |";
            echo "| Source ref | ${GITHUB_REF_NAME} |";
            echo "| Release version | ${{ steps.resolve.outputs.release_version }} |";
            echo "| Next development version | ${{ steps.resolve.outputs.next_development_version }} |";
            echo "| Tag | ${{ steps.resolve.outputs.tag_name }} |";
            echo "| Maintenance branch | ${{ steps.resolve.outputs.maintenance_branch }} |";
            echo "| Dry run | ${{ steps.resolve.outputs.dry_run }} |";
            echo "| Release date | ${{ steps.resolve.outputs.release_date }} |";
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Full QA, Build & Verify
    needs: preflight
    runs-on: ubuntu-22.04
    outputs:
      artifact_name: ${{ steps.collect.outputs.artifact_name }}
      verified_tree: ${{ steps.record.outputs.verified_tree }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.1.0
        with:
          gradle-home-cache-cleanup: true

      - name: Install checkout prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-venv \
            z3=4.8.12-1
          ./gradlew --no-daemon \
            :app:installPlaywrightHostDependencies \
            --console=plain

      - name: Prepare deterministic release metadata in the build worktree
        if: github.event_name == 'workflow_dispatch'
        run: |
          python3 .github/scripts/update-release-metadata.py \
            "${{ needs.preflight.outputs.release_version }}" \
            --release \
            --release-date "${{ needs.preflight.outputs.release_date }}"

      - name: Run full checkout-owned QA and assemble distributions
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/logs
          env -u GITHUB_SHA ./gradlew \
            --no-daemon \
            --no-configuration-cache \
            ciCheck \
            :app:assemble \
            --console=plain \
            --stacktrace \
            2>&1 | tee build/logs/release-ci-check.log

      - name: Ensure QA leaves no unexpected tracked changes
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t CHANGED < <(git diff HEAD --name-only)
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            for path in "${CHANGED[@]}"; do
              case "${path}" in
                CITATION.cff|CITATION.md|.zenodo.json|codemeta.json|release.properties) ;;
                *)
                  echo "::error::QA changed unexpected tracked file: ${path}"
                  exit 1
                  ;;
              esac
            done
          elif (( ${#CHANGED[@]} != 0 )); then
            echo "::error::QA changed tracked files on a tagged release" >&2
            printf '  %s\n' "${CHANGED[@]}" >&2
            exit 1
          fi

      - name: Record verified release tree
        id: record
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            git add CITATION.cff CITATION.md .zenodo.json codemeta.json release.properties
          fi
          VERIFIED_TREE=$(git write-tree)
          git reset --quiet
          echo "verified_tree=${VERIFIED_TREE}" >> "$GITHUB_OUTPUT"
          echo "Verified release tree: ${VERIFIED_TREE}"

      - name: Smoke-test assembled distribution
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/release-smoke
          mkdir -p build/release-smoke
          ARCHIVE=$(find app/build/distributions -maxdepth 1 -type f -name '*.tar' -print | sort | head -n 1)
          if [[ -z "${ARCHIVE}" ]]; then
            echo "::error::No TAR distribution was produced for the release smoke test"
            exit 1
          fi
          tar -xf "${ARCHIVE}" -C build/release-smoke
          LAUNCHER=$(find build/release-smoke -type f -path '*/bin/app' -print | sort | head -n 1)
          if [[ -z "${LAUNCHER}" ]]; then
            echo "::error::The assembled distribution contains no bin/app launcher"
            exit 1
          fi
          chmod +x "${LAUNCHER}"
          OUTPUT=$("${LAUNCHER}")
          grep -Fq 'Usage:' <<< "${OUTPUT}"
          grep -Fq 'discover' <<< "${OUTPUT}"

      - name: Collect distribution artifacts
        id: collect
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          shopt -s nullglob
          for f in app/build/distributions/*.zip app/build/distributions/*.tar app/build/libs/*.jar; do
            cp "$f" release-artifacts/
          done
          shopt -u nullglob
          if ! compgen -G 'release-artifacts/*' > /dev/null; then
            echo "::error::No release artifacts were found"
            exit 1
          fi
          (cd release-artifacts && sha256sum * > SHA256SUMS.txt)
          ls -la release-artifacts/
          echo "artifact_name=regelsuche-${{ needs.preflight.outputs.release_version }}-artifacts" >> "$GITHUB_OUTPUT"

      - name: Upload release artifacts (workflow run)
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.collect.outputs.artifact_name }}
          path: release-artifacts/**

      - name: Retain release QA evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-qa-evidence
          path: |
            build/logs/**
            build/reports/**
            build/ai-knowledge/**
            build/independent-reproduction/**
            public/**
            **/build/reports/**
            **/build/test-results/**
            **/build/discovery-artifacts/**
          include-hidden-files: true
          if-no-files-found: warn

  release:
    name: Tag & GitHub Release
    needs: [preflight, build]
    if: needs.preflight.outputs.dry_run != 'true'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download release artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: release-artifacts

      - name: Create release metadata commit (workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          VERSION="${{ needs.preflight.outputs.release_version }}"
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          python3 .github/scripts/update-release-metadata.py \
            "${VERSION}" \
            --release \
            --release-date "${{ needs.preflight.outputs.release_date }}"
          git add CITATION.cff CITATION.md .zenodo.json codemeta.json release.properties
          git commit -m "Release version ${VERSION}"

      - name: Verify release tree matches QA
        run: |
          set -euo pipefail
          EXPECTED_TREE="${{ needs.build.outputs.verified_tree }}"
          ACTUAL_TREE=$(git rev-parse 'HEAD^{tree}')
          if [[ "${ACTUAL_TREE}" != "${EXPECTED_TREE}" ]]; then
            echo "::error::Release tree ${ACTUAL_TREE} differs from QA-verified tree ${EXPECTED_TREE}"
            exit 1
          fi
          echo "Release tree matches QA: ${ACTUAL_TREE}"

      - name: Create or reuse git tag (workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          TAG="${{ needs.preflight.outputs.tag_name }}"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
            if [[ "${{ needs.build.outputs.verified_tree }}" != "$(git rev-parse "${TAG}^{tree}")" ]]; then
              echo "::error::Existing tag ${TAG} does not match the QA-verified release tree"
              exit 1
            fi
            git checkout --detach "${TAG}^{commit}"
            echo "Tag ${TAG} already exists and its release commit has been restored"
          else
            git tag -a "${TAG}" -m "Release ${{ needs.preflight.outputs.release_version }}"
            git push origin "${TAG}"
          fi

      - name: Create or advance maintenance branch (workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          BRANCH="${{ needs.preflight.outputs.maintenance_branch }}"
          if git ls-remote --exit-code --heads origin "${BRANCH}" >/dev/null 2>&1; then
            git fetch origin "refs/heads/${BRANCH}:refs/remotes/origin/${BRANCH}"
            if git merge-base --is-ancestor "origin/${BRANCH}" HEAD; then
              git push origin "HEAD:refs/heads/${BRANCH}"
            elif git merge-base --is-ancestor HEAD "origin/${BRANCH}"; then
              echo "Maintenance branch ${BRANCH} already contains the release commit"
            else
              echo "::error::Maintenance branch ${BRANCH} has diverged from the release commit"
              exit 1
            fi
          else
            git push origin "HEAD:refs/heads/${BRANCH}"
          fi

      - name: Create or repair GitHub Release
        run: |
          set -euo pipefail
          TAG="${{ needs.preflight.outputs.tag_name }}"
          VERSION="${{ needs.preflight.outputs.release_version }}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release edit "${TAG}" --title "Regelsuche ${VERSION}"
            gh release upload "${TAG}" release-artifacts/* --clobber
          else
            gh release create "${TAG}" \
              --title "Regelsuche ${VERSION}" \
              --generate-notes \
              release-artifacts/*
          fi

      - name: Prepare next development metadata
        if: github.event_name == 'workflow_dispatch'
        run: |
          python3 .github/scripts/update-release-metadata.py \
            "${{ needs.preflight.outputs.next_development_version }}"

      - name: Open next development metadata PR
        if: github.event_name == 'workflow_dispatch'
        uses: peter-evans/create-pull-request@v8
        with:
          branch: release/prepare-next-${{ needs.preflight.outputs.next_development_version }}
          delete-branch: false
          commit-message: Prepare next development version ${{ needs.preflight.outputs.next_development_version }}
          title: Prepare next development version ${{ needs.preflight.outputs.next_development_version }}
          body: |
            Automated follow-up after release ${{ needs.preflight.outputs.release_version }}.

            Changes:
            - update release.properties
            - update CITATION.cff
            - update CITATION.md
            - update .zenodo.json
            - update codemeta.json
            - remove release-only date metadata from the development snapshot
          add-paths: |
            CITATION.cff
            CITATION.md
            .zenodo.json
            codemeta.json
            release.properties

  dry-run-summary:
    name: Dry-run summary
    needs: [preflight, build]
    if: needs.preflight.outputs.dry_run == 'true'
    runs-on: ubuntu-22.04
    steps:
      - name: Report dry run
        run: |
          {
            echo "## Dry run completed";
            echo "";
            echo "Full checkout-owned QA completed for **${{ github.sha }}**.";
            echo "Would have created tag **${{ needs.preflight.outputs.tag_name }}** and a GitHub Release";
            echo "with artifacts uploaded from job *Full QA, Build & Verify* (artifact name:";
            echo "`${{ needs.build.outputs.artifact_name }}`).";
            echo "Would have opened a follow-up PR for **${{ needs.preflight.outputs.next_development_version }}**.";
          } >> "$GITHUB_STEP_SUMMARY"
