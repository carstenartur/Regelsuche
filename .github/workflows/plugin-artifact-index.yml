name: Plugin Artifact Index

on:
  push:
    branches: [ "main" ]
    paths:
      - 'app/src/main/java/de/regelsuche/plugin/PluginArtifactIndex.java'
      - 'app/src/main/java/de/regelsuche/plugin/PluginArtifactIndexSignature.java'
      - 'app/src/main/java/de/regelsuche/plugin/PluginArtifactIndexVerifier.java'
      - 'app/src/main/java/de/regelsuche/plugin/PluginArtifactResolver.java'
      - 'app/src/main/java/de/regelsuche/plugin/PluginTrustStore.java'
      - 'app/src/test/java/de/regelsuche/plugin/PluginArtifactIndex*.java'
      - 'app/src/test/java/de/regelsuche/plugin/PluginArtifactResolverTest.java'
      - 'docs/plugin-artifact-index.md'
      - 'docs/schemas/regelsuche-plugin-artifact-index-v1.schema.json'
      - 'docs/schemas/regelsuche-plugin-artifact-index-signature-v1.schema.json'
      - 'docs/schemas/regelsuche-plugin-artifact-index-verification-v1.schema.json'
      - 'docs/schemas/regelsuche-plugin-artifact-resolution-v1.schema.json'
      - '.github/workflows/plugin-artifact-index.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'app/src/main/java/de/regelsuche/plugin/PluginArtifactIndex.java'
      - 'app/src/main/java/de/regelsuche/plugin/PluginArtifactIndexSignature.java'
      - 'app/src/main/java/de/regelsuche/plugin/PluginArtifactIndexVerifier.java'
      - 'app/src/main/java/de/regelsuche/plugin/PluginArtifactResolver.java'
      - 'app/src/main/java/de/regelsuche/plugin/PluginTrustStore.java'
      - 'app/src/test/java/de/regelsuche/plugin/PluginArtifactIndex*.java'
      - 'app/src/test/java/de/regelsuche/plugin/PluginArtifactResolverTest.java'
      - 'docs/plugin-artifact-index.md'
      - 'docs/schemas/regelsuche-plugin-artifact-index-v1.schema.json'
      - 'docs/schemas/regelsuche-plugin-artifact-index-signature-v1.schema.json'
      - 'docs/schemas/regelsuche-plugin-artifact-index-verification-v1.schema.json'
      - 'docs/schemas/regelsuche-plugin-artifact-resolution-v1.schema.json'
      - '.github/workflows/plugin-artifact-index.yml'
  workflow_dispatch:

concurrency:
  group: plugin-artifact-index-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0

      - name: Verify immutable signed index and deterministic resolution contracts
        shell: bash
        run: |
          mkdir -p app/build/reports/plugin-artifact-index
          set -o pipefail
          ./gradlew :app:test \
            --tests 'de.regelsuche.plugin.PluginArtifactIndex*' \
            --tests de.regelsuche.plugin.PluginArtifactResolverTest \
            --rerun-tasks \
            --stacktrace \
            --console=plain 2>&1 \
            | tee app/build/reports/plugin-artifact-index/targeted-test.log

      - name: Require retained canonical evidence
        run: |
          for name in \
            index \
            index-signature \
            index-verification \
            index-trust-store \
            resolved \
            unresolved; do
            test -s "app/build/reports/plugin-artifact-index/${name}.json"
          done

      - name: Require byte-identical repeated evidence
        shell: bash
        run: |
          mkdir -p /tmp/plugin-artifact-index-first
          cp app/build/reports/plugin-artifact-index/*.json \
            /tmp/plugin-artifact-index-first/
          ./gradlew :app:test \
            --tests de.regelsuche.plugin.PluginArtifactIndexEvidenceTest \
            --tests de.regelsuche.plugin.PluginArtifactIndexSignatureTest \
            --rerun-tasks
          for name in \
            index \
            index-signature \
            index-verification \
            index-trust-store \
            resolved \
            unresolved; do
            cmp "/tmp/plugin-artifact-index-first/${name}.json" \
              "app/build/reports/plugin-artifact-index/${name}.json"
          done

      - name: Validate schemas, signatures, immutable identities and side-effect boundary
        shell: bash
        run: |
          python3 -m pip install \
            --disable-pip-version-check \
            --quiet \
            jsonschema==4.25.1
          python3 - <<'PY'
          from copy import deepcopy
          import base64
          import hashlib
          import json
          from pathlib import Path
          import struct
          import subprocess
          import tempfile
          from urllib.parse import urlsplit
          from jsonschema import FormatChecker, ValidationError
          from jsonschema.validators import validator_for

          def compact(value):
              return json.dumps(
                  value,
                  ensure_ascii=False,
                  separators=(',', ':'),
              ).encode('utf-8')

          def sha256(value):
              return 'sha256:' + hashlib.sha256(value).hexdigest()

          def field(name, value):
              name_bytes = name.encode('utf-8')
              value_bytes = value.encode('utf-8')
              return (
                  struct.pack('>I', len(name_bytes)) + name_bytes
                  + struct.pack('>I', len(value_bytes)) + value_bytes
              )

          def require_rejection(validator, value, label):
              try:
                  validator.validate(value)
              except ValidationError:
                  return
              raise AssertionError(f'{label} unexpectedly passed schema validation')

          def require_distribution_uri(value):
              parsed = urlsplit(value)
              assert parsed.fragment == ''
              assert parsed.username is None
              assert parsed.password is None
              scheme = parsed.scheme.lower()
              if scheme == 'https':
                  assert parsed.hostname
              elif scheme == 'file':
                  assert parsed.netloc == ''
                  assert parsed.path.startswith('/')
              else:
                  raise AssertionError(f'unsupported distribution URI scheme: {scheme}')

          schema_paths = {
              'index': Path(
                  'docs/schemas/regelsuche-plugin-artifact-index-v1.schema.json'),
              'signature': Path(
                  'docs/schemas/regelsuche-plugin-artifact-index-signature-v1.schema.json'),
              'verification': Path(
                  'docs/schemas/regelsuche-plugin-artifact-index-verification-v1.schema.json'),
              'resolution': Path(
                  'docs/schemas/regelsuche-plugin-artifact-resolution-v1.schema.json'),
          }
          validators = {}
          for name, path in schema_paths.items():
              schema = json.loads(path.read_text(encoding='utf-8'))
              validator_for(schema).check_schema(schema)
              assert schema.get('additionalProperties') is False
              validators[name] = validator_for(schema)(
                  schema,
                  format_checker=FormatChecker(),
              )

          report_dir = Path('app/build/reports/plugin-artifact-index')
          index_path = report_dir / 'index.json'
          signature_path = report_dir / 'index-signature.json'
          verification_path = report_dir / 'index-verification.json'
          trust_store_path = report_dir / 'index-trust-store.json'
          index = json.loads(index_path.read_text(encoding='utf-8'))
          signature = json.loads(signature_path.read_text(encoding='utf-8'))
          verification = json.loads(verification_path.read_text(encoding='utf-8'))
          trust_store = json.loads(trust_store_path.read_text(encoding='utf-8'))
          resolved = json.loads((report_dir / 'resolved.json').read_text(encoding='utf-8'))
          unresolved = json.loads((report_dir / 'unresolved.json').read_text(encoding='utf-8'))
          validators['index'].validate(index)
          validators['signature'].validate(signature)
          validators['verification'].validate(verification)
          validators['resolution'].validate(resolved)
          validators['resolution'].validate(unresolved)

          inconsistent_verification = deepcopy(verification)
          inconsistent_verification['trusted'] = False
          require_rejection(
              validators['verification'],
              inconsistent_verification,
              'verified status without trusted flag',
          )

          missing_dependencies = deepcopy(index)
          del missing_dependencies['entries'][0]['dependencies']
          require_rejection(
              validators['index'],
              missing_dependencies,
              'entry without dependencies',
          )

          remote_file_uri = deepcopy(index)
          remote_file_uri['entries'][0]['artifactUri'] = (
              'file://remote.example.test/artifacts/not-local.jar'
          )
          require_rejection(
              validators['index'],
              remote_file_uri,
              'remote-host file URI',
          )

          leading_zero_prerelease = deepcopy(index)
          leading_zero_prerelease['entries'][0]['version'] = '1.0.0-alpha.01'
          require_rejection(
              validators['index'],
              leading_zero_prerelease,
              'numeric prerelease with leading zero',
          )

          unsigned_java_plan = deepcopy(resolved)
          java_step = next(
              item for item in unsigned_java_plan['plan']
              if item['kind'] == 'JAVA_PLUGIN'
          )
          java_step['signatureManifestUri'] = ''
          require_rejection(
              validators['resolution'],
              unsigned_java_plan,
              'Java plan step without signature manifest',
          )

          artifact_ids = set()
          coordinates = set()
          artifact_hashes = set()
          for entry in index['entries']:
              identity_payload = {k: v for k, v in entry.items() if k != 'identityHash'}
              assert entry['identityHash'] == sha256(compact(identity_payload))
              assert entry['artifactId'] not in artifact_ids
              artifact_ids.add(entry['artifactId'])
              coordinate = (entry['kind'], entry['componentId'], entry['version'])
              assert coordinate not in coordinates
              coordinates.add(coordinate)
              assert entry['artifactSha256'] not in artifact_hashes
              artifact_hashes.add(entry['artifactSha256'])
              require_distribution_uri(entry['artifactUri'])
              require_distribution_uri(entry['provenanceUri'])
              if entry['kind'] == 'JAVA_PLUGIN':
                  require_distribution_uri(entry['signatureManifestUri'])

          index_payload = {k: v for k, v in index.items() if k != 'contentHash'}
          assert index['contentHash'] == sha256(compact(index_payload) + b'\n')

          assert signature['indexId'] == index['indexId']
          assert signature['revision'] == index['revision']
          assert signature['indexContentHash'] == index['contentHash']
          assert signature['curatorId'] == index['curatorId']
          assert signature['algorithm'] == 'Ed25519'
          matching_keys = [
              key for key in trust_store['keys']
              if key['publisherId'] == signature['curatorId']
              and key['keyId'] == signature['keyId']
          ]
          assert len(matching_keys) == 1
          key = matching_keys[0]
          assert key['algorithm'] == signature['algorithm']
          assert key['status'] in {'ACTIVE', 'RETIRED'}

          signed_payload = b''.join([
              field('schema', signature['schema']),
              field('indexId', signature['indexId']),
              field('revision', signature['revision']),
              field('indexContentHash', signature['indexContentHash']),
              field('curatorId', signature['curatorId']),
              field('keyId', signature['keyId']),
              field('algorithm', signature['algorithm']),
          ])
          signature_bytes = base64.b64decode(
              signature['signatureBase64'], validate=True)
          assert len(signature_bytes) == 64
          with tempfile.TemporaryDirectory() as temporary:
              temporary = Path(temporary)
              key_path = temporary / 'curator-key.der'
              payload_path = temporary / 'payload.bin'
              signature_bytes_path = temporary / 'signature.bin'
              key_path.write_bytes(base64.b64decode(
                  key['publicKeyBase64'], validate=True))
              payload_path.write_bytes(signed_payload)
              signature_bytes_path.write_bytes(signature_bytes)
              subprocess.run([
                  'openssl', 'pkeyutl',
                  '-verify',
                  '-pubin',
                  '-inkey', str(key_path),
                  '-keyform', 'DER',
                  '-rawin',
                  '-in', str(payload_path),
                  '-sigfile', str(signature_bytes_path),
              ], check=True, capture_output=True)

          assert verification['indexId'] == index['indexId']
          assert verification['revision'] == index['revision']
          assert verification['indexContentHash'] == index['contentHash']
          assert verification['signatureContentHash'] == sha256(
              signature_path.read_bytes())
          assert verification['trustStoreContentHash'] == sha256(
              trust_store_path.read_bytes())
          assert verification['status'] == 'VERIFIED_TRUSTED'
          assert verification['signatureVerified'] is True
          assert verification['trusted'] is True
          assert verification['curatorId'] == signature['curatorId']
          assert verification['keyId'] == signature['keyId']
          verification_material = b''.join([
              field('schema', verification['schema']),
              field('indexId', verification['indexId']),
              field('revision', verification['revision']),
              field('indexContentHash', verification['indexContentHash']),
              field('signatureContentHash', verification['signatureContentHash']),
              field('trustStoreContentHash', verification['trustStoreContentHash']),
              field('status', verification['status']),
              field('signatureVerified', str(verification['signatureVerified']).lower()),
              field('trusted', str(verification['trusted']).lower()),
              field('curatorId', verification['curatorId']),
              field('keyId', verification['keyId']),
              struct.pack('>I', len(verification['warnings'])),
              *[field('warning', warning) for warning in verification['warnings']],
          ])
          assert verification['contentHash'] == sha256(verification_material)

          for receipt in (resolved, unresolved):
              request = receipt['request']
              request_payload = {k: v for k, v in request.items() if k != 'contentHash'}
              assert request['contentHash'] == sha256(compact(request_payload))
              receipt_payload = {k: v for k, v in receipt.items() if k != 'contentHash'}
              assert receipt['contentHash'] == sha256(compact(receipt_payload))
              assert receipt['indexContentHash'] == index['contentHash']
              assert receipt['networkAccessStatus'] == 'NOT_PERFORMED'
              assert receipt['installationStatus'] == 'NOT_PERFORMED'
              assert receipt['trustVerificationStatus'] == 'NOT_EVALUATED'
              for step in receipt['plan']:
                  require_distribution_uri(step['artifactUri'])
                  require_distribution_uri(step['provenanceUri'])
                  if step['kind'] == 'JAVA_PLUGIN':
                      require_distribution_uri(step['signatureManifestUri'])

          assert resolved['status'] == 'RESOLVED'
          assert resolved['blockers'] == []
          assert resolved['plan']
          assert [item['order'] for item in resolved['plan']] == list(
              range(1, len(resolved['plan']) + 1))
          assert resolved['plan'][-1]['identityHash'] == \
              resolved['rootArtifactIdentityHash']
          assert len({
              (item['kind'], item['componentId']) for item in resolved['plan']
          }) == len(resolved['plan'])

          assert unresolved['status'] == 'UNRESOLVED'
          assert unresolved['rootArtifactIdentityHash'] == ''
          assert unresolved['plan'] == []
          assert unresolved['blockers']
          PY

      - name: Upload index evidence and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: plugin-artifact-index-evidence
          path: |
            app/build/reports/plugin-artifact-index/**
            app/build/reports/tests/**
            app/build/test-results/**
            docs/schemas/regelsuche-plugin-artifact-index-v1.schema.json
            docs/schemas/regelsuche-plugin-artifact-index-signature-v1.schema.json
            docs/schemas/regelsuche-plugin-artifact-index-verification-v1.schema.json
            docs/schemas/regelsuche-plugin-artifact-resolution-v1.schema.json
          if-no-files-found: warn
