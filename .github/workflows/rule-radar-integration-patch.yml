name: Apply AST rule radar integration

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: read

jobs:
  patch:
    if: >-
      github.event.issue.pull_request &&
      github.event.issue.number == 468 &&
      github.event.comment.body == '/apply-rule-radar-integration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-467-ast-rule-radar
          fetch-depth: 0
      - name: Apply strict integration anchors
        run: python3 tools/apply-rule-radar-integration.py
      - name: Commit direct source integration
        run: |
          if git diff --quiet; then
            echo "No integration changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/de/regelsuche/web/WebWorkbenchServer.java \
                  app/src/main/resources/web/index.html \
                  docs/ast-rule-radar.md
          git commit -m "Integrate AST rule radar into workbench"
          git push origin HEAD:issue-467-ast-rule-radar
