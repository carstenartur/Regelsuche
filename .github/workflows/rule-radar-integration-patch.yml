name: Apply rule radar integration patch

on:
  push:
    branches:
      - issue-467-ast-rule-radar
    paths:
      - tools/apply-rule-radar-integration.py
      - .github/workflows/rule-radar-integration-patch.yml
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - tools/apply-rule-radar-integration.py
      - .github/workflows/rule-radar-integration-patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[radar-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-467-ast-rule-radar
          fetch-depth: 0
      - name: Apply strict integration anchors
        run: python3 tools/apply-rule-radar-integration.py
      - name: Commit integration edits
        run: |
          if git diff --quiet; then
            echo "No integration changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/de/regelsuche/web/WebWorkbenchServer.java \
                  app/src/main/resources/web/index.html \
                  docs/ast-rule-radar.md
          git commit -m "Integrate AST rule radar into workbench [radar-patch]"
          git push origin HEAD:issue-467-ast-rule-radar
