name: Apply and verify AST rule radar integration

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/rule-radar-integration-patch.yml
  schedule:
    - cron: '*/5 * * * *'
  issue_comment:
    types: [created]

concurrency:
  group: ast-rule-radar-integration
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: read

jobs:
  patch-and-verify:
    # Retry marker: feature-branch workflow removed before this verification.
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      (github.event.issue.pull_request &&
       github.event.issue.number == 468 &&
       github.event.comment.body == '/apply-rule-radar-integration')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-467-ast-rule-radar
          fetch-depth: 0
      - name: Detect completed verification
        id: completed
        shell: bash
        run: |
          if grep -qx 'SUCCESS' docs/generated/rule-radar-ci-status.txt 2>/dev/null; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
          else
            echo 'skip=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Apply strict integration anchors
        if: steps.completed.outputs.skip != 'true'
        run: python3 tools/apply-rule-radar-integration.py
      - name: Commit direct source integration before verification
        if: steps.completed.outputs.skip != 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/de/regelsuche/web/WebWorkbenchServer.java \
                  app/src/main/java/de/regelsuche/radar/AstRuleRadarService.java \
                  app/src/main/resources/web/index.html \
                  app/src/main/resources/web/rule-radar.js \
                  docs/README.md \
                  docs/ast-rule-radar.md
          if git diff --cached --quiet; then
            echo "Direct integration is already committed."
          else
            git commit -m "Integrate AST rule radar into workbench"
            git push origin HEAD:issue-467-ast-rule-radar
          fi
      - uses: actions/setup-java@v5
        if: steps.completed.outputs.skip != 'true'
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6.1.0
        if: steps.completed.outputs.skip != 'true'
      - name: Install external verification tools
        if: steps.completed.outputs.skip != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-venv z3
      - name: Run complete repository verification lifecycle
        if: steps.completed.outputs.skip != 'true'
        id: verification
        shell: bash
        run: |
          set +e
          set -o pipefail
          mkdir -p build/logs docs/generated
          env -u GITHUB_SHA ./gradlew \
            :app:installPlaywrightHostDependencies \
            :app:installPlaywrightBrowsers \
            fullCheck \
            jacocoTestReport \
            :app:benchmarkReport \
            generateCiPages \
            --console=plain \
            --stacktrace \
            2>&1 | tee build/logs/rule-radar-full-check.log
          status=${PIPESTATUS[0]}
          if [ "$status" -eq 0 ]; then
            printf 'SUCCESS\n' > docs/generated/rule-radar-ci-status.txt
          else
            {
              printf 'FAILURE exit=%s\n\n' "$status"
              tail -n 700 build/logs/rule-radar-full-check.log
            } > docs/generated/rule-radar-ci-status.txt
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Commit verification status
        if: steps.completed.outputs.skip != 'true'
        shell: bash
        run: |
          git add docs/generated/rule-radar-ci-status.txt
          if git diff --cached --quiet; then
            echo "No verification status change required."
          else
            git commit -m "Record AST rule radar verification status"
            git push origin HEAD:issue-467-ast-rule-radar
          fi
      - name: Fail verification when fullCheck failed
        if: steps.completed.outputs.skip != 'true' && steps.verification.outputs.status != '0'
        run: exit 1
