name: Verify AST rule radar integration once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/rule-radar-integration-patch.yml
  schedule:
    - cron: '*/5 * * * *'

concurrency:
  group: ast-rule-radar-sequence-head-v4
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  verify-fixed-head:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-467-ast-rule-radar
          fetch-depth: 0
      - name: Detect completed verification
        id: completed
        shell: bash
        run: |
          if grep -qx 'SUCCESS' docs/generated/rule-radar-ci-status.txt 2>/dev/null \
             && test -s docs/assets/screenshots/ast-rule-radar.png; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
          else
            echo 'skip=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Apply strict integration and review fixes
        if: steps.completed.outputs.skip != 'true'
        run: |
          python3 tools/apply-rule-radar-integration.py
          python3 tools/apply-rule-radar-review-fixes.py
      - name: Persist direct source fixes before verification
        if: steps.completed.outputs.skip != 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/de/regelsuche/web/WebWorkbenchServer.java \
                  app/src/main/java/de/regelsuche/radar/AstRuleRadarService.java \
                  app/src/main/resources/web/index.html \
                  app/src/main/resources/web/rule-radar.js \
                  app/src/main/resources/web/rule-radar.css \
                  docs/README.md \
                  docs/ast-rule-radar.md
          if ! git diff --cached --quiet; then
            git commit -m "Apply AST rule radar request-sequencing fix"
            git push origin HEAD:issue-467-ast-rule-radar
          fi
      - uses: actions/setup-java@v5
        if: steps.completed.outputs.skip != 'true'
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6.1.0
        if: steps.completed.outputs.skip != 'true'
      - name: Install external verification tools
        if: steps.completed.outputs.skip != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-venv z3
      - name: Run radar preflight, full lifecycle and browser evidence capture
        if: steps.completed.outputs.skip != 'true'
        id: verification
        shell: bash
        run: |
          set +e
          set -o pipefail
          mkdir -p build/logs docs/generated docs/assets/screenshots
          verified_head="$(git rev-parse HEAD)"
          phase="radar-unit-api-preflight"

          env -u GITHUB_SHA ./gradlew \
            :app:installPlaywrightHostDependencies \
            :app:installPlaywrightBrowsers \
            :app:test \
            --tests 'de.regelsuche.radar.*' \
            --tests 'de.regelsuche.web.RuleRadarApiTest' \
            --console=plain \
            --stacktrace \
            2>&1 | tee build/logs/rule-radar-unit-api-preflight.log
          status=${PIPESTATUS[0]}

          if [ "$status" -eq 0 ]; then
            phase="radar-browser-preflight"
            env -u GITHUB_SHA ./gradlew \
              :app:e2eTest \
              --tests 'de.regelsuche.e2e.RuleRadarBrowserFlowTest' \
              --tests 'de.regelsuche.e2e.RuleAuthoringBrowserFlowTest' \
              -Pregelsuche.skipPlaywrightInstall=true \
              --console=plain \
              --stacktrace \
              2>&1 | tee build/logs/rule-radar-browser-preflight.log
            status=${PIPESTATUS[0]}
          fi

          if [ "$status" -eq 0 ]; then
            phase="full-repository-lifecycle"
            env -u GITHUB_SHA ./gradlew \
              fullCheck \
              jacocoTestReport \
              :app:benchmarkReport \
              generateCiPages \
              -Pregelsuche.skipPlaywrightInstall=true \
              --console=plain \
              --stacktrace \
              2>&1 | tee build/logs/rule-radar-full-check.log
            status=${PIPESTATUS[0]}
          fi

          if [ "$status" -eq 0 ]; then
            phase="documentation-browser-evidence"
            env -u GITHUB_SHA ./gradlew \
              :app:e2eTest \
              --tests 'de.regelsuche.e2e.RuleRadarBrowserFlowTest' \
              -Pregelsuche.recordDocs=true \
              -Pregelsuche.skipPlaywrightInstall=true \
              --console=plain \
              --stacktrace \
              2>&1 | tee build/logs/rule-radar-docs-e2e.log
            status=${PIPESTATUS[0]}
          fi

          python3 - <<'PY' > build/logs/rule-radar-failed-tests.txt
          from pathlib import Path
          import xml.etree.ElementTree as ET

          failures = 0
          for xml_path in sorted(Path('.').glob('**/build/test-results/*/TEST-*.xml')):
              try:
                  root = ET.parse(xml_path).getroot()
              except Exception as exc:
                  print(f"### Could not parse {xml_path}: {exc}")
                  continue
              file_failures = []
              for case in root.iter('testcase'):
                  nodes = list(case.findall('failure')) + list(case.findall('error'))
                  for node in nodes:
                      failures += 1
                      file_failures.append((case, node))
              if not file_failures:
                  continue
              print(f"### {xml_path}")
              for case, node in file_failures:
                  classname = case.attrib.get('classname', '<unknown class>')
                  name = case.attrib.get('name', '<unknown test>')
                  message = node.attrib.get('message', '').strip()
                  details = (node.text or '').strip()
                  print(f"- {classname} :: {name}")
                  if message:
                      print(f"  message: {message}")
                  if details:
                      print('  details:')
                      for line in details[-6000:].splitlines():
                          print(f"    {line}")
              stderr = root.find('system-err')
              if stderr is not None and (stderr.text or '').strip():
                  print('  suite stderr tail:')
                  for line in (stderr.text or '').strip()[-4000:].splitlines():
                      print(f"    {line}")
          if failures == 0:
              print('No failed JUnit XML test cases were found.')
          else:
              print(f"TOTAL_FAILED_TEST_CASES={failures}")
          PY

          if [ "$status" -eq 0 ] && test -s docs/assets/screenshots/ast-rule-radar.png; then
            {
              printf 'SUCCESS\n'
              printf 'verifiedHead=%s\n' "$verified_head"
            } > docs/generated/rule-radar-ci-status.txt
          else
            {
              printf 'FAILURE exit=%s\n' "$status"
              printf 'phase=%s\n' "$phase"
              printf 'verifiedHead=%s\n\n' "$verified_head"
              printf '%s\n' '--- exact failed test cases ---'
              cat build/logs/rule-radar-failed-tests.txt
              printf '%s\n' '--- radar unit/API preflight tail ---'
              tail -n 180 build/logs/rule-radar-unit-api-preflight.log 2>/dev/null || true
              printf '%s\n' '--- radar browser preflight tail ---'
              tail -n 180 build/logs/rule-radar-browser-preflight.log 2>/dev/null || true
              printf '%s\n' '--- fullCheck tail ---'
              tail -n 220 build/logs/rule-radar-full-check.log 2>/dev/null || true
              printf '%s\n' '--- focused documentation e2e tail ---'
              tail -n 160 build/logs/rule-radar-docs-e2e.log 2>/dev/null || true
            } > docs/generated/rule-radar-ci-status.txt
            status=1
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Commit verification evidence
        if: steps.completed.outputs.skip != 'true'
        shell: bash
        run: |
          git add docs/generated/rule-radar-ci-status.txt
          if test -s docs/assets/screenshots/ast-rule-radar.png; then
            git add docs/assets/screenshots/ast-rule-radar.png
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Record AST rule radar verification evidence"
            git push origin HEAD:issue-467-ast-rule-radar
          fi
      - name: Fail when verification failed
        if: steps.completed.outputs.skip != 'true' && steps.verification.outputs.status != '0'
        run: exit 1
