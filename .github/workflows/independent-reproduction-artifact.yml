name: Independent Reproduction Artifact

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
    paths:
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "settings.gradle"
      - "build.gradle"
      - "gradle.properties"
      - "scripts/build-independent-reproduction-artifact.py"
      - "scripts/verify-independent-reproduction.py"
      - "scripts/verify-independent-reproduction-lifecycle.py"
      - "reproduction/**"
      - "regelsuche-*/src/**"
      - "regelsuche-*/build.gradle"
      - ".github/workflows/independent-reproduction-artifact.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "settings.gradle"
      - "build.gradle"
      - "gradle.properties"
      - "scripts/build-independent-reproduction-artifact.py"
      - "scripts/verify-independent-reproduction.py"
      - "scripts/verify-independent-reproduction-lifecycle.py"
      - "reproduction/**"
      - "regelsuche-*/src/**"
      - "regelsuche-*/build.gradle"
      - ".github/workflows/independent-reproduction-artifact.yml"
  workflow_dispatch:

concurrency:
  group: independent-reproduction-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SOURCE_REVISION: ${{ github.sha }}
  RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('development-{0}', github.sha) }}
  RELEASE_TAG_STATUS: ${{ startsWith(github.ref, 'refs/tags/v') && 'TAGGED_RELEASE' || 'DEVELOPMENT_REVISION' }}

jobs:
  artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6.1.0
      - name: Verify and execute the checkout-owned reproduction contract
        run: >-
          ./gradlew
          verifyIndependentReproductionArtifact
          independentReproductionContainerTest
          -PindependentReproductionSourceRevision=${SOURCE_REVISION}
          -PindependentReproductionReleaseTag=${RELEASE_TAG}
          -PindependentReproductionReleaseTagStatus=${RELEASE_TAG_STATUS}
          -PindependentReproductionArchitecture=linux/amd64
          --console=plain
      - name: Upload reproduction artifact, receipts and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: regelsuche-independent-reproduction-${{ github.sha }}
          path: build/independent-reproduction/**
          if-no-files-found: error
