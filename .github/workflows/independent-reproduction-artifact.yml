name: Apply Independent Reproduction Script Fixes

on:
  push:
    branches: [ "issue-387-reproduction-artifact" ]
    paths:
      - '.github/workflows/independent-reproduction-artifact.yml'
      - '.github/issue-398-review-fixes/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - '.github/workflows/independent-reproduction-artifact.yml'
      - '.github/issue-398-review-fixes/**'
  workflow_dispatch:

concurrency:
  group: apply-independent-reproduction-review-${{ github.repository }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: issue-387-reproduction-artifact
          fetch-depth: 0

      - name: Apply and validate script fixes
        shell: bash
        run: |
          set -euo pipefail
          PATCH=.github/issue-398-review-fixes/review.patch
          test -f "$PATCH"
          git apply --check \
            --include='scripts/build-independent-reproduction-artifact.py' \
            --include='scripts/verify-independent-reproduction.py' \
            "$PATCH"
          git apply \
            --include='scripts/build-independent-reproduction-artifact.py' \
            --include='scripts/verify-independent-reproduction.py' \
            "$PATCH"
          rm -rf .github/issue-398-review-fixes

          python3 - <<'PY'
          from pathlib import Path
          for name in (
              'scripts/build-independent-reproduction-artifact.py',
              'scripts/verify-independent-reproduction.py',
          ):
              compile(Path(name).read_text(encoding='utf-8'), name, 'exec')
          PY
          grep -q 'repository checkout does not match' \
            scripts/build-independent-reproduction-artifact.py
          grep -q 'expected_directories' \
            scripts/verify-independent-reproduction.py
          git diff --check

      - name: Commit permanent script fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add scripts .github/issue-398-review-fixes
          test -n "$(git diff --cached --name-only)"
          git commit --no-verify -m 'Address independent reproduction script review findings'
          git push origin HEAD:refs/heads/issue-387-reproduction-artifact
