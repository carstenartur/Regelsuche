name: Apply Independent Reproduction Review Fixes

on:
  push:
    branches: [ "issue-387-reproduction-artifact" ]
    paths:
      - '.github/workflows/independent-reproduction-artifact.yml'
      - '.github/issue-398-review-fixes/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - '.github/workflows/independent-reproduction-artifact.yml'
      - '.github/issue-398-review-fixes/**'
  workflow_dispatch:

concurrency:
  group: apply-independent-reproduction-review-${{ github.repository }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: issue-387-reproduction-artifact
          fetch-depth: 0

      - name: Apply and validate review fixes
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/issue-398-review-fixes/review.patch

          # The patch targets the permanent workflow, not this temporary carrier.
          git show HEAD^:.github/workflows/independent-reproduction-artifact.yml \
            > .github/workflows/independent-reproduction-artifact.yml
          git apply --check .github/issue-398-review-fixes/review.patch
          git apply .github/issue-398-review-fixes/review.patch
          rm -rf .github/issue-398-review-fixes

          bash -n reproduction/reproduce.sh
          python3 - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          for name in (
              'scripts/build-independent-reproduction-artifact.py',
              'scripts/verify-independent-reproduction.py',
          ):
              compile(Path(name).read_text(encoding='utf-8'), name, 'exec')
          schema = json.loads(Path(
              'docs/schemas/regelsuche-independent-reproduction-artifact-v1.schema.json'
          ).read_text(encoding='utf-8'))
          Draft202012Validator.check_schema(schema)
          assert schema['properties']['declaredEnvironment']['properties'][
              'launcherRequirements'
          ]['properties']['jsonschema']['const'] == '4.25.1'
          PY

          grep -q 'repository checkout does not match' \
            scripts/build-independent-reproduction-artifact.py
          grep -q 'expected_directories' \
            scripts/verify-independent-reproduction.py
          grep -q 'unexpected-empty-directory' \
            .github/workflows/independent-reproduction-artifact.yml

      - name: Commit permanent review fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Address independent reproduction review findings'
          git push origin HEAD:issue-387-reproduction-artifact
