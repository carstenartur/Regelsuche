name: PR 701 one-shot semantic hardening

on:
  push:
    branches:
      - agent/target-free-post-freeze-qualification
    paths:
      - .github/workflows/pr701-semantic-hardening.yml

permissions:
  contents: write

jobs:
  harden:
    if: github.event.head_commit.message == 'Arm one-shot qualification hardening'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/target-free-post-freeze-qualification
          fetch-depth: 0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
      - name: Harden semantics, verify, and publish
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('regelsuche-discovery/src/main/java/de/regelsuche/discovery/representation/TargetFreeRepresentationPostFreezeQualification.java')
          text = path.read_text(encoding='utf-8')
          original = text

          def method(source, name):
              match = re.search(r'(?m)^\s*private\s+static\s+[^\n]+\b' + re.escape(name) + r'\s*\(', source)
              if not match:
                  raise SystemExit(f'method not found: {name}')
              start = match.start()
              brace = source.find('{', match.end())
              depth = 0
              in_string = False
              escaped = False
              in_char = False
              for index in range(brace, len(source)):
                  char = source[index]
                  if in_string:
                      if escaped:
                          escaped = False
                      elif char == '\\':
                          escaped = True
                      elif char == '"':
                          in_string = False
                      continue
                  if in_char:
                      if escaped:
                          escaped = False
                      elif char == '\\':
                          escaped = True
                      elif char == "'":
                          in_char = False
                      continue
                  if char == '"':
                      in_string = True
                  elif char == "'":
                      in_char = True
                  elif char == '{':
                      depth += 1
                  elif char == '}':
                      depth -= 1
                      if depth == 0:
                          return start, brace, index + 1, source[start:brace], source[brace:index + 1]
              raise SystemExit(f'unclosed method: {name}')

          token = method(text, 'tokenSavings')
          if '.length()' in token[4]:
              if 'sourceExpression' not in token[3] or 'candidateExpression' not in token[3]:
                  raise SystemExit('unexpected tokenSavings signature')
              replacement = '''{
                  SemanticDescriptionMeasurer measurer =
                      new SemanticDescriptionMeasurer();
                  de.regelsuche.parse.ExpressionParser parser =
                      new de.regelsuche.parse.ExpressionParser();
                  return measurer.measure(parser.parseTerm(sourceExpression))
                      .tokenCount()
                      - measurer.measure(parser.parseTerm(candidateExpression))
                          .tokenCount();
              }'''
              text = text[:token[1]] + replacement + text[token[2]:]

          capability = method(text, 'executableCapabilities')
          if '.transform(' not in capability[4] or 'candidateExpression' not in capability[3]:
              signature = capability[3]
              open_parenthesis = signature.find('(')
              close_parenthesis = signature.rfind(')')
              parameters = signature[open_parenthesis + 1:close_parenthesis]
              selection = re.search(r'KnowledgePackSelection\s+(\w+)', parameters)
              lists = re.findall(r'List<String>\s+(\w+)', parameters)
              if not selection or not lists:
                  raise SystemExit('unexpected executableCapabilities signature')
              selection_name = selection.group(1)
              required_name = next((value for value in lists if 'capabil' in value.lower() or 'required' in value.lower()), lists[-1])
              string_parameters = re.findall(r'(?<!List<)String\s+(\w+)', parameters)
              expression_name = next((value for value in string_parameters if 'expression' in value.lower()), None)
              new_signature = signature
              if expression_name is None:
                  expression_name = 'candidateExpression'
                  amended = parameters.rstrip()
                  if amended.strip():
                      amended += ',\n        '
                  amended += 'String candidateExpression\n    '
                  new_signature = signature[:open_parenthesis + 1] + amended + signature[close_parenthesis:]

                  def patch_calls(segment):
                      output = []
                      position = 0
                      marker = 'executableCapabilities('
                      while True:
                          found = segment.find(marker, position)
                          if found < 0:
                              output.append(segment[position:])
                              return ''.join(output)
                          output.append(segment[position:found])
                          line_start = segment.rfind('\n', 0, found) + 1
                          if 'private static' in segment[line_start:found]:
                              output.append(marker)
                              position = found + len(marker)
                              continue
                          cursor = found + len(marker)
                          depth = 1
                          quoted = False
                          escaped = False
                          while cursor < len(segment) and depth:
                              char = segment[cursor]
                              if quoted:
                                  if escaped:
                                      escaped = False
                                  elif char == '\\':
                                      escaped = True
                                  elif char == '"':
                                      quoted = False
                              else:
                                  if char == '"':
                                      quoted = True
                                  elif char == '(':
                                      depth += 1
                                  elif char == ')':
                                      depth -= 1
                              cursor += 1
                          if depth:
                              raise SystemExit('unclosed executableCapabilities call')
                          inner = segment[found + len(marker):cursor - 1]
                          if 'candidate.expression()' not in inner and 'candidateExpression' not in inner:
                              inner = inner.rstrip() + ',\n            candidate.expression()'
                          output.append(marker + inner + ')')
                          position = cursor

                  before = patch_calls(text[:capability[0]])
                  after = patch_calls(text[capability[2]:])
              else:
                  before = text[:capability[0]]
                  after = text[capability[2]:]

              body = '''{
                  de.regelsuche.transform.AstRewriteTransformationEngine engine =
                      de.regelsuche.transform.AstRewriteTransformationEngine
                          .withKnowledgePacks(%s);
                  List<de.regelsuche.transform.Transformation> successors =
                      engine.transform(%s);
                  return %s.stream()
                      .filter(capabilityId -> {
                          String ruleId = capabilityId.startsWith("rule:")
                              ? capabilityId.substring("rule:".length())
                              : capabilityId;
                          return successors.stream().anyMatch(transformation ->
                              transformation.rule().equals(ruleId));
                      })
                      .sorted()
                      .toList();
              }''' % (selection_name, expression_name, required_name)
              text = before + new_signature + body + after

          token = method(text, 'tokenSavings')
          capability = method(text, 'executableCapabilities')
          if '.length()' in token[4]:
              raise SystemExit('character length still used as token savings')
          if '.transform(' not in capability[4] or 'candidateExpression' not in capability[3]:
              raise SystemExit('capability execution is not candidate-local')
          if text == original:
              raise SystemExit('hardening produced no source change')
          path.write_text(text, encoding='utf-8')
          PY

          git diff --check
          ./gradlew --no-daemon --no-configuration-cache \
            :regelsuche-discovery:test \
            --tests '*TargetFreeRepresentationPostFreezeQualificationTest' \
            --stacktrace --console=plain
          ./gradlew --no-daemon --no-configuration-cache \
            :regelsuche-discovery:check \
            --stacktrace --console=plain

          rm .github/workflows/pr701-semantic-hardening.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          test "$(git diff --cached --name-only | sort)" = $'.github/workflows/pr701-semantic-hardening.yml\nregelsuche-discovery/src/main/java/de/regelsuche/discovery/representation/TargetFreeRepresentationPostFreezeQualification.java'
          git commit -m 'Require semantic savings and executable capabilities'
          git push origin HEAD:agent/target-free-post-freeze-qualification