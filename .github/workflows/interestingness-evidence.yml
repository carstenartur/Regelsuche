name: Interestingness Evidence

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: interestingness-evidence-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evidence:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0

      - name: Generate deterministic assessment and calibration evidence
        run: |
          ./gradlew :regelsuche-learning:test \
            --tests de.regelsuche.mining.InterestingnessAssessmentEvidenceTest \
            --tests de.regelsuche.mining.InterestingnessCalibrationEvidenceTest

      - name: Require evidence artifacts
        run: |
          test -s regelsuche-learning/build/reports/interestingness-assessment/report.json
          test -s regelsuche-learning/build/reports/interestingness-calibration/report.json

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: interestingness-evidence
          path: |
            regelsuche-learning/build/reports/interestingness-assessment/report.json
            regelsuche-learning/build/reports/interestingness-calibration/report.json
          if-no-files-found: warn
