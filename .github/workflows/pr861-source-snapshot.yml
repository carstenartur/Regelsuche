name: Temporary projected-work prototype export

on:
  push:
    branches:
      - feature/748-on-demand-verified-factorization-adapter-v2

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Check out discarded prototype commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ef477375723e066beff8af8280dd1e1c12a93a30
          fetch-depth: 1
      - name: Retain prototype generator
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr861-projected-work-prototype
          path: tools/apply_pr861_projected_work_v4.py
          if-no-files-found: error
          retention-days: 1
