name: Comparative Benchmarks

on:
  push:
    branches: [ main ]
    paths:
      - 'regelsuche-benchmarks/**'
      - 'regelsuche-solver-ir/**'
      - 'regelsuche-solver-portfolio/**'
      - 'docs/schemas/regelsuche-comparative-benchmark-v1.schema.json'
      - 'docs/discovery-benchmarks.md'
      - 'scripts/run-comparative-benchmarks-verification.sh'
      - 'scripts/verify-comparative-benchmark.py'
      - 'Dockerfile.comparative-benchmarks'
      - '.github/workflows/comparative-benchmarks.yml'
      - 'settings.gradle'
      - 'gradle/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'regelsuche-benchmarks/**'
      - 'regelsuche-solver-ir/**'
      - 'regelsuche-solver-portfolio/**'
      - 'docs/schemas/regelsuche-comparative-benchmark-v1.schema.json'
      - 'docs/discovery-benchmarks.md'
      - 'scripts/run-comparative-benchmarks-verification.sh'
      - 'scripts/verify-comparative-benchmark.py'
      - 'Dockerfile.comparative-benchmarks'
      - '.github/workflows/comparative-benchmarks.yml'
      - 'settings.gradle'
      - 'gradle/**'
  workflow_dispatch:

concurrency:
  group: comparative-benchmarks-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  comparative:
    name: track-scoped parity and external baselines
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6.1.0
      - name: Install pinned Z3 toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            z3=4.8.12-3.1build1 \
            python3-venv
      - name: Run repository-owned comparative benchmark verification
        run: bash scripts/run-comparative-benchmarks-verification.sh
      - name: Upload comparative evidence and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: comparative-benchmark-evidence
          path: |
            build/reports/comparative-ci/**
            regelsuche-benchmarks/build/reports/tests/**
            regelsuche-benchmarks/build/test-results/**
          if-no-files-found: warn
