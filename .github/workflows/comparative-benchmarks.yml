name: Comparative Benchmarks

on:
  push:
    branches: [ main ]
    paths:
      - 'regelsuche-benchmarks/**'
      - 'regelsuche-solver-ir/**'
      - 'regelsuche-solver-portfolio/**'
      - 'docs/schemas/regelsuche-comparative-benchmark-v1.schema.json'
      - 'docs/discovery-benchmarks.md'
      - 'Dockerfile.comparative-benchmarks'
      - '.github/workflows/comparative-benchmarks.yml'
      - 'settings.gradle'
      - 'gradle/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'regelsuche-benchmarks/**'
      - 'regelsuche-solver-ir/**'
      - 'regelsuche-solver-portfolio/**'
      - 'docs/schemas/regelsuche-comparative-benchmark-v1.schema.json'
      - 'docs/discovery-benchmarks.md'
      - 'Dockerfile.comparative-benchmarks'
      - '.github/workflows/comparative-benchmarks.yml'
      - 'settings.gradle'
      - 'gradle/**'
  workflow_dispatch:

concurrency:
  group: comparative-benchmarks-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  comparative:
    name: track-scoped parity and external baselines
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.1.0

      - name: Install real Z3 and pinned SymPy
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends z3 python3-venv
          python3 -m venv .venv
          .venv/bin/python -m pip install \
            --disable-pip-version-check \
            --quiet \
            sympy==1.14.0 \
            jsonschema==4.25.1
          z3 -version
          .venv/bin/python -c 'import sympy; print(sympy.__version__)'

      - name: Test and write two canonical benchmark bundles
        shell: bash
        env:
          REGELSUCHE_SYMPY_PYTHON: ${{ github.workspace }}/.venv/bin/python
        run: |
          mkdir -p build/reports/comparative-ci
          set -o pipefail
          ./gradlew \
            :regelsuche-benchmarks:test \
            2>&1 | tee build/reports/comparative-ci/gradle.log
          ./gradlew \
            :regelsuche-benchmarks:writeComparativeBenchmark \
            -PcomparativeBenchmarkOutput="$PWD/build/reports/comparative-ci/run-a" \
            2>&1 | tee -a build/reports/comparative-ci/gradle.log
          ./gradlew \
            :regelsuche-benchmarks:writeComparativeBenchmark \
            -PcomparativeBenchmarkOutput="$PWD/build/reports/comparative-ci/run-b" \
            2>&1 | tee -a build/reports/comparative-ci/gradle.log

      - name: Validate schema, parity, references and retained objects
        shell: bash
        run: |
          .venv/bin/python - <<'PY'
          import copy
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          from jsonschema.exceptions import ValidationError

          root = Path('build/reports/comparative-ci/run-a')
          schema = json.loads(Path(
              'docs/schemas/regelsuche-comparative-benchmark-v1.schema.json'
          ).read_text(encoding='utf-8'))
          Draft202012Validator.check_schema(schema)
          validator = Draft202012Validator(schema)
          report = json.loads((root / 'report.json').read_text(encoding='utf-8'))
          validator.validate(report)

          assert report['scorePolicy'] == \
              'NO_UNIVERSAL_SCORE_TRACK_SCOPED_CLAIMS_ONLY'
          assert len(report['parityManifests']) == 2
          assert len(report['configurations']) == 6
          assert len(report['cases']) == 5
          assert len(report['results']) == 15
          assert len(report['claims']) == 2
          assert all(result['disposition'] == 'EXECUTED'
                     for result in report['results'])
          assert all(result['correct'] is True for result in report['results'])
          assert all(claim['status'] == 'SUPPORTED'
                     for claim in report['claims'])

          configurations = {
              item['contentHash']: item for item in report['configurations']
          }
          cases = {item['contentHash']: item for item in report['cases']}
          results = {item['contentHash']: item for item in report['results']}
          manifests = {
              item['contentHash']: item for item in report['parityManifests']
          }

          for configuration in report['configurations']:
              parity = manifests[configuration['parityManifestHash']]
              assert parity['track'] == configuration['track']

          backend_ids = {
              item['backendId'] for item in report['configurations']
              if item['track'] == 'EQUALITY_VALIDATION'
          }
          assert backend_ids == {
              'polynomial-normal-form',
              'sympy-cas-equality',
              'z3-smt-proof',
          }

          search_results = [result for result in report['results']
                            if result['track'] == 'TARGET_DIRECTED_SEARCH']
          validation_results = [result for result in report['results']
                                if result['track'] == 'EQUALITY_VALIDATION']
          assert len(search_results) == 9
          assert len(validation_results) == 6

          for result in report['results']:
              configuration = configurations[result['configurationHash']]
              case = cases[result['caseHash']]
              assert result['track'] == configuration['track'] == case['track']
              resources = result['resources']
              assert resources['configuredWork'] == (
                  resources['executedWork']
                  + resources['skippedWork']
                  + resources['remainingWork']
              )
              assert resources['completedMandatoryEvaluations'] <= \
                  resources['mandatoryEvaluations']
              assert 'elapsedMillis' not in result
              assert 'durationMillis' not in result

          for claim in report['claims']:
              referenced = [results[value]
                            for value in claim['evidenceResultHashes']]
              assert all(item['track'] == claim['track'] for item in referenced)

          expected_gaps = {
              'HIDDEN_RULE_REDISCOVERY',
              'OPEN_TARGET_DISCOVERY',
              'CROSS_FAMILY_TRANSFER',
              'AUTONOMOUS_CAMPAIGN',
              'DISCOVERY_COMPONENT_ABLATION',
              'CONTROLLER_ABLATION',
          }
          assert {gap['track'] for gap in report['coverageGaps']} == expected_gaps

          formal_results = []
          for result in validation_results:
              configuration = configurations[result['configurationHash']]
              if result['evidence']['proofStatus'] == \
                      'FORMAL_CERTIFICATE_RETAINED':
                  formal_results.append((configuration, result))
          assert formal_results
          assert all(configuration['backendId'] == 'z3-smt-proof'
                     for configuration, _ in formal_results)

          def load_all(directory):
              return [json.loads(path.read_text(encoding='utf-8'))
                      for path in sorted(directory.glob('*.json'))]

          assert load_all(root / 'parity-manifests') == report['parityManifests']
          assert load_all(root / 'configurations') == report['configurations']
          assert load_all(root / 'cases') == report['cases']
          assert load_all(root / 'results') == report['results']
          assert load_all(root / 'claims') == report['claims']
          assert load_all(root / 'coverage-gaps') == report['coverageGaps']

          invalid_score = copy.deepcopy(report)
          invalid_score['scorePolicy'] = 'UNIVERSAL_LEADERBOARD'
          try:
              validator.validate(invalid_score)
          except ValidationError:
              pass
          else:
              raise AssertionError('schema accepted a universal score policy')

          invalid_result = copy.deepcopy(report)
          invalid_result['results'][0]['disposition'] = 'FILTERED_UNSUPPORTED'
          try:
              validator.validate(invalid_result)
          except ValidationError:
              pass
          else:
              raise AssertionError('schema accepted correct filtered result')
          PY

      - name: Require byte-identical repeated Gradle evidence
        shell: bash
        run: diff -ru build/reports/comparative-ci/run-a build/reports/comparative-ci/run-b

      - name: Build pinned comparative benchmark image
        shell: bash
        run: |
          set -o pipefail
          docker build \
            -f Dockerfile.comparative-benchmarks \
            -t regelsuche-comparative-benchmarks . \
            2>&1 | tee build/reports/comparative-ci/docker-build.log

      - name: Reproduce canonical evidence in Docker
        shell: bash
        run: |
          mkdir -p build/reports/comparative-ci/run-docker
          chmod 0777 build/reports/comparative-ci/run-docker
          set -o pipefail
          docker run --rm \
            -v "$PWD/build/reports/comparative-ci/run-docker:/output" \
            regelsuche-comparative-benchmarks \
            /output \
            2>&1 | tee build/reports/comparative-ci/docker-run.log

      - name: Require byte-identical Gradle and Docker evidence
        shell: bash
        run: diff -ru build/reports/comparative-ci/run-a build/reports/comparative-ci/run-docker

      - name: Upload comparative evidence and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: comparative-benchmark-evidence
          path: |
            build/reports/comparative-ci/**
            regelsuche-benchmarks/build/reports/tests/**
            regelsuche-benchmarks/build/test-results/**
          if-no-files-found: warn
