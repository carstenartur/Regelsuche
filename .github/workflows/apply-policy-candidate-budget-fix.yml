name: Apply policy candidate-budget semantics fix

on:
  push:
    branches:
      - fix/policy-candidate-budget-semantics
    paths:
      - .github/workflows/apply-policy-candidate-budget-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/policy-candidate-budget-semantics
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Patch candidate ordering and telemetry
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          best = Path('regelsuche-search/src/main/java/de/regelsuche/search/strategy/BestFirstSearchStrategy.java')
          text = best.read_text()
          text = text.replace(
              'import de.regelsuche.transform.Transformation;\n',
              'import de.regelsuche.transform.Transformation;\nimport de.regelsuche.transform.TransformationEngine;\n')
          text = text.replace(
              'public class BestFirstSearchStrategy implements SearchStrategy {\n',
              '''public class BestFirstSearchStrategy implements SearchStrategy {\n    /** Engine contract for callers that already provide the complete candidate order. */\n    interface PreorderedTransformationEngine extends TransformationEngine {\n    }\n\n''')
          old = '''        List<Transformation> transformations = new ArrayList<>(problem.engine().transform(current.expression()));\n        Comparator<Transformation> deterministic = Comparator\n'''
          new = '''        List<Transformation> transformations = new ArrayList<>(problem.engine().transform(current.expression()));\n        if (problem.engine() instanceof PreorderedTransformationEngine) {\n            return List.copyOf(transformations);\n        }\n        Comparator<Transformation> deterministic = Comparator\n'''
          if old not in text:
              raise SystemExit('BestFirst ordering insertion point not found')
          text = text.replace(old, new, 1)
          best.write_text(text)

          policy = Path('regelsuche-search/src/main/java/de/regelsuche/search/strategy/PolicyAwareBestFirstSearchStrategy.java')
          text = policy.read_text()
          text = text.replace(
              'import de.regelsuche.search.policy.SearchPolicy.PolicyDecision;\n',
              '''import de.regelsuche.search.policy.SearchPolicy.PolicyDecision;\nimport de.regelsuche.search.telemetry.SearchEvent;\nimport de.regelsuche.search.telemetry.SearchEventType;\nimport de.regelsuche.search.telemetry.SearchObserver;\n''')
          old = '''            TransformationEngine rankedEngine = new RankingEngine(\n                problem.engine(),\n                policy,\n                trace,\n                distance,\n                problem.canonicalizer(),\n                problem.heuristic().maxCandidatesPerState());\n            SearchProblem rankedProblem = new SearchProblem(\n'''
          new = '''            SearchObserver observer = event -> {\n                trace.onEvent(event);\n                problem.observer().onEvent(event);\n            };\n            TransformationEngine rankedEngine = new RankingEngine(\n                problem.engine(),\n                policy,\n                trace,\n                distance,\n                problem.canonicalizer());\n            SearchProblem rankedProblem = new SearchProblem(\n'''
          if old not in text:
              raise SystemExit('Policy search construction point not found')
          text = text.replace(old, new, 1)
          text = text.replace(
              '                problem.observer(),\n                problem.target());',
              '                observer,\n                problem.target());',
              1)
          old_record = '''        String explanation,\n        int deterministicRank,\n        boolean selectedByCandidateBudget\n    ) {\n'''
          new_record = '''        String explanation,\n        int deterministicRank,\n        boolean consideredBySearch,\n        boolean enqueued,\n        String pruningReason\n    ) {\n'''
          if old_record not in text:
              raise SystemExit('RankingEvent record point not found')
          text = text.replace(old_record, new_record, 1)
          text = text.replace(
              '            explanation = explanation == null ? "" : explanation;\n',
              '            explanation = explanation == null ? "" : explanation;\n            pruningReason = pruningReason == null ? "" : pruningReason;\n',
              1)
          text = text.replace(
              'private static final class RankingEngine implements TransformationEngine {',
              'private static final class RankingEngine implements BestFirstSearchStrategy.PreorderedTransformationEngine {')
          text = text.replace('        private final int candidateBudget;\n', '')
          old_ctor = '''            PolicyTrace trace,\n            TargetDistance distance,\n            ExpressionCanonicalizer canonicalizer,\n            int candidateBudget\n        ) {\n'''
          new_ctor = '''            PolicyTrace trace,\n            TargetDistance distance,\n            ExpressionCanonicalizer canonicalizer\n        ) {\n'''
          if old_ctor not in text:
              raise SystemExit('RankingEngine constructor point not found')
          text = text.replace(old_ctor, new_ctor, 1)
          text = text.replace('            this.candidateBudget = Math.max(1, candidateBudget);\n', '')

          pattern = re.compile(r'''        @Override\n        public List<Transformation> transform\(String expression\) \{.*?\n        \}\n    \}\n\n    private static final class PolicyTrace \{.*?\n    \}\n\n    private static final class TargetDistance''', re.S)
          replacement = '''        @Override\n        public List<Transformation> transform(String expression) {\n            List<Transformation> applicable = new ArrayList<>(delegate.transform(expression));\n            Comparator<RankedTransformation> deterministic = Comparator\n                .comparing((RankedTransformation ranked) -> ranked.transformation().rule())\n                .thenComparing(ranked -> ranked.transformation().transformedExpression())\n                .thenComparing(ranked -> ranked.transformation().applicationKey());\n            List<RankedTransformation> scored = applicable.stream()\n                .map(transformation -> new RankedTransformation(\n                    transformation,\n                    policy.score(\n                        new PolicyContext(\n                            expression,\n                            distance.distance(transformation.transformedExpression()),\n                            distance.enabled(),\n                            canonicalizer),\n                        transformation)))\n                .toList();\n\n            boolean completeFallback = !scored.isEmpty()\n                && scored.stream().allMatch(item -> item.decision().fallback());\n            Comparator<RankedTransformation> staticOrder = Comparator\n                .comparingInt((RankedTransformation item) ->\n                    distance.distance(item.transformation().transformedExpression()))\n                .thenComparing(deterministic);\n            Comparator<RankedTransformation> policyOrder = Comparator\n                .comparingInt((RankedTransformation item) -> item.decision().priority())\n                .thenComparing(deterministic);\n            List<RankedTransformation> ordered = scored.stream()\n                .sorted(completeFallback ? staticOrder : policyOrder)\n                .toList();\n\n            long group = decisionGroup++;\n            for (int index = 0; index < ordered.size(); index++) {\n                RankedTransformation item = ordered.get(index);\n                trace.record(\n                    group,\n                    expression,\n                    item.transformation(),\n                    item.decision(),\n                    index);\n            }\n            return ordered.stream()\n                .map(RankedTransformation::transformation)\n                .toList();\n        }\n    }\n\n    private static final class PolicyTrace {\n        private final List<MutableRankingEvent> events = new ArrayList<>();\n        private final Map<String, Long> latestGroupByParent = new HashMap<>();\n\n        private void record(\n            long decisionGroup,\n            String parentExpression,\n            Transformation transformation,\n            PolicyDecision decision,\n            int deterministicRank\n        ) {\n            events.add(new MutableRankingEvent(\n                decisionGroup,\n                parentExpression,\n                transformation,\n                decision,\n                deterministicRank));\n            latestGroupByParent.put(parentExpression, decisionGroup);\n        }\n\n        private void onEvent(SearchEvent event) {\n            if (event.type() == SearchEventType.TRANSFORMATION_GENERATED) {\n                MutableRankingEvent match = nextUnconsidered(event);\n                if (match != null) {\n                    match.consideredBySearch = true;\n                    match.pruningReason = event.pruningReason();\n                }\n            } else if (event.type() == SearchEventType.STATE_ENQUEUED) {\n                MutableRankingEvent match = nextConsideredNotEnqueued(event);\n                if (match != null) {\n                    match.enqueued = true;\n                }\n            } else if (event.type() == SearchEventType.STATE_PRUNED_DUPLICATE) {\n                MutableRankingEvent match = nextConsideredNotEnqueued(event);\n                if (match != null && match.pruningReason.isBlank()) {\n                    match.pruningReason = event.pruningReason();\n                }\n            } else if (event.type() == SearchEventType.STATE_PRUNED_BUDGET) {\n                Long group = latestGroupByParent.get(event.expression());\n                if (group != null) {\n                    events.stream()\n                        .filter(candidate -> candidate.decisionGroup == group)\n                        .filter(candidate -> !candidate.consideredBySearch)\n                        .forEach(candidate -> candidate.pruningReason =\n                            "candidate-budget-not-considered");\n                }\n            }\n        }\n\n        private MutableRankingEvent nextUnconsidered(SearchEvent event) {\n            return events.stream()\n                .filter(candidate -> !candidate.consideredBySearch)\n                .filter(candidate -> candidate.matches(event))\n                .findFirst()\n                .orElse(null);\n        }\n\n        private MutableRankingEvent nextConsideredNotEnqueued(SearchEvent event) {\n            return events.stream()\n                .filter(candidate -> candidate.consideredBySearch && !candidate.enqueued)\n                .filter(candidate -> candidate.matches(event))\n                .findFirst()\n                .orElse(null);\n        }\n\n        private List<RankingEvent> events() {\n            return events.stream().map(MutableRankingEvent::freeze).toList();\n        }\n    }\n\n    private static final class MutableRankingEvent {\n        private final long decisionGroup;\n        private final String parentExpression;\n        private final Transformation transformation;\n        private final PolicyDecision decision;\n        private final int deterministicRank;\n        private boolean consideredBySearch;\n        private boolean enqueued;\n        private String pruningReason = "";\n\n        private MutableRankingEvent(\n            long decisionGroup,\n            String parentExpression,\n            Transformation transformation,\n            PolicyDecision decision,\n            int deterministicRank\n        ) {\n            this.decisionGroup = decisionGroup;\n            this.parentExpression = parentExpression;\n            this.transformation = transformation;\n            this.decision = decision;\n            this.deterministicRank = deterministicRank;\n        }\n\n        private boolean matches(SearchEvent event) {\n            return parentExpression.equals(event.parentExpression())\n                && transformation.rule().equals(event.ruleId())\n                && transformation.transformedExpression().equals(event.expression());\n        }\n\n        private RankingEvent freeze() {\n            return new RankingEvent(\n                decisionGroup,\n                parentExpression,\n                transformation.rule(),\n                transformation.transformedExpression(),\n                decision.policyId(),\n                decision.priority(),\n                decision.confidencePermille(),\n                decision.fallback(),\n                decision.contributions(),\n                decision.explanation(),\n                deterministicRank,\n                consideredBySearch,\n                enqueued,\n                pruningReason);\n        }\n    }\n\n    private static final class TargetDistance'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'Policy ranking block replacement count={count}')
          policy.write_text(text)

          test = Path('regelsuche-search/src/test/java/de/regelsuche/search/strategy/PolicyCandidateBudgetSemanticsTest.java')
          test.write_text('''package de.regelsuche.search.strategy;\n\nimport static org.junit.jupiter.api.Assertions.assertEquals;\nimport static org.junit.jupiter.api.Assertions.assertFalse;\nimport static org.junit.jupiter.api.Assertions.assertTrue;\n\nimport de.regelsuche.canonical.ExpressionCanonicalizer;\nimport de.regelsuche.scoring.ExpressionScorer;\nimport de.regelsuche.search.SearchHeuristic;\nimport de.regelsuche.search.policy.SearchPolicy;\nimport de.regelsuche.search.policy.SearchPolicy.PolicyContext;\nimport de.regelsuche.search.policy.SearchPolicy.PolicyDecision;\nimport de.regelsuche.transform.RewriteKind;\nimport de.regelsuche.transform.Transformation;\nimport de.regelsuche.transform.TransformationEngine;\nimport java.util.List;\nimport java.util.Map;\nimport org.junit.jupiter.api.Test;\n\nclass PolicyCandidateBudgetSemanticsTest {\n    @Test\n    void guardRejectedTopRankDoesNotHideTheNextEnqueueableCandidate() {\n        TransformationEngine engine = expression -> switch (expression) {\n            case "start" -> List.of(step("prepare", "middle", "repeat-key"));\n            case "middle" -> List.of(\n                step("blocked", "blocked-state", "repeat-key"),\n                step("goal", "goal", "goal-key"));\n            default -> List.of();\n        };\n        SearchPolicy policy = new SearchPolicy() {\n            @Override\n            public String id() {\n                return "guard-first-test/v1";\n            }\n\n            @Override\n            public PolicyDecision score(PolicyContext context, Transformation transformation) {\n                int priority = transformation.rule().equals("blocked") ? 0 : 1;\n                return new PolicyDecision(\n                    id(), priority, 1000, false, Map.of("test", priority), "test ordering");\n            }\n        };\n        SearchProblem problem = new SearchProblem(\n            "start",\n            engine,\n            new ExpressionScorer(),\n            new ExpressionCanonicalizer(),\n            new SearchHeuristic(3, 20, 1, 2, 1, 5))\n            .withTarget(SearchProblem.SearchTarget.syntaxExact("goal"));\n\n        var result = new PolicyAwareBestFirstSearchStrategy(policy)\n            .searchWithDiagnostics(problem);\n\n        assertTrue(result.reached(), result.search().toString());\n        assertEquals(List.of("prepare", "goal"),\n            result.search().reachedState().appliedRuleIds());\n        var blocked = result.policyEvents().stream()\n            .filter(event -> event.parentExpression().equals("middle"))\n            .filter(event -> event.ruleId().equals("blocked"))\n            .findFirst().orElseThrow();\n        var goal = result.policyEvents().stream()\n            .filter(event -> event.parentExpression().equals("middle"))\n            .filter(event -> event.ruleId().equals("goal"))\n            .findFirst().orElseThrow();\n        assertTrue(blocked.consideredBySearch());\n        assertFalse(blocked.enqueued());\n        assertEquals("repeated-rule-application", blocked.pruningReason());\n        assertTrue(goal.consideredBySearch());\n        assertTrue(goal.enqueued());\n        assertTrue(goal.pruningReason().isBlank());\n    }\n\n    private static Transformation step(String rule, String output, String applicationKey) {\n        return new Transformation(\n            rule, output, RewriteKind.NORMALIZE, false, 0, true, applicationKey);\n    }\n}\n''')

          Path('.github/workflows/apply-policy-candidate-budget-fix.yml').unlink()
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Preserve BestFirst candidate-budget semantics under policy ranking"
          git push origin HEAD:fix/policy-candidate-budget-semantics
