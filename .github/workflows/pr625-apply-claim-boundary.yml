name: Apply PR 625 claim-boundary repair

on:
  push:
    branches:
      - research/historical-rediscovery-atlas-v1

permissions:
  contents: write

jobs:
  patch:
    name: Apply and commit the reviewed source repair
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: research/historical-rediscovery-atlas-v1
          fetch-depth: 0

      - name: Apply the fail-closed claim boundary and regression test
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path(
              "regelsuche-experiments/src/main/java/de/regelsuche/benchmark/"
              "HistoricalRediscoveryAtlas.java"
          )
          text = source.read_text(encoding="utf-8")
          old = '''        if (genericBridge.executed() && anyReached(genericBridge)) {
              return PrimaryStatus.GENERIC_BRIDGE_REQUIRED_AND_FOUND;
          }
          if (curatedControl.executed()
                  && curatedControl.oracle().reachable()) {
              return PrimaryStatus
                  .CURATED_CONTROL_ONLY_MISSING_PRODUCTION_PRIMITIVE;
          }
          if (production.oracle().completeClosureExhausted()) {
              return PrimaryStatus.UNREACHABLE_IN_COMPLETE_FROZEN_CLOSURE;
          }
          return PrimaryStatus.BUDGET_INCONCLUSIVE;
          '''
          new = '''        // A bridge or curated-control hit identifies a missing production
          // capability only after the frozen production closure was exhausted.
          if (!production.oracle().completeClosureExhausted()) {
              return PrimaryStatus.BUDGET_INCONCLUSIVE;
          }
          if (genericBridge.executed() && anyReached(genericBridge)) {
              return PrimaryStatus.GENERIC_BRIDGE_REQUIRED_AND_FOUND;
          }
          if (curatedControl.executed()
                  && curatedControl.oracle().reachable()) {
              return PrimaryStatus
                  .CURATED_CONTROL_ONLY_MISSING_PRODUCTION_PRIMITIVE;
          }
          return PrimaryStatus.UNREACHABLE_IN_COMPLETE_FROZEN_CLOSURE;
          '''
          if text.count(old) != 1:
              raise SystemExit(
                  f"expected one original classification block, found {text.count(old)}"
              )
          source.write_text(text.replace(old, new), encoding="utf-8")

          test = Path(
              "regelsuche-experiments/src/test/java/de/regelsuche/benchmark/"
              "HistoricalRediscoveryClaimBoundaryTest.java"
          )
          test.write_text('''package de.regelsuche.benchmark;

          import static org.junit.jupiter.api.Assertions.assertEquals;
          import static org.junit.jupiter.api.Assertions.assertTrue;

          import de.regelsuche.benchmark.HistoricalRediscoveryAtlas.PrimaryStatus;
          import de.regelsuche.benchmark.HistoricalRediscoveryCorpus.Corpus;
          import java.util.List;
          import org.junit.jupiter.api.Test;
          import org.junit.jupiter.api.Timeout;

          class HistoricalRediscoveryClaimBoundaryTest {

              @Test
              @Timeout(240)
              void curatedHitDoesNotBecomeCapabilityGapBeforeProductionClosureCompletes() {
                  Corpus full = HistoricalRediscoveryCorpus.load();
                  HistoricalRediscoveryCorpus.Case benchmarkCase = full.cases().stream()
                      .filter(value -> value.id().equals("regrouped-square"))
                      .findFirst()
                      .orElseThrow();
                  Corpus subset = new Corpus(
                      full.schema(),
                      full.evidenceStatus(),
                      full.inventoryRevision(),
                      full.claimBoundary(),
                      full.contentSha256(),
                      List.of(benchmarkCase));

                  HistoricalRediscoveryAtlas.CaseResult result =
                      new HistoricalRediscoveryAtlas().run(subset).cases().get(0);

                  assertTrue(result.production().oracle().inconclusive());
                  assertTrue(result.curatedControl().oracle().reachable());
                  assertEquals(PrimaryStatus.BUDGET_INCONCLUSIVE, result.status());
              }
          }
          '''.replace("\n          ", "\n"), encoding="utf-8")
          PY

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add \
            regelsuche-experiments/src/main/java/de/regelsuche/benchmark/HistoricalRediscoveryAtlas.java \
            regelsuche-experiments/src/test/java/de/regelsuche/benchmark/HistoricalRediscoveryClaimBoundaryTest.java
          git rm -- .github/workflows/pr625-apply-claim-boundary.yml
          git commit -m "Fix historical rediscovery claim boundary"
          git push origin HEAD:research/historical-rediscovery-atlas-v1
