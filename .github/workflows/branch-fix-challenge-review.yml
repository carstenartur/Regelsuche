name: Apply Challenge Portfolio Review Fixes

on:
  push:
    branches: [ "issue-390-challenge-portfolio" ]
    paths:
      - '.github/workflows/branch-fix-challenge-review.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - '.github/workflows/branch-fix-challenge-review.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: issue-390-challenge-portfolio
          fetch-depth: 0

      - name: Harden source policy validation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/generate-discovery-challenge-portfolio.py')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  '''    selection = source.get("selectionPolicy")
    if not isinstance(selection, dict):
        raise ValueError("selectionPolicy must be an object")
    if selection.get("externalSearchVisibility") != "POST_FORMATION_ONLY":
        raise ValueError("external search must remain post-formation")
    if selection.get("pilotEvidenceStatus") != "DEVELOPMENT_ONLY":
        raise ValueError("pilot evidence must remain development-only")
    challenges = source.get("challenges")
    if not isinstance(challenges, list):
        raise ValueError("challenges must be an array")
    if len(challenges) < int(selection.get("minimumAssessedClasses", 5)):
        raise ValueError("insufficient assessed challenge classes")
''',
                  '''    require_text(source.get("portfolioId"), "portfolioId")
    selection = source.get("selectionPolicy")
    if not isinstance(selection, dict):
        raise ValueError("selectionPolicy must be an object")
    for flag in (
        "requireIndependentEvaluator",
        "requireFrozenSplitUnit",
        "requireInformationParityBaselines",
    ):
        if selection.get(flag) is not True:
            raise ValueError(f"selectionPolicy.{flag} must remain true")
    minimum_assessed = selection.get("minimumAssessedClasses")
    minimum_selected = selection.get("minimumSelectedClasses")
    if not isinstance(minimum_assessed, int) or minimum_assessed < 5:
        raise ValueError("minimumAssessedClasses must be at least 5")
    if not isinstance(minimum_selected, int) or minimum_selected < 2:
        raise ValueError("minimumSelectedClasses must be at least 2")
    if selection.get("externalSearchVisibility") != "POST_FORMATION_ONLY":
        raise ValueError("external search must remain post-formation")
    if selection.get("pilotEvidenceStatus") != "DEVELOPMENT_ONLY":
        raise ValueError("pilot evidence must remain development-only")
    challenges = source.get("challenges")
    if not isinstance(challenges, list):
        raise ValueError("challenges must be an array")
    if len(challenges) < minimum_assessed:
        raise ValueError("insufficient assessed challenge classes")
''',
                  'selection-policy validation marker',
              ),
              (
                  '''        if challenge["complexityTier"] not in VALID_COMPLEXITY:
            raise ValueError(
                f"selected challenge is not beyond elementary tier: {challenge_id}"
            )
''',
                  '''        if challenge["complexityTier"] not in VALID_COMPLEXITY:
            raise ValueError(
                f"unsupported complexity tier for {challenge_id}"
            )
''',
                  'complexity error marker',
              ),
              (
                  '''    if selected < int(selection.get("minimumSelectedClasses", 2)):
        raise ValueError("insufficient selected challenge classes")
''',
                  '''    if selected < minimum_selected:
        raise ValueError("insufficient selected challenge classes")
''',
                  'selected-count marker',
              ),
          ]

          for old, new, marker in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'{marker} not found exactly once')
              text = text.replace(old, new)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify generator and schemas
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet jsonschema==4.25.1
          rm -rf /tmp/challenge-review-output
          python3 scripts/generate-discovery-challenge-portfolio.py \
            --source research/challenges/challenge-plan-source.json \
            --output /tmp/challenge-review-output
          diff -ru /tmp/challenge-review-output research/challenges/generated
          python3 - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          source_schema = json.loads(Path(
              'docs/schemas/regelsuche-discovery-challenge-plan-source-v1.schema.json'
          ).read_text(encoding='utf-8'))
          artifact_schema = json.loads(Path(
              'docs/schemas/regelsuche-discovery-challenge-artifact-v1.schema.json'
          ).read_text(encoding='utf-8'))
          Draft202012Validator.check_schema(source_schema)
          Draft202012Validator.check_schema(artifact_schema)
          source = json.loads(Path(
              'research/challenges/challenge-plan-source.json'
          ).read_text(encoding='utf-8'))
          Draft202012Validator(source_schema).validate(source)
          for path in sorted(Path('research/challenges/generated').glob('*.json')):
              Draft202012Validator(artifact_schema).validate(
                  json.loads(path.read_text(encoding='utf-8'))
              )
          PY

      - name: Commit review fixes
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/branch-fix-challenge-review.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(research): align challenge policy and schemas'
          git push origin HEAD:issue-390-challenge-portfolio
