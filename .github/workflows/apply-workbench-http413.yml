name: Apply Workbench HTTP 413 slice

on:
  push:
    branches:
      - fix/workbench-wide-http-413

permissions:
  contents: write

jobs:
  patch:
    name: Apply and commit the reviewed HTTP boundary
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/workbench-wide-http-413
          fetch-depth: 0

      - name: Apply the reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          cat <<'PATCH' | base64 --decode | gzip --decompress > /tmp/http413.patch
          
          PATCH
          test "$(sha256sum /tmp/http413.patch | cut -d' ' -f1)" = "d9a89f2e68c4774735e06ad3c273ff84ab9f972501630b63e870411d0def92fb"
          git apply --check /tmp/http413.patch
          git apply /tmp/http413.patch
          git diff --check

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add \
            app/src/main/java/de/regelsuche/web/WebWorkbenchServer.java \
            app/src/main/resources/web/openapi/openapi.json \
            app/src/test/java/de/regelsuche/web/OpenApiStaticReferenceTest.java \
            app/src/test/java/de/regelsuche/web/WebWorkbenchServerRequestLimitTest.java \
            docs/web-workbench-security.md
          git rm -- .github/workflows/apply-workbench-http413.yml
          git commit -m "Complete Workbench-wide HTTP 413 handling"
          git push origin HEAD:fix/workbench-wide-http-413
