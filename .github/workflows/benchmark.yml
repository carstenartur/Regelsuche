name: Benchmark

on:
  push:
    branches: [ main ]
    paths:
      - 'app/src/jmh/**'
      - 'app/src/main/**'
      - 'app/build.gradle'
      - 'scripts/run-jmh-benchmark-verification.sh'
      - 'scripts/verify-jmh-benchmark.py'
      - '.github/workflows/benchmark.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'app/src/jmh/**'
      - 'app/src/main/**'
      - 'app/build.gradle'
      - 'scripts/run-jmh-benchmark-verification.sh'
      - 'scripts/verify-jmh-benchmark.py'
      - '.github/workflows/benchmark.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: JMH micro-benchmark verification
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6.1.0
      - name: Run repository-owned JMH verification
        run: bash scripts/run-jmh-benchmark-verification.sh
      - name: Upload verified JMH result and local badge
        uses: actions/upload-artifact@v7
        with:
          name: jmh-verification
          path: |
            app/build/reports/jmh/**
            public/dev/bench/badge.json
            build/logs/jmh-benchmark*.log
          if-no-files-found: error

  publish:
    name: Publish benchmark history and reports
    needs: verify
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && format('pages-publish-{0}-main', github.repository) || format('benchmark-report-{0}-{1}', github.repository, github.run_id) }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
      deployments: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - name: Download verified JMH result
        uses: actions/download-artifact@v8.0.1
        with:
          name: jmh-verification
          path: .
      - name: Ensure gh-pages branch exists
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            echo "gh-pages branch already exists."
            exit 0
          fi

          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT
          git init "$tmp_dir"
          cd "$tmp_dir"
          git checkout --orphan gh-pages
          touch .nojekyll
          mkdir -p coverage tests dev/bench
          printf '{"schemaVersion":1,"label":"coverage","message":"pending","color":"lightgrey"}\n' > coverage/badge.json
          printf '<!doctype html><title>Coverage pending</title><h1>Coverage pending</h1>\n' > coverage/index.html
          printf '{"schemaVersion":1,"label":"tests","message":"pending","color":"lightgrey"}\n' > tests/badge.json
          printf '<!doctype html><title>Tests pending</title><h1>Tests pending</h1>\n' > tests/index.html
          printf '{"schemaVersion":1,"label":"performance","message":"pending","color":"lightgrey"}\n' > dev/bench/badge.json
          printf '<!doctype html><title>Benchmarks pending</title><h1>Benchmarks pending</h1>\n' > dev/bench/index.html
          git add .
          git -c user.name='github-actions[bot]' -c user.email='github-actions[bot]@users.noreply.github.com' commit -m 'Initialize gh-pages'
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin gh-pages
      - name: Store benchmark history and charts
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: JMH Benchmarks
          tool: 'jmh'
          output-file-path: app/build/reports/jmh/result.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          benchmark-data-dir-path: dev/bench
          auto-push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          alert-threshold: '115%'
          comment-on-alert: true
          fail-on-alert: false
          alert-comment-cc-users: '@carstenartur'
      - name: Deploy performance badge to GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: public/dev/bench
          destination_dir: dev/bench
          keep_files: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'Update benchmark badge (${{ github.sha }})'
      - name: Report benchmark dashboard
        if: always()
        run: |
          {
            echo "### ⚡ Benchmark dashboard"
            echo ""
            echo "📊 [View Performance Charts](https://carstenartur.github.io/Regelsuche/dev/bench/)"
          } >> "$GITHUB_STEP_SUMMARY"
