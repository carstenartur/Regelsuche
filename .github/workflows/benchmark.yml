name: Benchmark

on:
  push:
    branches: [ main ]
    paths:
      - 'app/src/jmh/**'
      - 'app/src/main/**'
      - 'app/build.gradle'
      - '.github/workflows/benchmark.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'app/src/jmh/**'
      - 'app/src/main/**'
      - 'app/build.gradle'
      - '.github/workflows/benchmark.yml'
  workflow_dispatch:

permissions:
  contents: write       # auto-push benchmark results to gh-pages
  deployments: write    # create deployment status for benchmark
  pull-requests: write  # post alert comments on PRs

jobs:
  benchmark:
    name: JMH micro-benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v3

      - name: Run JMH benchmarks
        run: ./gradlew --no-configuration-cache :app:jmh

      - name: Locate JMH JSON result
        id: locate
        run: |
          path="app/build/reports/jmh/result.json"
          if [ ! -f "$path" ]; then
            # Fallback for jmh-gradle-plugin layouts that write into results/jmh
            path=$(find app/build -name 'result.json' -path '*jmh*' | head -n1)
          fi
          echo "Benchmark result file: $path"
          test -f "$path"
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - name: Publish benchmark results
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Regelsuche JMH Benchmarks
          tool: 'jmh'
          output-file-path: ${{ steps.locate.outputs.path }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          alert-threshold: '115%'
          comment-on-alert: true
          fail-on-alert: false
          alert-comment-cc-users: '@carstenartur'

      - name: Upload raw JMH artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jmh-results
          path: |
            ${{ steps.locate.outputs.path }}
            app/build/reports/jmh/**

      - name: Report deployed URL
        if: always()
        run: |
          echo "### ⚡ Benchmark dashboard" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "📊 [View Performance Charts](https://carstenartur.github.io/Regelsuche/dev/bench/)" >> "$GITHUB_STEP_SUMMARY"
