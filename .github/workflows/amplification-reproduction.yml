name: Public rule amplification reproduction

on:
  workflow_dispatch:
    inputs:
      previous_result_hash:
        description: 'Prior retained cohort-result SHA-256 for an explicit new attempt (blank for the first cohort)'
        required: false
        default: ''
        type: string

permissions: { contents: read, actions: read }
concurrency:
  group: public-amplification-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Preregister public inputs without formation
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    outputs:
      cohort_hash: ${{ steps.plan.outputs.cohort_hash }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { ref: '${{ github.sha }}', fetch-depth: 1 }
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with: { distribution: temurin, java-version: '25.0.3+9', verify-signature: true }
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
      - name: Provision pinned native-module relocation prerequisite
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends patchelf=0.14.3-1
      - name: Prepare the checkout-owned public plan
        id: plan
        env:
          AMPLIFICATION_PREVIOUS_RESULT: ${{ inputs.previous_result_hash }}
        run: >-
          python3 -B scripts/run-amplification-cohort.py prepare
          --output build/amplification-plan
          --previous-result-hash "$AMPLIFICATION_PREVIOUS_RESULT"
      - name: Retain first preparation receipt and exact preregistered inputs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: amplification-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/amplification-plan
          if-no-files-found: warn

  execute:
    name: Dedicated public reproduction ${{ matrix.role }}
    needs: prepare
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        role: [host-a, host-b, container]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { ref: '${{ github.sha }}', fetch-depth: 1 }
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with: { distribution: temurin, java-version: '25.0.3+9', verify-signature: true }
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
      - name: Provision isolated reproduction prerequisite
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends patchelf=0.14.3-1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: amplification-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/amplification-plan
      - name: Execute the unchanged Java authority on this dedicated machine
        env:
          AMPLIFICATION_ROLE: ${{ matrix.role }}
          AMPLIFICATION_COHORT_HASH: ${{ needs.prepare.outputs.cohort_hash }}
        run: >-
          python3 -B scripts/run-amplification-cohort.py "$AMPLIFICATION_ROLE"
          --inputs build/amplification-plan/inputs
          --expected-cohort-hash "$AMPLIFICATION_COHORT_HASH"
          --output build/amplification-execution
      - name: Retain complete or failed first execution, including raw logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: amplification-execution-${{ matrix.role }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/amplification-execution
          if-no-files-found: warn

  compare:
    name: Checkout-owned three-environment acceptance
    needs: [prepare, execute]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { ref: '${{ github.sha }}', fetch-depth: 1 }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: amplification-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/amplification-plan
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        continue-on-error: true
        with:
          name: amplification-execution-host-a-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/amplification-retained/host-a
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        continue-on-error: true
        with:
          name: amplification-execution-host-b-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/amplification-retained/host-b
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        continue-on-error: true
        with:
          name: amplification-execution-container-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/amplification-retained/container
      - name: Verify every retained authority and diagnose incomplete or inconclusive execution
        env:
          AMPLIFICATION_COHORT_HASH: ${{ needs.prepare.outputs.cohort_hash }}
        run: >-
          python3 -B scripts/run-amplification-cohort.py compare
          --inputs build/amplification-plan/inputs
          --expected-cohort-hash "$AMPLIFICATION_COHORT_HASH"
          --roots build/amplification-retained/host-a build/amplification-retained/host-b build/amplification-retained/container
          --output build/amplification-result/cohort-result.json --require-conclusive
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: amplification-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/amplification-result
          if-no-files-found: warn
