name: Independent Interestingness Review Protocol

on:
  push:
    branches: [ "main" ]
    paths:
      - 'regelsuche-learning/src/main/java/de/regelsuche/mining/InterestingnessIndependentReview*.java'
      - 'regelsuche-learning/src/test/java/de/regelsuche/mining/*IndependentReview*.java'
      - 'docs/independent-interestingness-review.md'
      - 'docs/interestingness-ranking.md'
      - 'docs/schemas/regelsuche-independent-review-*.schema.json'
      - '.github/workflows/independent-interestingness-review.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'regelsuche-learning/src/main/java/de/regelsuche/mining/InterestingnessIndependentReview*.java'
      - 'regelsuche-learning/src/test/java/de/regelsuche/mining/*IndependentReview*.java'
      - 'docs/independent-interestingness-review.md'
      - 'docs/interestingness-ranking.md'
      - 'docs/schemas/regelsuche-independent-review-*.schema.json'
      - '.github/workflows/independent-interestingness-review.yml'
  workflow_dispatch:

concurrency:
  group: independent-interestingness-review-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0

      - name: Verify freeze, leakage, privacy, intake and correction contracts
        run: |
          ./gradlew :regelsuche-learning:test \
            --tests 'de.regelsuche.mining.InterestingnessIndependentReview*' \
            --rerun-tasks

      - name: Require retained protocol-validation evidence
        run: |
          test -s regelsuche-learning/build/reports/independent-review-protocol/study-plan.json
          test -s regelsuche-learning/build/reports/independent-review-protocol/development-intake.json

      - name: Validate schemas, hashes and non-empirical evidence boundary
        shell: bash
        run: |
          python3 -m pip install \
            --disable-pip-version-check \
            --quiet \
            jsonschema==4.25.1
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from jsonschema.validators import validator_for

          schema_paths = [
              Path('docs/schemas/regelsuche-independent-review-study-plan-v1.schema.json'),
              Path('docs/schemas/regelsuche-independent-review-intake-v1.schema.json'),
          ]
          schemas = {}
          for path in schema_paths:
              schema = json.loads(path.read_text(encoding='utf-8'))
              validator_for(schema).check_schema(schema)
              assert schema.get('additionalProperties') is False
              schemas[schema['$id']] = schema

          root = Path('regelsuche-learning/build/reports/independent-review-protocol')
          plan = json.loads((root / 'study-plan.json').read_text(encoding='utf-8'))
          intake = json.loads((root / 'development-intake.json').read_text(encoding='utf-8'))
          validator_for(schemas[plan['schema']])(schemas[plan['schema']]).validate(plan)
          validator_for(schemas[intake['schema']])(schemas[intake['schema']]).validate(intake)

          def hash_payload(payload):
              encoded = json.dumps(
                  payload,
                  ensure_ascii=False,
                  separators=(',', ':'),
              ).encode('utf-8')
              return 'sha256:' + hashlib.sha256(encoded).hexdigest()

          predictive = {
              'schema': 'regelsuche.independent-review-predictive-corpus/v1',
              'minimumCasesPerSplit': 2,
              'cases': plan['cases'],
          }
          assert plan['predictiveCorpusHash'] == hash_payload(predictive)
          assert plan['thresholdLockHash'] == hash_payload(plan['acceptanceThresholds'])
          plan_without_hash = dict(plan)
          plan_without_hash.pop('contentHash')
          assert plan['contentHash'] == hash_payload(plan_without_hash)
          assert plan['labelsStatus'] == 'NOT_COLLECTED'
          assert plan['promotionStatus'] == 'NOT_EVALUATED'
          assert plan['publicEvidenceStatus'] == 'NOT_EVALUATED'

          calibration = [case for case in plan['cases'] if case['split'] == 'CALIBRATION']
          test = [case for case in plan['cases'] if case['split'] == 'TEST']
          assert len(calibration) >= 2 and len(test) >= 2
          assert not ({case['candidateFamily'] for case in calibration}
                      & {case['candidateFamily'] for case in test})
          assert not ({case['structuralSignatureHash'] for case in calibration}
                      & {case['structuralSignatureHash'] for case in test})

          labeled_payload = {
              'schema': 'regelsuche.independent-review-labeled-evaluation/v1',
              'studyPlanHash': intake['studyPlanHash'],
              'predictiveCorpusHash': intake['predictiveCorpusHash'],
              'thresholdLockHash': intake['thresholdLockHash'],
              'minimumIndependentExpertReviews': intake['minimumIndependentExpertReviews'],
              'revision': intake['revision'],
              'priorLabeledEvaluationHash': intake['priorLabeledEvaluationHash'],
              'evidenceStatus': intake['evidenceStatus'],
              'decisions': intake['decisions'],
              'candidateStatuses': intake['candidateStatuses'],
          }
          assert intake['labeledEvaluationHash'] == hash_payload(labeled_payload)
          intake_without_hash = dict(intake)
          intake_without_hash.pop('contentHash')
          assert intake['contentHash'] == hash_payload(intake_without_hash)
          assert intake['studyPlanHash'] == plan['contentHash']
          assert intake['predictiveCorpusHash'] == plan['predictiveCorpusHash']
          assert intake['thresholdLockHash'] == plan['thresholdLockHash']

          assert intake['evidenceStatus'] == 'DEVELOPMENT_ONLY'
          assert all(item['origin'] == 'DEVELOPMENT_FIXTURE'
                     for item in intake['decisions'])
          assert all(item['outcome'] == 'DEVELOPMENT_ONLY'
                     for item in intake['decisions'])
          assert all(item['countedExpertReviews'] == 0
                     for item in intake['candidateStatuses'])
          assert all(item['status'] == 'DEVELOPMENT_ONLY'
                     for item in intake['candidateStatuses'])
          assert intake['promotionStatus'] == 'NOT_EVALUATED'
          assert intake['publicEvidenceStatus'] == 'NOT_EVALUATED'
          PY

      - name: Upload protocol-validation evidence and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: independent-interestingness-review-protocol
          path: |
            regelsuche-learning/build/reports/independent-review-protocol/**
            regelsuche-learning/build/reports/tests/**
            regelsuche-learning/build/test-results/**
            docs/schemas/regelsuche-independent-review-*.schema.json
          if-no-files-found: warn
