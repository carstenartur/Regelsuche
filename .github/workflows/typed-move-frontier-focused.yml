name: Typed move frontier review QA
on:
  push:
    branches: [qa/typed-move-frontier-red-20260918]
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: c590f1043e62d006dbc2b1f5a359869b706b695d
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Run focused typed frontier and codec tests
        run: mvn --batch-mode --no-transfer-progress -pl regelsuche-search -am -Dtest=StagedMoveSearchTest,CompiledAstReplayCodecTest -Dsurefire.failIfNoSpecifiedTests=false test
