name: Temporary Java 25 development toolchain
on:
  push:
    branches: [ 'qa/java25-local-toolchain-20260919' ]
permissions:
  contents: read
jobs:
  export-java:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '25'
          verify-signature: true
      - name: Retain only the public JDK distribution for disconnected local tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/public-toolchain"
          cd "$RUNNER_TEMP/public-toolchain"
          java -version 2> java-version.txt
          tar -czf temurin25-linux-x64.tar.gz -C "$JAVA_HOME" .
          sha256sum temurin25-linux-x64.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: public-java25-toolchain
          path: ${{ runner.temp }}/public-toolchain/
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
