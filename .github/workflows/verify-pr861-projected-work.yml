name: Verify PR 861 projected work authority

on:
  push:
    branches:
      - feature/748-on-demand-verified-factorization-adapter-v2
    paths:
      - .github/workflows/verify-pr861-projected-work.yml

permissions:
  contents: write

concurrency:
  group: pr861-projected-work-finalizer
  cancel-in-progress: false

jobs:
  verify-and-finalize:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - name: Check out the PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/748-on-demand-verified-factorization-adapter-v2
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Ensure the correction is applied
        run: |
          if grep -q 'interface PolynomialWorkProjection' \
              regelsuche-core/src/main/java/de/regelsuche/polynomial/PolynomialWorkProjection.java 2>/dev/null \
              && grep -q 'nativeRuntimeProjection' \
              regelsuche-experiments/src/main/java/de/regelsuche/benchmark/polynomial/PolynomialTheoryUtilityCanonicalWorkProjection.java; then
            echo 'Projected-work source is already present.'
          elif [ -f tools/apply_pr861_projected_work_v3.py ]; then
            python3 tools/apply_pr861_projected_work_v3.py
          else
            echo 'Neither the applied source nor the recovery bootstrap is present.' >&2
            exit 1
          fi

      - name: Run affected tests and retain concise failure evidence
        id: focused
        shell: bash
        run: |
          set +e
          mvn --batch-mode --no-transfer-progress \
            -pl app -am \
            -Dtest=PolynomialWorkProjectionTest,PolynomialWorkBudgetProjectionTest,NativeUnivariateEngineWorkAuthorityTest,PolynomialTheoryUtilityRuntimeProjectionParityTest,PolynomialTheoryUtilityTerminalStatusTest,PolynomialTheoryUtilityOnDemandWorkCharacterizationTest,PolynomialTheoryUtilityOnDemandVerifiedFactorizationAdapterTest,PolynomialTheoryUtilityOnDemandProfileMatrixTest \
            -Dsurefire.failIfNoSpecifiedTests=false \
            test 2>&1 | tee /tmp/pr861-focused.log
          status=${PIPESTATUS[0]}
          set -e
          echo "status=${status}" >> "$GITHUB_OUTPUT"

      - name: Commit concise failure evidence
        if: steps.focused.outputs.status != '0'
        run: |
          {
            echo '# PR 861 projected-work focused verification failure'
            echo
            echo '## Surefire failures and errors'
            grep -R -h -E '<failure|<error' -- */target/surefire-reports/TEST-*.xml 2>/dev/null || true
            echo
            echo '## Relevant Maven summary'
            grep -E '^\[ERROR\]|Tests run:|BUILD FAILURE|COMPILATION ERROR' /tmp/pr861-focused.log | tail -n 160 || true
          } > tools/pr861-bootstrap-failure.log
          git add tools/pr861-bootstrap-failure.log
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Record PR 861 projected-work verification failure'
          git push origin HEAD:feature/748-on-demand-verified-factorization-adapter-v2
          exit 1

      - name: Write the permanent authority note
        if: steps.focused.outputs.status == '0'
        run: |
          mkdir -p docs/architecture
          cat > docs/architecture/projected-polynomial-work-authority.md <<'EOF'
          # Projected polynomial work authority

          Native polynomial algorithms retain a complete raw, stage-labelled
          work ledger. A caller may additionally declare a stable, monotone
          projection that converts cumulative raw instrumentation units into the
          scientific work units owned by that caller.

          The execution budget charges the incremental projected delta for each
          stage while preserving every raw ledger entry. The target-blind
          polynomial-utility experiment uses the same projection identity and
          stage quanta both during native execution and when it validates final
          evidence. Structural hashes, UTF-8 evidence payloads and source-text
          scans therefore cannot be priced one way at runtime and a second way
          after the run.

          Nested native polynomial budgets inherit the active projection scope.
          The default remains one raw unit per work unit, preserving all callers
          that do not opt into a declared projection.

          Multi-occurrence evaluation is all-or-none at its terminal boundary:
          a successful occurrence may not hide a budget-inconclusive,
          unsupported or technically failed sibling occurrence. Such a mixed
          result is rejected before it can be labelled a validated transition.

          This mechanism neither truncates ledgers nor raises frozen experiment
          authorities. If the declared projected budget is insufficient, the
          native result remains `BUDGET_INCONCLUSIVE`.
          EOF

      - name: Commit verified source and remove all bootstrap artifacts
        if: steps.focused.outputs.status == '0'
        run: |
          rm -f tools/apply_pr861_projected_work.py
          rm -f tools/apply_pr861_projected_work_v2.py
          rm -f tools/apply_pr861_projected_work_v3.py
          rm -f tools/.apply_pr861_projected_work_runtime.py
          rm -f .github/workflows/apply-pr861-projected-work.yml
          rm -f .github/workflows/apply-pr861-projected-work-v3.yml
          rm -f .github/workflows/verify-pr861-projected-work.yml
          rm -f tools/_connector_local_path_probe.txt
          rm -f tools/pr861-bootstrap-failure.log
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No verified source or cleanup change remained.' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Finalize projected native polynomial work authority'
          git push origin HEAD:feature/748-on-demand-verified-factorization-adapter-v2
