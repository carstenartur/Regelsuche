name: Debug PR 695 occurrence bridge

on:
  push:
    branches:
      - debug/pr695-occurrence-bridge

permissions:
  contents: write

jobs:
  diagnostics:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
      - name: Apply the focused fix under test
        shell: bash
        run: |
          set -euo pipefail
          echo '713026f19cf3a41b9e862262efc1855c127a53b644a84ff125d9cbcf8eef6559  debug/pr695-occurrence-fix.patch' \
            | sha256sum --check --strict
          git apply --check debug/pr695-occurrence-fix.patch
          git apply debug/pr695-occurrence-fix.patch
          git diff --check
      - name: Run the formerly failing contract and diagnostics
        run: |
          ./gradlew --no-daemon \
            :regelsuche-discovery:test \
            --tests de.regelsuche.discovery.representation.TargetFreeRepresentationEvaluationPlanTest.occurrenceLocalBridgeIsActuallyExposedAfterFreeze \
            --tests de.regelsuche.discovery.representation.TargetFreeRepresentationEvaluationPlanDiagnosticsTest \
            --console=plain
      - name: Publish diagnostic XML to the branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p debug/results
          cp regelsuche-discovery/build/test-results/test/TEST-de.regelsuche.discovery.representation.TargetFreeRepresentationEvaluationPlanDiagnosticsTest.xml \
            debug/results/diagnostics.xml
          cp regelsuche-discovery/build/test-results/test/TEST-de.regelsuche.discovery.representation.TargetFreeRepresentationEvaluationPlanTest.xml \
            debug/results/contract.xml
          git restore . ':!debug/results'
          git clean -fd -e debug/results
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add debug/results
          git commit -m 'Record fixed PR 695 occurrence verification'
          git push
      - name: Retain diagnostic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr695-occurrence-diagnostics
          path: |
            regelsuche-discovery/build/test-results/test/**
            regelsuche-discovery/build/reports/tests/test/**
