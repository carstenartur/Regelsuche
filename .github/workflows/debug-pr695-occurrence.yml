name: Debug PR 695 occurrence bridge

on:
  push:
    branches:
      - debug/pr695-occurrence-bridge

permissions:
  contents: write

jobs:
  diagnostics:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
      - name: Run focused diagnostic
        run: |
          ./gradlew --no-daemon \
            :regelsuche-discovery:test \
            --tests de.regelsuche.discovery.representation.TargetFreeRepresentationEvaluationPlanDiagnosticsTest \
            --console=plain
      - name: Publish diagnostic XML to the branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          source_file='regelsuche-discovery/build/test-results/test/TEST-de.regelsuche.discovery.representation.TargetFreeRepresentationEvaluationPlanDiagnosticsTest.xml'
          test -f "$source_file"
          mkdir -p debug
          cp "$source_file" debug/pr695-occurrence-diagnostics.xml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add debug/pr695-occurrence-diagnostics.xml
          git commit -m 'Record PR 695 occurrence diagnostics'
          git push
      - name: Retain diagnostic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr695-occurrence-diagnostics
          path: |
            regelsuche-discovery/build/test-results/test/**
            regelsuche-discovery/build/reports/tests/test/**
