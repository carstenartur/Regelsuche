name: Release Readiness

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: release-readiness-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0
      - name: Run repository-owned release readiness verification
        run: bash scripts/run-release-readiness-verification.sh
      - name: Upload evidence and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-readiness
          path: |
            build/logs/release-readiness-*.log
            app/build/reports/hidden-rule-pilot/**
            app/build/test-results/test/**
            regelsuche-release/build/reports/release-readiness-qualified/**
            build/release-readiness-docker-output/**
          if-no-files-found: warn
