name: Release Readiness

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: release-readiness-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0

      - name: Generate hidden-rule and qualified release evidence
        shell: bash
        run: |
          set -o pipefail
          ./gradlew \
            :app:test \
            --tests de.regelsuche.docs.HiddenRulePilotCampaignTest \
            :regelsuche-release:runQualifiedReleaseReadinessWithHiddenRuleEvidence \
            2>&1 | tee release-readiness-build.log

      - name: Require evidence artifacts
        shell: bash
        run: |
          test -s app/build/reports/hidden-rule-pilot/report.json
          test -s app/build/reports/hidden-rule-pilot/runtime.json
          DIR=regelsuche-release/build/reports/release-readiness-qualified
          for file in profiles.json evidence-summary.json \
            hidden-rule-release-evidence.json release-readiness-report.json \
            release-readiness-run.json; do test -s "$DIR/$file"; done
          for file in production-campaign-manifest.json \
            campaign-resource-ledger.json feedback-reallocation.json \
            proof-report.json solver-obligation.json solver-result.json \
            production-lifecycle-run.json; do test -s "$DIR/campaign/$file"; done
          test ! -e "$DIR/campaign/proof-obligation.json"
          for file in qualification-suite.json qualification-split-audit.json \
            qualification-evaluation.json qualification-utility.json \
            candidate-qualification-evidence.json \
            candidate-qualification-run.json; do \
            test -s "$DIR/qualification/$file"
          done

      - name: Validate versioned release schemas
        shell: bash
        run: |
          python -m pip install \
            --disable-pip-version-check \
            --quiet \
            jsonschema==4.25.1
          python - <<'PY'
          import json
          from pathlib import Path

          from jsonschema import Draft202012Validator

          root = Path("regelsuche-release/build/reports/release-readiness-qualified")
          schemas = Path("docs/schemas")
          pairs = [
              (
                  schemas / "regelsuche-autonomous-candidate-qualification-suite-v1.schema.json",
                  root / "qualification/qualification-suite.json",
              ),
              (
                  schemas / "regelsuche-autonomous-candidate-qualification-split-v1.schema.json",
                  root / "qualification/qualification-split-audit.json",
              ),
              (
                  schemas / "regelsuche-open-target-conjecture-evaluation-v1.schema.json",
                  root / "qualification/qualification-evaluation.json",
              ),
              (
                  schemas / "regelsuche-autonomous-candidate-qualified-utility-v1.schema.json",
                  root / "qualification/qualification-utility.json",
              ),
              (
                  schemas / "regelsuche-autonomous-candidate-qualification-v1.schema.json",
                  root / "qualification/candidate-qualification-evidence.json",
              ),
              (
                  schemas / "regelsuche-autonomous-candidate-qualification-run-v1.schema.json",
                  root / "qualification/candidate-qualification-run.json",
              ),
              (
                  schemas / "regelsuche-release-readiness-matrix-v1.schema.json",
                  root / "release-readiness-report.json",
              ),
              (
                  schemas / "regelsuche-release-readiness-run-v1.schema.json",
                  root / "release-readiness-run.json",
              ),
              (
                  schemas / "regelsuche-solver-obligation-v1.schema.json",
                  root / "campaign/solver-obligation.json",
              ),
              (
                  schemas / "regelsuche-solver-result-v1.schema.json",
                  root / "campaign/solver-result.json",
              ),
              (
                  schemas / "regelsuche-open-target-conjecture-proof-v2.schema.json",
                  root / "campaign/proof-report.json",
              ),
              (
                  schemas / "regelsuche-autonomous-production-lifecycle-v3.schema.json",
                  root / "campaign/production-lifecycle-run.json",
              ),
          ]
          for schema_path, artifact_path in pairs:
              schema = json.loads(schema_path.read_text(encoding="utf-8"))
              artifact = json.loads(artifact_path.read_text(encoding="utf-8"))
              Draft202012Validator.check_schema(schema)
              Draft202012Validator(schema).validate(artifact)
              print(f"validated {artifact_path} against {schema_path}")

          obligation = json.loads((root / "campaign/solver-obligation.json").read_text())
          result = json.loads((root / "campaign/solver-result.json").read_text())
          proof = json.loads((root / "campaign/proof-report.json").read_text())
          lifecycle = json.loads((root / "campaign/production-lifecycle-run.json").read_text())
          assert result["obligationHash"] == obligation["contentHash"]
          assert proof["solverObligationHash"] == obligation["contentHash"]
          assert proof["solverResultHash"] == result["contentHash"]
          assert lifecycle["solverObligationHash"] == obligation["contentHash"]
          assert lifecycle["solverResultHash"] == result["contentHash"]
          assert result["status"] == "CONFIRMED"
          assert result["translationStatus"] == "LOSSLESS"
          PY

      - name: Verify independently bound profiles and candidate qualification
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("regelsuche-release/build/reports/release-readiness-qualified")
          matrix = json.loads((root / "release-readiness-report.json").read_text())
          hidden = json.loads((root / "hidden-rule-release-evidence.json").read_text())
          run = json.loads((root / "release-readiness-run.json").read_text())
          qualification = json.loads(
              (root / "qualification/candidate-qualification-evidence.json").read_text()
          )
          split = json.loads(
              (root / "qualification/qualification-split-audit.json").read_text()
          )
          utility = json.loads(
              (root / "qualification/qualification-utility.json").read_text()
          )

          profiles = {item["profile"]: item for item in matrix["profiles"]}
          assert profiles["HIDDEN_RULE_REDISCOVERY"]["status"] == "READY"
          assert profiles["HIDDEN_RULE_REDISCOVERY"]["blockers"] == []
          assert profiles["OPEN_TARGET_DISCOVERY"]["status"] == "READY"
          assert profiles["AUTONOMOUS_CAMPAIGN"]["status"] == "READY"
          assert profiles["AUTONOMOUS_CAMPAIGN"]["blockers"] == []
          assert profiles["EXTERNAL_NOVELTY_REVIEW"]["status"] == "BLOCKED"

          assert (hidden["cases"], hidden["families"]) == (20, 4)
          assert hidden["configuredNegativeHoldouts"] == 40
          assert hidden["executedNegativeHoldouts"] == 38
          assert hidden["skippedNegativeHoldouts"] == 2
          assert hidden["falsePositiveHoldouts"] == 0
          assert hidden["hiddenReferenceIsolated"] is True
          assert hidden["benchmarkComplete"] is True
          assert hidden["executableRediscoveryRetained"] is True

          assert split["passed"] is True
          assert split["heldOutFamilyOrClusterCount"] == 1
          assert split["upstreamCollisions"] == []
          assert split["internalCollisions"] == []
          assert qualification["configuredPositiveHoldouts"] == 12
          assert qualification["executedPositiveHoldouts"] == 12
          assert qualification["configuredNegativeHoldouts"] == 12
          assert qualification["executedNegativeHoldouts"] == 12
          assert qualification["mandatorySkippedWorkCount"] == 0
          assert qualification["refutingHoldouts"] == 0
          assert qualification["counterexamplesFound"] == 0
          assert qualification["pairedHeldOutUtilityEvaluated"] is True
          assert qualification["pairedUtilityPermille"] > 0
          assert qualification["correctnessRegressionCount"] == 0
          assert qualification["qualified"] is True
          assert utility["beneficial"] is True
          assert utility["materialGainCount"] > 0
          assert utility["correctnessRegressionCount"] == 0

          assert matrix["hiddenRuleEvidenceHash"] == hidden["evidenceHash"]
          assert run["hiddenRuleEvidenceStatus"] == "BOUND"
          assert run["hiddenRuleEvidenceHash"] == hidden["evidenceHash"]
          assert run["qualificationEvidenceStatus"] == "BOUND"
          assert run["qualificationEvidenceHash"] == qualification["contentHash"]
          assert matrix["autonomousCampaignStatus"] == "READY"
          assert matrix["autonomyClaimAuthorized"] is True
          assert run["autonomousCampaignStatus"] == "READY"
          assert run["autonomyClaimAuthorized"] is True
          assert run["promotionStatus"] == "NOT_EVALUATED"
          assert run["publicEvidenceStatus"] == "NOT_EVALUATED"
          PY

      - name: Build qualified release runtime image
        shell: bash
        run: docker build -f Dockerfile.release-readiness -t regelsuche-release-readiness .

      - name: Reproduce qualified release evidence in Docker
        shell: bash
        run: |
          mkdir -p build/release-readiness-docker-output
          chmod 0777 build/release-readiness-docker-output
          docker run --rm \
            -v "$PWD/build/release-readiness-docker-output:/output" \
            -v "$PWD/app/build/reports/hidden-rule-pilot/report.json:/input/hidden-rule-report.json:ro" \
            regelsuche-release-readiness \
            /output \
            --hidden-rule-report /input/hidden-rule-report.json \
            --qualify-candidate \
            --require-ready \
            2>&1 | tee release-readiness-docker.log

      - name: Compare Gradle and Docker evidence byte-for-byte
        shell: bash
        run: |
          diff -ru \
            regelsuche-release/build/reports/release-readiness-qualified \
            build/release-readiness-docker-output

      - name: Upload evidence and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-readiness
          path: |
            release-readiness-build.log
            release-readiness-docker.log
            app/build/reports/hidden-rule-pilot/**
            app/build/test-results/test/**
            regelsuche-release/build/reports/release-readiness-qualified/**
            build/release-readiness-docker-output/**
          if-no-files-found: warn
