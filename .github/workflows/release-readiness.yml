name: Release Readiness

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: release-readiness-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  readiness:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0

      - name: Generate hidden-rule and release evidence
        shell: bash
        run: |
          set -o pipefail
          ./gradlew \
            :app:test \
            --tests de.regelsuche.docs.HiddenRulePilotCampaignTest \
            :regelsuche-release:runReleaseReadinessWithHiddenRuleEvidence \
            2>&1 | tee release-readiness-build.log

      - name: Require evidence artifacts
        shell: bash
        run: |
          test -s app/build/reports/hidden-rule-pilot/report.json
          test -s app/build/reports/hidden-rule-pilot/runtime.json
          DIR=regelsuche-release/build/reports/release-readiness
          for file in profiles.json evidence-summary.json \
            hidden-rule-release-evidence.json release-readiness-report.json \
            release-readiness-run.json; do test -s "$DIR/$file"; done
          for file in production-campaign-manifest.json \
            campaign-resource-ledger.json feedback-reallocation.json \
            proof-obligation.json; do test -s "$DIR/campaign/$file"; done

      - name: Verify independently bound profiles
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("regelsuche-release/build/reports/release-readiness")
          matrix = json.loads((root / "release-readiness-report.json").read_text())
          hidden = json.loads((root / "hidden-rule-release-evidence.json").read_text())
          run = json.loads((root / "release-readiness-run.json").read_text())
          profiles = {item["profile"]: item for item in matrix["profiles"]}
          assert profiles["HIDDEN_RULE_REDISCOVERY"]["status"] == "READY"
          assert profiles["HIDDEN_RULE_REDISCOVERY"]["blockers"] == []
          assert profiles["OPEN_TARGET_DISCOVERY"]["status"] == "READY"
          assert profiles["AUTONOMOUS_CAMPAIGN"]["blockers"] == [
              "BALANCED_RELEASE_HOLDOUT_SUITE",
              "HELD_OUT_FAMILY_OR_CLUSTER",
              "PAIRED_HELD_OUT_UTILITY",
          ]
          assert (hidden["cases"], hidden["families"]) == (20, 4)
          assert hidden["configuredNegativeHoldouts"] == 40
          assert hidden["executedNegativeHoldouts"] == 38
          assert hidden["skippedNegativeHoldouts"] == 2
          assert hidden["falsePositiveHoldouts"] == 0
          assert hidden["hiddenReferenceIsolated"] is True
          assert hidden["benchmarkComplete"] is True
          assert hidden["executableRediscoveryRetained"] is True
          assert matrix["hiddenRuleEvidenceHash"] == hidden["evidenceHash"]
          assert run["hiddenRuleEvidenceStatus"] == "BOUND"
          assert run["hiddenRuleEvidenceHash"] == hidden["evidenceHash"]
          assert matrix["autonomyClaimAuthorized"] is False
          PY

      - name: Upload evidence and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-readiness
          path: |
            release-readiness-build.log
            app/build/reports/hidden-rule-pilot/**
            app/build/test-results/test/**
            regelsuche-release/build/reports/release-readiness/**
          if-no-files-found: warn
