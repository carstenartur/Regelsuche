name: Candidate-Independent Benchmark

on:
  push:
    branches: [ "main" ]
    paths:
      - 'build.gradle'
      - 'research/benchmarks/candidate-independent/**'
      - 'scripts/verify-candidate-independent-preregistration.py'
      - 'docs/candidate-independent-benchmark.md'
      - '.github/workflows/candidate-independent-benchmark.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'build.gradle'
      - 'research/benchmarks/candidate-independent/**'
      - 'scripts/verify-candidate-independent-preregistration.py'
      - 'docs/candidate-independent-benchmark.md'
      - '.github/workflows/candidate-independent-benchmark.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6.1.0
      - name: Verify frozen preregistration
        run: ./gradlew verifyCandidateIndependentBenchmark --console=plain
