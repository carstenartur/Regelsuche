name: Evolution Genome Evidence

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: evolution-genome-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evidence:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0

      - name: Verify genome, preflight, replay, compiler and mutation contracts
        run: |
          ./gradlew :regelsuche-learning:test \
            --tests 'de.regelsuche.evolution.*'

      - name: Require retained deterministic mutation lineage
        run: test -s regelsuche-learning/build/reports/evolution/mutation-batch.json

      - name: Upload evolution foundation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evolution-genome-evidence
          path: |
            regelsuche-learning/build/reports/evolution/**
            regelsuche-learning/build/reports/tests/**
            regelsuche-learning/build/test-results/**
          if-no-files-found: warn
