name: Branch Source Fix

on:
  push:
    branches: [ "issue-104-authenticated-trust-state" ]
    paths:
      - '.github/workflows/branch-source-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: issue-104-authenticated-trust-state

      - name: Apply exact source fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          revision = Path(
              'app/src/main/java/de/regelsuche/plugin/PluginTrustStoreRevision.java')
          text = revision.read_text(encoding='utf-8')
          text = text.replace(
              'import com.fasterxml.jackson.core.JsonProcessingException;\n',
              'import com.fasterxml.jackson.core.JsonFactory;\n'
              'import com.fasterxml.jackson.core.JsonProcessingException;\n'
              'import com.fasterxml.jackson.core.StreamReadFeature;\n',
          )
          text = text.replace(
              'private static final ObjectMapper JSON = new ObjectMapper()\n'
              '        .findAndRegisterModules()\n',
              'private static final ObjectMapper JSON = new ObjectMapper(\n'
              '        JsonFactory.builder()\n'
              '            .enable(StreamReadFeature.STRICT_DUPLICATE_DETECTION)\n'
              '            .build())\n'
              '        .findAndRegisterModules()\n',
          )
          revision.write_text(text, encoding='utf-8')

          verifier = Path(
              'app/src/main/java/de/regelsuche/plugin/'
              'PluginTrustStoreRevisionVerifier.java')
          text = verifier.read_text(encoding='utf-8')
          text = text.replace(
              'import com.fasterxml.jackson.core.JsonProcessingException;\n',
              'import com.fasterxml.jackson.core.JsonFactory;\n'
              'import com.fasterxml.jackson.core.JsonProcessingException;\n'
              'import com.fasterxml.jackson.core.StreamReadFeature;\n',
          )
          text = text.replace(
              'private static final ObjectMapper JSON = new ObjectMapper()\n'
              '            .findAndRegisterModules()\n'
              '            .enable(DeserializationFeature.FAIL_ON_UNKNOWN_PROPERTIES)\n'
              '            .enable(DeserializationFeature.FAIL_ON_TRAILING_TOKENS);',
              'private static final ObjectMapper JSON = new ObjectMapper(\n'
              '            JsonFactory.builder()\n'
              '                .enable(StreamReadFeature.STRICT_DUPLICATE_DETECTION)\n'
              '                .build())\n'
              '            .findAndRegisterModules()\n'
              '            .enable(DeserializationFeature.FAIL_ON_UNKNOWN_PROPERTIES)\n'
              '            .enable(DeserializationFeature.FAIL_ON_TRAILING_TOKENS);',
          )
          marker = (
              '    private static String hash(String value) {\n'
              '        return PluginArtifactVerifier.sha256('\
              'value.getBytes(StandardCharsets.UTF_8));\n'
              '    }\n'
          )
          replacement = (
              '    private static String hash(byte[] value) {\n'
              '        return PluginArtifactVerifier.sha256(value);\n'
              '    }\n\n'
              + marker
          )
          if 'private static String hash(byte[] value)' not in text:
              if marker not in text:
                  raise SystemExit('hash(String) marker not found')
              text = text.replace(marker, replacement)
          verifier.write_text(text, encoding='utf-8')
          PY

          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            app/src/main/java/de/regelsuche/plugin/PluginTrustStoreRevision.java \
            app/src/main/java/de/regelsuche/plugin/PluginTrustStoreRevisionVerifier.java
          git commit -m 'fix(plugins): compile and harden trust revision parsing'
          git push origin HEAD:issue-104-authenticated-trust-state
