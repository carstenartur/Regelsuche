name: PR 1075 exact-head regression verification
on:
  push:
    branches: [diagnostic/pr1075-before-rebase-20261009]
permissions:
  contents: read
jobs:
  regressions:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 89fae2d204388ba82333e8e890338a281081219a
          path: verified-source
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '25'
          verify-signature: true
      - name: Verify source identity and unchanged workflow policy
        working-directory: verified-source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 89fae2d204388ba82333e8e890338a281081219a
          test -z "$(git status --porcelain)"
          git ls-files '.github/workflows/*'
          if ! mvn --batch-mode --no-transfer-progress -pl maven-build-contract \
            -Dtest=MavenWorkflowSemanticsContractTest test > "$RUNNER_TEMP/workflow-contract.log" 2>&1; then
            tail -100 "$RUNNER_TEMP/workflow-contract.log"
            exit 1
          fi
          grep -E 'Tests run:|BUILD SUCCESS' "$RUNNER_TEMP/workflow-contract.log"
      - name: Run all SDK and dependency-reactor tests without exclusions
        working-directory: verified-source
        shell: bash
        run: |
          set -euo pipefail
          if ! mvn --batch-mode --no-transfer-progress -Psdk-release -pl regelsuche-optimization-sdk -am \
            test > "$RUNNER_TEMP/sdk-regressions.log" 2>&1; then
            tail -130 "$RUNNER_TEMP/sdk-regressions.log"
            exit 1
          fi
          grep -E 'Tests run:|BUILD SUCCESS' "$RUNNER_TEMP/sdk-regressions.log" | tail -35
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as E
          paths = sorted(pathlib.Path('regelsuche-optimization-sdk/target/surefire-reports').glob('TEST-*.xml'))
          assert paths, 'SDK test reports must exist'
          totals = dict.fromkeys(('tests','failures','errors','skipped'),0)
          for p in paths:
              root=E.parse(p).getroot()
              for key in totals: totals[key]+=int(root.get(key,'0'))
          assert totals['tests'] > 0 and all(totals[k]==0 for k in ('failures','errors','skipped')), totals
          print('EXACT_HEAD=89fae2d204388ba82333e8e890338a281081219a SDK_TOTALS=' + str(totals))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: pr1075-exact-head-regressions-${{ github.run_id }}
          retention-days: 7
          path: |
            ${{ runner.temp }}/workflow-contract.log
            ${{ runner.temp }}/sdk-regressions.log
            verified-source/maven-build-contract/target/surefire-reports/**
            verified-source/regelsuche-optimization-sdk/target/surefire-reports/**
