name: Temporary apply Zenodo lineage repair

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
    paths:
      - .github/scripts/temporary-apply-zenodo-lineage.py
      - .github/workflows/temporary-apply-zenodo-lineage.yml

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.head_ref == 'release/audit-v0.3.0'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply the reviewed lineage contract
        run: |
          set -euo pipefail
          python3 .github/scripts/temporary-apply-zenodo-lineage.py
          bash -n .github/scripts/audit-published-release.sh
          git diff --check

      - name: Commit only the permanent audit files
        run: |
          set -euo pipefail
          rm -- \
            .github/scripts/temporary-apply-zenodo-lineage.py \
            .github/workflows/temporary-apply-zenodo-lineage.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git diff --cached --check
          git commit -m 'Follow the authoritative Zenodo version lineage'
          git push origin "HEAD:${{ github.head_ref }}"
