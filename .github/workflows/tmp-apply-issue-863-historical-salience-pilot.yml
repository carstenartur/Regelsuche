name: Apply issue 863 historical salience pilot chunks

on:
  push:
    branches:
      - feature/863-historical-salience-pilot-v1

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Apply issue 863 historical salience pilot payload v2'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Check out exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Verify, apply and commit reviewed payload
        shell: bash
        run: |
          set -euo pipefail
          payload="$RUNNER_TEMP/issue-863-historical-salience-pilot.patch.gz"
          cat \
            .github/automation/issue863-part-00 \
            .github/automation/issue863-part-01 \
            .github/automation/issue863-part-02 \
            .github/automation/issue863-part-03 \
            .github/automation/issue863-part-04 \
            .github/automation/issue863-part-05 \
            > "$payload"
          echo '76701651f67594ab7348c5c151f78d1bbd4ca213a4b36731cb78722e6176bcd7  '"$payload" | sha256sum -c -
          gzip -t "$payload"
          gzip -dc "$payload" | git apply --index --whitespace=error-all
          git rm .github/automation/issue863-part-00
          git rm .github/automation/issue863-part-01
          git rm .github/automation/issue863-part-02
          git rm .github/automation/issue863-part-03
          git rm .github/automation/issue863-part-04
          git rm .github/automation/issue863-part-05
          git rm .github/workflows/tmp-apply-issue-863-historical-salience-pilot.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add hard held-out representation salience pilot'
          git push origin HEAD:feature/863-historical-salience-pilot-v1
