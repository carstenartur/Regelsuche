name: Tighten PR 625 aggregate assessment

on:
  push:
    branches:
      - research/historical-rediscovery-atlas-v1

permissions:
  contents: write

jobs:
  tighten:
    name: Align aggregate claims with target-blind evidence
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: research/historical-rediscovery-atlas-v1
          fetch-depth: 0

      - name: Apply the reviewed assessment invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_between(
              text: str,
              start_marker: str,
              end_marker: str,
              replacement: str,
              label: str,
          ) -> str:
              start = text.find(start_marker)
              end = text.find(end_marker, start + len(start_marker))
              if start < 0 or end < 0:
                  raise SystemExit(
                      f"cannot locate {label}: start={start}, end={end}"
                  )
              return text[:start] + replacement + text[end:]

          source = Path(
              "regelsuche-experiments/src/main/java/de/regelsuche/benchmark/"
              "HistoricalRediscoveryAtlas.java"
          )
          text = source.read_text(encoding="utf-8")

          equivalence_replacement = (
              "            boolean hasNegativeEquivalenceControl = results.stream()\n"
              "                .anyMatch(result ->\n"
              "                    result.benchmarkCase().role()\n"
              "                        == Role.NEGATIVE_CONTROL);\n"
              "            boolean equivalence = hasNegativeEquivalenceControl\n"
              "                && results.stream()\n"
              "                    .filter(result ->\n"
              "                        result.benchmarkCase().role()\n"
              "                            == Role.NEGATIVE_CONTROL)\n"
              "                    .allMatch(result ->\n"
              "                        result.equivalence().evaluated()\n"
              "                            && !result.equivalence().equivalent())\n"
              "                && results.stream()\n"
              "                    .filter(result ->\n"
              "                        result.benchmarkCase().relation()\n"
              "                            == Relation.EQUIVALENT)\n"
              "                    .anyMatch(result ->\n"
              "                        result.equivalence().equivalent());\n"
          )
          text = replace_between(
              text,
              "            boolean equivalence = results.stream()\n",
              "            boolean productionPositive = results.stream()\n",
              equivalence_replacement,
              "equivalence assessment block",
          )

          policy_replacement = (
              "            boolean searchPolicy = counts.getOrDefault(\n"
              "                PrimaryStatus\n"
              "                    .REACHABLE_BUT_SCALAR_MISSED_DIVERSITY_FOUND,\n"
              "                0) > 0;\n"
          )
          text = replace_between(
              text,
              "            boolean searchPolicy = counts.getOrDefault(\n",
              "            boolean genericBridge = counts.getOrDefault(\n",
              policy_replacement,
              "search-policy assessment block",
          )

          old_reason = (
              '"matched-work search policies produce different '
              'reachability outcomes"'
          )
          new_reason = (
              '"target-blind scalar and structural-diversity searches differ '
              'under the same declared heuristic budget"'
          )
          if text.count(old_reason) != 1:
              raise SystemExit(
                  f"expected one search-policy reason, found {text.count(old_reason)}"
              )
          source.write_text(
              text.replace(old_reason, new_reason),
              encoding="utf-8",
          )

          test = Path(
              "regelsuche-experiments/src/test/java/de/regelsuche/benchmark/"
              "HistoricalRediscoveryAtlasTest.java"
          )
          test_text = test.read_text(encoding="utf-8")
          marker = (
              "    @Test\n"
              "    @Timeout(240)\n"
              "    void curatedHitDoesNotBecomeCapabilityGapBeforeProductionClosureCompletes() {\n"
          )
          if test_text.count(marker) != 1:
              raise SystemExit(
                  f"expected one test insertion marker, found {test_text.count(marker)}"
              )
          method = (
              "    @Test\n"
              "    @Timeout(240)\n"
              "    void equivalenceDiscriminationRequiresANegativeControl() {\n"
              "        Corpus full = HistoricalRediscoveryCorpus.load();\n"
              "        HistoricalRediscoveryCorpus.Case positive =\n"
              "            full.cases().stream()\n"
              "                .filter(value -> value.id().equals(\n"
              "                    \"difference-of-squares-powers\"))\n"
              "                .findFirst()\n"
              "                .orElseThrow();\n"
              "        Corpus positiveOnly = new Corpus(\n"
              "            full.schema(),\n"
              "            full.evidenceStatus(),\n"
              "            full.inventoryRevision(),\n"
              "            full.claimBoundary(),\n"
              "            full.contentSha256(),\n"
              "            List.of(positive));\n"
              "\n"
              "        HistoricalRediscoveryAtlas.AtlasReport report =\n"
              "            new HistoricalRediscoveryAtlas().run(positiveOnly);\n"
              "\n"
              "        assertTrue(report.cases().get(0).equivalence().equivalent());\n"
              "        assertFalse(\n"
              "            report.assessment().equivalenceLayerDiscriminates());\n"
              "    }\n"
              "\n"
          )
          test.write_text(
              test_text.replace(marker, method + marker),
              encoding="utf-8",
          )
          PY

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add \
            regelsuche-experiments/src/main/java/de/regelsuche/benchmark/HistoricalRediscoveryAtlas.java \
            regelsuche-experiments/src/test/java/de/regelsuche/benchmark/HistoricalRediscoveryAtlasTest.java
          git rm -- .github/workflows/pr625-tighten-assessment.yml
          git commit -m "Tighten historical atlas aggregate claims"
          git push origin HEAD:research/historical-rediscovery-atlas-v1
