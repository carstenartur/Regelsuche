name: Checked Lean proof boundary
on:
  pull_request:
    paths:
      - 'regelsuche-solver-portfolio/**'
      - '.ci/lean-proof/**'
      - 'app/src/**/de/regelsuche/proof/**'
      - '.github/workflows/checked-lean-proof.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Retain exact reviewed source snapshot
        run: git archive --format=zip --output=/tmp/checked-proof-source.zip HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: checked-proof-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/checked-proof-source.zip
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Run proof-boundary contracts
        run: mvn -B -pl regelsuche-solver-portfolio -am -Dtest=CheckedLeanProofTest -Dsurefire.failIfNoSpecifiedTests=false test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: checked-proof-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            regelsuche-solver-portfolio/target/surefire-reports/
            regelsuche-solver-portfolio/target/checked-proof/
  real-lean:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      REGELSUCHE_REAL_LEAN: 'true'
      REGELSUCHE_LEAN_PROJECT: ${{ github.workspace }}/.ci/lean-proof
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Install pinned Lean and mathlib reference environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y elan z3
          cd .ci/lean-proof
          lake update
          lake exe cache get
          lake env lean --version
      - name: Run actual Lean proofs and rejection controls
        run: mvn -B -pl app -am -Dtest=CheckedLeanRealTest,CheckedProofBridgeRealTest -Dsurefire.failIfNoSpecifiedTests=false test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: real-lean-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            regelsuche-solver-portfolio/target/checked-proof/
            regelsuche-solver-portfolio/target/surefire-reports/
            app/target/checked-proof/
            app/target/surefire-reports/
            .ci/lean-proof/lake-manifest.json

  app-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Verify application proof admission
        run: mvn -B -pl app -am -Dtest=CheckedProofBridgeTest,LeanProofBridgeTest,SmtProofBridgeTest,ProverExecutorAndBridgeTest,ProofBridgeServiceTest,ProofBridgeFormallyProvedTest,ProofWorkerTest,ProofScriptValidatorTest,UnifiedMathDomainWorkbenchTest,WebWorkbenchServerTest,Z3SmtSolverBackendTest -Dsurefire.failIfNoSpecifiedTests=false test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: app-proof-boundary-${{ github.run_id }}-${{ github.run_attempt }}
          path: app/target/surefire-reports/
