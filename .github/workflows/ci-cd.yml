name: CI/CD

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/assets/screenshots/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Complete checkout-local verification
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6.1.0
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-v1
      - name: Install Playwright host dependencies and Chromium
        run: ./gradlew :app:installPlaywrightHostDependencies :app:installPlaywrightBrowsers --console=plain
      - name: Run repository-owned verification contracts
        shell: bash
        run: |
          set -euo pipefail
          env -u GITHUB_SHA ./gradlew \
            docsLint \
            test \
            verifyDiscoveryGallery \
            verifyStaticReferencePage \
            jacocoTestReport \
            --console=plain
      - name: Render local coverage and test pages
        if: always()
        run: ./gradlew generateCiPages --console=plain
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
            **/build/reports/jacoco/**
            app/build/discovery-artifacts/**
          if-no-files-found: warn
      - name: Upload generated Pages content
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-pages
          path: public/**
          if-no-files-found: warn

  publish-pages:
    name: Publish coverage and test reports
    needs: verify
    if: needs.verify.result == 'success' && github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: ci-pages
          path: public
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: public
          keep_files: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'Update coverage and test reports (${{ github.sha }})'

  docs-assets:
    name: Refresh documentation screenshots and videos
    needs: verify
    if: needs.verify.result == 'success' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6.1.0
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-v1
      - name: Install Playwright host dependencies and Chromium
        run: ./gradlew :app:installPlaywrightHostDependencies :app:installPlaywrightBrowsers --console=plain
      - name: Record documentation media from browser tests
        run: ./gradlew :app:test :app:e2eTest -Pregelsuche.recordDocs=true -Pregelsuche.skipPlaywrightInstall=true --console=plain
      - name: Detect screenshot changes
        id: screenshot_changes
        run: |
          changed_files="$(git status --porcelain docs/assets/screenshots/ | awk '{print $2}')"
          if [ -z "$changed_files" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          {
            echo "files<<EOF"
            printf '%s\n' "$changed_files"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Create or update screenshot refresh PR
        id: screenshot_pr
        if: steps.screenshot_changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          branch: chore/docs-screenshots-refresh
          delete-branch: false
          commit-message: 'chore(docs): refresh demo-gallery screenshots'
          title: 'chore(docs): refresh demo-gallery screenshots'
          body: |
            Generated by the repository-owned Playwright documentation mode.

            Trigger commit: `${{ github.sha }}`

            Updated files:
            ${{ steps.screenshot_changes.outputs.files }}
          add-paths: docs/assets/screenshots/**
      - name: Upload generated documentation media
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: docs-media
          path: |
            docs/assets/screenshots/**
            docs/assets/videos/**
          if-no-files-found: warn

  benchmark-report:
    name: Benchmark quality report
    needs: verify
    if: needs.verify.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6.1.0
      - name: Generate benchmark report locally
        run: ./gradlew :app:benchmarkReport --console=plain
      - uses: actions/upload-artifact@v7
        with:
          name: benchmark-report
          path: |
            docs/benchmark-report.md
            docs/assets/benchmark-summary.json
