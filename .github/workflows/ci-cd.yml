name: CI/CD

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/assets/screenshots/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs-lint:
    name: Docs markdown lint (display math indentation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail on indented $$ display math in docs/
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys

          print("Rule: GitHub's MathJax-Renderer rendert `$$ … $$` nicht, wenn der Block in einer Liste eingerückt ist. Ziehe den Block auf Top-Level oder ersetze ihn durch Inline-Math `$…$`.")

          # Self-check of the lint logic: fenced-code content must be ignored.
          sample = [
              "```md",
              "  $$",
              "x^2",
              "  $$",
              "```",
              "",
              "  $$",
              "x^2",
              "  $$",
          ]
          in_fence = False
          sample_hits = []
          for idx, line in enumerate(sample, start=1):
              if re.match(r"^\s*```", line):
                  in_fence = not in_fence
                  continue
              if not in_fence and re.match(r"^[ \t]+\$\$", line):
                  sample_hits.append(idx)
          if sample_hits != [7, 9]:
              print("Internal lint self-check failed:", sample_hits)
              sys.exit(2)

          failures = []
          for md in sorted(Path("docs").rglob("*.md")):
              in_fence = False
              for lineno, line in enumerate(md.read_text(encoding="utf-8").splitlines(), start=1):
                  if re.match(r"^\s*```", line):
                      in_fence = not in_fence
                      continue
                  if in_fence:
                      continue
                  if re.match(r"^[ \t]+\$\$", line):
                      failures.append(f"{md}:{lineno}: indented display math `$$`")

          if failures:
              print("\nFound indented display-math blocks:")
              for item in failures:
                  print(item)
              sys.exit(1)

          print("OK: no indented display-math blocks in docs/**/*.md")
          PY

  unit-test:
    name: Unit & integration tests
    runs-on: ubuntu-latest
    needs: docs-lint
    permissions:
      contents: write   # required to publish reports to gh-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v3
      - name: Build, test, coverage
        run: ./gradlew build jacocoTestReport
      - name: Generate badge JSON for coverage & tests
        if: always()
        run: |
          python3 - <<'EOF'
          import json, os, glob, xml.etree.ElementTree as ET

          GREEN, YELLOW = 80, 60

          def colour(pct):
              if pct >= GREEN:
                  return 'brightgreen'
              if pct >= YELLOW:
                  return 'yellow'
              return 'red'

          # ── Coverage badge (JaCoCo INSTRUCTION counters) ──────────────────
          covered = missed = 0
          for jacoco_file in glob.glob('**/build/reports/jacoco/**/jacocoTestReport.xml',
                                        recursive=True):
              for counter in ET.parse(jacoco_file).getroot().iter('counter'):
                  if counter.get('type') == 'INSTRUCTION':
                      covered += int(counter.get('covered', 0))
                      missed  += int(counter.get('missed', 0))
          total = covered + missed
          pct = round(covered / total * 100) if total else 0
          coverage = {"schemaVersion": 1, "label": "coverage",
                      "message": f"{pct}%", "color": colour(pct)}

          os.makedirs('public/coverage', exist_ok=True)
          with open('public/coverage/badge.json', 'w') as f:
              json.dump(coverage, f)

          # Mirror the JaCoCo HTML report so gh-pages can serve it.
          import shutil
          for html_dir in glob.glob('**/build/reports/jacoco/test/html',
                                     recursive=True):
              shutil.copytree(html_dir, 'public/coverage', dirs_exist_ok=True)

          # ── Tests badge (Surefire / JUnit XML) ────────────────────────────
          tests = failures = errors = 0
          xml_files = []
          for root_dir in ('app/build/test-results/test', 'app/build/test-results/e2eTest'):
              xml_files.extend(glob.glob(f'{root_dir}/TEST-*.xml'))
          for path in xml_files:
              root = ET.parse(path).getroot()
              tests    += int(root.get('tests',    0))
              failures += int(root.get('failures', 0))
              errors   += int(root.get('errors',   0))
          failed = failures + errors
          passed = tests - failed
          if failed:
              msg, colr = f"{failed}/{tests} failed", 'red'
          else:
              msg, colr = f"{passed} passed", 'brightgreen'
          tests_badge = {"schemaVersion": 1, "label": "tests",
                         "message": msg, "color": colr}
          os.makedirs('public/tests', exist_ok=True)
          with open('public/tests/badge.json', 'w') as f:
              json.dump(tests_badge, f)

          # Mirror the JUnit HTML report so gh-pages can serve it.
          for html_dir in glob.glob('app/build/reports/tests/test'):
              shutil.copytree(html_dir, 'public/tests', dirs_exist_ok=True)

          print(f"Coverage: {pct}%   Tests: {tests} ({failed} failed)")
          EOF
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: app/build/reports/jacoco/test/**
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: '**/build/reports/tests/**'
      - name: Deploy coverage badge & report to GitHub Pages
        if: always() && github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: public
          keep_files: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'Update coverage + test report (${{ github.sha }})'

  browser-e2e:
    name: Browser end-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: unit-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v3
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-v1
      - name: Run browser E2E flows
        run: ./gradlew e2eTest
      - name: Upload E2E reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-reports
          path: |
            app/build/reports/tests/e2eTest/**
            app/build/test-results/e2eTest/**

  docs-assets:
    name: Refresh docs/assets screenshots & videos
    runs-on: ubuntu-latest
    needs: browser-e2e
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v3
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-v1
      - name: Record screenshots and videos
        run: ./gradlew e2eTest -Pregelsuche.recordDocs=true
      - name: Detect screenshot changes
        id: screenshot_changes
        run: |
          changed_files="$(git status --porcelain docs/assets/screenshots/ | awk '{print $2}')"
          if [ -z "$changed_files" ]; then
            echo "No screenshot changes detected."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          {
            echo "files<<EOF"
            printf '%s\n' "$changed_files"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      # Variant 1 (recommended): raise/update a PR from a dedicated refresh branch.
      # Variant 2 fallback would be direct push with strict concurrency+rebase retry loop.
      - name: Create or update screenshot refresh PR
        id: screenshot_pr
        if: steps.screenshot_changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/docs-screenshots-refresh
          delete-branch: false
          commit-message: chore(docs): refresh demo-gallery screenshots
          title: chore(docs): refresh demo-gallery screenshots
          body: |
            This PR refreshes demo-gallery screenshots from CI.

            Trigger commit: `${{ github.sha }}`

            Updated files:
            ${{ steps.screenshot_changes.outputs.files }}
          add-paths: |
            docs/assets/screenshots/**
      - name: Enable auto-merge (if repository policy allows it)
        if: steps.screenshot_changes.outputs.changed == 'true' && steps.screenshot_pr.outputs.pull-request-number != ''
        continue-on-error: true
        uses: peter-evans/enable-pull-request-automerge@v3
        with:
          pull-request-number: ${{ steps.screenshot_pr.outputs.pull-request-number }}
          merge-method: squash
      - name: Upload screenshots artifact
        if: steps.screenshot_changes.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: docs-screenshots
          path: docs/assets/screenshots/**
      - name: Upload videos
        uses: actions/upload-artifact@v4
        with:
          name: docs-videos
          path: docs/assets/videos/**

  benchmark-report:
    name: Benchmark quality report
    runs-on: ubuntu-latest
    needs: unit-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v3
      - name: Run benchmark + render report
        run: ./gradlew benchmarkReport
      - name: Upload benchmark report (Markdown)
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-report
          path: docs/benchmark-report.md
      - name: Upload benchmark summary (JSON)
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-summary
          path: docs/assets/benchmark-summary.json


  proof-image:
    name: Build Dockerfile.proof & verify provers
    runs-on: ubuntu-latest
    needs: unit-test
    steps:
      - uses: actions/checkout@v4
      - name: Build proof image (Z3 + cvc5; Lean opt-in)
        run: docker build -f Dockerfile.proof -t regelsuche-proof:ci .
      - name: Verify Z3 is present inside the image
        run: docker run --rm --entrypoint z3 regelsuche-proof:ci --version
      - name: Verify cvc5 is present inside the image
        run: docker run --rm --entrypoint cvc5 regelsuche-proof:ci --version
      - name: Smoke-check the proof workbench REST surface
        run: |
          docker run -d --rm --name regelsuche-proof-smoke \
            -p 18080:8080 regelsuche-proof:ci
          # Wait for the workbench to come up
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:18080/api/proof/jobs >/dev/null; then
              echo "Workbench responded after ${i}s"
              break
            fi
            sleep 1
          done
          # Submit a tiny job and poll until it is listed.
          curl -sf -X POST http://127.0.0.1:18080/api/proof/jobs \
            -H 'Content-Type: application/json' \
            -d '{"leftPattern":"a+0","rightPattern":"a","priority":0}' \
            | tee /tmp/submit.json
          curl -sf http://127.0.0.1:18080/api/proof/jobs | tee /tmp/list.json
          grep '"jobId"' /tmp/submit.json
          docker stop regelsuche-proof-smoke

  docker-image-e2e:
    name: Docker-image integration tests (Testcontainers + Playwright)
    runs-on: ubuntu-latest
    needs: unit-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v3
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-v1
      - name: Install Playwright browsers
        run: ./gradlew installPlaywrightBrowsers
      - name: Run Docker-image E2E tests
        run: ./gradlew dockerE2eTest
      - name: Upload Docker E2E reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docker-e2e-test-reports
          path: |
            app/build/reports/tests/dockerE2eTest/**
            app/build/test-results/dockerE2eTest/**
