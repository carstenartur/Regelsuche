name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  unit-test:
    name: Unit & integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v3
      - name: Build & Test
        run: ./gradlew build
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: '**/build/reports/tests/**'

  browser-e2e:
    name: Browser end-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: unit-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v3
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-v1
      - name: Run browser E2E flows
        run: ./gradlew e2eTest
      - name: Upload E2E reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-reports
          path: |
            app/build/reports/tests/e2eTest/**
            app/build/test-results/e2eTest/**

  docs-assets:
    name: Refresh docs/assets screenshots & videos
    runs-on: ubuntu-latest
    needs: browser-e2e
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v3
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-v1
      - name: Record screenshots and videos
        run: ./gradlew e2eTest -Pregelsuche.recordDocs=true
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: docs-screenshots
          path: docs/assets/screenshots/**
      - name: Upload videos
        uses: actions/upload-artifact@v4
        with:
          name: docs-videos
          path: docs/assets/videos/**

