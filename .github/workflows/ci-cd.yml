name: CI/CD

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/assets/screenshots/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: pages-publish-${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-test:
    name: Unit tests and checkout-local verification
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6.1.0
      - name: Verify thin-workflow architecture
        run: ./gradlew verifyWorkflowSemantics --console=plain
      - name: Lint documentation
        run: python3 scripts/check-docs-math.py
      - name: Build, test and generate coverage
        run: ./gradlew build jacocoTestReport
      - name: Verify generated discovery gallery
        run: |
          env -u GITHUB_SHA ./gradlew :app:generateDiscoveryGallery
          python3 scripts/verify-generated-discovery-gallery.py
      - name: Verify static reference page
        run: |
          ./gradlew :app:generateStaticReferencePage
          python3 scripts/verify-static-reference-page.py
      - name: Render local coverage and test pages
        if: always()
        run: python3 scripts/generate-ci-pages.py
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: '**/build/reports/jacoco/**'
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports
          path: '**/build/reports/tests/**'
      - name: Ensure gh-pages branch exists
        if: always() && github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            echo "gh-pages branch already exists."
            exit 0
          fi
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT
          git init "$tmp_dir"
          cd "$tmp_dir"
          git checkout --orphan gh-pages
          touch .nojekyll
          mkdir -p coverage tests dev/bench
          printf '{"schemaVersion":1,"label":"coverage","message":"pending","color":"lightgrey"}\n' > coverage/badge.json
          printf '<!doctype html><title>Coverage pending</title><h1>Coverage pending</h1>\n' > coverage/index.html
          printf '{"schemaVersion":1,"label":"tests","message":"pending","color":"lightgrey"}\n' > tests/badge.json
          printf '<!doctype html><title>Tests pending</title><h1>Tests pending</h1>\n' > tests/index.html
          printf '{"schemaVersion":1,"label":"performance","message":"pending","color":"lightgrey"}\n' > dev/bench/badge.json
          printf '<!doctype html><title>Benchmarks pending</title><h1>Benchmarks pending</h1>\n' > dev/bench/index.html
          git add .
          git -c user.name='github-actions[bot]' \
            -c user.email='github-actions[bot]@users.noreply.github.com' \
            commit -m 'Initialize gh-pages'
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin gh-pages
      - name: Deploy coverage badge and report to GitHub Pages
        if: always() && github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: public
          keep_files: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'Update coverage + test report (${{ github.sha }})'

  browser-e2e:
    name: Browser end-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: unit-test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6.1.0
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-v1
      - name: Install Playwright host dependencies and Chromium
        run: ./gradlew :app:installPlaywrightHostDependencies :app:installPlaywrightBrowsers
      - name: Run checkout-local browser suite
        run: ./gradlew :app:e2eTest -Pregelsuche.skipPlaywrightInstall=true
      - name: Upload browser reports and evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-e2e-reports
          path: |
            app/build/reports/tests/e2eTest/**
            app/build/test-results/e2eTest/**
            app/build/reports/e2eTest/**
            app/build/discovery-artifacts/**

  docs-assets:
    name: Refresh docs screenshots and videos
    runs-on: ubuntu-latest
    needs: browser-e2e
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6.1.0
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-v1
      - name: Install Playwright host dependencies and Chromium
        run: ./gradlew :app:installPlaywrightHostDependencies :app:installPlaywrightBrowsers
      - name: Record screenshots and videos
        run: ./gradlew :app:test :app:e2eTest -Pregelsuche.recordDocs=true -Pregelsuche.skipPlaywrightInstall=true
      - name: Detect screenshot changes
        id: screenshot_changes
        run: |
          changed_files="$(git status --porcelain docs/assets/screenshots/ | awk '{print $2}')"
          if [ -z "$changed_files" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          {
            echo "files<<EOF"
            printf '%s\n' "$changed_files"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Create or update screenshot refresh PR
        id: screenshot_pr
        if: steps.screenshot_changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          branch: chore/docs-screenshots-refresh
          delete-branch: false
          commit-message: 'chore(docs): refresh demo-gallery screenshots'
          title: 'chore(docs): refresh demo-gallery screenshots'
          body: |
            This PR refreshes demo-gallery screenshots from CI.

            Trigger commit: `${{ github.sha }}`

            Updated files:
            ${{ steps.screenshot_changes.outputs.files }}
          add-paths: docs/assets/screenshots/**
      - name: Enable auto-merge when repository policy allows it
        if: steps.screenshot_changes.outputs.changed == 'true' && steps.screenshot_pr.outputs.pull-request-number != ''
        continue-on-error: true
        uses: peter-evans/enable-pull-request-automerge@v3
        with:
          pull-request-number: ${{ steps.screenshot_pr.outputs.pull-request-number }}
          merge-method: squash
      - name: Upload generated documentation media
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: docs-media
          path: |
            docs/assets/screenshots/**
            docs/assets/videos/**

  benchmark-report:
    name: Benchmark quality report
    runs-on: ubuntu-latest
    needs: unit-test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6.1.0
      - name: Generate benchmark report locally
        run: ./gradlew :app:benchmarkReport
      - name: Upload benchmark report
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-report
          path: |
            docs/benchmark-report.md
            docs/assets/benchmark-summary.json

  integration-test:
    name: Infrastructure integration tests (Testcontainers)
    runs-on: ubuntu-latest
    needs: unit-test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6.1.0
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-v1
      - name: Install Playwright host dependencies and Chromium
        run: ./gradlew :app:installPlaywrightHostDependencies :app:installPlaywrightBrowsers
      - name: Run checkout-local Testcontainers suite
        run: ./gradlew :app:dockerE2eTest -Pregelsuche.skipPlaywrightInstall=true
      - name: Upload integration reports and scientific artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-reports
          path: |
            app/build/reports/tests/dockerE2eTest/**
            app/build/test-results/dockerE2eTest/**
            app/build/discovery-artifacts/**
