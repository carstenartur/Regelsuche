name: Apply ValueKey-only BestFirst cleanup

on:
  push:
    branches: [ "cleanup/263-valuekey-only-search-identity" ]
    paths:
      - '.github/workflows/cleanup-263-self-apply.yml'
  pull_request:
    branches: [ "main" ]
    types: [ opened, synchronize, reopened ]
    paths:
      - '.github/workflows/cleanup-263-self-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: cleanup/263-valuekey-only-search-identity
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6.1.0
      - name: Remove legacy BestFirst identity paths
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path('regelsuche-search/src/main/java/de/regelsuche/search/strategy/BestFirstSearchStrategy.java')
          lines = source.read_text(encoding='utf-8').splitlines(keepends=True)
          output = []
          counts = {
              'compatibility_call': 0,
              'fallback_constant': 0,
              'legacy_cache': 0,
              'hash_block': 0,
              'legacy_method': 0,
              'legacy_clear': 0,
          }
          index = 0
          while index < len(lines):
              line = lines[index]
              stripped = line.strip()
              if stripped == 'static final String LEGACY_FALLBACK_PREFIX = "legacy-v1:";':
                  counts['fallback_constant'] += 1
                  index += 1
                  continue
              if stripped == 'private final Map<String, String> legacyHashesByExpression = new LinkedHashMap<>();':
                  counts['legacy_cache'] += 1
                  index += 1
                  continue
              if 'current.canonicalHash() + "#" + current.depth(),' in line:
                  if index + 1 >= len(lines) or 'legacyHash(current.expression())' not in lines[index + 1]:
                      raise SystemExit('compatibility call marker was not followed by legacyHash')
                  output.append(line.replace('current.depth(),', 'current.depth())'))
                  counts['compatibility_call'] += 1
                  index += 2
                  continue
              if stripped == 'String hash = value(normalized)':
                  end = index
                  while end < len(lines) and 'valueHashesByExpression.put' not in lines[end]:
                      end += 1
                  if end == len(lines) or not any('LEGACY_FALLBACK_PREFIX' in item for item in lines[index:end]):
                      raise SystemExit('legacy valueHash block boundaries were not found')
                  output.extend([
                      '            ExprValue value = value(normalized).orElseThrow(() ->\n',
                      '                new IllegalArgumentException(\n',
                      '                    "search expression cannot be represented as ExprValue: " + normalized));\n',
                      '            String hash = HASH_PREFIX + sha256(value.key().encoded());\n',
                  ])
                  counts['hash_block'] += 1
                  index = end
                  continue
              if stripped == 'String legacyHash(String expression) {':
                  counts['legacy_method'] += 1
                  index += 1
                  while index < len(lines) and lines[index].strip() != '}':
                      index += 1
                  if index == len(lines):
                      raise SystemExit('legacyHash closing brace was not found')
                  index += 1
                  if index < len(lines) and not lines[index].strip():
                      index += 1
                  continue
              if stripped == 'legacyHashesByExpression.clear();':
                  counts['legacy_clear'] += 1
                  index += 1
                  continue
              output.append(line)
              index += 1

          source.write_text(''.join(output), encoding='utf-8')
          diagnostics = Path('build/reports/cleanup-263')
          diagnostics.mkdir(parents=True, exist_ok=True)
          diagnostics.joinpath('counts.txt').write_text(
              '\n'.join(f'{name}={value}' for name, value in sorted(counts.items())) + '\n',
              encoding='utf-8')
          missing = {name: value for name, value in counts.items() if value != 1}
          if missing:
              diagnostics.joinpath('error.txt').write_text(str(missing) + '\n', encoding='utf-8')
          PY
      - name: Upload patched source and counters
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cleanup-263-patch-diagnostics
          path: |
            regelsuche-search/src/main/java/de/regelsuche/search/strategy/BestFirstSearchStrategy.java
            build/reports/cleanup-263/**
      - name: Verify all legacy paths were removed
        run: |
          grep -q '^compatibility_call=1$' build/reports/cleanup-263/counts.txt
          grep -q '^fallback_constant=1$' build/reports/cleanup-263/counts.txt
          grep -q '^hash_block=1$' build/reports/cleanup-263/counts.txt
          grep -q '^legacy_cache=1$' build/reports/cleanup-263/counts.txt
          grep -q '^legacy_clear=1$' build/reports/cleanup-263/counts.txt
          grep -q '^legacy_method=1$' build/reports/cleanup-263/counts.txt
          ! grep -R "LEGACY_FALLBACK_PREFIX\|legacyHash\|compatibleIdentityHashes\|migrateCompatibleEntry" \
            regelsuche-search/src/main/java/de/regelsuche/search/strategy
      - name: Run focused search-identity tests
        run: |
          ./gradlew :regelsuche-search:test \
            --tests de.regelsuche.search.strategy.BestFirstSearchTelemetryTest \
            --tests de.regelsuche.search.memory.TranspositionTableIntegrationTest
      - name: Commit verified cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add regelsuche-search/src/main/java/de/regelsuche/search/strategy/BestFirstSearchStrategy.java
          git commit -m 'Require ValueKey identity for BestFirst states'
          git push origin HEAD:cleanup/263-valuekey-only-search-identity
