name: Algebraic output recognition development
on:
  push:
    branches: ['qa/1026-algebraic-output-recognition']
permissions:
  contents: read
jobs:
  recognition:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '25'
          verify-signature: true
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          cache-read-only: true
      - name: Characterize continuation matching at the existing core API
        run: ./gradlew --no-daemon --no-configuration-cache :regelsuche-core:test --tests 'de.regelsuche.transform.EquivalenceAwarePatternContinuationTest' --console=plain
      - name: Exercise actual learner matcher and arithmetic replay
        run: ./gradlew --no-daemon --no-configuration-cache :app:test --tests 'de.regelsuche.benchmark.TypedModPowAcTransferIntegrationTest' --tests 'de.regelsuche.benchmark.TypedModPowTransferIntegrationTest' --console=plain
      - name: Verify complete core learning and experiments modules
        run: ./gradlew --no-daemon --no-configuration-cache :regelsuche-core:test :regelsuche-learning:test :regelsuche-experiments:test --console=plain
      - name: Record actual JUnit outcomes and source identity
        if: always()
        run: |
          git rev-parse HEAD
          git diff --exit-code
          git hash-object regelsuche-core/src/main/java/de/regelsuche/transform/EquivalenceAwarePatternMatcher.java
          git hash-object regelsuche-learning/src/main/java/de/regelsuche/mining/TypedOutputPattern.java
          python3 - <<'PY'
          import json, pathlib, xml.etree.ElementTree as ET
          for module in ('regelsuche-core', 'app', 'regelsuche-learning', 'regelsuche-experiments'):
              paths = sorted(pathlib.Path(module, 'build/test-results/test').glob('TEST-*.xml'))
              totals = {k: 0 for k in ('tests','failures','errors','skipped')}
              failed = []
              for p in paths:
                  root = ET.parse(p).getroot()
                  for key in totals:
                      totals[key] += int(root.attrib[key])
                  failed.extend({'suite': p.name, 'name': t.attrib['name'], 'messages': [f.attrib.get('message','') for f in t.findall('failure') + t.findall('error')]} for t in root.findall('testcase') if t.find('failure') is not None or t.find('error') is not None)
              print('AC_OUTPUT_JUNIT=' + json.dumps({'module': module, 'executed': bool(paths), 'suites': len(paths), **totals, 'failed': failed}, sort_keys=True))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: algebraic-output-recognition-development
          path: |
            app/build/test-results/test/**
            app/build/reports/tests/test/**
            regelsuche-core/build/test-results/test/**
            regelsuche-learning/build/test-results/test/**
            regelsuche-experiments/build/test-results/test/**
          if-no-files-found: error
