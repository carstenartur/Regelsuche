name: General Java algebra exact-source qualification
on:
  push:
    branches: [diagnostic/bitwise-runtime-20261009]
permissions:
  contents: read
jobs:
  regressions:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: b483191d5ef20490195a6f7254c04da37f0adecc
          path: verified-source
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '25'
          verify-signature: true
      - name: Verify exact checkout and execute all SDK and dependency tests
        working-directory: verified-source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = b483191d5ef20490195a6f7254c04da37f0adecc
          test -z "$(git status --porcelain)"
          if ! mvn --batch-mode --no-transfer-progress -Psdk-release -pl regelsuche-optimization-sdk -am test > "$RUNNER_TEMP/sdk-regressions.log" 2>&1; then
            tail -140 "$RUNNER_TEMP/sdk-regressions.log"
            exit 1
          fi
          grep -E 'Tests run:|BUILD SUCCESS' "$RUNNER_TEMP/sdk-regressions.log" | tail -35
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: general-algebra-regressions-${{ github.run_id }}
          retention-days: 7
          path: |
            ${{ runner.temp }}/sdk-regressions.log
            verified-source/regelsuche-optimization-sdk/target/surefire-reports/**
