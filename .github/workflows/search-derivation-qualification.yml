name: Qualify selected search derivations
on:
  push:
    branches: [diagnostic/search-derivation-20261010]
permissions:
  contents: read
concurrency:
  group: selected-search-derivation-qualification
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: dcbd12bad508f6a824630dbf4502808f0bdf95c8
          fetch-depth: 2
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Verify the unchanged production source and complete SDK suite
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = dcbd12bad508f6a824630dbf4502808f0bdf95c8
          test -z "$(git status --porcelain)"
          test "$(git diff --name-only HEAD^ HEAD)" = regelsuche-optimization-sdk/src/test/java/de/regelsuche/sdk/optimization/EmptySearchDerivationTest.java
          git rev-parse HEAD > "$RUNNER_TEMP/source-commit.txt"
          mvn -B -ntp -Psdk-release -pl regelsuche-optimization-sdk -am test > "$RUNNER_TEMP/sdk-review.log" 2>&1 || { tail -110 "$RUNNER_TEMP/sdk-review.log"; exit 1; }
          grep -E 'Tests run:|BUILD SUCCESS' "$RUNNER_TEMP/sdk-review.log" | tail -30
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as E
          totals=dict.fromkeys(('tests','failures','errors','skipped'),0)
          for p in Path('regelsuche-optimization-sdk/target/surefire-reports').glob('TEST-*.xml'):
              root=E.parse(p).getroot()
              for k in totals: totals[k]+=int(root.get(k,'0'))
          assert totals==dict(tests=106,failures=0,errors=0,skipped=0),totals
          print('SDK_REVIEW_TOTALS',totals)
          PY
      - name: Publish only the tested review regression
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          git fetch --no-tags origin refs/heads/feat/selected-search-derivation-20261010
          test "$(git rev-parse FETCH_HEAD)" = c48d160800a5d1ab82a7adbb0804be768256e94b
          git push origin HEAD:refs/heads/feat/selected-search-derivation-20261010
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: selected-search-review-${{ github.run_id }}
          retention-days: 7
          path: |
            ${{ runner.temp }}/source-commit.txt
            ${{ runner.temp }}/sdk-review.log
            regelsuche-optimization-sdk/target/surefire-reports/**
