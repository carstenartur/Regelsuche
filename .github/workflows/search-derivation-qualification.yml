name: Qualify selected search derivations
on:
  push:
    branches: [diagnostic/search-derivation-20261010]
permissions:
  contents: read
concurrency:
  group: selected-search-derivation-qualification
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: control
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ac8ab6df53115edd17d0a3e40e7bafda17a54ec6
          path: source
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Stage source changes in an isolated committed checkout
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = ac8ab6df53115edd17d0a3e40e7bafda17a54ec6
          test -z "$(git status --porcelain)"
          python3 ../control/qualification/integrate-derivation.py .
          git add regelsuche-optimization-sdk examples/external-consumers/java-optimization-java25
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat: retain and independently replay selected mathematical search paths'
          git rev-parse HEAD > "$RUNNER_TEMP/source-commit.txt"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/source-tree.txt"
      - name: Verify the complete SDK dependency reactor
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -Psdk-release -pl regelsuche-optimization-sdk -am test > "$RUNNER_TEMP/sdk.log" 2>&1 || { tail -110 "$RUNNER_TEMP/sdk.log"; exit 1; }
          grep -E 'Tests run:|BUILD SUCCESS|ACTUAL_.*SEARCH' "$RUNNER_TEMP/sdk.log" | tail -45
          cp -a regelsuche-optimization-sdk/target/surefire-reports "$RUNNER_TEMP/sdk-reports"
      - name: Execute repository-owned reproducible SDK distribution and workflow contracts
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -Psdk-release -pl maven-build-contract -Dtest=MavenOptimizationSdkDistributionTest,MavenWorkflowSemanticsContractTest test > "$RUNNER_TEMP/distribution.log" 2>&1 || { tail -150 "$RUNNER_TEMP/distribution.log"; exit 1; }
          grep -E 'Tests run:|BUILD SUCCESS' "$RUNNER_TEMP/distribution.log" | tail -12
          python3 - <<'PY'
          import json
          from pathlib import Path
          receipts=list(Path('maven-build-contract/target/surefire-reports').glob('sdk-distribution-*/reproducibility.json'))
          assert len(receipts)==1, receipts
          receipt=json.loads(receipts[0].read_text())
          assert receipt['status']=='PASS' and receipt['cleanBuilds']==2
          print('REPRODUCIBLE_SDK', json.dumps(receipt))
          PY
      - name: Publish tested source only to the existing main-based feature branch
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$(cat "$RUNNER_TEMP/source-commit.txt")"
          test -z "$(git status --porcelain)"
          git fetch --no-tags origin refs/heads/feat/selected-search-derivation-20261010
          test "$(git rev-parse FETCH_HEAD)" = ac8ab6df53115edd17d0a3e40e7bafda17a54ec6
          git push origin HEAD:refs/heads/feat/selected-search-derivation-20261010
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: selected-search-derivation-${{ github.run_id }}
          retention-days: 7
          path: |
            ${{ runner.temp }}/source-*.txt
            ${{ runner.temp }}/sdk.log
            ${{ runner.temp }}/sdk-reports/**
            ${{ runner.temp }}/distribution.log
            source/regelsuche-optimization-sdk/target/surefire-reports/**
            source/maven-build-contract/target/surefire-reports/**
