name: Solver IR

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: solver-ir-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0
      - name: Run repository-owned Solver IR verification
        run: bash scripts/run-solver-ir-verification.sh
      - name: Upload canonical contracts and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: solver-ir-contracts
          path: |
            build/logs/solver-ir-*.log
            regelsuche-solver-ir/build/reports/solver-ir/**
            regelsuche-solver-ir/build/reports/tests/**
            regelsuche-solver-ir/build/test-results/**
          if-no-files-found: warn
