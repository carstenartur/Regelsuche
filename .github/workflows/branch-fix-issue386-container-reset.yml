name: Fix Walkthrough Container Reset

on:
  push:
    branches: [ "issue-386-result-card" ]
    paths:
      - '.github/workflows/branch-fix-issue386-container-reset.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: issue-386-result-card
          fetch-depth: 0

      - name: Apply container-safe reset patch
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/issue-386-container-reset.py
          git diff --check
          grep -Fq 'paths.filter(path -> !path.equals(outputDirectory))' \
            regelsuche-release/src/main/java/de/regelsuche/release/AutonomousDiscoveryWalkthroughRunner.java

      - name: Compile focused release module
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :regelsuche-release:compileJava --console=plain

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add regelsuche-release/src/main/java/de/regelsuche/release/AutonomousDiscoveryWalkthroughRunner.java
          git diff --cached --quiet && exit 0
          git commit -m 'fix: preserve mounted walkthrough output root'
          git push origin HEAD:issue-386-result-card
