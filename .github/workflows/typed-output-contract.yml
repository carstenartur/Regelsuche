name: Typed output contract
on:
  push:
    branches: ['research/1026-output-pattern-transfer']
    paths:
      - 'regelsuche-learning/src/**/TypedOutputPattern*.java'
      - '.github/workflows/typed-output-contract.yml'
permissions:
  contents: read
concurrency:
  group: typed-output-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contract:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '25'
          verify-signature: true
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
      - name: Run focused behavioral contracts
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/typed-output"
          git rev-parse HEAD > "$RUNNER_TEMP/typed-output/source-commit.txt"
          ./gradlew --no-daemon --no-configuration-cache :regelsuche-learning:test --tests 'de.regelsuche.mining.TypedOutputPatternTest' --console=plain --stacktrace 2>&1 | tee "$RUNNER_TEMP/typed-output/focused.log"
      - name: Retain focused JUnit
        if: always()
        run: cp -r regelsuche-learning/build/test-results/test "$RUNNER_TEMP/typed-output/focused-junit"
      - name: Run all learning-module tests
        run: |
          set -o pipefail
          ./gradlew --no-daemon --no-configuration-cache :regelsuche-learning:test --console=plain --stacktrace 2>&1 | tee "$RUNNER_TEMP/typed-output/regression.log"
      - name: Retain source and regression evidence
        if: always()
        run: |
          tar -czf "$RUNNER_TEMP/typed-output/source.tar.gz" regelsuche-learning/src/main/java/de/regelsuche/mining/Typed*Pattern*.java regelsuche-learning/src/test/java/de/regelsuche/mining/Typed*Pattern*Test.java docs/research/typed-output-pattern-1026.md
          cp -r regelsuche-learning/build/test-results/test "$RUNNER_TEMP/typed-output/final-junit"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: typed-output-${{ github.sha }}
          path: ${{ runner.temp }}/typed-output
          if-no-files-found: error
