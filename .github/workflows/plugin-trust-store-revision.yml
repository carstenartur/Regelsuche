name: Plugin Trust Store Revision

on:
  push:
    branches: [ "main" ]
    paths:
      - 'app/src/main/java/de/regelsuche/plugin/PluginTrustStore.java'
      - 'app/src/main/java/de/regelsuche/plugin/PluginTrustStoreRevision.java'
      - 'app/src/main/java/de/regelsuche/plugin/PluginTrustStoreRevisionVerifier.java'
      - 'app/src/test/java/de/regelsuche/plugin/PluginTrustStoreRevisionTest.java'
      - 'docs/plugin-trust-store-revisions.md'
      - 'docs/schemas/regelsuche-plugin-trust-store-v1.schema.json'
      - 'docs/schemas/regelsuche-plugin-trust-store-revision-v1.schema.json'
      - 'docs/schemas/regelsuche-plugin-trust-store-chain-checkpoint-v1.schema.json'
      - 'docs/schemas/regelsuche-plugin-trust-store-revision-verification-v1.schema.json'
      - '.github/workflows/plugin-trust-store-revision.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'app/src/main/java/de/regelsuche/plugin/PluginTrustStore.java'
      - 'app/src/main/java/de/regelsuche/plugin/PluginTrustStoreRevision.java'
      - 'app/src/main/java/de/regelsuche/plugin/PluginTrustStoreRevisionVerifier.java'
      - 'app/src/test/java/de/regelsuche/plugin/PluginTrustStoreRevisionTest.java'
      - 'docs/plugin-trust-store-revisions.md'
      - 'docs/schemas/regelsuche-plugin-trust-store-v1.schema.json'
      - 'docs/schemas/regelsuche-plugin-trust-store-revision-v1.schema.json'
      - 'docs/schemas/regelsuche-plugin-trust-store-chain-checkpoint-v1.schema.json'
      - 'docs/schemas/regelsuche-plugin-trust-store-revision-verification-v1.schema.json'
      - '.github/workflows/plugin-trust-store-revision.yml'
  workflow_dispatch:

concurrency:
  group: plugin-trust-store-revision-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  revision:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0

      - name: Verify signed trust-state chain contracts
        shell: bash
        run: |
          mkdir -p app/build/reports/plugin-trust-store-revision
          set -o pipefail
          ./gradlew :app:test \
            --tests de.regelsuche.plugin.PluginTrustStoreRevisionTest \
            --rerun-tasks \
            --stacktrace \
            --console=plain 2>&1 \
            | tee app/build/reports/plugin-trust-store-revision/targeted-test.log

      - name: Require retained canonical chain evidence
        run: |
          for name in \
            root-trust-store \
            trust-store-1 revision-1 verification-1 checkpoint-1 \
            trust-store-2 revision-2 verification-2 checkpoint-2; do
            test -s "app/build/reports/plugin-trust-store-revision/${name}.json"
          done

      - name: Require byte-identical repeated evidence
        shell: bash
        run: |
          mkdir -p /tmp/plugin-trust-store-revision-first
          cp app/build/reports/plugin-trust-store-revision/*.json \
            /tmp/plugin-trust-store-revision-first/
          ./gradlew :app:test \
            --tests de.regelsuche.plugin.PluginTrustStoreRevisionTest \
            --rerun-tasks
          for name in \
            root-trust-store \
            trust-store-1 revision-1 verification-1 checkpoint-1 \
            trust-store-2 revision-2 verification-2 checkpoint-2; do
            cmp "/tmp/plugin-trust-store-revision-first/${name}.json" \
              "app/build/reports/plugin-trust-store-revision/${name}.json"
          done

      - name: Validate schemas, signatures, chain and replay evidence
        shell: bash
        run: |
          python3 -m pip install \
            --disable-pip-version-check \
            --quiet \
            jsonschema==4.25.1
          python3 - <<'PY'
          from copy import deepcopy
          import base64
          import hashlib
          import json
          from pathlib import Path
          import struct
          import subprocess
          import tempfile
          from jsonschema.exceptions import ValidationError
          from jsonschema.validators import validator_for

          def compact(value):
              return json.dumps(
                  value,
                  ensure_ascii=False,
                  separators=(',', ':'),
              ).encode('utf-8') + b'\n'

          def sha256(value):
              return 'sha256:' + hashlib.sha256(value).hexdigest()

          def field(name, value):
              name_bytes = name.encode('utf-8')
              value_bytes = value.encode('utf-8')
              return (
                  struct.pack('>I', len(name_bytes)) + name_bytes
                  + struct.pack('>I', len(value_bytes)) + value_bytes
              )

          def require_rejection(validator, value, label):
              try:
                  validator.validate(value)
              except ValidationError:
                  return
              raise AssertionError(f'{label} unexpectedly passed schema validation')

          schema_paths = {
              'store': Path('docs/schemas/regelsuche-plugin-trust-store-v1.schema.json'),
              'revision': Path(
                  'docs/schemas/regelsuche-plugin-trust-store-revision-v1.schema.json'),
              'checkpoint': Path(
                  'docs/schemas/regelsuche-plugin-trust-store-chain-checkpoint-v1.schema.json'),
              'verification': Path(
                  'docs/schemas/regelsuche-plugin-trust-store-revision-verification-v1.schema.json'),
          }
          validators = {}
          for name, path in schema_paths.items():
              schema = json.loads(path.read_text(encoding='utf-8'))
              validator_for(schema).check_schema(schema)
              assert schema.get('additionalProperties') is False
              validators[name] = validator_for(schema)(schema)

          report = Path('app/build/reports/plugin-trust-store-revision')
          root_path = report / 'root-trust-store.json'
          root = json.loads(root_path.read_text(encoding='utf-8'))
          validators['store'].validate(root)
          root_hash = sha256(root_path.read_bytes())

          previous_revision_hash = ''
          previous_checkpoint_hash = ''
          for sequence in (1, 2):
              store_path = report / f'trust-store-{sequence}.json'
              revision_path = report / f'revision-{sequence}.json'
              verification_path = report / f'verification-{sequence}.json'
              checkpoint_path = report / f'checkpoint-{sequence}.json'
              store = json.loads(store_path.read_text(encoding='utf-8'))
              revision = json.loads(revision_path.read_text(encoding='utf-8'))
              verification = json.loads(
                  verification_path.read_text(encoding='utf-8'))
              checkpoint = json.loads(
                  checkpoint_path.read_text(encoding='utf-8'))
              validators['store'].validate(store)
              validators['revision'].validate(revision)
              validators['verification'].validate(verification)
              validators['checkpoint'].validate(checkpoint)

              assert revision['sequence'] == sequence
              assert revision['previousRevisionHash'] == previous_revision_hash
              assert revision['trustStoreContentHash'] == sha256(
                  store_path.read_bytes())
              assert revision['algorithm'] == 'Ed25519'
              matching = [
                  key for key in root['keys']
                  if key['publisherId'] == revision['authorityId']
                  and key['keyId'] == revision['keyId']
              ]
              assert len(matching) == 1
              authority_key = matching[0]
              assert authority_key['status'] in {'ACTIVE', 'RETIRED'}

              signed_payload = b''.join([
                  field('schema', revision['schema']),
                  field('trustDomainId', revision['trustDomainId']),
                  field('sequence', str(revision['sequence'])),
                  field('previousRevisionHash', revision['previousRevisionHash']),
                  field('trustStoreContentHash', revision['trustStoreContentHash']),
                  field('authorityId', revision['authorityId']),
                  field('keyId', revision['keyId']),
                  field('algorithm', revision['algorithm']),
              ])
              signature_bytes = base64.b64decode(
                  revision['signatureBase64'], validate=True)
              assert len(signature_bytes) == 64
              assert base64.b64encode(signature_bytes).decode('ascii') == \
                  revision['signatureBase64']
              with tempfile.TemporaryDirectory() as temporary:
                  temporary = Path(temporary)
                  key_path = temporary / 'authority.der'
                  payload_path = temporary / 'payload.bin'
                  signature_path = temporary / 'signature.bin'
                  key_path.write_bytes(base64.b64decode(
                      authority_key['publicKeyBase64'], validate=True))
                  payload_path.write_bytes(signed_payload)
                  signature_path.write_bytes(signature_bytes)
                  subprocess.run([
                      'openssl', 'pkeyutl', '-verify', '-pubin',
                      '-inkey', str(key_path), '-keyform', 'DER', '-rawin',
                      '-in', str(payload_path), '-sigfile', str(signature_path),
                  ], check=True, capture_output=True)

              revision_payload = {
                  key: revision[key]
                  for key in (
                      'schema', 'trustDomainId', 'sequence',
                      'previousRevisionHash', 'trustStoreContentHash',
                      'authorityId', 'keyId', 'algorithm', 'signatureBase64')
              }
              assert revision['contentHash'] == sha256(compact(revision_payload))

              assert verification['trustDomainId'] == revision['trustDomainId']
              assert verification['sequence'] == sequence
              assert verification['revisionHash'] == revision['contentHash']
              assert verification['previousRevisionHash'] == previous_revision_hash
              assert verification['trustStoreContentHash'] == \
                  revision['trustStoreContentHash']
              assert verification['rootTrustStoreContentHash'] == root_hash
              assert verification['previousCheckpointHash'] == \
                  previous_checkpoint_hash
              assert verification['status'] == 'VERIFIED_TRUSTED'
              assert verification['signatureVerified'] is True
              assert verification['trusted'] is True
              assert verification['replaySafe'] is True
              assert verification['authorityId'] == revision['authorityId']
              assert verification['keyId'] == revision['keyId']

              verification_material = b''.join([
                  field('schema', verification['schema']),
                  field('trustDomainId', verification['trustDomainId']),
                  field('sequence', str(verification['sequence'])),
                  field('revisionHash', verification['revisionHash']),
                  field('previousRevisionHash',
                        verification['previousRevisionHash']),
                  field('trustStoreContentHash',
                        verification['trustStoreContentHash']),
                  field('rootTrustStoreContentHash',
                        verification['rootTrustStoreContentHash']),
                  field('previousCheckpointHash',
                        verification['previousCheckpointHash']),
                  field('status', verification['status']),
                  field('signatureVerified', 'true'),
                  field('trusted', 'true'),
                  field('replaySafe', 'true'),
                  field('authorityId', verification['authorityId']),
                  field('keyId', verification['keyId']),
                  struct.pack('>I', len(verification['warnings'])),
                  b''.join(field('warning', warning)
                           for warning in verification['warnings']),
              ])
              assert verification['contentHash'] == sha256(
                  verification_material)

              checkpoint_payload = {
                  key: checkpoint[key]
                  for key in ('schema', 'trustDomainId', 'sequence', 'revisionHash')
              }
              assert checkpoint['trustDomainId'] == revision['trustDomainId']
              assert checkpoint['sequence'] == sequence
              assert checkpoint['revisionHash'] == revision['contentHash']
              assert checkpoint['contentHash'] == sha256(
                  compact(checkpoint_payload))

              previous_revision_hash = revision['contentHash']
              previous_checkpoint_hash = checkpoint['contentHash']

          invalid_genesis = deepcopy(json.loads(
              (report / 'revision-1.json').read_text(encoding='utf-8')))
          invalid_genesis['previousRevisionHash'] = 'sha256:' + '0' * 64
          require_rejection(
              validators['revision'], invalid_genesis,
              'genesis revision with predecessor')
          invalid_successor = deepcopy(json.loads(
              (report / 'revision-2.json').read_text(encoding='utf-8')))
          invalid_successor['previousRevisionHash'] = ''
          require_rejection(
              validators['revision'], invalid_successor,
              'non-genesis revision without predecessor')
          invalid_flags = deepcopy(json.loads(
              (report / 'verification-2.json').read_text(encoding='utf-8')))
          invalid_flags['replaySafe'] = False
          require_rejection(
              validators['verification'], invalid_flags,
              'trusted revision without replay-safe flag')
          PY

      - name: Upload trust-state evidence and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: plugin-trust-store-revision-evidence
          path: |
            app/build/reports/plugin-trust-store-revision/**
            app/build/reports/tests/**
            app/build/test-results/**
            docs/schemas/regelsuche-plugin-trust-store*.schema.json
          if-no-files-found: warn
