name: Normalize Solver Result 233

on:
  push:
    branches: [ "feature/233-solver-neutral-ir" ]

permissions:
  contents: write

concurrency:
  group: solver-ir-normalize-233
  cancel-in-progress: false

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/233-solver-neutral-ir
          fetch-depth: 0

      - name: Remove duplicated translation state
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old in text:
                  p.write_text(text.replace(old, new))
              elif new not in text:
                  raise RuntimeError(f'expected content missing from {path}')

          solver_ir = Path('regelsuche-solver-ir/src/main/java/de/regelsuche/solver/ir/SolverIr.java')
          text = solver_ir.read_text()
          start = text.index('    public record SolverResult(')
          end = text.index('    public static String sha256(', start)
          block = '''    public record SolverResult(
              String schema,
              String obligationHash,
              String goalHash,
              String assumptionsHash,
              String backendId,
              String backendVersion,
              ResultStatus status,
              List<String> usedCapabilities,
              String invocationHash,
              String message,
              Map<String, String> counterexample,
              String certificateHash,
              String contentHash
          ) {
              public SolverResult {
                  if (!RESULT_SCHEMA.equals(schema)) {
                      throw new IllegalArgumentException("unsupported solver result schema");
                  }
                  requireSha(obligationHash, "obligationHash");
                  requireSha(goalHash, "goalHash");
                  requireSha(assumptionsHash, "assumptionsHash");
                  requireText(backendId, "backendId");
                  requireText(backendVersion, "backendVersion");
                  Objects.requireNonNull(status, "status");
                  usedCapabilities = sortedStrings(usedCapabilities);
                  requireSha(invocationHash, "invocationHash");
                  message = message == null ? "" : message;
                  counterexample = immutableSortedMap(counterexample);
                  certificateHash = certificateHash == null ? "" : certificateHash;
                  if (!certificateHash.isEmpty()) {
                      requireSha(certificateHash, "certificateHash");
                  }
                  requireSha(contentHash, "contentHash");
                  String expected = resultHash(
                      schema, obligationHash, goalHash, assumptionsHash,
                      backendId, backendVersion, status, usedCapabilities,
                      invocationHash, message, counterexample, certificateHash);
                  if (!expected.equals(contentHash)) {
                      throw new IllegalArgumentException(
                          "solver result hash does not match canonical fields");
                  }
              }

              public static SolverResult create(
                  Obligation obligation,
                  BackendDescriptor descriptor,
                  ResultStatus status,
                  List<String> usedCapabilities,
                  String message,
                  Map<String, String> counterexample,
                  String certificateHash
              ) {
                  Objects.requireNonNull(obligation, "obligation");
                  Objects.requireNonNull(descriptor, "descriptor");
                  List<String> capabilities = sortedStrings(usedCapabilities);
                  Map<String, String> model = immutableSortedMap(counterexample);
                  String normalizedMessage = message == null ? "" : message;
                  String normalizedCertificate = certificateHash == null
                      ? "" : certificateHash;
                  String invocationHash = sha256(
                      descriptor.backendId() + '|' + descriptor.backendVersion()
                          + '|' + obligation.contentHash() + '|' + status.name()
                          + '|' + capabilities + '|' + normalizedMessage + '|'
                          + model + '|' + normalizedCertificate);
                  String contentHash = resultHash(
                      RESULT_SCHEMA, obligation.contentHash(), obligation.goalHash(),
                      obligation.assumptionsHash(), descriptor.backendId(),
                      descriptor.backendVersion(), status, capabilities,
                      invocationHash, normalizedMessage, model, normalizedCertificate);
                  return new SolverResult(
                      RESULT_SCHEMA, obligation.contentHash(), obligation.goalHash(),
                      obligation.assumptionsHash(), descriptor.backendId(),
                      descriptor.backendVersion(), status, capabilities,
                      invocationHash, normalizedMessage, model,
                      normalizedCertificate, contentHash);
              }

              public String toCanonicalJson() {
                  JsonWriter json = new JsonWriter().beginObject()
                      .property("schema", schema)
                      .property("obligationHash", obligationHash)
                      .property("goalHash", goalHash)
                      .property("assumptionsHash", assumptionsHash)
                      .property("backendId", backendId)
                      .property("backendVersion", backendVersion)
                      .property("status", status.name())
                      .stringArray("usedCapabilities", usedCapabilities)
                      .property("invocationHash", invocationHash)
                      .property("message", message)
                      .object("counterexample", object ->
                          counterexample.forEach(object::property))
                      .property("certificateHash", certificateHash)
                      .property("contentHash", contentHash);
                  return json.endObject().toString();
              }
          }

'''
          solver_ir.write_text(text[:start] + block + text[end:])

          replace(
              'regelsuche-solver-ir/src/main/java/de/regelsuche/solver/ir/SolverIr.java',
              '''        TranslationStatus translationStatus,
                  List<String> usedCapabilities,
                  List<String> translationIssues,
                  String invocationHash,
          ''',
              '''        List<String> usedCapabilities,
                  String invocationHash,
          ''')
          # Replace the remaining resultHash helper with its normalized signature.
          p = Path('regelsuche-solver-ir/src/main/java/de/regelsuche/solver/ir/SolverIr.java')
          text = p.read_text()
          old_start = text.index('    private static String resultHash(')
          old_end = text.index('    private static void writePredicate(', old_start)
          helper = '''    private static String resultHash(
              String schema,
              String obligationHash,
              String goalHash,
              String assumptionsHash,
              String backendId,
              String backendVersion,
              ResultStatus status,
              List<String> usedCapabilities,
              String invocationHash,
              String message,
              Map<String, String> counterexample,
              String certificateHash
          ) {
              return sha256(
                  schema + "\\nobligation=" + obligationHash
                      + "\\ngoal=" + goalHash
                      + "\\nassumptions=" + assumptionsHash
                      + "\\nbackend=" + backendId + '@' + backendVersion
                      + "\\nstatus=" + status.name()
                      + "\\ncapabilities=" + usedCapabilities
                      + "\\ninvocation=" + invocationHash
                      + "\\nmessage=" + message
                      + "\\ncounterexample=" + counterexample
                      + "\\ncertificate=" + certificateHash);
          }

'''
          p.write_text(text[:old_start] + helper + text[old_end:])

          # JSON codec.
          replace(
              'regelsuche-solver-ir/src/main/java/de/regelsuche/solver/ir/SolverIrJsonCodec.java',
              '''            ResultStatus.valueOf(text(root, "status")),
                  TranslationStatus.valueOf(text(root, "translationStatus")),
                  strings(array(root, "usedCapabilities")),
                  strings(array(root, "translationIssues")),
                  text(root, "invocationHash"),
          ''',
              '''            ResultStatus.valueOf(text(root, "status")),
                  strings(array(root, "usedCapabilities")),
                  text(root, "invocationHash"),
          ''')

          # Execution owns translation consistency; result no longer duplicates it.
          replace(
              'regelsuche-solver-ir/src/main/java/de/regelsuche/solver/ir/SolverExecution.java',
              '''        if (translation.status() != result.translationStatus()
                  || !translation.issues().equals(result.translationIssues())) {
              throw new IllegalArgumentException(
                  "result translation summary differs from translation artifact");
          }
          ''',
              '')

          # Backend support.
          replace(
              'regelsuche-solver-ir/src/main/java/de/regelsuche/solver/ir/SolverBackendSupport.java',
              '''            ResultStatus.UNSUPPORTED,
                  TranslationStatus.REJECTED,
                  List.of(),
                  translation.issues(),
                  "backend rejected the obligation before execution",
          ''',
              '''            ResultStatus.UNSUPPORTED,
                  List.of(),
                  "backend rejected the obligation before execution",
          ''')

          # Production backends.
          for file in [
              'regelsuche-solver-ir/src/main/java/de/regelsuche/solver/ir/RegelsucheSearchBackend.java',
              'regelsuche-solver-ir/src/main/java/de/regelsuche/solver/ir/PolynomialNormalFormSolverBackend.java',
          ]:
              replace(file,
                  '''                status,
                      TranslationStatus.LOSSLESS,
                      List.of(''',
                  '''                status,
                      List.of(''')
              replace(file,
                  '''                ResultStatus.ERROR,
                      TranslationStatus.LOSSLESS,
                      List.of(''',
                  '''                ResultStatus.ERROR,
                      List.of(''')
              replace(file,
                  '''                    ResultStatus.ERROR,
                          TranslationStatus.LOSSLESS,
                          List.of(''',
                  '''                    ResultStatus.ERROR,
                          List.of(''')
              # Capabilities are followed by an obsolete empty translation issue list.
              p = Path(file)
              value = p.read_text()
              value = value.replace(
                  '''),
                      List.of(),
                      message,''',
                  '''),
                      message,''')
              value = value.replace(
                  '''),
                      List.of(),
                      exception.getClass()''',
                  '''),
                      exception.getClass()''')
              value = value.replace(
                  '''),
                          List.of(),
                          "backend "''',
                  '''),
                          "backend "''')
              value = value.replace(
                  '''),
                          List.of(),
                          evidence.detail(),''',
                  '''),
                          evidence.detail(),''')
              p.write_text(value)

          # Controlled test fixtures.
          for file in [
              'regelsuche-learning/src/test/java/de/regelsuche/mining/OpenTargetConjectureProofGateTest.java',
              'app/src/test/java/de/regelsuche/docs/OpenTargetPromotionGateTest.java',
              'regelsuche-autopilot/src/test/java/de/regelsuche/experiments/autopilot/AutonomousCandidateLifecycleV2Test.java',
              'regelsuche-learning/src/test/java/de/regelsuche/mining/CrossFamilyBridgeQualificationGateTest.java',
          ]:
              p = Path(file)
              value = p.read_text()
              value = value.replace(
                  '''            resultStatus,
                  TranslationStatus.LOSSLESS,
                  List.of(''',
                  '''            resultStatus,
                  List.of(''')
              value = value.replace(
                  '''            backendStatus,
                  TranslationStatus.LOSSLESS,
                  List.of(''',
                  '''            backendStatus,
                  List.of(''')
              value = value.replace(
                  '''            ResultStatus.CONFIRMED,
                  TranslationStatus.LOSSLESS,
                  List.of(''',
                  '''            ResultStatus.CONFIRMED,
                  List.of(''')
              value = value.replace(
                  '''),
                  List.of(),
                  status.name(),''',
                  '''),
                  status.name(),''')
              value = value.replace(
                  '''),
                  List.of(),
                  evidence,''',
                  '''),
                  evidence,''')
              value = value.replace(
                  '''),
                  List.of(),
                  "symbolic equivalence confirmed''',
                  '''),
                  "symbolic equivalence confirmed''')
              p.write_text(value)

          # Integration tests now read translation status/issues only from translation.
          p = Path('regelsuche-solver-ir/src/test/java/de/regelsuche/solver/ir/SolverBackendIntegrationTest.java')
          value = p.read_text()
          value = value.replace(
              '''        assertEquals(search.result().translationStatus(),
              search.translation().status());
          assertEquals(polynomial.result().translationIssues(),
              polynomial.translation().issues());
          ''', '')
          value = value.replace(
              '''            assertEquals(execution.translation().issues(),
                  execution.result().translationIssues());
          ''', '')
          p.write_text(value)

          # Result schema becomes result-only.
          Path('docs/schemas/regelsuche-solver-result-v1.schema.json').write_text('''{
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "$id": "regelsuche.solver-result/v1",
            "title": "Regelsuche solver-neutral backend result v1",
            "type": "object",
            "required": [
              "schema", "obligationHash", "goalHash", "assumptionsHash",
              "backendId", "backendVersion", "status", "usedCapabilities",
              "invocationHash", "message", "counterexample", "certificateHash",
              "contentHash"
            ],
            "properties": {
              "schema": { "const": "regelsuche.solver-result/v1" },
              "obligationHash": { "$ref": "#/$defs/sha256" },
              "goalHash": { "$ref": "#/$defs/sha256" },
              "assumptionsHash": { "$ref": "#/$defs/sha256" },
              "backendId": { "$ref": "#/$defs/nonBlank" },
              "backendVersion": { "$ref": "#/$defs/nonBlank" },
              "status": {
                "enum": [
                  "CONFIRMED", "REFUTED", "UNKNOWN", "TIMEOUT",
                  "UNSUPPORTED", "ERROR"
                ]
              },
              "usedCapabilities": {
                "type": "array",
                "uniqueItems": true,
                "items": { "$ref": "#/$defs/nonBlank" }
              },
              "invocationHash": { "$ref": "#/$defs/sha256" },
              "message": { "type": "string" },
              "counterexample": {
                "type": "object",
                "additionalProperties": { "type": "string" }
              },
              "certificateHash": {
                "oneOf": [
                  { "const": "" },
                  { "$ref": "#/$defs/sha256" }
                ]
              },
              "contentHash": { "$ref": "#/$defs/sha256" }
            },
            "$defs": {
              "nonBlank": { "type": "string", "minLength": 1 },
              "sha256": {
                "type": "string",
                "pattern": "^sha256:[0-9a-f]{64}$"
              }
            },
            "additionalProperties": false
          }
          ''')

          # Workflow assertions use the translation artifact as the sole source.
          for file in [
              '.github/workflows/solver-ir.yml',
              '.github/workflows/autopilot-evidence.yml',
              '.github/workflows/release-readiness.yml',
          ]:
              p = Path(file)
              value = p.read_text()
              value = value.replace(
                  '''          assert search["translationStatus"] == "LOSSLESS"
          assert polynomial["translationStatus"] == "LOSSLESS"
          ''',
                  '''          assert search_translation["status"] == "LOSSLESS"
          assert polynomial_translation["status"] == "LOSSLESS"
          ''')
              value = value.replace(
                  '''          assert unsupported["translationStatus"] == "REJECTED"
          ''', '')
              value = value.replace(
                  '''          assert "ASSUMPTIONS_NOT_SUPPORTED" in unsupported["translationIssues"]
          assert unsupported["translationIssues"] == unsupported_translation["issues"]
          ''',
                  '''          assert "ASSUMPTIONS_NOT_SUPPORTED" in unsupported_translation["issues"]
          ''')
              value = value.replace(
                  '''          assert result["translationStatus"] == "LOSSLESS"
          ''',
                  '''          assert translation["status"] == "LOSSLESS"
          ''')
              p.write_text(value)

          # Docs: translation facts live only in Translation v1.
          replace(
              'docs/solver-neutral-ir.md',
              '''Zusätzlich wird die Übersetzung separat bewertet:
          ''',
              '''Die Übersetzung wird ausschließlich im separaten Translation-Vertrag bewertet:
          ''')
          replace(
              'docs/solver-neutral-ir.md',
              '''Jedes Resultat enthält den Obligation-, Goal- und Assumptions-Hash, Backend-ID und -Version, Invocation-Hash, verwendete Capabilities, sichtbare Übersetzungsprobleme sowie optionale Counterexample- und Certificate-Hashes.
          ''',
              '''Jedes Resultat enthält den Obligation-, Goal- und Assumptions-Hash, Backend-ID und -Version, Invocation-Hash, verwendete Capabilities sowie optionale Counterexample- und Certificate-Hashes. Übersetzungsstatus und Übersetzungsprobleme stehen nicht zusätzlich im Resultat.
          ''')

          Path('.github/workflows/normalize-solver-result-233.yml').unlink()
          PY

      - name: Reject duplicated translation fields
        shell: bash
        run: |
          if grep -R --line-number --extended-regexp \
              'result\(\)\.translation(Status|Issues)|"translationIssues"|"translationStatus"' \
              regelsuche-solver-ir/src docs/schemas/regelsuche-solver-result-v1.schema.json \
              --include='*.java' --include='*.json'; then
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0

      - name: Compile normalized contracts
        run: |
          ./gradlew --no-daemon \
            :regelsuche-solver-ir:test \
            :regelsuche-learning:test \
            :regelsuche-autopilot:test

      - name: Commit normalized contracts
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Separate solver translations from backend results"
          git push origin HEAD:feature/233-solver-neutral-ir
