name: Consolidate PR 625 claim-boundary test

on:
  push:
    branches:
      - research/historical-rediscovery-atlas-v1

permissions:
  contents: write

jobs:
  consolidate:
    name: Move the regression into the existing atlas test class
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: research/historical-rediscovery-atlas-v1
          fetch-depth: 0

      - name: Consolidate without weakening the AI context gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          target = Path(
              "regelsuche-experiments/src/test/java/de/regelsuche/benchmark/"
              "HistoricalRediscoveryAtlasTest.java"
          )
          standalone = Path(
              "regelsuche-experiments/src/test/java/de/regelsuche/benchmark/"
              "HistoricalRediscoveryClaimBoundaryTest.java"
          )
          if not standalone.is_file():
              raise SystemExit("standalone claim-boundary test is missing")

          text = target.read_text(encoding="utf-8")
          marker = "    private RecognitionSummary runRecognitionCorpus(\n"
          if text.count(marker) != 1:
              raise SystemExit(
                  f"expected one insertion marker, found {text.count(marker)}"
              )
          method = '''    @Test
              @Timeout(240)
              void curatedHitDoesNotBecomeCapabilityGapBeforeProductionClosureCompletes() {
                  Corpus full = HistoricalRediscoveryCorpus.load();
                  HistoricalRediscoveryCorpus.Case benchmarkCase = full.cases().stream()
                      .filter(value -> value.id().equals("regrouped-square"))
                      .findFirst()
                      .orElseThrow();
                  Corpus subset = new Corpus(
                      full.schema(),
                      full.evidenceStatus(),
                      full.inventoryRevision(),
                      full.claimBoundary(),
                      full.contentSha256(),
                      List.of(benchmarkCase));

                  HistoricalRediscoveryAtlas.CaseResult result =
                      new HistoricalRediscoveryAtlas().run(subset).cases().get(0);

                  assertTrue(result.production().oracle().inconclusive());
                  assertTrue(result.curatedControl().oracle().reachable());
                  assertEquals(PrimaryStatus.BUDGET_INCONCLUSIVE, result.status());
              }

          '''.replace("\n              ", "\n    ")
          target.write_text(text.replace(marker, method + marker), encoding="utf-8")
          PY

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add regelsuche-experiments/src/test/java/de/regelsuche/benchmark/HistoricalRediscoveryAtlasTest.java
          git rm \
            regelsuche-experiments/src/test/java/de/regelsuche/benchmark/HistoricalRediscoveryClaimBoundaryTest.java \
            .github/workflows/pr625-consolidate-claim-test.yml
          git commit -m "Consolidate historical claim-boundary regression"
          git push origin HEAD:research/historical-rediscovery-atlas-v1
