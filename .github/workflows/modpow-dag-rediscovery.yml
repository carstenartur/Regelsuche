name: Validate modPow DAG rediscovery

on:
  push:
    branches:
      - 'research/1024-modpow-dag-rediscovery'
    paths:
      - 'regelsuche-experiments/src/main/java/de/regelsuche/benchmark/ModPowDagRediscoveryStudy.java'
      - 'regelsuche-experiments/src/test/java/de/regelsuche/benchmark/ModPowDagRediscoveryStudyTest.java'
      - 'docs/research/modpow-dag-rediscovery-plan.json'
      - '.github/workflows/modpow-dag-rediscovery.yml'

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '25'
          verify-signature: true
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
      - name: Run focused study tests
        run: |
          ./gradlew --no-daemon --no-configuration-cache \
            :regelsuche-experiments:test \
            --tests 'de.regelsuche.benchmark.ModPowDagRediscoveryStudyTest' \
            --console=plain --stacktrace
