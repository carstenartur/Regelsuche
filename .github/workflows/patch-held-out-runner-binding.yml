name: Patch held-out runner binding

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'agent/target-free-held-out-matrix-execution'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Rebind the runner to the current preregistration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("regelsuche-discovery/src/main/java/de/regelsuche/discovery/representation/TargetFreeHeldOutMatrixRunner.java")
          old = "sha256:4c4516862823dc46cbeab1d10d769294b8627ca1243320f68471f6e41a12f045"
          new = "sha256:9d79fe60a2a2cf3fda9255cc3b26577b4ac23d61b8359cd22b3a7a0dcdb7bd29"
          source = path.read_text(encoding="utf-8")
          count = source.count(old)
          if count == 1:
              path.write_text(source.replace(old, new), encoding="utf-8")
          elif count != 0:
              raise SystemExit(f"expected zero or one stale preregistration binding, found {count}")
          PY
          if git diff --quiet -- regelsuche-discovery/src/main/java/de/regelsuche/discovery/representation/TargetFreeHeldOutMatrixRunner.java; then
            echo 'Runner already uses the current preregistration binding.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- regelsuche-discovery/src/main/java/de/regelsuche/discovery/representation/TargetFreeHeldOutMatrixRunner.java
          git commit -m 'Rebind the held-out matrix runner to the current preregistration'
          git push origin HEAD:agent/target-free-held-out-matrix-execution
