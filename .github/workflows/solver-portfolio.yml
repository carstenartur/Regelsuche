name: Solver Portfolio

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: solver-portfolio-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portfolio:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0

      - name: Install real Z3 backend
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends z3
          z3 -version

      - name: Test portfolio and write real reference trace
        run: |
          ./gradlew \
            :regelsuche-solver-portfolio:test \
            :regelsuche-solver-portfolio:z3IntegrationTest \
            :regelsuche-solver-portfolio:writeSolverPortfolioExample

      - name: Validate canonical portfolio report
        run: |
          python3 -m pip install --disable-pip-version-check --quiet jsonschema==4.25.1
          python3 - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          root = Path('regelsuche-solver-portfolio/build/reports/solver-portfolio')
          schema = json.loads(Path(
              'docs/schemas/regelsuche-solver-portfolio-report-v1.schema.json'
          ).read_text())
          Draft202012Validator.check_schema(schema)
          formal = json.loads((root / 'formal-report.json').read_text())
          guidance = json.loads((root / 'guidance-report.json').read_text())
          Draft202012Validator(schema).validate(formal)
          Draft202012Validator(schema).validate(guidance)
          manifest = json.loads((root / 'manifest.json').read_text())

          assert formal['outcome'] == 'CONFIRMED'
          assert formal['proofAuthorized'] is True
          assert formal['selectedBackendId'] == 'z3-smt-proof'
          executed = [a['backendId'] for a in formal['attempts']
                      if a['disposition'] == 'EXECUTED']
          assert 'polynomial-normal-form' in executed
          assert 'z3-smt-proof' in executed
          assert guidance['outcome'] == 'CONFIRMED'
          assert guidance['selectedBackendId'] == 'regelsuche-search'
          assert formal['telemetryNotice'] == \
              'EXECUTION_TELEMETRY_NOT_MATHEMATICAL_EVIDENCE'
          assert manifest['allThreeRolesConfigured'] is True
          assert manifest['formalMultiStage'] is True
          assert manifest['formalProofAuthorized'] is True
          assert manifest['searchGuidanceExecuted'] is True
          print('solver-portfolio-contract=valid')
          PY

      - name: Upload portfolio trace
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: solver-portfolio-trace
          path: |
            regelsuche-solver-portfolio/build/reports/solver-portfolio/**
            regelsuche-solver-portfolio/build/reports/tests/**
            regelsuche-solver-portfolio/build/test-results/**
          if-no-files-found: warn
