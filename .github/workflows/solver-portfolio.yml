name: Solver Portfolio

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: solver-portfolio-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  portfolio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0
      - name: Install real Z3 backend
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends z3
      - name: Run repository-owned solver portfolio verification
        run: bash scripts/run-solver-portfolio-verification.sh
      - name: Upload portfolio trace and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: solver-portfolio-trace
          path: |
            build/logs/solver-portfolio-*.log
            regelsuche-solver-portfolio/build/reports/solver-portfolio/**
            regelsuche-solver-portfolio/build/reports/tests/**
            regelsuche-solver-portfolio/build/test-results/**
            app/build/test-results/test/TEST-de.regelsuche.proof.OpenTargetProofPortfolioIntegrationTest.xml
          if-no-files-found: warn
