name: Solver Portfolio

on:
  push:
    branches: [ "main" ]
    paths:
      - 'regelsuche-solver-ir/**'
      - 'regelsuche-solver-portfolio/**'
      - 'app/src/test/java/de/regelsuche/proof/OpenTargetProofPortfolioIntegrationTest.java'
      - 'docs/schemas/regelsuche-solver-*.schema.json'
      - 'scripts/verify-solver-portfolio.py'
      - '.github/workflows/solver-portfolio.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'regelsuche-solver-ir/**'
      - 'regelsuche-solver-portfolio/**'
      - 'app/src/test/java/de/regelsuche/proof/OpenTargetProofPortfolioIntegrationTest.java'
      - 'docs/schemas/regelsuche-solver-*.schema.json'
      - 'scripts/verify-solver-portfolio.py'
      - '.github/workflows/solver-portfolio.yml'
  workflow_dispatch:

concurrency:
  group: solver-portfolio-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  portfolio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v6.1.0
      - name: Install the real Z3 backend and verifier dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends z3
          python3 -m pip install --disable-pip-version-check --quiet jsonschema==4.25.1
      - name: Run the repository-owned solver portfolio verification
        run: ./gradlew :regelsuche-solver-portfolio:verifySolverPortfolioEvidence --console=plain
      - name: Upload portfolio trace and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: solver-portfolio-trace
          path: |
            regelsuche-solver-portfolio/build/reports/solver-portfolio/**
            regelsuche-solver-portfolio/build/reports/tests/**
            regelsuche-solver-portfolio/build/test-results/**
            app/build/test-results/test/TEST-de.regelsuche.proof.OpenTargetProofPortfolioIntegrationTest.xml
          if-no-files-found: warn
