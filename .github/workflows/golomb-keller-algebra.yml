name: Golomb Keller algebra obligations
on:
  pull_request:
    paths:
      - 'regelsuche-solver-ir/**'
      - 'docs/golomb-keller-proof-campaign.md'
      - '.github/workflows/golomb-keller-algebra.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  algebra:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Run actual exact backend and proof-contract controls
        run: mvn -B -pl regelsuche-solver-ir -am -Dtest=GolombKellerAlgebraCampaignTest -Dsurefire.failIfNoSpecifiedTests=false test
      - name: Retain all actual proof artifacts and test diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: golomb-keller-algebra-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            regelsuche-solver-ir/target/surefire-reports/
            regelsuche-solver-ir/target/golomb-keller/
          if-no-files-found: warn
