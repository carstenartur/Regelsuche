name: Docker Image Integration

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: docker-image-integration-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docker-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6.1.0
      - name: Install Playwright host dependencies and Chromium
        run: ./gradlew :app:installPlaywrightHostDependencies :app:installPlaywrightBrowsers --console=plain
      - name: Run the repository-owned Docker integration suite
        run: ./gradlew :app:dockerE2eTest --console=plain
      - name: Upload Docker integration diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: docker-integration-reports
          path: |
            app/build/reports/tests/dockerE2eTest/**
            app/build/test-results/dockerE2eTest/**
            app/build/discovery-artifacts/**
          if-no-files-found: warn
