name: Temporary finalize issue 867 reference-independent validation

on:
  push:
    branches:
      - automation/867-finalize-reference-independent-validation

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: read
  actions: read

jobs:
  finalize:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: carstenartur/Regelsuche
      PR_NUMBER: '868'
      ISSUE_NUMBER: '867'
      FEATURE_BRANCH: feature/867-reference-independent-candidate-validation-v1
    steps:
      - name: Resolve exact PR head
        shell: bash
        run: |
          set -euo pipefail
          head_sha=$(gh pr view "$PR_NUMBER" --repo "$REPOSITORY" --json headRefOid,headRefName,state --jq '.headRefOid')
          head_name=$(gh pr view "$PR_NUMBER" --repo "$REPOSITORY" --json headRefName --jq '.headRefName')
          state=$(gh pr view "$PR_NUMBER" --repo "$REPOSITORY" --json state --jq '.state')
          test "$head_name" = "$FEATURE_BRANCH"
          test "$state" = OPEN
          echo "head_sha=$head_sha" >> "$GITHUB_ENV"
      - name: Check out exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
        with:
          repository: carstenartur/Regelsuche
          ref: feature/867-reference-independent-candidate-validation-v1
          fetch-depth: 0
      - name: Confirm exact head
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$head_sha"
      - name: Set up Java 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v5.0.0
        with:
          distribution: temurin
          java-version: '25'
      - name: Reproduce validation companion and full checkout authority
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-configuration-cache :regelsuche-discovery:check
          ./gradlew --no-configuration-cache ciCheck
          python3 - <<'PY'
          from pathlib import Path
          import json

          matches=[]
          for path in Path('.').glob('**/build/reports/**/*.json'):
              try:
                  root=json.loads(path.read_text(encoding='utf-8'))
              except Exception:
                  continue
              content=root.get('content',root) if isinstance(root,dict) else {}
              schema=content.get('schema','') if isinstance(content,dict) else ''
              if 'reference-independent' in schema.lower() or 'candidate-equivalence-validation' in schema.lower():
                  matches.append((path,root,content,schema))
          if len(matches) != 1:
              raise SystemExit(f'expected one reference-independent artifact, got {[(str(p),s) for p,_,_,s in matches]}')
          path,root,content,schema=matches[0]
          rows=content.get('rows',content.get('entries'))
          if not isinstance(rows,list) or len(rows) != 144:
              raise SystemExit(f'expected 144 validation rows, got {None if not isinstance(rows,list) else len(rows)}')
          candidate_objects=[]
          def walk(value):
              if isinstance(value,dict):
                  keys={key.lower() for key in value}
                  if ('candidatehash' in keys or 'candidateid' in keys) and any(key in keys for key in ('status','validationstatus','proofstatus','outcome')):
                      candidate_objects.append(value)
                  for child in value.values(): walk(child)
              elif isinstance(value,list):
                  for child in value: walk(child)
          walk(content)
          if not candidate_objects:
              raise SystemExit('validation artifact contains no candidate results')
          forbidden=[]
          for candidate in candidate_objects:
              forbidden.extend(key for key in candidate if any(token in key.lower() for token in ('reference','historical','expected')))
          if forbidden:
              raise SystemExit(f'reference-like fields leaked into validation results: {sorted(set(forbidden))}')
          print(json.dumps({
              'schema':schema,
              'rows':len(rows),
              'candidateResults':len(candidate_objects),
              'contentHash':root.get('contentHash'),
              'summary':content.get('summary'),
          },sort_keys=True,default=str))
          PY
      - name: Mark ready and wait for protected checks
        shell: bash
        run: |
          set -euo pipefail
          gh pr ready "$PR_NUMBER" --repo "$REPOSITORY" >/dev/null 2>&1 || true
          for attempt in $(seq 1 70); do
            current=$(gh pr view "$PR_NUMBER" --repo "$REPOSITORY" --json headRefOid --jq .headRefOid)
            test "$current" = "$head_sha"
            checks=$(gh pr checks "$PR_NUMBER" --repo "$REPOSITORY" --json name,state,bucket 2>/dev/null || true)
            count=$(jq 'length' <<<"${checks:-[]}")
            pending=$(jq '[.[] | select(.bucket == "pending")] | length' <<<"${checks:-[]}")
            failed=$(jq '[.[] | select(.bucket == "fail" or .bucket == "cancel")] | length' <<<"${checks:-[]}")
            if [ "$failed" -gt 0 ]; then
              gh issue comment "$ISSUE_NUMBER" --repo "$REPOSITORY" --body \
                "PR #$PR_NUMBER is not merged: a protected check failed on \`$head_sha\`."
              exit 1
            fi
            if [ "$count" -gt 0 ] && [ "$pending" -eq 0 ]; then
              break
            fi
            sleep 15
          done
          checks=$(gh pr checks "$PR_NUMBER" --repo "$REPOSITORY" --json name,state,bucket)
          test "$(jq '[.[] | select(.bucket == "pending" or .bucket == "fail" or .bucket == "cancel")] | length' <<<"$checks")" -eq 0
      - name: Require head-current review without open threads
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 40); do
            payload=$(gh api graphql \
              -f query='query($owner:String!,$repo:String!,$number:Int!){repository(owner:$owner,name:$repo){pullRequest(number:$number){headRefOid reviewThreads(first:100){nodes{isResolved}} reviews(first:100){nodes{state commit{oid} author{login}}}}}}' \
              -F owner=carstenartur -F repo=Regelsuche -F number="$PR_NUMBER")
            test "$(jq -r '.data.repository.pullRequest.headRefOid' <<<"$payload")" = "$head_sha"
            unresolved=$(jq '[.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved == false)] | length' <<<"$payload")
            adverse=$(jq --arg sha "$head_sha" '[.data.repository.pullRequest.reviews.nodes[] | select(.commit.oid == $sha and .state == "CHANGES_REQUESTED")] | length' <<<"$payload")
            current_reviews=$(jq --arg sha "$head_sha" '[.data.repository.pullRequest.reviews.nodes[] | select(.commit.oid == $sha)] | length' <<<"$payload")
            if [ "$unresolved" -eq 0 ] && [ "$adverse" -eq 0 ] && [ "$current_reviews" -gt 0 ]; then
              exit 0
            fi
            if [ "$unresolved" -gt 0 ] || [ "$adverse" -gt 0 ]; then
              gh issue comment "$ISSUE_NUMBER" --repo "$REPOSITORY" --body \
                "PR #$PR_NUMBER remains open because review changes or unresolved threads exist on \`$head_sha\`."
              exit 1
            fi
            gh pr comment "$PR_NUMBER" --repo "$REPOSITORY" --body \
              '@copilot review — please review this exact head for reference leakage, candidate-set equality, status completeness, and preservation of historical qualification v1.' >/dev/null 2>&1 || true
            sleep 20
          done
          gh issue comment "$ISSUE_NUMBER" --repo "$REPOSITORY" --body \
            "PR #$PR_NUMBER passed local reproduction and protected checks, but no head-current review appeared; no merge was attempted."
          exit 1
      - name: Merge exact reviewed head
        shell: bash
        run: |
          set -euo pipefail
          gh pr merge "$PR_NUMBER" --repo "$REPOSITORY" --squash --delete-branch \
            --subject 'Add reference-independent candidate validation (#868)' \
            --body 'Validate every eligible frozen candidate independently of historical correspondence while preserving qualification v1. Refs #867.'
          main_sha=$(gh api repos/$REPOSITORY/branches/main --jq .commit.sha)
          echo "main_sha=$main_sha" >> "$GITHUB_ENV"
      - name: Verify merged main and record completion
        shell: bash
        run: |
          set -euo pipefail
          run_id=''
          for attempt in $(seq 1 40); do
            run_id=$(gh api "repos/$REPOSITORY/actions/workflows/gradle.yml/runs?head_sha=$main_sha&event=push&per_page=10" --jq '.workflow_runs[0].id // empty')
            [ -n "$run_id" ] && break
            sleep 10
          done
          [ -n "$run_id" ]
          completed=false
          for attempt in $(seq 1 90); do
            status=$(gh api repos/$REPOSITORY/actions/runs/$run_id --jq .status)
            conclusion=$(gh api repos/$REPOSITORY/actions/runs/$run_id --jq '.conclusion // empty')
            if [ "$status" = completed ]; then
              completed=true
              test "$conclusion" = success
              break
            fi
            sleep 15
          done
          test "$completed" = true
          gh issue comment "$ISSUE_NUMBER" --repo "$REPOSITORY" --body \
            "PR #$PR_NUMBER merged as \`$main_sha\`. The exact PR head passed independent 144-row artifact inspection and full \`ciCheck\`; merged main then passed workflow run $run_id. Historical qualification v1 remains unchanged."
          encoded=${GITHUB_REF_NAME//\//%2F}
          gh api --method DELETE "repos/$REPOSITORY/git/refs/heads/$encoded" >/dev/null 2>&1 || true
