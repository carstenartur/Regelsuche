name: Characterize PR 861 projected work authority

on:
  push:
    branches:
      - feature/748-on-demand-verified-factorization-adapter-v2
    paths:
      - tools/apply_pr861_projected_work_v4.py
      - tools/patch_pr861_authority_diagnostics.py
      - tools/patch_pr861_root_identity_projection.py
      - tools/patch_pr861_formation_characterization.py
      - .github/workflows/apply-pr861-projected-work-v4.yml

permissions:
  contents: read

concurrency:
  group: pr861-projected-work-characterization
  cancel-in-progress: true

jobs:
  characterize:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Check out the PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/748-on-demand-verified-factorization-adapter-v2
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Apply the candidate implementation and diagnostic test
        run: |
          python3 tools/apply_pr861_projected_work_v4.py
          python3 tools/patch_pr861_root_identity_projection.py
          python3 tools/patch_pr861_authority_diagnostics.py
          python3 tools/patch_pr861_formation_characterization.py

      - name: Execute all 120 visible formation rows
        run: >-
          mvn --batch-mode --no-transfer-progress
          -pl app -am
          -Dtest=PolynomialTheoryUtilityOnDemandFormationCharacterizationTest
          -Dsurefire.failIfNoSpecifiedTests=false
          test

      - name: Show compact characterization summary
        run: |
          python3 - <<'PY'
          import csv
          from collections import Counter, defaultdict
          from pathlib import Path

          path = Path('build/reports/pr861-formation-characterization.tsv')
          rows = list(csv.DictReader(path.open(encoding='utf-8'), delimiter='\t'))
          print(f'rows={len(rows)}')
          print('kind=' + repr(Counter(row['kind'] for row in rows)))
          print('terminal=' + repr(Counter(row['terminalStatus'] for row in rows if row['terminalStatus'])))
          by_checkpoint = defaultdict(Counter)
          for row in rows:
              outcome = row['terminalStatus'] or row['kind']
              by_checkpoint[row['checkpoint']][outcome] += 1
          for checkpoint, counts in by_checkpoint.items():
              print(f'{checkpoint}={dict(counts)}')
          print('CP06_ROWS')
          for row in rows:
              if row['checkpoint'] == 'CP06_FULL':
                  print(
                      row['case'],
                      row['terminalStatus'] or row['kind'],
                      row['mechanicalAuthority'],
                      row['factorizationAuthority'],
                      row['detail'] or row['error'],
                      sep='\t',
                  )
          PY

      - name: Upload the complete formation map
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr861-formation-characterization
          path: build/reports/pr861-formation-characterization.tsv
          if-no-files-found: error
          retention-days: 7
