name: Diagnose Zenodo concept query

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Probe record-provided Zenodo version links
        shell: bash
        run: |
          set -euo pipefail
          seed_record='20951900'
          parent_record='20951899'

          summarize() {
            local label="$1"
            local url="$2"
            local body headers status content_type
            body=$(mktemp)
            headers=$(mktemp)
            status=$(curl --silent --show-error --location \
              --retry 3 --retry-delay 1 --retry-max-time 20 \
              -H 'Accept: application/json' \
              -H 'User-Agent: Regelsuche-zenodo-query-diagnosis/2' \
              --dump-header "$headers" \
              --output "$body" \
              --write-out '%{http_code}' \
              "$url")
            content_type=$(awk -F': ' 'tolower($1)=="content-type" {print tolower($2)}' "$headers" | tr -d '\r' | tail -n 1)
            echo "::group::${label} status=${status} content-type=${content_type}"
            if [[ "$status" == 200 && "$content_type" == application/json* ]]; then
              jq -c '
                if has("hits") then
                  {
                    total: (
                      if (.hits.total | type) == "number" then .hits.total
                      elif (.hits.total.value | type) == "number" then .hits.total.value
                      else null end
                    ),
                    links,
                    hits: [.hits.hits[] | {
                      id,
                      title: .metadata.title,
                      version: .metadata.version,
                      doi: (.pids.doi.identifier // .doi // null),
                      parent: (.parent // null),
                      links: {
                        self: .links.self,
                        latest: .links.latest,
                        versions: .links.versions,
                        parent: .links.parent,
                        parent_doi: .links.parent_doi
                      }
                    }]
                  }
                else
                  {
                    id,
                    title: .metadata.title,
                    version: .metadata.version,
                    doi: (.pids.doi.identifier // .doi // null),
                    parent: (.parent // null),
                    links: {
                      self: .links.self,
                      latest: .links.latest,
                      versions: .links.versions,
                      parent: .links.parent,
                      parent_doi: .links.parent_doi
                    }
                  }
                end
              ' "$body"
            else
              head -c 1000 "$body" || true
              echo
            fi
            echo '::endgroup::'
            rm -f "$body" "$headers"
          }

          summarize 'seed version 0.1.0' \
            "https://zenodo.org/api/records/${seed_record}"
          summarize 'seed versions collection' \
            "https://zenodo.org/api/records/${seed_record}/versions?size=25&page=1&sort=mostrecent"
          summarize 'seed latest version' \
            "https://zenodo.org/api/records/${seed_record}/versions/latest"
          summarize 'parent concept resource' \
            "https://zenodo.org/api/records/${parent_record}"
