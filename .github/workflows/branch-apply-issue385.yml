name: Apply Capability Status Source

on:
  push:
    branches: [ "issue-385-capability-status" ]
    paths:
      - '.github/workflows/branch-apply-issue385.yml'
      - '.github/issue-385-patch/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - '.github/workflows/branch-apply-issue385.yml'
      - '.github/issue-385-patch/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: issue-385-capability-status
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0

      - name: Decode implementation archive
        shell: bash
        run: |
          set -euo pipefail
          cat .github/issue-385-patch/chunk-* | base64 --decode > /tmp/issue385-static.tar.gz
          tar -tzf /tmp/issue385-static.tar.gz
          tar -xzf /tmp/issue385-static.tar.gz
          test -s scripts/generate-capability-status.py
          test -s docs/capability-status.md
          test -s docs/schemas/regelsuche-capability-status-v1.schema.json
          test -s .github/workflows/capability-status.yml
          test -s .github/issue-385-apply.sh

      - name: Apply and verify capability-status slice
        shell: bash
        run: |
          set -euo pipefail
          chmod +x .github/issue-385-apply.sh
          .github/issue-385-apply.sh
