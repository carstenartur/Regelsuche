name: Apply Capability Status Source

on:
  push:
    branches: [ "issue-385-capability-status" ]
    paths:
      - '.github/workflows/branch-apply-issue385.yml'
      - '.github/issue-385-patch/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - '.github/workflows/branch-apply-issue385.yml'
      - '.github/issue-385-patch/**'
  workflow_dispatch:

concurrency:
  group: apply-capability-status-${{ github.repository }}-issue-385
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: issue-385-capability-status
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0

      - name: Decode and authenticate implementation archive
        shell: bash
        run: |
          set -euo pipefail
          cat .github/issue-385-patch/chunk-* | base64 --decode > /tmp/issue385-static.tar.gz
          actual="$(sha256sum /tmp/issue385-static.tar.gz | cut -d' ' -f1)"
          test "$actual" = 4df6ae7792ea05d1d3bcb35c514b8d0e71beac0acc66a093eb017e6e38796f39
          tar -tzf /tmp/issue385-static.tar.gz > /tmp/issue385-files.txt
          grep -qx 'scripts/generate-capability-status.py' /tmp/issue385-files.txt
          grep -qx 'docs/capability-status.md' /tmp/issue385-files.txt
          grep -qx 'docs/schemas/regelsuche-capability-status-v1.schema.json' /tmp/issue385-files.txt
          grep -qx '.github/workflows/capability-status.yml' /tmp/issue385-files.txt
          grep -qx '.github/issue-385-apply.sh' /tmp/issue385-files.txt

      - name: Produce authoritative evidence before adding generated-doc links
        shell: bash
        run: |
          set -o pipefail
          ./gradlew \
            :regelsuche-release:runQualifiedReleaseReadinessWithHiddenRuleEvidence \
            :regelsuche-release:runDomainGenericQualification \
            --rerun-tasks \
            --console=plain 2>&1 \
            | tee /tmp/issue385-evidence.log

      - name: Apply and verify capability-status slice
        shell: bash
        run: |
          set -o pipefail
          rm -rf /tmp/issue385-stage
          mkdir -p /tmp/issue385-stage
          tar -xzf /tmp/issue385-static.tar.gz -C /tmp/issue385-stage

          install -Dm755 \
            /tmp/issue385-stage/scripts/generate-capability-status.py \
            scripts/generate-capability-status.py
          install -Dm644 \
            /tmp/issue385-stage/docs/capability-status.md \
            docs/capability-status.md
          install -Dm644 \
            /tmp/issue385-stage/docs/schemas/regelsuche-capability-status-v1.schema.json \
            docs/schemas/regelsuche-capability-status-v1.schema.json
          install -Dm644 \
            /tmp/issue385-stage/.github/workflows/capability-status.yml \
            .github/workflows/capability-status.yml

          python3 - <<'PY'
          from pathlib import Path

          source = Path('/tmp/issue385-stage/.github/issue-385-apply.sh')
          text = source.read_text(encoding='utf-8')
          start = text.find('\n./gradlew \\\n')
          end = text.find('\nCOMMON_ARGS=(', start)
          if start < 0 or end < 0:
              raise SystemExit('staged apply script Gradle block not found')
          patched = text[:start] + '\n' + text[end:]
          target = Path('/tmp/issue385-apply-with-evidence.sh')
          target.write_text(patched, encoding='utf-8')
          target.chmod(0o755)
          PY

          bash -x /tmp/issue385-apply-with-evidence.sh 2>&1 \
            | tee /tmp/issue385-bootstrap.log

      - name: Upload capability bootstrap diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: capability-status-bootstrap-diagnostics
          path: |
            /tmp/issue385-bootstrap.log
            /tmp/issue385-evidence.log
            /tmp/issue385-files.txt
            regelsuche-release/build/reports/release-readiness-qualified/**
            regelsuche-release/build/reports/domain-generic-qualification/**
            docs/generated/capability-status.*
          if-no-files-found: warn
