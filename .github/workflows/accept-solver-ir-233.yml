name: Accept Solver IR 233

on:
  push:
    branches: [ "feature/233-solver-neutral-ir" ]

permissions:
  contents: write
  pull-requests: write
  statuses: write

concurrency:
  group: accept-solver-ir-233
  cancel-in-progress: false

jobs:
  accept:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/233-solver-neutral-ir
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0

      - name: Full repository build
        run: ./gradlew --no-daemon build

      - name: Generate solver IR examples
        run: ./gradlew --no-daemon :regelsuche-solver-ir:writeSolverIrExample

      - name: Validate all solver contracts
        shell: bash
        run: |
          python3 -m pip install --disable-pip-version-check --quiet jsonschema==4.25.1
          python3 - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          root = Path('regelsuche-solver-ir/build/reports/solver-ir')
          schemas = Path('docs/schemas')
          pairs = []
          for name in ['obligation', 'assumption-obligation']:
              pairs.append((schemas / 'regelsuche-solver-obligation-v1.schema.json', root / f'{name}.json'))
          for prefix in ['regelsuche-search', 'polynomial-normal-form', 'unsupported']:
              pairs.extend([
                  (schemas / 'regelsuche-solver-translation-v1.schema.json', root / f'{prefix}-translation.json'),
                  (schemas / 'regelsuche-solver-result-v1.schema.json', root / f'{prefix}-result.json'),
                  (schemas / 'regelsuche-solver-execution-v1.schema.json', root / f'{prefix}-execution.json'),
              ])
          for schema_path, artifact_path in pairs:
              schema = json.loads(schema_path.read_text())
              Draft202012Validator.check_schema(schema)
              Draft202012Validator(schema).validate(json.loads(artifact_path.read_text()))
          PY

      - name: Generate qualified release evidence
        shell: bash
        run: |
          ./gradlew --no-daemon \
            :app:test \
            --tests de.regelsuche.docs.HiddenRulePilotCampaignTest \
            :regelsuche-release:runQualifiedReleaseReadinessWithHiddenRuleEvidence

      - name: Validate production proof and lifecycle contracts
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          root = Path('regelsuche-release/build/reports/release-readiness-qualified/campaign')
          schemas = Path('docs/schemas')
          pairs = [
              ('regelsuche-solver-obligation-v1.schema.json', 'solver-obligation.json'),
              ('regelsuche-solver-translation-v1.schema.json', 'solver-translation.json'),
              ('regelsuche-solver-result-v1.schema.json', 'solver-result.json'),
              ('regelsuche-solver-execution-v1.schema.json', 'solver-execution.json'),
              ('regelsuche-open-target-conjecture-proof-v2.schema.json', 'proof-report.json'),
              ('regelsuche-autonomous-production-lifecycle-v3.schema.json', 'production-lifecycle-run.json'),
          ]
          for schema_name, artifact_name in pairs:
              schema = json.loads((schemas / schema_name).read_text())
              Draft202012Validator.check_schema(schema)
              Draft202012Validator(schema).validate(
                  json.loads((root / artifact_name).read_text())
              )

          obligation = json.loads((root / 'solver-obligation.json').read_text())
          translation = json.loads((root / 'solver-translation.json').read_text())
          result = json.loads((root / 'solver-result.json').read_text())
          execution = json.loads((root / 'solver-execution.json').read_text())
          proof = json.loads((root / 'proof-report.json').read_text())
          lifecycle = json.loads((root / 'production-lifecycle-run.json').read_text())
          assert translation['obligationHash'] == obligation['contentHash']
          assert result['obligationHash'] == obligation['contentHash']
          assert execution['obligationHash'] == obligation['contentHash']
          assert execution['translationHash'] == translation['contentHash']
          assert execution['resultHash'] == result['contentHash']
          assert proof['solverTranslationHash'] == translation['contentHash']
          assert proof['solverExecutionHash'] == execution['contentHash']
          assert lifecycle['solverTranslationHash'] == translation['contentHash']
          assert lifecycle['solverExecutionHash'] == execution['contentHash']
          assert translation['status'] == 'LOSSLESS'
          assert result['status'] == 'CONFIRMED'
          assert proof['proofStatus'] == 'SYMBOLICALLY_VERIFIED'
          PY

      - name: Build standard image
        run: docker build -f Dockerfile -t regelsuche:solver-ir-233 .

      - name: Build proof image
        run: docker build -f Dockerfile.proof -t regelsuche-proof:solver-ir-233 .

      - name: Build and reproduce release image
        shell: bash
        run: |
          docker build -f Dockerfile.release-readiness \
            -t regelsuche-release-readiness:solver-ir-233 .
          mkdir -p build/release-readiness-docker-output
          chmod 0777 build/release-readiness-docker-output
          docker run --rm \
            -v "$PWD/build/release-readiness-docker-output:/output" \
            -v "$PWD/app/build/reports/hidden-rule-pilot/report.json:/input/hidden-rule-report.json:ro" \
            regelsuche-release-readiness:solver-ir-233 \
            /output \
            --hidden-rule-report /input/hidden-rule-report.json \
            --qualify-candidate \
            --require-ready
          diff -ru \
            regelsuche-release/build/reports/release-readiness-qualified \
            build/release-readiness-docker-output

      - name: Publish final accepted commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          rm .github/workflows/accept-solver-ir-233.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Complete solver IR acceptance"
          git push origin HEAD:feature/233-solver-neutral-ir
          SHA=$(git rev-parse HEAD)
          gh api \
            --method POST \
            repos/${{ github.repository }}/statuses/$SHA \
            -f state=success \
            -f context='Solver IR Acceptance' \
            -f description='Full build, schemas, release evidence and Docker reproduction passed'
          gh pr ready 363 --repo ${{ github.repository }}
