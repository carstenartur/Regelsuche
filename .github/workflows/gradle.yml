# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-gradle

name: Java CI with Gradle

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: java-ci-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0

    - name: Install Playwright host dependencies
      run: ./gradlew :app:installPlaywrightHostDependencies --console=plain

    - name: Build and run the complete Gradle test lifecycle
      shell: bash
      run: |
        mkdir -p build/reports/ci
        set -o pipefail
        ./gradlew test build --console=plain 2>&1 | tee build/reports/ci/gradle-build.log

    - name: Upload Gradle diagnostics
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: gradle-build-diagnostics
        path: |
          build/reports/ci/gradle-build.log
          **/build/reports/tests/**
          **/build/test-results/**
        if-no-files-found: warn

    - name: Require hidden-rule pilot evidence after a successful build
      if: success()
      shell: bash
      run: |
        test -s app/build/reports/hidden-rule-pilot/report.json
        test -s app/build/reports/hidden-rule-pilot/runtime.json

    - name: Upload hidden-rule pilot evidence
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: hidden-rule-pilot-evidence
        path: app/build/reports/hidden-rule-pilot/**
        if-no-files-found: warn

    - name: Require held-out policy evidence after a successful build
      if: success()
      shell: bash
      run: |
        test -s app/build/reports/held-out-policy/report.json
        test -s app/build/reports/held-out-policy/trajectories.jsonl

    - name: Upload held-out policy evidence
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: held-out-policy-evidence
        path: app/build/reports/held-out-policy/**
        if-no-files-found: warn

    - name: Require held-out descriptor-policy evidence after a successful build
      if: success()
      shell: bash
      run: |
        test -s app/build/reports/held-out-descriptor-policy/report.json
        test -s app/build/reports/held-out-descriptor-policy/trajectories.jsonl

    - name: Upload held-out descriptor-policy evidence
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: held-out-descriptor-policy-evidence
        path: app/build/reports/held-out-descriptor-policy/**
        if-no-files-found: warn

    - name: Require open-target conjecture evidence after a successful build
      if: success()
      shell: bash
      run: test -s regelsuche-learning/build/reports/open-target-conjecture-mining/report.json

    - name: Upload open-target conjecture evidence
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: open-target-conjecture-evidence
        path: regelsuche-learning/build/reports/open-target-conjecture-mining/**
        if-no-files-found: warn

    - name: Require cross-family bridge transfer evidence after a successful build
      if: success()
      shell: bash
      run: |
        test -s regelsuche-learning/build/reports/cross-family-bridge-transfer/hypothesis.json
        test -s regelsuche-learning/build/reports/cross-family-bridge-transfer/report.json

    - name: Upload cross-family bridge transfer evidence
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: cross-family-bridge-transfer-evidence
        path: regelsuche-learning/build/reports/cross-family-bridge-transfer/**
        if-no-files-found: warn

    - name: Require cross-family bridge qualification evidence after a successful build
      if: success()
      shell: bash
      run: |
        test -s regelsuche-learning/build/reports/cross-family-bridge-qualification/ablation.json
        test -s regelsuche-learning/build/reports/cross-family-bridge-qualification/report.json

    - name: Upload cross-family bridge qualification evidence
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: cross-family-bridge-qualification-evidence
        path: regelsuche-learning/build/reports/cross-family-bridge-qualification/**
        if-no-files-found: warn

  dependency-submission:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Generate and submit dependency graph
      uses: gradle/actions/dependency-submission@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0
