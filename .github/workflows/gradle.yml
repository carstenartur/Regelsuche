name: PR1006 isolated scoring provenance qualification

on:
  create:
  push:
    branches: [qa/pr1006-provenance-20260914]

permissions:
  contents: write

concurrency:
  group: pr1006-provenance-qualification
  cancel-in-progress: false

jobs:
  qualification:
    if: github.ref == 'refs/heads/qa/pr1006-provenance-20260914'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      GITHUB_TOKEN: ${{ github.token }}
      EXPECTED_HEAD: ae1f5c1670aa0c8e51a5223bb4812cea0c00f5a1
      CANDIDATE_BRANCH: fix/pr1006-provenance-candidate-20260914
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
      - name: Keep preparation outside the product checkout
        run: |
          cp .github/scripts/pr1006-provenance.py "$RUNNER_TEMP/pr1006-provenance.py"
          python3 - <<'PY'
          import os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'pr1006-provenance.py'
          source = path.read_text()
          start = source.index("path = S + 'search/telemetry/SearchEventJson.java'")
          end = source.index('\n\nadd_revision_record(', start)
          source = source[:start] + '''path = S + 'search/telemetry/SearchEventJson.java'
          text = Path(path).read_text()
          anchor = '        appendNumberField(json, "score", event.score());'
          assert text.count(anchor) == 1
          write(path, text.replace(anchor, anchor + '\\n        appendStringField(json, "scoringRevision", event.scoringRevision());'))
          ''' + source[end:]
          path.write_text(source)
          compile(source, str(path), 'exec')
          PY
          git fetch --quiet --no-tags --depth=1 origin "$EXPECTED_HEAD"
          git checkout --detach "$EXPECTED_HEAD"
          actual=$(git ls-remote origin refs/heads/fix/scoped-symbol-search-prerequisites-20260913 | cut -f1)
          test "$actual" = "$EXPECTED_HEAD"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          cache-read-only: true
      - name: Reproduce the two score provenance defects
        run: |
          python3 "$RUNNER_TEMP/pr1006-provenance.py" --red
          set +e
          ./gradlew --no-daemon --no-configuration-cache --console=plain --max-workers=2 :regelsuche-search:test --tests de.regelsuche.scoring.ExpressionScoreRevisionTest > "$RUNNER_TEMP/pr1006-red.log" 2>&1
          result=$?
          set -e
          tail -50 "$RUNNER_TEMP/pr1006-red.log"
          test "$result" -ne 0
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          p='regelsuche-search/build/test-results/test/TEST-de.regelsuche.scoring.ExpressionScoreRevisionTest.xml'
          r=ET.parse(p).getroot()
          assert int(r.attrib['tests']) == 2, r.attrib
          assert int(r.attrib['failures']) == 2 and int(r.attrib['errors']) == 0, r.attrib
          print('RED: both behavioral regressions reproduced; not a compiler failure')
          PY
      - name: Apply source-bound revision and migrate current consumers
        run: |
          python3 "$RUNNER_TEMP/pr1006-provenance.py" --apply
          python3 - <<'PY'
          import os, json
          from pathlib import Path
          manifest = Path(os.environ['RUNNER_TEMP']) / 'pr1006-changed-paths.txt'
          changed = set(manifest.read_text().splitlines())
          def edit(path, old, new):
              p = Path(path)
              s = p.read_text()
              assert s.count(old) == 1, (path, old, s.count(old))
              p.write_text(s.replace(old,new))
              changed.add(path)
          p='regelsuche-search/src/test/java/de/regelsuche/search/policy/DescriptorPolicyTrainerTest.java'
          edit(p, 'trainsAndLoadsByteStableDescriptorModelFromTrajectoryV2', 'trainsAndLoadsByteStableDescriptorModelFromTrajectoryV3')
          edit(p, 'assertEquals(TransformationDescriptor.SCHEMA, first.featureSchemaVersion());',
               'assertEquals(TransformationDescriptor.SCHEMA + ";score=" + de.regelsuche.scoring.ScoreRevision.CURRENT, first.featureSchemaVersion());')
          edit(p, 'regelsuche.search-trajectory/v2', 'regelsuche.search-trajectory/v3')
          edit('docs/work-budget-search-frontier.md', '`regelsuche.work-search-replay/v1`',
               '`regelsuche.work-search-replay/v2`, including the actual scoring producer revision')
          p='docs/schemas/regelsuche-search-trajectory-v3.schema.json'
          s=json.loads(Path(p).read_text()); s['title']='Regelsuche search trajectory event v3'
          Path(p).write_text(json.dumps(s,indent=2)+'\n')
          p='app/src/main/resources/web/candidate-dossier-state.js'
          edit(p, "value.schema !== 'regelsuche.search-state-replay/v1' || !value.executionRetained",
               "value.schema !== 'regelsuche.search-state-replay/v2'\n"
               "                || value.scoringRevision !== 'regelsuche.expression-score/v2'\n"
               "                || value.score?.scoringRevision !== value.scoringRevision || !value.executionRetained")
          p='app/src/e2eTest/resources/native-search-dossier-controls.js'
          edit(p, '    const selected = api.selection(decoded, candidate.stateId);',
               '''    const selected = api.selection(decoded, candidate.stateId);
              check(selected.observation.schema === 'regelsuche.search-state-replay/v2'
                  && selected.observation.scoringRevision === 'regelsuche.expression-score/v2'
                  && selected.observation.score.scoringRevision === selected.observation.scoringRevision,
                  'native score lost its producer-bound revision');
              for (const mutate of [
                  value => { value.schema = 'regelsuche.search-state-replay/v1'; },
                  value => { delete value.scoringRevision; },
                  value => { value.scoringRevision = 'foreign-score/v1'; },
                  value => { delete value.score.scoringRevision; },
                  value => { value.score.scoringRevision = 'foreign-score/v1'; }
              ]) {
                  const incompatible = JSON.parse(JSON.stringify(artifact));
                  const state = incompatible.content.states[0];
                  const observation = window.RegelsucheRunWorkspace.parseExactJson(state.canonicalStateJson);
                  mutate(observation);
                  state.canonicalStateJson = JSON.stringify(observation);
                  reject(() => api.decode(run, {...reply, raw: JSON.stringify(incompatible)}),
                      'native dossier accepted incompatible scoring provenance');
              }''')
          manifest.write_text('\n'.join(sorted(changed))+'\n')
          PY
          node --check app/src/main/resources/web/candidate-dossier-state.js
          node --check app/src/e2eTest/resources/native-search-dossier-controls.js
          git diff --check
          git diff --stat
      - name: Java25 core and search tests and complete application compilation
        run: |
          ./gradlew --no-daemon --no-configuration-cache --console=plain --max-workers=2 :regelsuche-core:test :regelsuche-search:test :app:compileJava :app:compileTestJava > "$RUNNER_TEMP/pr1006-green.log" 2>&1 || { tail -180 "$RUNNER_TEMP/pr1006-green.log"; exit 1; }
          tail -100 "$RUNNER_TEMP/pr1006-green.log"
      - name: Application import and export tests
        run: |
          ./gradlew --no-daemon --no-configuration-cache --console=plain --max-workers=2 :app:test --tests 'de.regelsuche.export.*' > "$RUNNER_TEMP/pr1006-export.log" 2>&1 || { tail -160 "$RUNNER_TEMP/pr1006-export.log"; exit 1; }
          tail -70 "$RUNNER_TEMP/pr1006-export.log"
      - name: Summarize fresh tests and publish isolated candidate only
        run: |
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          counts={k:0 for k in ('tests','failures','errors','skipped')}
          for m in ('regelsuche-core','regelsuche-search','app'):
            for p in pathlib.Path(m+'/build/test-results/test').glob('TEST-*.xml'):
              r=ET.parse(p).getroot()
              for k in counts: counts[k]+=int(r.attrib.get(k,0))
          print('JAVA25 QUALIFICATION:',counts)
          assert counts['tests']>100 and counts['failures']==counts['errors']==0,counts
          p=pathlib.Path('regelsuche-search/build/test-results/test/TEST-de.regelsuche.search.learning.ScoringProvenanceTest.xml')
          assert int(ET.parse(p).getroot().attrib['tests']) >= 6
          PY
          git diff --check
          git add --pathspec-from-file="$RUNNER_TEMP/pr1006-changed-paths.txt"
          git diff --cached --check
          git diff --cached --binary > "$RUNNER_TEMP/pr1006-product.patch"
          git diff --cached --stat
          git config user.name 'Regelsuche maintenance automation'
          git config user.email 'noreply@github.com'
          git commit -m 'Bind scoring revisions to producers and gate replay and learning data'
          git push origin "HEAD:refs/heads/$CANDIDATE_BRANCH"
          echo "QUALIFIED_CANDIDATE=$(git rev-parse HEAD)"
          echo "QUALIFIED_TREE=$(git rev-parse HEAD^{tree})"
      - name: Report any failed tests without suppressing the failure
        if: failure()
        run: |
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          for module in ('regelsuche-core','regelsuche-search','app'):
            for path in pathlib.Path(module+'/build/test-results/test').glob('TEST-*.xml'):
              for case in ET.parse(path).getroot().iter('testcase'):
                for kind in ('failure','error'):
                  for error in case.findall(kind):
                    print(path, case.attrib, error.attrib, (error.text or '')[:2500])
          PY
      - name: Preserve reports on success and failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr1006-scoring-provenance-qualification
          path: |
            ${{ runner.temp }}/pr1006-*.log
            ${{ runner.temp }}/pr1006-product.patch
            ${{ runner.temp }}/pr1006-changed-paths.txt
            regelsuche-core/build/test-results/test/TEST-*.xml
            regelsuche-search/build/test-results/test/TEST-*.xml
            app/build/test-results/test/TEST-*.xml
          if-no-files-found: error
