        run: git archive --format=zip --output=/tmp/checked-proof-source.zip HEAD
      - name: Execute every checked proof suite and both independent proof projects inside the worker
        run: mvn --batch-mode --no-transfer-progress -Pchecked-proofs -pl regelsuche-proof-tests -am -DskipTests verify
