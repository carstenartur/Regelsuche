  verification:
    name: ${{ github.event_name == 'create' && 'Showcase train-freeze authority v1' || 'Checkout-local ciCheck' }}
    needs: [preflight-contracts, gradle-verification, jmh-verification, sympy-runtime-verification, maven-product-verification, maven-git-free-verification, typed-external-polynomial-comparison, checked-proofs, native-scalar-reproduction, maven-polynomial-qualification, maven-native-polynomial-study, maven-typed-polynomial-study, maven-schema-polynomial-study, maven-student-sdk-archive-qualification]
    if: >-
      ${{ always() && (github.event_name != 'create' || (github.event.ref_type == 'branch' && github.event.ref == 'showcase/train-freeze-authority-v1')) }}
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Reject incomplete verification authority
        if: >-
          ${{ needs.preflight-contracts.result != 'success' || needs.gradle-verification.result != 'success' || needs.jmh-verification.result != 'success' || needs.sympy-runtime-verification.result != 'success' || (github.event_name != 'create' && (needs.maven-product-verification.result != 'success' || needs.maven-git-free-verification.result != 'success' || needs.typed-external-polynomial-comparison.result != 'success' || needs.checked-proofs.result != 'success' || needs.native-scalar-reproduction.result != 'success' || needs.maven-polynomial-qualification.result != 'success' || needs.maven-native-polynomial-study.result != 'success' || needs.maven-typed-polynomial-study.result != 'success' || needs.maven-schema-polynomial-study.result != 'success' || needs.maven-student-sdk-archive-qualification.result != 'success')) }}
        run: exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        with: { distribution: temurin, java-version: '25', verify-signature: true, problem-matcher: true, cache: maven }
      - name: Download project-parallel Gradle coverage evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ github.event_name == 'create' && github.event.ref_type == 'branch' && github.event.ref == 'showcase/train-freeze-authority-v1' && format('proof-carrying-showcase-train-freeze-{0}-{1}', github.sha, github.run_id) || 'repository-verification' }}
          path: .
      - name: Download isolated SymPy coverage evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: sympy-runtime-verification
          path: build/authority-evidence/sympy
      - name: Download isolated JMH acceptance evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: jmh-verification
          path: .
      - name: Checkout exact polynomial evidence source
        if: github.event_name != 'create'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: build/polynomial-parity-source
          persist-credentials: false
      - name: Download paired host polynomial archives
        if: github.event_name != 'create'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: typed-external-polynomial-${{ github.event.pull_request.head.sha || github.sha }}
          path: build/polynomial-parity/legacy
      - name: Download typed Maven polynomial archive
        if: github.event_name != 'create'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: maven-typed-polynomial-${{ github.event.pull_request.head.sha || github.sha }}
          path: build/polynomial-parity/typed
      - name: Download native Maven polynomial archive
        if: github.event_name != 'create'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: maven-native-polynomial-${{ github.event.pull_request.head.sha || github.sha }}
          path: build/polynomial-parity/native
      - name: Verify complete cross-authority coverage and render standard JaCoCo pages
        run: >-
          mvn --batch-mode --no-transfer-progress -pl regelsuche-quality
          -Pverify-cross-authority-coverage -Dregelsuche.coverage.publish=true -DskipTests verify
      - name: Collect complete checkout-owned quality acceptance evidence
        id: acceptance_evidence
        env:
          EVIDENCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          mvn --batch-mode --no-transfer-progress -pl regelsuche-release -am
          -Dtest=QualityAcceptancePublicationTest,PolynomialParityQualificationTest -Dsurefire.failIfNoSpecifiedTests=false
          -Dregelsuche.polynomialParity.enabled=${{ github.event_name != 'create' }}
          -Dregelsuche.qualityAcceptance.collect=true verify
      - name: Retain polynomial parity qualification
        if: github.event_name != 'create'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: polynomial-parity-qualification-${{ github.event.pull_request.head.sha || github.sha }}
          path: build/polynomial-parity/qualification.json
          if-no-files-found: error
      - name: Retain quality acceptance index and bound source files
        if: ${{ always() && !cancelled() && steps.acceptance_evidence.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: quality-acceptance-evidence
          path: build/reports/quality/acceptance-evidence/**
          include-hidden-files: true
          if-no-files-found: error
      - name: Retain converged coverage evidence
        if: >-
          ${{ always() && !cancelled() && needs.gradle-verification.result == 'success' && needs.jmh-verification.result == 'success' && needs.sympy-runtime-verification.result == 'success' && (github.event_name == 'create' || (needs.maven-product-verification.result == 'success' && needs.maven-git-free-verification.result == 'success')) }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: coverage-verification
          path: |
            build/reports/quality/coverage-report.json
            build/reports/quality/coverage-report.md
            public/coverage/**
          include-hidden-files: true
          if-no-files-found: error
      - name: Record complete verification authority
        run: echo "Preflight=${{ needs.preflight-contracts.result }} Gradle=${{ needs.gradle-verification.result }} JMH=${{ needs.jmh-verification.result }} SymPy=${{ needs.sympy-runtime-verification.result }} Maven=${{ needs.maven-product-verification.result }} MavenGitFree=${{ needs.maven-git-free-verification.result }} TypedPolynomial=${{ needs.typed-external-polynomial-comparison.result }} MavenPolynomial=${{ needs.maven-polynomial-qualification.result }} MavenNativePolynomial=${{ needs.maven-native-polynomial-study.result }} MavenTypedPolynomial=${{ needs.maven-typed-polynomial-study.result }} MavenStudentSdkArchive=${{ needs.maven-student-sdk-archive-qualification.result }} MavenSchemaPolynomial=${{ needs.maven-schema-polynomial-study.result }} Coverage=success"

  publish-pages:
    name: Publish generated reports
    needs: verification
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    permissions: { actions: read, contents: write }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with: { name: repository-verification, path: . }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with: { name: jmh-verification, path: . }
      - name: Remove producer-local coverage before restoring the complete report
        run: rm -rf public/coverage
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with: { name: coverage-verification, path: . }
      - name: Assemble the static site
        run: |
          rm -rf build/pages-site && mkdir -p build/pages-site
          cp -R docs/. build/pages-site/
          cp -R public/. build/pages-site/
          if [ -f app/build/reports/benchmark/benchmark-report.md ]; then cp app/build/reports/benchmark/benchmark-report.md build/pages-site/; fi
          if [ -f app/build/reports/benchmark/benchmark-summary.json ]; then mkdir -p build/pages-site/assets; cp app/build/reports/benchmark/benchmark-summary.json build/pages-site/assets/; fi
          touch build/pages-site/.nojekyll
      - name: Check whether this revision is still current main
        id: current-main
        run: |
          set -euo pipefail
          remote_main="$(git ls-remote --exit-code origin refs/heads/main)"
          remote_sha="${remote_main%%[[:space:]]*}"
          if [[ "$remote_sha" == "$GITHUB_SHA" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "Skipping reports for superseded main revision $GITHUB_SHA"
          fi
      - name: Publish generated reports to gh-pages
        if: ${{ steps.current-main.outputs.current == 'true' }}
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/pages-site
          keep_files: false
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: Publish generated reports (${{ github.sha }})

  jmh-precision-study:
    name: JMH precision study replica ${{ matrix.replicate }}
    if: >-
      github.event_name == 'pull_request' && github.event.action == 'opened' && github.run_attempt == 1 &&
      github.head_ref == 'codex/issue-981-jmh-precision-study' && github.repository == 'carstenartur/Regelsuche' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        replicate: [1, 2, 3]
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REGELSUCHE_STUDY_REPLICATE: ${{ matrix.replicate }}
    steps:
      - name: Start the complete replica wall-clock budget
        run: echo "REGELSUCHE_STUDY_JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        timeout-minutes: 5
        with: { fetch-depth: 0, ref: '${{ github.sha }}' }
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        timeout-minutes: 5
        with: { distribution: temurin, java-version: '25', verify-signature: true, problem-matcher: true }
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c
        timeout-minutes: 5
        with: { cache-cleanup: on-success }
      - name: Install the same isolated benchmark prerequisites
        timeout-minutes: 5
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            patchelf=0.14.3-1 \
            python3-venv
      - name: Collect the preregistered protocols without retries
        timeout-minutes: 60
        run: >-
          python3 -B scripts/run-jmh-precision-study-v1.py
          --replicate "$REGELSUCHE_STUDY_REPLICATE"
          --job-start-epoch "$REGELSUCHE_STUDY_JOB_START"
          --output "build/reports/jmh-precision-study-v1/replicate-$REGELSUCHE_STUDY_REPLICATE"
      - name: Retain every replica outcome and its original raw evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: jmh-precision-study-v1-replicate-${{ matrix.replicate }}
          path: build/reports/jmh-precision-study-v1/replicate-${{ matrix.replicate }}
          if-no-files-found: error

  jmh-precision-study-report:
    name: Retained JMH precision study analysis
    needs: jmh-precision-study
    if: >-
      ${{ always() && !cancelled() && github.event_name == 'pull_request' && github.event.action == 'opened' &&
      github.run_attempt == 1 && github.head_ref == 'codex/issue-981-jmh-precision-study' &&
      github.repository == 'carstenartur/Regelsuche' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { fetch-depth: 0, ref: '${{ github.sha }}' }
      - name: Download every available replica, including failed collections
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: jmh-precision-study-v1-replicate-*
          path: retained
          merge-multiple: false
      - name: Revalidate all three replicas or retain an incomplete-evidence report
        if: ${{ always() && !cancelled() }}
        run: >-
          python3 -B scripts/report-jmh-precision-study-v1.py
          --replicate retained/jmh-precision-study-v1-replicate-1
          --replicate retained/jmh-precision-study-v1-replicate-2
          --replicate retained/jmh-precision-study-v1-replicate-3
          --output build/reports/jmh-precision-study-v1/analysis
      - name: Retain canonical analysis including errors and null outcomes
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: jmh-precision-study-v1-analysis
          path: build/reports/jmh-precision-study-v1/analysis
          if-no-files-found: error

