name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  create:
  workflow_dispatch:

concurrency:
  group: >-
    ${{ github.event_name == 'create' && github.event.ref_type == 'branch' && github.event.ref == 'showcase/train-freeze-authority-v1' && format('showcase-train-freeze-{0}', github.repository) || format('ci-{0}-{1}', github.repository, github.ref) }}
  cancel-in-progress: >-
    ${{ github.event_name != 'create' || github.event.ref_type != 'branch' || github.event.ref != 'showcase/train-freeze-authority-v1' }}
permissions: { actions: read, contents: write, packages: read }
jobs:
  verification:
    name: ${{ github.event_name == 'create' && 'Showcase train-freeze authority v1' || 'Checkout-local ciCheck' }}
    if: github.event_name != 'create' || (github.event.ref_type == 'branch' && github.event.ref == 'showcase/train-freeze-authority-v1')
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    env:
      AI_KNOWLEDGE_EXTRACTOR_ENABLED: 'true'
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REGELSUCHE_AUTHORITY_GITHUB_SHA: ${{ github.sha }}
      REGELSUCHE_CI_TASK: ${{ github.event_name == 'create' && github.event.ref_type == 'branch' && github.event.ref == 'showcase/train-freeze-authority-v1' && 'authorizedShowcaseTrainFreeze' || 'ciCheck' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { fetch-depth: 0 }
      - name: Materialize consolidated immutable run persistence
        id: materialize
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/representation-run-store'
        run: |
          set -euo pipefail
          git fetch origin "$GITHUB_HEAD_REF" main
          git checkout -B "$GITHUB_HEAD_REF" "origin/$GITHUB_HEAD_REF"
          python3 scripts/materialize-run-store-consolidation.py
          git checkout origin/main -- .github/workflows/gradle.yml
          git rm scripts/materialize-run-store-consolidation.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add regelsuche-discovery/src/main/java/de/regelsuche/discovery/representation/RepresentationDiscoveryRunWorkspace.java
          git add regelsuche-discovery/src/test/java/de/regelsuche/discovery/representation/JsonFileRepresentationDiscoveryRunRepositoryTest.java
          git add -u regelsuche-discovery/src/main/java/de/regelsuche/discovery/representation
          git commit -m 'Consolidate immutable run persistence into the workspace contract'
          git push origin "HEAD:$GITHUB_HEAD_REF"
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        if: steps.materialize.outputs.changed != 'true'
        with: { distribution: temurin, java-version: '25' }
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        if: steps.materialize.outputs.changed != 'true'
        with: { cache-cleanup: on-success }
      - name: Install checkout prerequisites
        if: steps.materialize.outputs.changed != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-venv z3=4.8.12-1
          ./gradlew --no-daemon :app:installPlaywrightHostDependencies --console=plain
      - name: Run the checkout-owned CI lifecycle
        if: steps.materialize.outputs.changed != 'true'
        run: |
          set -o pipefail
          mkdir -p build/logs
          env -u GITHUB_SHA ./gradlew --no-daemon --no-configuration-cache "$REGELSUCHE_CI_TASK" --console=plain --stacktrace 2>&1 | tee build/logs/ci-check.log
      - name: Verify the complete Maven product and Docker contract once
        if: ${{ success() && !cancelled() && github.event_name != 'create' && steps.materialize.outputs.changed != 'true' }}
        run: mvn --batch-mode --no-transfer-progress -Pfull verify
      - name: Retain verification evidence
        if: ${{ always() && !cancelled() && steps.materialize.outputs.changed != 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ github.event_name == 'create' && github.event.ref_type == 'branch' && github.event.ref == 'showcase/train-freeze-authority-v1' && format('proof-carrying-showcase-train-freeze-{0}-{1}', github.sha, github.run_id) || 'repository-verification' }}
          path: |
            build/logs/**
            build/reports/**
            build/ai-knowledge/**
            build/independent-reproduction/**
            build/proof-carrying-showcase/**
            public/**
            **/build/reports/**
            **/build/test-results/**
            **/build/discovery-artifacts/**
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
            **/target/discovery-artifacts/**
            docs/generated/**
          include-hidden-files: true
          if-no-files-found: warn
  publish-pages:
    name: Publish generated reports
    needs: verification
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    permissions: { actions: read, contents: write }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with: { name: repository-verification, path: . }
      - name: Assemble the static site
        run: |
          rm -rf build/pages-site && mkdir -p build/pages-site
          cp -R docs/. build/pages-site/
          cp -R public/. build/pages-site/
          if [ -f app/build/reports/benchmark/benchmark-report.md ]; then cp app/build/reports/benchmark/benchmark-report.md build/pages-site/; fi
          if [ -f app/build/reports/benchmark/benchmark-summary.json ]; then mkdir -p build/pages-site/assets; cp app/build/reports/benchmark/benchmark-summary.json build/pages-site/assets/; fi
          touch build/pages-site/.nojekyll
      - name: Publish generated reports to gh-pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/pages-site
          keep_files: false
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: Publish generated reports (${{ github.sha }})
