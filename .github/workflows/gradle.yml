name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  verification:
    name: Checkout-local ciCheck
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    env:
      AI_KNOWLEDGE_EXTRACTOR_ENABLED: 'true'
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0
        with:
          cache-cleanup: on-success

      - name: Install checkout prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-venv \
            z3=4.8.12-1
          ./gradlew --no-daemon \
            :app:installPlaywrightHostDependencies \
            --console=plain

      - name: Run the checkout-owned CI lifecycle
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/logs
          env -u GITHUB_SHA ./gradlew \
            --no-daemon \
            --no-configuration-cache \
            ciCheck \
            --console=plain \
            --stacktrace \
            2>&1 | tee build/logs/ci-check.log

      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: repository-verification
          path: |
            build/logs/**
            build/reports/**
            build/ai-knowledge/**
            build/independent-reproduction/**
            public/**
            **/build/reports/**
            **/build/test-results/**
            **/build/discovery-artifacts/**
            docs/benchmark-report.md
            docs/assets/benchmark-summary.json
            docs/generated/**
          include-hidden-files: true
          if-no-files-found: warn

  publish-pages:
    name: Publish generated reports
    needs: verification
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    concurrency:
      group: pages-${{ github.repository }}-main
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: repository-verification
          path: .

      - name: Assemble the static site
        run: |
          rm -rf build/pages-site
          mkdir -p build/pages-site
          cp -R docs/. build/pages-site/
          cp -R public/. build/pages-site/
          touch build/pages-site/.nojekyll

      - name: Publish generated reports to gh-pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/pages-site
          keep_files: false
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: Publish generated reports (${{ github.sha }})
