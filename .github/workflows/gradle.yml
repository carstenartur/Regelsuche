name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  create:
  workflow_dispatch:

concurrency:
  group: >-
    ${{ github.event_name == 'create' && github.event.ref_type == 'branch' && github.event.ref == 'showcase/train-freeze-authority-v1' && format('showcase-train-freeze-{0}', github.repository) || format('ci-{0}-{1}', github.repository, github.ref) }}
  cancel-in-progress: >-
    ${{ github.event_name != 'create' || github.event.ref_type != 'branch' || github.event.ref != 'showcase/train-freeze-authority-v1' }}
permissions: { actions: read, contents: read, packages: read }
jobs:
  gradle-verification:
    name: ${{ github.event_name == 'create' && 'Showcase train-freeze Gradle authority' || 'Checkout-local Gradle authority' }}
    if: github.event_name != 'create' || (github.event.ref_type == 'branch' && github.event.ref == 'showcase/train-freeze-authority-v1')
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    env:
      AI_KNOWLEDGE_EXTRACTOR_ENABLED: 'true'
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REGELSUCHE_AUTHORITY_GITHUB_SHA: ${{ github.sha }}
      REGELSUCHE_CI_TASK: ${{ github.event_name == 'create' && github.event.ref_type == 'branch' && github.event.ref == 'showcase/train-freeze-authority-v1' && 'authorizedShowcaseTrainFreeze' || 'ciCheck' }}
      ORG_GRADLE_PROJECT_separateSympyRuntimeAuthority: 'true'
      REGELSUCHE_SEPARATE_SYMPY_RUNTIME_AUTHORITY: required-by-workflow
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with: { distribution: temurin, java-version: '25' }
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with: { cache-cleanup: on-success }
      - name: Install checkout prerequisites
        run: |
          sudo apt-get update
          # GraalPy isolates native modules beside the private extracted tree
          # and invokes patchelf to relocate each context-local ELF copy.
          sudo apt-get install -y --no-install-recommends \
            patchelf=0.14.3-1 \
            python3-venv \
            z3=4.8.12-1
          # Resolve only the pinned Playwright CLI. The independent bootstrap
          # avoids configuring and compiling the complete production reactor.
          ./gradlew --no-daemon -p playwright-bootstrap installPlaywrightHostDependencies --console=plain
      - name: Run the checkout-owned Gradle authority without duplicate JMH or loaded SymPy runtime work
        run: |
          set -o pipefail
          mkdir -p build/logs
          env -u GITHUB_SHA ./gradlew --no-daemon --no-configuration-cache -PseparateJmhAuthority=true "$REGELSUCHE_CI_TASK" --parallel --console=plain --stacktrace 2>&1 | tee build/logs/ci-check.log
      - name: Retain Gradle verification evidence
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ github.event_name == 'create' && github.event.ref_type == 'branch' && github.event.ref == 'showcase/train-freeze-authority-v1' && format('proof-carrying-showcase-train-freeze-{0}-{1}', github.sha, github.run_id) || 'repository-verification' }}
          path: |
            build/logs/**
            build/reports/**
            build/ai-knowledge/**
            build/independent-reproduction/**
            build/proof-carrying-showcase/**
            public/**
            **/build/reports/**
            **/build/test-results/**
            **/build/discovery-artifacts/**
            docs/generated/**
          include-hidden-files: true
          if-no-files-found: warn

  jmh-verification:
    name: Isolated JMH authority
    if: github.event_name != 'create' || (github.event.ref_type == 'branch' && github.event.ref == 'showcase/train-freeze-authority-v1')
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REGELSUCHE_AUTHORITY_GITHUB_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with: { distribution: temurin, java-version: '25' }
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with: { cache-cleanup: on-success }
      - name: Install isolated benchmark prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            patchelf=0.14.3-1 \
            python3-venv
      - name: Run every JMH benchmark and fail-closed validator
        run: bash gradle/run-isolated-jmh-authority.sh
      - name: Retain isolated JMH evidence
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: jmh-verification
          path: |
            app/build/reports/jmh/**
            app/build/reports/jmh-allocation/**
            regelsuche-math-sympy/build/reports/jmh/**
            build/reports/quality/jmh-regression-report.json
            build/reports/quality/jmh-regression-report.md
            public/dev/bench/**
          include-hidden-files: true
          if-no-files-found: error

  sympy-runtime-verification:
    name: Isolated SymPy runtime authority
    if: github.event_name != 'create' || (github.event.ref_type == 'branch' && github.event.ref == 'showcase/train-freeze-authority-v1')
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REGELSUCHE_AUTHORITY_GITHUB_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with: { distribution: temurin, java-version: '25' }
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with: { cache-cleanup: on-success }
      - name: Install isolated SymPy runtime prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            patchelf=0.14.3-1 \
            python3-venv
      - name: Run the complete Gradle SymPy runtime test authority
        run: bash gradle/run-isolated-sympy-runtime-authority.sh
      - name: Retain isolated SymPy runtime evidence
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sympy-runtime-verification
          path: |
            regelsuche-math-sympy/build/test-results/**
            regelsuche-math-sympy/build/reports/tests/**
            regelsuche-math-sympy/build/reports/jacoco/**
          include-hidden-files: true
          if-no-files-found: error

  maven-product-verification:
    name: Complete Maven product and Docker authority
    if: github.event_name != 'create'
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      AI_KNOWLEDGE_EXTRACTOR_ENABLED: 'true'
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REGELSUCHE_AUTHORITY_GITHUB_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Install independent Maven checkout prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            patchelf=0.14.3-1 \
            python3-venv \
            z3=4.8.12-1
          mvn --batch-mode --no-transfer-progress \
            -f playwright-bootstrap/pom.xml \
            org.codehaus.mojo:exec-maven-plugin:3.5.0:java
      - name: Verify the complete Maven product and Docker contract
        run: mvn --batch-mode --no-transfer-progress -Pfull verify
      - name: Retain Maven product verification evidence
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: maven-product-verification
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
            **/target/discovery-artifacts/**
          include-hidden-files: true
          if-no-files-found: warn

  verification:
    name: ${{ github.event_name == 'create' && 'Showcase train-freeze authority v1' || 'Checkout-local ciCheck' }}
    needs: [gradle-verification, jmh-verification, sympy-runtime-verification, maven-product-verification]
    if: >-
      ${{ always() && (github.event_name != 'create' || (github.event.ref_type == 'branch' && github.event.ref == 'showcase/train-freeze-authority-v1')) }}
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Reject incomplete verification authority
        if: >-
          ${{ needs.gradle-verification.result != 'success' || needs.jmh-verification.result != 'success' || needs.sympy-runtime-verification.result != 'success' || (github.event_name != 'create' && needs.maven-product-verification.result != 'success') }}
        run: exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Download project-parallel Gradle coverage evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ github.event_name == 'create' && github.event.ref_type == 'branch' && github.event.ref == 'showcase/train-freeze-authority-v1' && format('proof-carrying-showcase-train-freeze-{0}-{1}', github.sha, github.run_id) || 'repository-verification' }}
          path: .
      - name: Download isolated SymPy coverage evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: sympy-runtime-verification
          path: build/authority-evidence/sympy/regelsuche-math-sympy/build
      - name: Verify complete cross-authority coverage
        run: >-
          python3 -B scripts/verify-cross-authority-coverage.py
          --root "$PWD"
          --isolated-report
          build/authority-evidence/sympy/regelsuche-math-sympy/build/reports/jacoco/test/jacocoTestReport.xml
      - name: Retain converged coverage evidence
        if: >-
          ${{ always() && !cancelled() && needs.gradle-verification.result == 'success' && needs.jmh-verification.result == 'success' && needs.sympy-runtime-verification.result == 'success' && (github.event_name == 'create' || needs.maven-product-verification.result == 'success') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: coverage-verification
          path: |
            build/reports/quality/coverage-report.json
            build/reports/quality/coverage-report.md
          include-hidden-files: true
          if-no-files-found: error
      - name: Record complete verification authority
        run: echo "Gradle=${{ needs.gradle-verification.result }} JMH=${{ needs.jmh-verification.result }} SymPy=${{ needs.sympy-runtime-verification.result }} Maven=${{ needs.maven-product-verification.result }} Coverage=success"

  publish-pages:
    name: Publish generated reports
    needs: verification
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    permissions: { actions: read, contents: write }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with: { name: repository-verification, path: . }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with: { name: jmh-verification, path: . }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with: { name: coverage-verification, path: . }
      - name: Assemble the static site
        run: |
          rm -rf build/pages-site && mkdir -p build/pages-site
          cp -R docs/. build/pages-site/
          cp -R public/. build/pages-site/
          if [ -f app/build/reports/benchmark/benchmark-report.md ]; then cp app/build/reports/benchmark/benchmark-report.md build/pages-site/; fi
          if [ -f app/build/reports/benchmark/benchmark-summary.json ]; then mkdir -p build/pages-site/assets; cp app/build/reports/benchmark/benchmark-summary.json build/pages-site/assets/; fi
          touch build/pages-site/.nojekyll
      - name: Publish generated reports to gh-pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/pages-site
          keep_files: false
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: Publish generated reports (${{ github.sha }})
