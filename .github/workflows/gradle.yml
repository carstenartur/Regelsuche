name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main, 'codex/learned-*', 'codex/typed-*' ]
  create:
  workflow_dispatch:

concurrency:
  group: >-
    ${{ github.event_name == 'create' && github.event.ref_type == 'branch' && github.event.ref == 'showcase/train-freeze-authority-v1' && format('showcase-train-freeze-{0}', github.repository) || format('ci-{0}-{1}', github.repository, github.ref) }}
  # Finish running main verification; keep only the latest not-yet-started revision.
  # New PR revisions may still cancel obsolete PR work.
  queue: single
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions: { actions: read, contents: read, packages: read }
jobs:
  preflight-contracts:
    name: Fast build and workflow contracts
    if: github.event_name != 'create' || (github.event.ref_type == 'branch' && github.event.ref == 'showcase/train-freeze-authority-v1')
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        with: { distribution: temurin, java-version: '25', verify-signature: true, cache: maven }
      - name: Check build contracts and live strategy references before expensive execution
        run: >-
          mvn --batch-mode --no-transfer-progress -pl maven-build-contract,regelsuche-core -am
          '-Dtest=Maven*ContractTest,StrategyCodeReferencesTest'
          -Dsurefire.failIfNoSpecifiedTests=false test
      - name: Retain fast contract reports
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: preflight-contracts
          path: |
            maven-build-contract/target/surefire-reports/**
            regelsuche-core/target/surefire-reports/**
          if-no-files-found: error

  gradle-verification:
    needs: preflight-contracts
    name: ${{ github.event_name == 'create' && 'Showcase train-freeze Gradle authority' || 'Checkout-local Gradle authority' }}
    if: github.event_name != 'create' || (github.event.ref_type == 'branch' && github.event.ref == 'showcase/train-freeze-authority-v1')
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    env:
      AI_KNOWLEDGE_EXTRACTOR_ENABLED: 'true'
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REGELSUCHE_AUTHORITY_GITHUB_SHA: ${{ github.sha }}
      REGELSUCHE_CI_TASK: ${{ github.event_name == 'create' && github.event.ref_type == 'branch' && github.event.ref == 'showcase/train-freeze-authority-v1' && 'authorizedShowcaseTrainFreeze' || 'ciCheck' }}
      ORG_GRADLE_PROJECT_separateSympyRuntimeAuthority: 'true'
      REGELSUCHE_SEPARATE_SYMPY_RUNTIME_AUTHORITY: required-by-workflow
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        with:
          distribution: temurin
          java-version: '25'
          problem-matcher: true
          verify-signature: true
          cache: maven
          # This job bootstraps Playwright but never fills the full Maven reactor cache.
          cache-dependency-path: playwright-bootstrap/pom.xml
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c
        with: { cache-cleanup: on-success }
      - name: Install checkout prerequisites
        run: |
          # Chrome is preinstalled by the runner; this checkout installs no Google apt packages.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          # The 22.04 hosted mirrorlist can stall for an hour on its Azure HTTP entry.
          # Prefer the same official Ubuntu archive over HTTPS; retain package pins.
          if test -f /etc/apt/apt-mirrors.txt; then
            sudo sed -i 's#http://azure.archive.ubuntu.com/ubuntu#https://archive.ubuntu.com/ubuntu#g' /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get update
          # GraalPy isolates native modules beside the private extracted tree
          # and invokes patchelf to relocate each context-local ELF copy.
          sudo apt-get install -y --no-install-recommends \
            patchelf=0.14.3-1 \
            python3-venv \
            z3=4.8.12-1
          # Provision the pinned Playwright CLI from the independent Maven bootstrap;
          # no Gradle reactor configuration or application build is required.
          mvn --batch-mode --no-transfer-progress \
            -f playwright-bootstrap/pom.xml \
            org.codehaus.mojo:exec-maven-plugin:3.5.0:java
      - name: Run the checkout-owned Gradle authority without duplicate JMH or loaded SymPy runtime work
        run: |
          set -o pipefail
          mkdir -p build/logs
          env -u GITHUB_SHA ./gradlew --no-daemon --no-configuration-cache -PseparateJmhAuthority=true "$REGELSUCHE_CI_TASK" --parallel --console=plain --stacktrace 2>&1 | tee build/logs/ci-check.log
      - name: Retain Gradle verification evidence
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ github.event_name == 'create' && github.event.ref_type == 'branch' && github.event.ref == 'showcase/train-freeze-authority-v1' && format('proof-carrying-showcase-train-freeze-{0}-{1}', github.sha, github.run_id) || 'repository-verification' }}
          path: |
            build/logs/**
            build/distributions/regelsuche-sdk-*.zip
            build/reports/**
            build/ai-knowledge/**
            build/independent-reproduction/**
            build/proof-carrying-showcase/**
            public/**
            **/build/reports/**
            **/build/test-results/**
            **/build/discovery-artifacts/**
            docs/generated/**
            !build/reports/student-java-sdk/isolated-gradle-user-home/**
            !build/reports/student-java-sdk/generated-gradle-user-home/**
            !build/reports/student-java-sdk/hello-rule-java25-gradle-cache/**
            !build/reports/student-java-sdk/finite-difference-domain-java25-gradle-cache/**
            !build/reports/student-java-sdk/solver-adapter-java25-gradle-cache/**
            !build/reports/student-java-sdk/number-theory-plan-java25-gradle-cache/**
          include-hidden-files: true
          if-no-files-found: warn

  jmh-verification:
    needs: preflight-contracts
    name: Isolated JMH authority
    if: github.event_name != 'create' || (github.event.ref_type == 'branch' && github.event.ref == 'showcase/train-freeze-authority-v1')
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        with: { distribution: temurin, java-version: '25', verify-signature: true, cache: maven }
      - name: Verify the unchanged measurement rules and replay both original decisions
        run: >-
          mvn --batch-mode --no-transfer-progress -pl regelsuche-quality
          -Dtest=JmhWarmupMigrationTest,JmhRegressionV3VerifierTest,JmhPublicationTest,JmhAllocationReportMainTest,SympyFactorizationReportTest verify
      - name: Measure the fresh application and factorization forks and decide every gate
        run: >-
          mvn --batch-mode --no-transfer-progress --fail-at-end -Pjmh-qualification
          -pl regelsuche-jmh,regelsuche-sympy-jmh -am -DskipTests verify
      - name: Retain all successful or rejected native benchmark measurements
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: jmh-verification
          path: |
            app/build/reports/jmh/**
            app/build/reports/jmh-allocation/**
            regelsuche-math-sympy/build/reports/jmh/**
            build/reports/quality/jmh-regression-report.json
            build/reports/quality/jmh-regression-report.md
            public/dev/bench/**
            regelsuche-jmh/target/reports/jmh/**
            regelsuche-jmh/target/failsafe-reports/**
            regelsuche-sympy-jmh/target/reports/jmh/**
            regelsuche-sympy-jmh/target/failsafe-reports/**
          if-no-files-found: error

  sympy-runtime-verification:
    needs: preflight-contracts
    name: Isolated SymPy runtime authority
    if: github.event_name != 'create' || (github.event.ref_type == 'branch' && github.event.ref == 'showcase/train-freeze-authority-v1')
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REGELSUCHE_AUTHORITY_GITHUB_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        with: { distribution: temurin, java-version: '25', verify-signature: true, cache: maven }
      - name: Run the complete SymPy runtime suite with coverage inside the pinned worker
        run: mvn --batch-mode --no-transfer-progress -Pfull -pl regelsuche-math-sympy -am verify
      - name: Retain isolated SymPy runtime evidence
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: sympy-runtime-verification
          path: |
            regelsuche-math-sympy/target/reports/sympy-runtime/**
            regelsuche-math-sympy/target/site/jacoco/**
            regelsuche-math-sympy/target/failsafe-reports/**
          if-no-files-found: error

  maven-product-verification:
    needs: preflight-contracts
    name: Complete Maven product and Docker authority
    if: github.event_name != 'create'
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      AI_KNOWLEDGE_EXTRACTOR_ENABLED: 'true'
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REGELSUCHE_AUTHORITY_GITHUB_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        with:
          distribution: temurin
          java-version: '25'
          problem-matcher: true
          verify-signature: true
          cache: maven
          # Keep complete-reactor entries separate from short Maven jobs.
          cache-dependency-path: |
            **/pom.xml
            .mvn/maven.config
      - name: Install independent Maven checkout prerequisites
        run: |
          # Chrome is preinstalled by the runner; this checkout installs no Google apt packages.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          # The 22.04 hosted mirrorlist can stall for an hour on its Azure HTTP entry.
          # Prefer the same official Ubuntu archive over HTTPS; retain package pins.
          if test -f /etc/apt/apt-mirrors.txt; then
            sudo sed -i 's#http://azure.archive.ubuntu.com/ubuntu#https://archive.ubuntu.com/ubuntu#g' /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            patchelf=0.14.3-1 \
            python3-venv \
            z3=4.8.12-1
          mvn --batch-mode --no-transfer-progress \
            -f playwright-bootstrap/pom.xml \
            org.codehaus.mojo:exec-maven-plugin:3.5.0:java
      - name: Verify the complete Maven product and Docker contract
        id: full_maven_product
        run: mvn --batch-mode --no-transfer-progress -Pfull,sdk-release,web-workbench-image verify
      - name: Retain the original full Maven reactor reports
        if: ${{ always() && !cancelled() && steps.full_maven_product.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: maven-full-reactor-verification
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
            **/target/jacoco.exec
            **/target/site/jacoco/**
          if-no-files-found: error
      - name: Snapshot the original Maven XML for page replay
        id: full_maven_reports
        shell: bash
        run: |
          shopt -s globstar nullglob
          report_root="$(mktemp -d "${RUNNER_TEMP}/regelsuche-maven-reports.XXXXXXXX")"
          reports=(**/target/surefire-reports/TEST-*.xml **/target/failsafe-reports/TEST-*.xml)
          cp --parents -- "${reports[@]}" "$report_root"
          echo "root=$report_root" >> "$GITHUB_OUTPUT"
      - name: Verify executed Web Workbench image tests from the retained Maven XML
        id: verify_workbench_evidence
        env:
          REGELSUCHE_MAVEN_REPORT_ROOT: ${{ steps.full_maven_reports.outputs.root }}
        run: >-
          mvn --batch-mode --no-transfer-progress -pl maven-build-contract -Pverify-workbench-report
          "-Dregelsuche.tests.mavenReportRoot=${REGELSUCHE_MAVEN_REPORT_ROOT:?}" test
      - name: Replay retained Maven Surefire and Failsafe pages without Gradle inputs
        env:
          REGELSUCHE_MAVEN_REPORT_ROOT: ${{ steps.full_maven_reports.outputs.root }}
        run: >-
          mvn --batch-mode --no-transfer-progress -pl regelsuche-quality
          -Dregelsuche.tests.mavenPages=true
          "-Dregelsuche.tests.mavenReportRoot=${REGELSUCHE_MAVEN_REPORT_ROOT:?}" verify
      - name: Retain Maven product verification evidence
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: maven-product-verification
          path: |
            build/reports/released-sdk-maven-consumers/**
            build/reports/python-client/**
            app/target/reports/hidden-rule-pilot/**
            regelsuche-jmh/target/reports/jmh/**
            regelsuche-sympy-jmh/target/reports/jmh/**
            regelsuche-browser-tests/target/reports/browser/**
            regelsuche-quality-aggregate/target/reports/release-readiness-qualified/**
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
            **/target/discovery-artifacts/**
            public/maven-tests/**
          include-hidden-files: true
          if-no-files-found: warn

  maven-git-free-verification:
    needs: preflight-contracts
    name: Complete Git-free Maven lifecycle
    if: github.event_name != 'create'
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      AI_KNOWLEDGE_EXTRACTOR_ENABLED: 'true'
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REGELSUCHE_AUTHORITY_GITHUB_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { fetch-depth: 0, ref: "${{ github.sha }}" }
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        with:
          distribution: temurin
          java-version: '25'
          problem-matcher: true
          verify-signature: true
          cache: maven
          cache-dependency-path: |
            **/pom.xml
            .mvn/maven.config
      - name: Install independent Maven checkout prerequisites
        run: |
          # Chrome is preinstalled by the runner; this checkout installs no Google apt packages.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          # The 22.04 hosted mirrorlist can stall for an hour on its Azure HTTP entry.
          # Prefer the same official Ubuntu archive over HTTPS; retain package pins.
          if test -f /etc/apt/apt-mirrors.txt; then
            sudo sed -i 's#http://azure.archive.ubuntu.com/ubuntu#https://archive.ubuntu.com/ubuntu#g' /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            patchelf=0.14.3-1 \
            python3-venv \
            z3=4.8.12-1
          mvn --batch-mode --no-transfer-progress \
            -f playwright-bootstrap/pom.xml \
            org.codehaus.mojo:exec-maven-plugin:3.5.0:java
      - name: Prepare the exact Git-free source archive
        id: source_archive
        run: |
          set -euo pipefail
          source_root="$(mktemp -d "${RUNNER_TEMP}/regelsuche-maven-source.XXXXXXXX")"
          echo "root=$source_root" >> "$GITHUB_OUTPUT"
          git archive --format=tar HEAD | tar -xf - -C "$source_root"
          mvn --batch-mode --no-transfer-progress -pl regelsuche-release -am \
            -Dtest=QualityAcceptancePublicationTest -Dsurefire.failIfNoSpecifiedTests=false \
            -DdisableXmlReport=true -Dsurefire.useFile=false -Djacoco.skip=true \
            -Dregelsuche.qualityAcceptance.registerArchive=true \
            "-Dregelsuche.qualityAcceptance.registration=$source_root/build/authority-evidence/quality-source-tree.json" test
      - name: Reproduce full Maven lifecycle from a Git-free source archive
        env:
          REGELSUCHE_SOURCE_ARCHIVE_ROOT: ${{ steps.source_archive.outputs.root }}
        run: |
          set -euo pipefail
          (
            cd "${REGELSUCHE_SOURCE_ARCHIVE_ROOT:?}"
            # This is intentionally the unfiltered full Maven reactor, not
            # a selected -pl subset. The archive has no .git metadata.
            # Supply exact checkout provenance explicitly before any module
            # that may need the preparation revision performs its tests.
            export REGELSUCHE_PREPARATION_REVISION="${REGELSUCHE_AUTHORITY_GITHUB_SHA:?}"
            mvn --batch-mode --no-transfer-progress -pl regelsuche-release -am \
              -Dtest=QualityAcceptancePublicationTest -Dsurefire.failIfNoSpecifiedTests=false \
              -Dregelsuche.qualityAcceptance.verifyArchive=true \
              "-Dregelsuche.qualityAcceptance.revision=$REGELSUCHE_AUTHORITY_GITHUB_SHA" test
            cp regelsuche-release/target/surefire-reports/TEST-de.regelsuche.release.QualityAcceptancePublicationTest.xml \
              build/authority-evidence/quality-source-verification.xml
            mvn --batch-mode --no-transfer-progress -Pfull verify
            # Run read-only, fail-closed report checks only AFTER the full
            # reactor has produced its actual Surefire/Failsafe evidence.
            # They require executed unit tests in the declared core slice,
            # real PostgreSQL and Neo4j container suites, and no .git.
            mvn --batch-mode --no-transfer-progress               -pl maven-build-contract               -Dregelsuche.sourceArchiveMode=true               -Dregelsuche.sourceArchiveContainerMode=true               -DfailIfNoTests=true test
          )
      - name: Retain evidence produced independently inside the Git-free source archive
        if: ${{ always() && !cancelled() && steps.source_archive.outputs.root != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: git-free-maven-verification
          path: |
            ${{ steps.source_archive.outputs.root }}/**/target/surefire-reports/**
            ${{ steps.source_archive.outputs.root }}/**/target/failsafe-reports/**
            ${{ steps.source_archive.outputs.root }}/**/target/reports/**
            ${{ steps.source_archive.outputs.root }}/build/authority-evidence/quality-source-tree.json
            ${{ steps.source_archive.outputs.root }}/build/authority-evidence/quality-source-verification.xml
            ${{ steps.source_archive.outputs.root }}/build/reports/python-client/**
            ${{ steps.source_archive.outputs.root }}/build/reports/released-sdk-maven-consumers/**
          if-no-files-found: error

  maven-student-sdk-archive-qualification:
    needs: preflight-contracts
    name: Fresh Maven Student SDK archive qualification
    if: github.event_name != 'create'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { ref: "${{ github.event.pull_request.head.sha || github.sha }}", persist-credentials: false }
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        with: { distribution: temurin, java-version: '25', verify-signature: true, cache: maven }
      - name: Stage fresh Maven SDK artifacts, package and qualify the native archive
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/student-sdk-archive/evidence"
          mkdir -p "$evidence"
          work=$(mktemp -d "$RUNNER_TEMP/student-sdk-archive/work.XXXXXXXX")
          repository="$work/staged"
          git rev-parse HEAD 'HEAD^{tree}' > "$evidence/source.txt"
          git show -s --format=%ct HEAD > "$evidence/source-epoch.txt"
          source_path=maven-build-contract/src/test/java/de/regelsuche/build
          sha256sum "$source_path/StudentSdkArchive.java" "$source_path/StudentSdkPinnedConsumer.java" \
            "$source_path/MavenStudentSdkArchiveTest.java" > "$evidence/native-assembler.sha256"
          version=$(sed -n 's/^version=//p' release.properties)
          archive="$work/regelsuche-sdk-${version}.zip"
          mvn --batch-mode --no-transfer-progress -Psdk-release \
            -pl regelsuche-discovery-sdk,regelsuche-optimization-sdk,regelsuche-plugin-api,regelsuche-extension-api,regelsuche-extension-runtime,regelsuche-bom -am \
            "-Dproject.build.outputTimestamp=$(cat "$evidence/source-epoch.txt")" \
            "-Dmaven.repo.local=$repository" -DskipTests clean install 2>&1 | tee "$evidence/stage.log"
          mvn --batch-mode --no-transfer-progress -pl maven-build-contract -am \
            -Dtest=MavenStudentSdkArchiveTest#packageConfiguredRepository -Dregelsuche.studentSdk.package=true \
            "-Dregelsuche.studentSdk.repository=$repository" "-Dregelsuche.studentSdk.version=$version" \
            "-Dregelsuche.studentSdk.output=$archive" test 2>&1 | tee "$evidence/native-package.log"
          mvn --batch-mode --no-transfer-progress -pl maven-build-contract -am \
            -Dtest=MavenStudentSdkArchiveTest#qualifyConfiguredArchive -Dregelsuche.studentSdk.qualify=true \
            "-Dregelsuche.studentSdk.repository=$repository" "-Dregelsuche.studentSdk.version=$version" \
            "-Dregelsuche.studentSdk.output=$archive" "-Dregelsuche.studentSdk.evidence=$evidence" test
      - name: Retain native SDK archive qualification evidence
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: maven-student-sdk-archive-qualification-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/student-sdk-archive/evidence
          if-no-files-found: error

  maven-polynomial-qualification:
    needs: preflight-contracts
    name: Maven pinned polynomial pilot
    if: github.event_name != 'create'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { fetch-depth: 0, ref: "${{ github.event.pull_request.head.sha || github.sha }}" }
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        with: { distribution: temurin, java-version: '25', verify-signature: true, cache: maven }
      - name: Reproduce the original frozen experiment in pinned Java and SymPy workers
        run: >-
          mvn --batch-mode --no-transfer-progress -Ppolynomial-comparison -pl regelsuche-release -am
          -Dtest=ExternalPolynomialComparisonWorkerTest,PolynomialSourceProofTest,PolynomialRuntimeClasspathTest,PolynomialComparisonArchiveTest
          -Dsurefire.failIfNoSpecifiedTests=false verify
      - name: Retain native Maven rows and independent replay evidence
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-polynomial-pilot-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            regelsuche-release/target/reports/polynomial-comparison/**
            regelsuche-release/target/failsafe-reports/**
            regelsuche-learning/target/surefire-reports/**
          if-no-files-found: error

  maven-native-polynomial-study:
    needs: preflight-contracts
    name: Maven pinned native polynomial study
    if: github.event_name != 'create'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { fetch-depth: 0, ref: "${{ github.event.pull_request.head.sha || github.sha }}" }
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
