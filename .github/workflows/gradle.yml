        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: jmh-precision-study-v2-replicate-${{ matrix.replicate }}
          path: build/reports/jmh-precision-study-v2/replicate-${{ matrix.replicate }}
          if-no-files-found: error

  jmh-precision-study-v2-report:
    name: Retained JMH precision study v2 analysis
    needs: jmh-precision-study-v2
    if: >-
      ${{ always() && !cancelled() && github.event_name == 'pull_request' && github.event.action == 'opened' &&
      github.run_attempt == 1 && github.head_ref == 'codex/issue-981-jmh-precision-study-v2' &&
      github.repository == 'carstenartur/Regelsuche' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { fetch-depth: 0, ref: '${{ github.sha }}' }
      - name: Download every available replica, including failed collections
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: jmh-precision-study-v2-replicate-*
          path: retained
          merge-multiple: false
      - name: Revalidate all three replicas or retain an incomplete-evidence report
        if: ${{ always() && !cancelled() }}
        run: >-
          python3 -B scripts/report-jmh-precision-study-v2.py
          --replicate retained/jmh-precision-study-v2-replicate-1
          --replicate retained/jmh-precision-study-v2-replicate-2
          --replicate retained/jmh-precision-study-v2-replicate-3
          --output build/reports/jmh-precision-study-v2/analysis
      - name: Retain canonical analysis including errors and null outcomes
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: jmh-precision-study-v2-analysis
          path: build/reports/jmh-precision-study-v2/analysis
          if-no-files-found: error
