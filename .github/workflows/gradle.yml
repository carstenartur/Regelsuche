name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verification:
    name: Gradle fullCheck
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6.1.0
      - name: Install external verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-venv z3
          z3 -version
      - name: Run the complete repository verification lifecycle
        run: >-
          env -u GITHUB_SHA ./gradlew
          :app:installPlaywrightHostDependencies
          :app:installPlaywrightBrowsers
          fullCheck
          jacocoTestReport
          :app:benchmarkReport
          generateCiPages
          --console=plain
      - name: Upload verification reports and retained evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: repository-verification
          path: |
            build/logs/**
            build/reports/**
            public/**
            **/build/reports/tests/**
            **/build/test-results/**
            **/build/reports/jacoco/**
            **/build/reports/domain-*/**
            **/build/reports/evolution/**
            **/build/reports/interestingness-calibration/**
            **/build/reports/release-readiness*/**
            **/build/reports/solver-*/**
            **/build/discovery-artifacts/**
            docs/benchmark-report.md
            docs/assets/benchmark-summary.json
          if-no-files-found: warn

  publish-quality-pages:
    name: Publish quality reports
    needs: verification
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: pages-publish-${{ github.repository }}-main
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8.0.1
        with:
          name: repository-verification
          path: .
      - name: Ensure gh-pages branch exists
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            echo "gh-pages branch already exists."
            exit 0
          fi
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT
          git init "$tmp_dir"
          cd "$tmp_dir"
          git checkout --orphan gh-pages
          touch .nojekyll
          mkdir -p coverage tests dev/bench
          git add .
          git -c user.name='github-actions[bot]' \
            -c user.email='github-actions[bot]@users.noreply.github.com' \
            commit -m 'Initialize gh-pages'
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin gh-pages
      - name: Deploy coverage and test reports
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: public
          keep_files: true
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: Update quality reports (${{ github.sha }})

  refresh-doc-assets:
    name: Refresh documentation media
    needs: verification
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6.1.0
      - name: Record screenshots and videos through Gradle
        run: >-
          ./gradlew
          :app:installPlaywrightHostDependencies
          :app:installPlaywrightBrowsers
          :app:test
          :app:e2eTest
          -Pregelsuche.recordDocs=true
          -Pregelsuche.skipPlaywrightInstall=true
          --console=plain
      - name: Create or update documentation-media PR
        uses: peter-evans/create-pull-request@v8
        with:
          branch: chore/docs-screenshots-refresh
          delete-branch: false
          commit-message: 'chore(docs): refresh demo-gallery media'
          title: 'chore(docs): refresh demo-gallery media'
          body: Automated refresh from the central Gradle CI lifecycle.
          add-paths: |
            docs/assets/screenshots/**
            docs/assets/videos/**

  dependency-submission:
    name: Submit dependency graph
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/dependency-submission@v6.1.0
