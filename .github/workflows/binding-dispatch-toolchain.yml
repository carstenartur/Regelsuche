name: Temporary binding-dispatch Java 25 toolchain
on:
  push:
    branches: [qa/binding-dispatch-toolchain-20260916]
permissions:
  contents: read
jobs:
  toolchain:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '25'
      - name: Archive only the installed JDK for offline source tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/binding-toolchain"
          java -version 2> "$RUNNER_TEMP/binding-toolchain/java-version.txt"
          tar -czf "$RUNNER_TEMP/binding-toolchain/jdk25.tar.gz" -C "$JAVA_HOME" .
          cd "$RUNNER_TEMP/binding-toolchain"
          sha256sum jdk25.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: binding-dispatch-java25-toolchain
          path: ${{ runner.temp }}/binding-toolchain/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
