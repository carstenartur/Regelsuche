name: Paper Artifact Foundation

on:
  push:
    branches: [ "main" ]
    paths:
      - 'paper/**'
      - 'scripts/verify-paper-foundation.py'
      - 'docs/schemas/regelsuche-paper-artifact-manifest-v1.schema.json'
      - '.github/workflows/paper-artifact.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'paper/**'
      - 'scripts/verify-paper-foundation.py'
      - 'docs/schemas/regelsuche-paper-artifact-manifest-v1.schema.json'
      - '.github/workflows/paper-artifact.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install schema validator
        run: python3 -m pip install --disable-pip-version-check --quiet jsonschema==4.25.1

      - name: Verify paper foundation
        run: bash paper/reproduce-paper.sh

      - name: Require deterministic generated summaries
        run: |
          cp -a paper/generated /tmp/paper-generated-first
          bash paper/reproduce-paper.sh
          diff -ru /tmp/paper-generated-first paper/generated

      - name: Reject premature empirical claims
        shell: bash
        run: |
          grep -q 'PENDING_383' paper/claims-and-evidence.md
          grep -q 'PENDING_235' paper/claims-and-evidence.md
          grep -q 'PENDING_384' paper/claims-and-evidence.md
          grep -q 'NOT_AUTHORIZED' paper/claims-and-evidence.md
          ! grep -Eqi 'externally novel mathematics (was|is) (found|discovered|confirmed)' paper/manuscript.md

      - name: Upload paper foundation verification
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: paper-artifact-foundation
          path: |
            paper/**
            docs/schemas/regelsuche-paper-artifact-manifest-v1.schema.json
          if-no-files-found: error
