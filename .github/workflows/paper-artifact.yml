name: Paper Artifact Foundation

on:
  push:
    branches: [ "main" ]
    paths:
      - 'paper/**'
      - 'scripts/verify-paper-foundation.py'
      - 'docs/schemas/regelsuche-paper-artifact-manifest-v1.schema.json'
      - '.github/workflows/paper-artifact.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'paper/**'
      - 'scripts/verify-paper-foundation.py'
      - 'docs/schemas/regelsuche-paper-artifact-manifest-v1.schema.json'
      - '.github/workflows/paper-artifact.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install schema validator
        run: python3 -m pip install --disable-pip-version-check --quiet jsonschema==4.25.1

      - name: Verify committed paper foundation
        run: |
          cp -a paper/generated /tmp/paper-generated-committed
          bash paper/reproduce-paper.sh
          diff -ru /tmp/paper-generated-committed paper/generated

      - name: Require deterministic clean generation
        run: |
          cp -a paper/generated /tmp/paper-generated-first
          bash paper/reproduce-paper.sh
          diff -ru /tmp/paper-generated-first paper/generated

      - name: Reject ambiguous or escaping manifests
        shell: bash
        run: |
          python3 - <<'PY'
          import copy
          import json
          import subprocess
          import tempfile
          from pathlib import Path

          manifest = json.loads(
              Path('paper/paper-artifact-manifest.json').read_text(encoding='utf-8')
          )

          duplicate_issue = copy.deepcopy(manifest)
          duplicate_issue['requiredEvidence'].append({
              'issue': duplicate_issue['requiredEvidence'][0]['issue'],
              'purpose': 'ambiguous duplicate issue',
              'status': 'OPTIONAL',
          })

          escaping_path = copy.deepcopy(manifest)
          escaping_path['files'][0]['path'] = 'paper/../README.md'

          for label, value in (
              ('duplicate evidence issue', duplicate_issue),
              ('escaping paper path', escaping_path),
          ):
              with tempfile.TemporaryDirectory() as directory:
                  path = Path(directory) / 'manifest.json'
                  path.write_text(json.dumps(value), encoding='utf-8')
                  result = subprocess.run(
                      [
                          'python3',
                          'scripts/verify-paper-foundation.py',
                          '--manifest',
                          str(path),
                          '--schema',
                          'docs/schemas/regelsuche-paper-artifact-manifest-v1.schema.json',
                          '--output',
                          str(Path(directory) / 'output'),
                      ],
                      check=False,
                  )
                  if result.returncode == 0:
                      raise AssertionError(f'{label} unexpectedly passed')
          PY

      - name: Reject premature empirical claims
        shell: bash
        run: |
          grep -q 'PENDING_383' paper/claims-and-evidence.md
          grep -q 'PENDING_235' paper/claims-and-evidence.md
          grep -q 'PENDING_384' paper/claims-and-evidence.md
          grep -q 'NOT_AUTHORIZED' paper/claims-and-evidence.md
          ! grep -Eqi 'externally novel mathematics (was|is) (found|discovered|confirmed)' paper/manuscript.md

      - name: Upload paper foundation verification
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: paper-artifact-foundation
          path: |
            paper/**
            docs/schemas/regelsuche-paper-artifact-manifest-v1.schema.json
          if-no-files-found: error
