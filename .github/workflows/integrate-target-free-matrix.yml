name: Integrate target-free matrix

on:
  pull_request:
    branches:
      - automation/target-free-matrix-integration
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

concurrency:
  group: integrate-target-free-matrix
  cancel-in-progress: false

jobs:
  integrate-and-verify:
    if: >-
      github.event.pull_request.head.ref == 'agent/target-free-candidate-freeze' &&
      github.event.pull_request.head.sha == 'f9b608bdb7b312e984b5e52d71fb5f7cdde22827'
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Check out the execution branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/target-free-candidate-freeze
          fetch-depth: 0

      - name: Reconstruct the exact desired tree
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = \
            'f9b608bdb7b312e984b5e52d71fb5f7cdde22827'
          cat .github/pr694-rebuild/part-*.patch > /tmp/pr694.patch
          echo '762797818eedaf76b9442bc4cb1ec981eb2ac7afd41cd1385fce71fe5b3aebd6  /tmp/pr694.patch' \
            | sha256sum --check

          git config user.name 'github-actions[bot]'
          git config user.email \
            '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          test "$(git rev-parse origin/main)" = \
            '7f20fce8ce103a6f757c1e3fb1227d1e8ea293fb'

          git worktree add --detach /tmp/pr694-desired \
            897982c4e0ba9f2e99458d555e2b8f7a9d86f96f
          pushd /tmp/pr694-desired
          git merge --no-edit origin/main
          git apply --check /tmp/pr694.patch
          git apply /tmp/pr694.patch
          git diff --check
          popd

          files=(
            'regelsuche-discovery/build.gradle'
            'regelsuche-discovery/src/main/java/de/regelsuche/discovery/representation/TargetFreeRepresentationCandidateFreeze.java'
            'regelsuche-discovery/src/main/java/de/regelsuche/discovery/representation/TargetFreeRepresentationSearch.java'
            'regelsuche-discovery/src/test/java/de/regelsuche/discovery/representation/TargetFreeRepresentationCandidateFreezeTest.java'
            'regelsuche-discovery/src/test/java/de/regelsuche/discovery/representation/TargetFreeRepresentationSearchTest.java'
          )
          for file in "${files[@]}"; do
            mkdir -p "$(dirname "$file")"
            cp "/tmp/pr694-desired/$file" "$file"
          done
          git worktree remove --force /tmp/pr694-desired

          rm -rf .github/pr694-rebuild
          rm .github/workflows/pr694-rebuild.yml
          git add -A
          git diff --cached --check
          git commit -m 'Rebuild target-free candidate freeze on hardened matrix'

          expected="$(printf '%s\n' "${files[@]}" | sort)"
          actual="$(git diff --name-only origin/main | sort)"
          test "$actual" = "$expected" || {
            printf 'Unexpected final PR diff:\n%s\n' "$actual" >&2
            exit 1
          }
          target_sha="$(git rev-parse HEAD)"
          echo "target_sha=$target_sha" >> "$GITHUB_OUTPUT"

      - name: Set up Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          cache-read-only: true

      - name: Verify execution and freeze contracts
        env:
          REGELSUCHE_AUTHORITY_GITHUB_SHA: ${{ steps.prepare.outputs.target_sha }}
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --no-configuration-cache \
            :regelsuche-search:test \
            --tests de.regelsuche.search.strategy.SearchStrategyTest \
            :regelsuche-discovery:test \
            --tests de.regelsuche.discovery.representation.TargetFreeRepresentationEvaluationPlanTest \
            --tests de.regelsuche.discovery.representation.TargetFreeRepresentationSearchTest \
            --tests de.regelsuche.discovery.representation.TargetFreeRepresentationCandidateFreezeTest \
            :regelsuche-discovery:generateTargetFreeRepresentationCandidateFreeze \
            --console=plain
          ./gradlew --no-daemon --no-configuration-cache \
            :regelsuche-discovery:check \
            --console=plain
          python3 - <<'PY'
          import json
          from pathlib import Path

          artifact = Path(
              'regelsuche-discovery/build/reports/representation-discovery/'
              'candidate-freeze/representation-discovery-candidate-freeze.json'
          )
          data = json.loads(artifact.read_text(encoding='utf-8'))
          content = data['content']
          assert content['qualificationDisclosure'] == 'NOT_DISCLOSED'
          assert len(content['entries']) == 24
          assert len({entry['configurationId'] for entry in content['entries']}) == 24
          assert {entry['caseId'] for entry in content['entries']} == {
              'assumption-sensitive-cancellation-control',
              'catalog-blind-trigonometric-bridge',
              'neutral-element-compression',
              'occurrence-local-trigonometric-bridge',
              'repeated-term-compression',
              'telescoping-capability-bridge',
          }
          canonical = artifact.read_text(encoding='utf-8')
          for forbidden in (
              '"referenceExpressions"',
              '"requiredCapabilities"',
              '"acceptedCandidateTypes"',
          ):
              assert forbidden not in canonical
          PY

      - name: Publish verified execution branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ steps.prepare.outputs.target_sha }}'
          git push origin HEAD:agent/target-free-candidate-freeze
