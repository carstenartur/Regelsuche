name: Regelsuche SDK consumer bundle

on:
  pull_request:
    branches: [main]
    paths:
      - 'regelsuche-core/**'
      - 'regelsuche-egraph/**'
      - 'regelsuche-search/**'
      - 'regelsuche-validation/**'
      - 'regelsuche-math-algorithms/**'
      - 'regelsuche-optimization-sdk/**'
      - 'examples/external-consumers/java-optimization-java25/**'
      - 'scripts/package-optimization-sdk.py'
      - 'pom.xml'
      - '.github/workflows/sdk-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdk-consumer-bundle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  consumer-bundle:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '25'
          verify-signature: true
          cache: maven
      - name: Build and qualify two clean SDK distributions
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/regelsuche-sdk"
          mkdir -p "$root"
          git rev-parse HEAD > "$root/source-revision.txt"
          git rev-parse 'HEAD^{tree}' > "$root/source-tree.txt"
          java -version > "$root/java-version.txt" 2>&1
          mvn --version > "$root/maven-version.txt"
          epoch="$(git show -s --format=%ct HEAD)"
          for attempt in first second; do
            mvn --batch-mode --no-transfer-progress -Psdk-release \
              -pl regelsuche-optimization-sdk -am clean install \
              -Dproject.build.outputTimestamp="$epoch" \
              2>&1 | tee "$root/$attempt-maven.log"
            mvn --batch-mode --no-transfer-progress -pl regelsuche-optimization-sdk \
              dependency:copy-dependencies -DincludeScope=runtime \
              -DexcludeGroupIds=de.regelsuche \
              -DoutputDirectory="$RUNNER_TEMP/sdk-dependencies-$attempt"
            python3 scripts/package-optimization-sdk.py \
              --external-dependencies "$RUNNER_TEMP/sdk-dependencies-$attempt" \
              --output "$root/$attempt" --java-home "$JAVA_HOME" \
              > "$root/$attempt-consumer.json"
          done
          diff --recursive --brief "$root/first" "$root/second"
          printf 'Two clean Maven builds, two fresh standalone consumers, identical distribution bytes.\n' \
            > "$root/reproducibility.txt"
      - name: Retain the source-bound SDK separately from large repository reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: regelsuche-sdk-consumer-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/regelsuche-sdk/
            regelsuche-optimization-sdk/target/surefire-reports/
          if-no-files-found: error
          retention-days: 30
