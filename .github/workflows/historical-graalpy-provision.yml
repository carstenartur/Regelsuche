name: Historical GraalPy JVM public control
on:
  push:
    branches: [codex/historical-graalpy-provision-20261120]
permissions: {}
jobs:
  public-jvm:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Install the pinned public JDK
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        with:
          distribution: temurin
          java-version: '25.0.5+8'
          verify-signature: true
      - name: Stage only the four public source files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p stage/probe-src stage/wheels evidence
          base="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}"
          for file in pom.xml HistoricalProbe.java provision.py; do
            curl --fail --silent --show-error --location --retry 3 "$base/tools/historical-graalpy/$file" -o "stage/probe-src/$file"
          done
          bridge='regelsuche-math-sympy/src/main/resources/GRAALPY-VFS/de.regelsuche/regelsuche-math-sympy/src/regelsuche_sympy_factor.py'
          curl --fail --silent --show-error --location --retry 3 "$base/$bridge" -o stage/bridge.py
          echo "d67e266e11c92fdd3e5e2c85c30a89a7b5292f56e291bc86a9d036ac7aab23c4  stage/bridge.py" | sha256sum --check
          printf '%s\n' "$GITHUB_SHA" > evidence/workflow-commit.txt
          java -version 2> evidence/jdk.txt
          mvn -version > evidence/maven.txt
      - name: Verify wheels and the native release source bindings
        run: |
          set -euo pipefail
          python -m pip download --disable-pip-version-check --only-binary=:all: --no-deps --dest stage/wheels sympy==1.14.0 mpmath==1.3.0
          python stage/probe-src/provision.py stage
      - name: Resolve original embedded JVM artifacts and sources
        shell: bash
        run: |
          set -euo pipefail
          copy=org.apache.maven.plugins:maven-dependency-plugin:3.10.0:copy-dependencies
          mvn -B -ntp -C -f stage/probe-src/pom.xml "$copy" -DincludeScope=runtime -Dmdep.copyPom=true -Dmdep.useRepositoryLayout=true -DoutputDirectory="$PWD/stage/runtime" 2>&1 | tee evidence/maven-runtime.log
          python stage/probe-src/provision.py inventory
          mvn -B -ntp -C -f stage/probe-src/pom.xml "$copy" -Dclassifier=sources -DincludeArtifactIds=python-language,regex,truffle-api -Dmdep.failOnMissingClassifierArtifact=false -Dmdep.useRepositoryLayout=true -DoutputDirectory="$PWD/stage/sources" 2>&1 | tee evidence/maven-sources.log
          python stage/probe-src/provision.py inventory
      - name: Compile the actual class and method receiver
        shell: bash
        run: |
          set -euo pipefail
          CP="$(find "$PWD/stage/runtime" -type f -name '*.jar' | LC_ALL=C sort | paste -sd: -)"
          mkdir -p stage/classes
          javac -cp "$CP" -d stage/classes stage/probe-src/HistoricalProbe.java
          printf 'Premain-Class: HistoricalProbe\n' > stage/agent-manifest.mf
          jar --create --file stage/agent.jar --manifest stage/agent-manifest.mf -C stage/classes .
      - name: Run the isolated public polynomial through the original bridge
        shell: bash
        run: |
          set -euo pipefail
          CP="$(find "$PWD/stage/runtime" -type f -name '*.jar' | LC_ALL=C sort | paste -sd: -)"
          sudo unshare --net -- setpriv --reuid="$(id -u)" --regid="$(id -g)" --init-groups \
            "$JAVA_HOME/bin/java" -Xmx3g -XX:-UsePerfData --enable-native-access=ALL-UNNAMED \
            -Dpolyglot.engine.WarnInterpreterOnly=false -javaagent:"$PWD/stage/agent.jar" \
            -cp "$PWD/stage/agent.jar:$CP" HistoricalProbe "$PWD/stage" "$PWD/evidence" 2>&1 | tee evidence/public-run.log
          python stage/probe-src/provision.py verify
      - name: Package the resolved JVM for independent replay
        if: always() && hashFiles('evidence/maven-artifacts.json') != ''
        run: python stage/probe-src/provision.py package
      - name: Retain public identities and raw method evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: historical-graalpy-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence
          if-no-files-found: error
          retention-days: 14
      - name: Retain resolved runtime part00
        if: always() && hashFiles('parts/part00') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: historical-graalpy-part00-${{ github.run_id }}-${{ github.run_attempt }}
          path: parts/part00
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - name: Retain resolved runtime part01
