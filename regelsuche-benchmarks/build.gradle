plugins {
    id 'java-library'
    id 'application'
    id 'jacoco'
}

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    mainClass = 'de.regelsuche.benchmarks.ComparativeBenchmarkMain'
}

dependencies {
    api project(':regelsuche-solver-ir')
    implementation project(':regelsuche-search')
    implementation project(':regelsuche-solver-portfolio')

    testImplementation libs.junit.jupiter
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

def verificationPython = rootProject.layout.buildDirectory.file(
    System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows')
        ? 'verification-venv/Scripts/python.exe'
        : 'verification-venv/bin/python')

def configureComparativeEnvironment = { task ->
    task.dependsOn ':prepareVerificationEnvironment'
    task.doFirst {
        environment 'REGELSUCHE_SYMPY_PYTHON',
            verificationPython.get().asFile.absolutePath
    }
}

def comparativeBenchmarkOutput = providers.gradleProperty(
    'comparativeBenchmarkOutput'
).orElse(
    layout.buildDirectory.dir('reports/comparative-benchmarks')
        .map { it.asFile.absolutePath }
)

def configureComparativeWriter = { task, Object output ->
    task.group = 'verification'
    task.description = 'Writes one canonical comparative benchmark bundle.'
    task.dependsOn tasks.named('classes')
    task.classpath = sourceSets.main.runtimeClasspath
    task.mainClass = 'de.regelsuche.benchmarks.ComparativeBenchmarkMain'
    task.args output
    task.outputs.dir output
    task.outputs.upToDateWhen { false }
    configureComparativeEnvironment(task)
}

tasks.register('writeComparativeBenchmark', JavaExec) { task ->
    configureComparativeWriter(task, comparativeBenchmarkOutput.get())
}

tasks.register('writeComparativeBenchmarkRunA', JavaExec) { task ->
    configureComparativeWriter(
        task,
        rootProject.layout.buildDirectory.dir(
            'reports/comparative-ci/run-a').get().asFile.absolutePath)
}

tasks.register('writeComparativeBenchmarkRunB', JavaExec) { task ->
    configureComparativeWriter(
        task,
        rootProject.layout.buildDirectory.dir(
            'reports/comparative-ci/run-b').get().asFile.absolutePath)
}

tasks.named('test') { testTask ->
    useJUnitPlatform()
    finalizedBy tasks.named('jacocoTestReport')
    configureComparativeEnvironment(testTask)
}

jacoco {
    toolVersion = '0.8.13'
}

tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test')
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
}

tasks.named('check') {
    dependsOn tasks.named('jacocoTestReport')
}
