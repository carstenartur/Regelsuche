plugins {
    id 'java-library'
    id 'jacoco'
}

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    api project(':regelsuche-solver-ir')
    implementation project(':regelsuche-search')
    implementation project(':regelsuche-solver-portfolio')

    testImplementation libs.junit.jupiter
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

def comparativeBenchmarkOutput = providers.gradleProperty(
    'comparativeBenchmarkOutput'
).orElse(
    layout.buildDirectory.dir('reports/comparative-benchmarks')
        .map { it.asFile.absolutePath }
)

tasks.register('writeComparativeBenchmark', JavaExec) {
    group = 'verification'
    description = 'Writes the canonical initial #235 comparative benchmark bundle.'
    dependsOn tasks.named('classes')
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'de.regelsuche.benchmarks.ComparativeBenchmarkMain'
    args comparativeBenchmarkOutput.get()
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy tasks.named('jacocoTestReport')
}

jacoco {
    toolVersion = '0.8.13'
}

tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test')
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
}

tasks.named('check') {
    dependsOn tasks.named('jacocoTestReport')
}
