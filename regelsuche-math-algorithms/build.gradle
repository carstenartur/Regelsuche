plugins {
    id 'java-library'
    id 'jacoco'
}

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

dependencies {
    api project(':regelsuche-core')
    api project(':regelsuche-validation')
    api project(':regelsuche-search')

    testImplementation libs.junit.jupiter
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    systemProperty 'regelsuche.repositoryRoot', rootProject.projectDir.absolutePath
    inputs.files(
        rootProject.file('config/benchmarks/external-recurrence-observations-v1.json'),
        rootProject.file('docs/research/external-recurrence-observations-v1/work.tsv')
    ).withPathSensitivity(PathSensitivity.RELATIVE)
    finalizedBy tasks.named('jacocoTestReport')
}

jacoco {
    toolVersion = '0.8.16'
}

tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test')
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
}

tasks.named('check') {
    dependsOn tasks.named('jacocoTestReport')
}
