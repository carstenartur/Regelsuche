- id: rewrite-search
  label: "Rewrite-based term search"
  description: "Searches for rewrite-rule sequences that transform a source expression into a target expression using configurable search strategies (BFS, DFS, A*, beam search)."
  modules: [regelsuche-search, regelsuche-core, regelsuche-egraph, app]
  ownerModules: [regelsuche-search]
  packages:
    - de.regelsuche.search
    - de.regelsuche.search.convergence
    - de.regelsuche.search.estimate
    - de.regelsuche.search.index
    - de.regelsuche.search.memory
    - de.regelsuche.search.strategy
    - de.regelsuche.scoring
    - de.regelsuche.scoring.cost
    - de.regelsuche.moves
    - de.regelsuche.moves.apply
    - de.regelsuche.moves.enumerate
    - de.regelsuche.moves.search
  typePatterns:
    - '*Search*'
    - '*Rewrite*'
    - '*Strategy*'
    - '*Move*'
    - '*Scorer*'
    - '*RuleIndex*'
  testPatterns:
    - '*Search*Test'
    - '*Strategy*Test'
    - '*Move*Test'
    - '*RuleIndex*Test'
  docPatterns:
    - docs/search-strategies.md
    - docs/search-intelligence.md
    - docs/search-intelligence-roadmap.md
    - docs/search-space-analytics.md
    - docs/rewrite-rules.md
  evidenceTypes:
    - discovery-evidence
  jmhPatterns:
    - app/src/jmh/**/*Benchmark*
    - app/src/jmh/**/CoreBenchmarks*
  tags: [search, rewriting, term-rewriting]

- id: equality-saturation
  label: "Equality saturation"
  description: "Builds and saturates an e-graph from a set of rewrite rules to explore all equivalent forms of a mathematical expression simultaneously."
  modules: [regelsuche-egraph, regelsuche-core]
  ownerModules: [regelsuche-egraph]
  packages:
    - de.regelsuche.egraph
  typePatterns:
    - '*EGraph*'
    - '*EClass*'
    - '*Saturation*'
    - '*ENode*'
    - '*EGraphPattern*'
  testPatterns:
    - '*EGraph*Test'
    - '*Saturation*Test'
  docPatterns:
    - docs/equality-saturation.md
  evidenceTypes:
    - discovery-evidence
  jmhPatterns:
    - app/src/jmh/**/CoreBenchmarks*
  tags: [egraph, equality-saturation, symbolic]

- id: hypothesis-mining
  label: "Hypothesis and rule-candidate mining"
  description: "Mines candidate rewrite rules from successful transformation paths using anti-unification and pattern generalisation."
  modules: [regelsuche-learning, regelsuche-core, regelsuche-search, app]
  ownerModules: [regelsuche-learning]
  packages:
    - de.regelsuche.mining
    - de.regelsuche.moves.hypothesis
  typePatterns:
    - '*Hypothesis*'
    - '*Mining*'
    - '*AntiUnification*'
    - '*Pattern*'
    - '*Generaliz*'
    - '*Generalis*'
    - '*ParameterIntelligence*'
  testPatterns:
    - '*Hypothesis*Test'
    - '*Mining*Test'
    - '*Pattern*Test'
    - '*AntiUnification*Test'
    - '*ParameterIntelligence*Test'
  docPatterns:
    - docs/hypothesis-mining.md
  evidenceTypes:
    - hypothesis-evidence
    - discovery-evidence
  tags: [mining, learning, anti-unification]

- id: counterexample-search
  label: "Counterexample and validation search"
  description: "Validates algebraic identities and candidate rules by searching for numerical or symbolic counterexamples."
  modules: [regelsuche-validation, regelsuche-math-algorithms, regelsuche-math-jas]
  ownerModules: [regelsuche-validation]
  packages:
    - de.regelsuche.validation
    - de.regelsuche.equivalence
    - de.regelsuche.math.algorithms.equivalence
    - de.regelsuche.math.algorithms.numeric
