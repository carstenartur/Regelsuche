    - '*KnuthBendix*'
    - '*Groebner*'
    - '*Pslq*'
    - '*Completion*'
    - '*ProofBridge*'
    - '*ProofJob*'
    - '*ProofWorker*'
  testPatterns:
    - '*Proof*Test'
    - '*KnuthBendix*Test'
    - '*Groebner*Test'
    - '*Pslq*Test'
    - '*Completion*Test'
    - '*ProofBridge*Test'
  docPatterns:
    - docs/proof-bridge.md
    - docs/proof-workbench.md
    - docs/prover-execution.md
    - docs/mathematical-algorithms.md
  evidenceTypes:
    - proof-evidence
    - discovery-evidence
  tags: [proof, completion, groebner, pslq]

