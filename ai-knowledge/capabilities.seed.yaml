  tags: [validation, counterexample, equivalence]

- id: proof-workflows
  label: "Proof workflow support"
  description: "Supports proof-oriented workflows including critical-pair completion (Knuth-Bendix), Groebner basis reduction and PSLQ-style numerical relation search."
  modules: [regelsuche-math-algorithms, regelsuche-validation, app]
  ownerModules: [regelsuche-math-algorithms]
  packages:
