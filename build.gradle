def generateCapabilityStatusForVerification = tasks.register('generateCapabilityStatusForVerification', Exec) {
    group = 'verification'
    description = 'Regenerates the public capability matrix from retained release and domain evidence.'
    dependsOn prepareVerificationEnvironment,
        ':regelsuche-release:runQualifiedReleaseReadinessWithHiddenRuleEvidence',
        ':regelsuche-release:runDomainGenericQualification'
    workingDir rootDir
    doFirst {
        commandLine verificationPythonFile.get().absolutePath,
            'scripts/generate-capability-status.py',
            '--repository-root', '.',
            '--release-report', 'regelsuche-release/build/reports/release-readiness-qualified/release-readiness-report.json',
            '--release-run', 'regelsuche-release/build/reports/release-readiness-qualified/release-readiness-run.json',
            '--domain-report', 'regelsuche-release/build/reports/domain-generic-qualification/qualification-report.json',
            '--domain-run', 'regelsuche-release/build/reports/domain-generic-qualification/qualification-run.json',
            '--repository-revision', 'WORKTREE',
            '--json-output', 'docs/generated/capability-status.json',
            '--markdown-output', 'docs/generated/capability-status.md',
            '--check', '--check-docs'
    }
}

def verifyCapabilityStatus = tasks.register('verifyCapabilityStatus', Exec) {
    group = 'verification'
    description = 'Verifies the generated capability matrix, status vocabulary and content hash.'
    dependsOn prepareVerificationEnvironment, generateCapabilityStatusForVerification
    workingDir rootDir
    inputs.file('scripts/verify-capability-status.py')
    doFirst {
        commandLine verificationPythonFile.get().absolutePath, 'scripts/verify-capability-status.py'
    }
}

def generateCiPages = tasks.register('generateCiPages', Exec) {
    group = 'reporting'
    description = 'Renders coverage and JUnit report pages from local Gradle outputs.'
    workingDir rootDir
    commandLine pythonExecutable, 'scripts/generate-ci-pages.py'
    inputs.file('scripts/generate-ci-pages.py')
    outputs.dir('public')
}

def repositoryCheck = tasks.register('check') {
    group = 'verification'
    description = 'Runs the complete local test lifecycle and checkout-local contract verification.'
    dependsOn repositoryTest,
        tasks.named('verifyWorkflowSemantics'),
        tasks.named('verifyCandidateIndependentBenchmark'),
        checkDocumentationMath,
        verifyGeneratedDiscoveryGallery,
        verifyStaticReferencePage,
        verifySolverIrEvidence,
        verifyGenericDiscoveryDomainsEvidence,
        verifyDomainLifecycleHandoffEvidence,
        verifyDomainGenericQualificationEvidence,
        verifyReleaseReadinessEvidence,
        verifyCapabilityStatus
}

def verifySolverPortfolioEvidence = tasks.register('verifySolverPortfolioEvidence', Exec) {
    group = 'verification'
    description = 'Requires real Z3 and verifies the canonical solver-portfolio evidence chain.'
    dependsOn prepareVerificationEnvironment, repositoryTest,
        ':regelsuche-solver-portfolio:writeSolverPortfolioExample'
    mustRunAfter repositoryCheck
    workingDir rootDir
    inputs.file('scripts/verify-solver-portfolio-evidence.py')
    doFirst {
        commandLine verificationPythonFile.get().absolutePath, 'scripts/verify-solver-portfolio-evidence.py'
    }
}

def verifyReleaseReadinessDockerReproduction = tasks.register('verifyReleaseReadinessDockerReproduction', Exec) {
    group = 'verification'
    description = 'Requires Docker and compares release-readiness Gradle and runtime-image evidence byte for byte.'
    dependsOn prepareVerificationEnvironment, verifyReleaseReadinessEvidence
    mustRunAfter repositoryCheck
    workingDir rootDir
    inputs.file('scripts/verify-release-readiness-docker-reproduction.sh')
    doFirst {
        environment 'REGELSUCHE_VERIFICATION_PYTHON', verificationPythonFile.get().absolutePath
        commandLine 'bash', 'scripts/verify-release-readiness-docker-reproduction.sh'
    }
}

tasks.register('fullCheck') {
    group = 'verification'
    description = 'Runs check plus strict external-tool and Docker reproducibility verification.'
    dependsOn repositoryCheck, verifySolverPortfolioEvidence, verifyReleaseReadinessDockerReproduction
}

gradle.projectsEvaluated {
    project(':regelsuche-release').tasks.named('runQualifiedReleaseReadinessWithHiddenRuleEvidence').configure {
        mustRunAfter repositoryTest
    }
    project(':regelsuche-release').tasks.named('runDomainGenericQualification').configure {
        mustRunAfter repositoryTest
    }
}
