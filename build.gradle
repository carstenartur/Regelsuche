def aiKnowledgeEnabled = System.getenv('AI_KNOWLEDGE_EXTRACTOR_ENABLED') == 'true' || providers.gradleProperty('enableAiKnowledgeExtractor').orNull == 'true'

def pythonExecutable = providers.gradleProperty('pythonExecutable').getOrElse('python3')
def configuredIncludeTags = providers.gradleProperty('includeTestTags').orNull
def configuredExcludeTags = providers.gradleProperty('excludeTestTags').orNull

def parseTestTags = { String raw ->
    raw == null ? [] : raw.split(',')
        .collect { it.trim() }
        .findAll { !it.isEmpty() }
        .unique()
}

def includedTestTags = parseTestTags(configuredIncludeTags)
def excludedTestTags = parseTestTags(configuredExcludeTags)

allprojects {
    tasks.withType(org.gradle.api.tasks.testing.Test).configureEach {
        useJUnitPlatform {
            if (!includedTestTags.isEmpty()) {
                includeTags(*includedTestTags)
            }
            if (!excludedTestTags.isEmpty()) {
                excludeTags(*excludedTestTags)
            }
        }
    }
}

project(':app') {
    tasks.matching { it.name == 'dockerE2eTest' }.configureEach {
        dependsOn tasks.named('installPlaywrightBrowsers')
    }
}

def repositoryTestTasks = subprojects.collect { candidateProject ->
    candidateProject.tasks.withType(org.gradle.api.tasks.testing.Test)
}

def repositoryTest = tasks.register('test') {
    group = 'verification'
    description = 'Runs every Gradle Test task in the repository, including browser, Docker/Testcontainers and external-tool integration tests.'
    dependsOn repositoryTestTasks
}

tasks.register('allTests') {
    group = 'verification'
    description = 'Explicit alias for the complete repository test run.'
    dependsOn repositoryTest
}

def aiKnowledgeTaskNames = [
    'generateAiKnowledgeIndex',
    'analyzeAiComplexity',
    'optimizeAiKnowledge',
    'benchmarkAiKnowledge',
    'checkAiKnowledgeIndex',
    'publishAiKnowledgeIndex',
    'verifyAiKnowledgeArtifacts',
    'aiKnowledgeCheck'
]

aiKnowledgeTaskNames.each { taskName ->
    tasks.register(taskName) {
        group = taskName in ['generateAiKnowledgeIndex', 'publishAiKnowledgeIndex']
            ? 'documentation'
            : 'verification'
        description = aiKnowledgeEnabled
            ? "Delegates ${taskName} to the versioned AI Knowledge Extractor consumer project."
            : 'Explains how to enable the AI Knowledge Extractor lifecycle.'
        if (aiKnowledgeEnabled) {
            dependsOn ":ai-knowledge-verification:${taskName}"
        } else {
            doLast {
                throw new GradleException(
                    'AI knowledge verification is disabled. Set '
                        + 'AI_KNOWLEDGE_EXTRACTOR_ENABLED=true or '
                        + '-PenableAiKnowledgeExtractor=true.')
            }
        }
    }
}

tasks.register('verifyCandidateIndependentBenchmark', Exec) {
    group = 'verification'
    description = 'Verifies the frozen candidate-independent benchmark preregistration from a plain checkout.'
    workingDir rootDir
    commandLine pythonExecutable,
        'scripts/verify-candidate-independent-preregistration.py',
        'research/benchmarks/candidate-independent/benchmark-source.json'
    inputs.file('research/benchmarks/candidate-independent/benchmark-source.json')
    inputs.file('scripts/verify-candidate-independent-preregistration.py')
}

tasks.register('verifyWorkflowSemantics') {
    group = 'verification'
    description = 'Compatibility alias; Maven/JUnit owns the workflow-semantics contract.'
    dependsOn ':regelsuche-core:verifyMavenCoreReactor'
}

def verificationVenvDirectory = layout.buildDirectory.dir('verification-venv')
def verificationPythonFile = providers.provider {
    def executable = System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows')
        ? 'Scripts/python.exe'
        : 'bin/python'
    new File(verificationVenvDirectory.get().asFile, executable)
}

def prepareVerificationEnvironment = tasks.register('prepareVerificationEnvironment', Exec) {
    group = 'verification'
    description = 'Creates the pinned checkout-local Python environment used by verification tasks.'
    workingDir rootDir
    inputs.file('scripts/prepare-verification-environment.py')
    outputs.file(verificationVenvDirectory.map { it.file('.regelsuche-verification-environment.json') })
    doFirst {
        commandLine pythonExecutable,
            'scripts/prepare-verification-environment.py',
            '--venv', verificationVenvDirectory.get().asFile.absolutePath
    }
}

def checkDocumentationMath = tasks.register('checkDocumentationMath') {
