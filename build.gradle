def aiKnowledgeEnabled = System.getenv('AI_KNOWLEDGE_EXTRACTOR_ENABLED') == 'true' || providers.gradleProperty('enableAiKnowledgeExtractor').orNull == 'true'

def pythonExecutable = providers.gradleProperty('pythonExecutable').getOrElse('python3')

buildscript {
    repositories {
        if (System.getenv('AI_KNOWLEDGE_EXTRACTOR_ENABLED') == 'true' || project.findProperty('enableAiKnowledgeExtractor') == 'true') {
            mavenCentral()
            maven {
                name = 'GitHubPackages'
                url = uri('https://maven.pkg.github.com/carstenartur/ai-knowledge-extractor')
                credentials {
                    username = System.getenv('GITHUB_ACTOR') ?: ''
                    password = System.getenv('GITHUB_TOKEN') ?: ''
                }
            }
        }
    }

    dependencies {
        if (System.getenv('AI_KNOWLEDGE_EXTRACTOR_ENABLED') == 'true' || project.findProperty('enableAiKnowledgeExtractor') == 'true') {
            classpath 'org.aiknowledge:ai-knowledge-gradle-plugin:0.1.7'
        }
    }
}

if (aiKnowledgeEnabled) {
    apply plugin: 'org.aiknowledge.extractor'

    aiKnowledge {
        outputDirectory = layout.buildDirectory.dir('ai-knowledge')
        docsOutputDirectory = layout.projectDirectory.dir('docs/ai-knowledge')
        seedDirectory = layout.projectDirectory.dir('ai-knowledge')
        modelProfileDirectory = layout.projectDirectory.dir('ai-knowledge')
        failOnWarnings = false

        // Extractor 0.1.7 schema v3: main measured 20.28; the deterministic
        // trajectory + descriptor policy measured 21.50; the bounded frontier-
        // priority slice measures 21.53. The 21.7 limit leaves a narrow 0.17-point
        // margin while keeping method-level complexity gates unchanged.
        maxCognitiveDebt = 21.7d

        maxMethodCognitiveComplexity = 65
        maxMethodCyclomaticComplexity = 35
        maxAverageMethodCognitiveComplexity = 4.0d
        maxAverageMethodCyclomaticComplexity = 4.0d
    }
} else {
    tasks.register('generateAiKnowledgeIndex') {
        group = 'documentation'
        description = 'Explains how to enable the AI Knowledge Extractor plugin.'
        doLast {
            throw new GradleException('AI knowledge extractor is disabled for this build.')
        }
    }
}

// Stable, checkout-local verification entry points. GitHub Actions may invoke
// these tasks, but it must not own their assertions or infrastructure lifecycle.
tasks.register('docsLint', Exec) {
    group = 'verification'
    description = 'Checks Markdown display-math layout using a checked-in verifier.'
    workingDir rootProject.projectDir
    commandLine pythonExecutable, 'scripts/check-docs-math.py'
}

tasks.register('verifyDiscoveryGallery', Exec) {
    group = 'verification'
    description = 'Regenerates and verifies the committed discovery gallery.'
    dependsOn ':app:generateDiscoveryGallery'
    workingDir rootProject.projectDir
    commandLine pythonExecutable, 'scripts/verify-generated-discovery-gallery.py'
}

tasks.register('verifyStaticReferencePage', Exec) {
    group = 'verification'
    description = 'Generates and verifies the static reference page contract.'
    dependsOn ':app:generateStaticReferencePage'
    workingDir rootProject.projectDir
    commandLine pythonExecutable, 'scripts/verify-static-reference-page.py'
}

tasks.register('generateCiPages', Exec) {
    group = 'reporting'
    description = 'Renders coverage and test badge pages from local Gradle reports.'
    workingDir rootProject.projectDir
    commandLine pythonExecutable, 'scripts/generate-ci-pages.py'
}

tasks.register('integrationTest') {
    group = 'verification'
    description = 'Runs Docker-backed integration tests through Testcontainers.'
    dependsOn ':app:dockerE2eTest'
}

tasks.register('browserE2eTest') {
    group = 'verification'
    description = 'Runs the browser end-to-end suite from a plain checkout.'
    dependsOn ':app:e2eTest'
}

def verificationTestTask = tasks.register('verificationTest') {
    group = 'verification'
    description = 'Runs all JVM tests plus the Testcontainers integration suite.'
    dependsOn tasks.named('docsLint')
    dependsOn tasks.named('integrationTest')
}

gradle.projectsEvaluated {
    verificationTestTask.configure {
        dependsOn subprojects.findAll { project ->
            project.tasks.findByName('test') != null
        }.collect { project ->
            project.tasks.named('test')
        }
    }
}
