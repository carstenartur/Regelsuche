def aiKnowledgeExtractor = file('../ai-knowledge-extractor')

if (aiKnowledgeExtractor.isDirectory()) {
    apply plugin: 'org.aiknowledge.extractor'

    aiKnowledge {
        outputDirectory = layout.buildDirectory.dir('ai-knowledge')
        docsOutputDirectory = layout.projectDirectory.dir('docs/ai-knowledge')
        seedDirectory = layout.projectDirectory.dir('ai-knowledge')
        modelProfileDirectory = layout.projectDirectory.dir('ai-knowledge')
        failOnWarnings = false
        maxCognitiveDebt = 100.0
    }
} else {
    tasks.register('generateAiKnowledgeIndex') {
        group = 'documentation'
        description = 'Explains how to enable the local AI Knowledge Extractor composite build.'
        doLast {
            throw new GradleException('Place ai-knowledge-extractor next to this repository or use the published org.aiknowledge.extractor plugin.')
        }
    }
}
