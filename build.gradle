def aiKnowledgeEnabled = System.getenv('AI_KNOWLEDGE_EXTRACTOR_ENABLED') == 'true' || providers.gradleProperty('enableAiKnowledgeExtractor').orNull == 'true'

def configuredIncludeTags = providers.gradleProperty('includeTestTags').orNull
def configuredExcludeTags = providers.gradleProperty('excludeTestTags').orNull

def parseTestTags = { String raw ->
    raw == null ? [] : raw.split(',')
        .collect { it.trim() }
        .findAll { !it.isEmpty() }
        .unique()
}

def includedTestTags = parseTestTags(configuredIncludeTags)
def excludedTestTags = parseTestTags(configuredExcludeTags)

allprojects {
    tasks.withType(org.gradle.api.tasks.testing.Test).configureEach {
        useJUnitPlatform {
            if (!includedTestTags.isEmpty()) {
                includeTags(*includedTestTags)
            }
            if (!excludedTestTags.isEmpty()) {
                excludeTags(*excludedTestTags)
            }
        }
    }
}

project(':app') {
    tasks.matching { it.name == 'dockerE2eTest' }.configureEach {
        dependsOn tasks.named('installPlaywrightBrowsers')
    }
}

tasks.register('allTests') {
    group = 'verification'
    description = 'Runs every Gradle Test task in the repository, including browser, Docker/Testcontainers and external-tool integration tests.'
    dependsOn subprojects.collect { candidateProject ->
        candidateProject.tasks.withType(org.gradle.api.tasks.testing.Test)
    }
}

buildscript {
    repositories {
        if (System.getenv('AI_KNOWLEDGE_EXTRACTOR_ENABLED') == 'true' || project.findProperty('enableAiKnowledgeExtractor') == 'true') {
            mavenCentral()
            maven {
                name = 'GitHubPackages'
                url = uri('https://maven.pkg.github.com/carstenartur/ai-knowledge-extractor')
                credentials {
                    username = System.getenv('GITHUB_ACTOR') ?: ''
                    password = System.getenv('GITHUB_TOKEN') ?: ''
                }
            }
        }
    }

    dependencies {
        if (System.getenv('AI_KNOWLEDGE_EXTRACTOR_ENABLED') == 'true' || project.findProperty('enableAiKnowledgeExtractor') == 'true') {
            classpath 'org.aiknowledge:ai-knowledge-gradle-plugin:0.1.7'
        }
    }
}

if (aiKnowledgeEnabled) {
    apply plugin: 'org.aiknowledge.extractor'

    aiKnowledge {
        outputDirectory = layout.buildDirectory.dir('ai-knowledge')
        docsOutputDirectory = layout.projectDirectory.dir('docs/ai-knowledge')
        seedDirectory = layout.projectDirectory.dir('ai-knowledge')
        modelProfileDirectory = layout.projectDirectory.dir('ai-knowledge')
        failOnWarnings = false

        // Extractor 0.1.7 schema v3: main measured 20.28; the deterministic
        // trajectory + descriptor policy measured 21.50; the bounded frontier-
        // priority slice measures 21.53. The 21.7 limit leaves a narrow 0.17-point
        // margin while keeping method-level complexity gates unchanged.
        maxCognitiveDebt = 21.7d

        maxMethodCognitiveComplexity = 65
        maxMethodCyclomaticComplexity = 35
        maxAverageMethodCognitiveComplexity = 4.0d
        maxAverageMethodCyclomaticComplexity = 4.0d
    }
} else {
    tasks.register('generateAiKnowledgeIndex') {
        group = 'documentation'
        description = 'Explains how to enable the AI Knowledge Extractor plugin.'
        doLast {
            throw new GradleException('AI knowledge extractor is disabled for this build.')
        }
    }
}

tasks.register('verifyCandidateIndependentBenchmark', Exec) {
    group = 'verification'
    description = 'Verifies the frozen candidate-independent benchmark preregistration from a plain checkout.'
    workingDir rootDir
    commandLine 'python3',
        'scripts/verify-candidate-independent-preregistration.py',
        'research/benchmarks/candidate-independent/benchmark-source.json'
    inputs.file('research/benchmarks/candidate-independent/benchmark-source.json')
    inputs.file('scripts/verify-candidate-independent-preregistration.py')
}
