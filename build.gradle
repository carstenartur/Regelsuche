def aiKnowledgeEnabled = System.getenv('AI_KNOWLEDGE_EXTRACTOR_ENABLED') == 'true' || providers.gradleProperty('enableAiKnowledgeExtractor').orNull == 'true'

def pythonExecutable = providers.gradleProperty('pythonExecutable').getOrElse('python3')
def configuredIncludeTags = providers.gradleProperty('includeTestTags').orNull
def configuredExcludeTags = providers.gradleProperty('excludeTestTags').orNull

def parseTestTags = { String raw ->
    raw == null ? [] : raw.split(',')
        .collect { it.trim() }
        .findAll { !it.isEmpty() }
        .unique()
}

def includedTestTags = parseTestTags(configuredIncludeTags)
def excludedTestTags = parseTestTags(configuredExcludeTags)

allprojects {
    tasks.withType(org.gradle.api.tasks.testing.Test).configureEach {
        useJUnitPlatform {
            if (!includedTestTags.isEmpty()) {
                includeTags(*includedTestTags)
            }
            if (!excludedTestTags.isEmpty()) {
                excludeTags(*excludedTestTags)
            }
        }
    }
}

project(':app') {
    tasks.matching { it.name == 'dockerE2eTest' }.configureEach {
        dependsOn tasks.named('installPlaywrightBrowsers')
    }
}

def repositoryTestTasks = subprojects.collect { candidateProject ->
    candidateProject.tasks.withType(org.gradle.api.tasks.testing.Test)
}

def repositoryTest = tasks.register('test') {
    group = 'verification'
    description = 'Runs every Gradle Test task in the repository, including browser, Docker/Testcontainers and external-tool integration tests.'
    dependsOn repositoryTestTasks
}

tasks.register('allTests') {
    group = 'verification'
    description = 'Explicit alias for the complete repository test run.'
    dependsOn repositoryTest
}

buildscript {
    repositories {
        if (System.getenv('AI_KNOWLEDGE_EXTRACTOR_ENABLED') == 'true' || project.findProperty('enableAiKnowledgeExtractor') == 'true') {
            mavenCentral()
            maven {
                name = 'GitHubPackages'
                url = uri('https://maven.pkg.github.com/carstenartur/ai-knowledge-extractor')
                credentials {
                    username = System.getenv('GITHUB_ACTOR') ?: ''
                    password = System.getenv('GITHUB_TOKEN') ?: ''
                }
            }
        }
    }

    dependencies {
        if (System.getenv('AI_KNOWLEDGE_EXTRACTOR_ENABLED') == 'true' || project.findProperty('enableAiKnowledgeExtractor') == 'true') {
            classpath 'org.aiknowledge:ai-knowledge-gradle-plugin:0.1.7'
        }
    }
}

if (aiKnowledgeEnabled) {
    apply plugin: 'org.aiknowledge.extractor'

    aiKnowledge {
        outputDirectory = layout.buildDirectory.dir('ai-knowledge')
        docsOutputDirectory = layout.projectDirectory.dir('docs/ai-knowledge')
        seedDirectory = layout.projectDirectory.dir('ai-knowledge')
        modelProfileDirectory = layout.projectDirectory.dir('ai-knowledge')
        failOnWarnings = false

        // Extractor 0.1.7 schema v3: main measured 20.28; the deterministic
        // trajectory + descriptor policy measured 21.50; the bounded frontier-
        // priority slice measures 21.53. The 21.7 limit leaves a narrow 0.17-point
        // margin while keeping method-level complexity gates unchanged.
        maxCognitiveDebt = 21.7d

        maxMethodCognitiveComplexity = 65
        maxMethodCyclomaticComplexity = 35
        maxAverageMethodCognitiveComplexity = 4.0d
        maxAverageMethodCyclomaticComplexity = 4.0d
    }
} else {
    tasks.register('generateAiKnowledgeIndex') {
        group = 'documentation'
        description = 'Explains how to enable the AI Knowledge Extractor plugin.'
        doLast {
            throw new GradleException('AI knowledge extractor is disabled for this build.')
        }
    }
}

tasks.register('verifyCandidateIndependentBenchmark', Exec) {
    group = 'verification'
    description = 'Verifies the frozen candidate-independent benchmark preregistration from a plain checkout.'
    workingDir rootDir
    commandLine pythonExecutable,
        'scripts/verify-candidate-independent-preregistration.py',
        'research/benchmarks/candidate-independent/benchmark-source.json'
    inputs.file('research/benchmarks/candidate-independent/benchmark-source.json')
    inputs.file('scripts/verify-candidate-independent-preregistration.py')
}

tasks.register('verifyWorkflowSemantics', Exec) {
    group = 'verification'
    description = 'Rejects unclassified workflows and workflow-owned verification semantics.'
    workingDir rootDir
    commandLine pythonExecutable, 'scripts/verify-workflow-semantics.py'
    inputs.dir('.github/workflows')
    inputs.file('config/workflow-semantics-policy.json')
    inputs.file('scripts/verify-workflow-semantics.py')
}

def verificationVenvDirectory = layout.buildDirectory.dir('verification-venv')
def verificationPythonFile = providers.provider {
    def executable = System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows')
        ? 'Scripts/python.exe'
        : 'bin/python'
    new File(verificationVenvDirectory.get().asFile, executable)
}

def prepareVerificationEnvironment = tasks.register('prepareVerificationEnvironment', Exec) {
    group = 'verification'
    description = 'Creates the pinned checkout-local Python environment used by verification tasks.'
    workingDir rootDir
    inputs.file('scripts/prepare-verification-environment.py')
    outputs.file(verificationVenvDirectory.map { it.file('.regelsuche-verification-environment.json') })
    doFirst {
        commandLine pythonExecutable,
            'scripts/prepare-verification-environment.py',
            '--venv', verificationVenvDirectory.get().asFile.absolutePath
    }
}

def checkDocumentationMath = tasks.register('checkDocumentationMath', Exec) {
    group = 'verification'
    description = 'Checks documentation math delimiters from a plain checkout.'
    workingDir rootDir
    commandLine pythonExecutable, 'scripts/check-docs-math.py'
    inputs.files(fileTree('docs') { include '**/*.md' })
    inputs.file('README.md')
    inputs.file('scripts/check-docs-math.py')
}

def verifyGeneratedDiscoveryGallery = tasks.register('verifyGeneratedDiscoveryGallery', Exec) {
    group = 'verification'
    description = 'Regenerates and verifies the deterministic discovery gallery.'
    dependsOn ':app:generateDiscoveryGallery'
    workingDir rootDir
    commandLine pythonExecutable, 'scripts/verify-generated-discovery-gallery.py'
    inputs.file('scripts/verify-generated-discovery-gallery.py')
    doFirst {
        environment.remove('GITHUB_SHA')
    }
}

def verifyStaticReferencePage = tasks.register('verifyStaticReferencePage', Exec) {
    group = 'verification'
    description = 'Generates and verifies the static reference-page contract.'
    dependsOn ':app:generateStaticReferencePage'
    workingDir rootDir
    commandLine pythonExecutable, 'scripts/verify-static-reference-page.py'
    inputs.file('scripts/verify-static-reference-page.py')
}

def verifySolverIrEvidence = tasks.register('verifySolverIrEvidence', Exec) {
    group = 'verification'
    description = 'Verifies canonical solver-IR schemas, hashes and backend outcomes.'
    dependsOn prepareVerificationEnvironment, ':regelsuche-solver-ir:writeSolverIrExample'
    workingDir rootDir
    inputs.file('scripts/verify-solver-ir-evidence.py')
    doFirst {
        commandLine verificationPythonFile.get().absolutePath, 'scripts/verify-solver-ir-evidence.py'
    }
}

def verifyGenericDiscoveryDomainsEvidence = tasks.register('verifyGenericDiscoveryDomainsEvidence', Exec) {
    group = 'verification'
    description = 'Verifies evidence emitted by all generic discovery-domain JUnit tests.'
    dependsOn prepareVerificationEnvironment, repositoryTest
    workingDir rootDir
    inputs.file('scripts/verify-generic-discovery-domains.py')
    doFirst {
        commandLine verificationPythonFile.get().absolutePath, 'scripts/verify-generic-discovery-domains.py'
    }
}

def verifyDomainLifecycleHandoffEvidence = tasks.register('verifyDomainLifecycleHandoffEvidence', Exec) {
    group = 'verification'
    description = 'Verifies lifecycle-handoff and production-export evidence emitted by JUnit tests.'
    dependsOn prepareVerificationEnvironment, repositoryTest
    workingDir rootDir
    inputs.file('scripts/verify-domain-lifecycle-handoff.py')
    doFirst {
        commandLine verificationPythonFile.get().absolutePath, 'scripts/verify-domain-lifecycle-handoff.py'
    }
}

def verifyDomainGenericQualificationEvidence = tasks.register('verifyDomainGenericQualificationEvidence', Exec) {
    group = 'verification'
    description = 'Generates and verifies the domain-generic qualification profile.'
    dependsOn prepareVerificationEnvironment, ':regelsuche-release:runDomainGenericQualification'
    workingDir rootDir
    inputs.file('scripts/verify-domain-generic-qualification.py')
    doFirst {
        commandLine verificationPythonFile.get().absolutePath, 'scripts/verify-domain-generic-qualification.py'
    }
}

def verifyReleaseReadinessEvidence = tasks.register('verifyReleaseReadinessEvidence', Exec) {
    group = 'verification'
    description = 'Generates and verifies qualified release-readiness evidence.'
    dependsOn prepareVerificationEnvironment, repositoryTest,
        ':regelsuche-release:runQualifiedReleaseReadinessWithHiddenRuleEvidence'
    workingDir rootDir
    inputs.file('scripts/verify-release-readiness-evidence.py')
    doFirst {
        commandLine verificationPythonFile.get().absolutePath,
            'scripts/verify-release-readiness-evidence.py',
            '--root', 'regelsuche-release/build/reports/release-readiness-qualified'
    }
}

def generateCapabilityStatusForVerification = tasks.register('generateCapabilityStatusForVerification', Exec) {
    group = 'verification'
    description = 'Regenerates the public capability matrix from retained release and domain evidence.'
    dependsOn prepareVerificationEnvironment,
        ':regelsuche-release:runQualifiedReleaseReadinessWithHiddenRuleEvidence',
        ':regelsuche-release:runDomainGenericQualification'
    workingDir rootDir
    doFirst {
        commandLine verificationPythonFile.get().absolutePath,
            'scripts/generate-capability-status.py',
            '--repository-root', '.',
            '--release-report', 'regelsuche-release/build/reports/release-readiness-qualified/release-readiness-report.json',
            '--release-run', 'regelsuche-release/build/reports/release-readiness-qualified/release-readiness-run.json',
            '--domain-report', 'regelsuche-release/build/reports/domain-generic-qualification/qualification-report.json',
            '--domain-run', 'regelsuche-release/build/reports/domain-generic-qualification/qualification-run.json',
            '--repository-revision', 'WORKTREE',
            '--json-output', 'docs/generated/capability-status.json',
            '--markdown-output', 'docs/generated/capability-status.md',
            '--check', '--check-docs'
    }
}

def verifyCapabilityStatus = tasks.register('verifyCapabilityStatus', Exec) {
    group = 'verification'
    description = 'Verifies the generated capability matrix, status vocabulary and content hash.'
    dependsOn prepareVerificationEnvironment, generateCapabilityStatusForVerification
    workingDir rootDir
    inputs.file('scripts/verify-capability-status.py')
    doFirst {
        commandLine verificationPythonFile.get().absolutePath, 'scripts/verify-capability-status.py'
    }
}

def generateCiPages = tasks.register('generateCiPages', Exec) {
    group = 'reporting'
    description = 'Renders coverage and JUnit report pages from local Gradle outputs.'
    workingDir rootDir
    commandLine pythonExecutable, 'scripts/generate-ci-pages.py'
    inputs.file('scripts/generate-ci-pages.py')
    outputs.dir('public')
}

def repositoryCheck = tasks.register('check') {
    group = 'verification'
    description = 'Runs the complete local test lifecycle and checkout-local contract verification.'
    dependsOn repositoryTest,
        tasks.named('verifyWorkflowSemantics'),
        tasks.named('verifyCandidateIndependentBenchmark'),
        checkDocumentationMath,
        verifyGeneratedDiscoveryGallery,
        verifyStaticReferencePage,
        verifySolverIrEvidence,
        verifyGenericDiscoveryDomainsEvidence,
        verifyDomainLifecycleHandoffEvidence,
        verifyDomainGenericQualificationEvidence,
        verifyReleaseReadinessEvidence,
        verifyCapabilityStatus
}

def verifySolverPortfolioEvidence = tasks.register('verifySolverPortfolioEvidence', Exec) {
    group = 'verification'
    description = 'Requires real Z3 and verifies the canonical solver-portfolio evidence chain.'
    dependsOn prepareVerificationEnvironment, repositoryTest,
        ':regelsuche-solver-portfolio:writeSolverPortfolioExample'
    mustRunAfter repositoryCheck
    workingDir rootDir
    inputs.file('scripts/verify-solver-portfolio-evidence.py')
    doFirst {
        commandLine verificationPythonFile.get().absolutePath, 'scripts/verify-solver-portfolio-evidence.py'
    }
}

def verifyReleaseReadinessDockerReproduction = tasks.register('verifyReleaseReadinessDockerReproduction', Exec) {
    group = 'verification'
    description = 'Requires Docker and compares release-readiness Gradle and runtime-image evidence byte for byte.'
    dependsOn prepareVerificationEnvironment, verifyReleaseReadinessEvidence
    mustRunAfter repositoryCheck
    workingDir rootDir
    inputs.file('scripts/verify-release-readiness-docker-reproduction.sh')
    doFirst {
        environment 'REGELSUCHE_VERIFICATION_PYTHON', verificationPythonFile.get().absolutePath
        commandLine 'bash', 'scripts/verify-release-readiness-docker-reproduction.sh'
    }
}

tasks.register('fullCheck') {
    group = 'verification'
    description = 'Runs check plus strict external-tool and Docker reproducibility verification.'
    dependsOn repositoryCheck, verifySolverPortfolioEvidence, verifyReleaseReadinessDockerReproduction
}

gradle.projectsEvaluated {
    project(':regelsuche-release').tasks.named('runQualifiedReleaseReadinessWithHiddenRuleEvidence').configure {
        mustRunAfter repositoryTest
    }
    project(':regelsuche-release').tasks.named('runDomainGenericQualification').configure {
        mustRunAfter repositoryTest
    }
}
