def aiKnowledgeEnabled = System.getenv('AI_KNOWLEDGE_EXTRACTOR_ENABLED') == 'true' || providers.gradleProperty('enableAiKnowledgeExtractor').orNull == 'true'

buildscript {
    repositories {
        if (System.getenv('AI_KNOWLEDGE_EXTRACTOR_ENABLED') == 'true' || project.findProperty('enableAiKnowledgeExtractor') == 'true') {
            mavenCentral()
            maven {
                name = 'GitHubPackages'
                url = uri('https://maven.pkg.github.com/carstenartur/ai-knowledge-extractor')
                credentials {
                    username = System.getenv('GITHUB_ACTOR') ?: ''
                    password = System.getenv('GITHUB_TOKEN') ?: ''
                }
            }
        }
    }

    dependencies {
        if (System.getenv('AI_KNOWLEDGE_EXTRACTOR_ENABLED') == 'true' || project.findProperty('enableAiKnowledgeExtractor') == 'true') {
            classpath 'org.aiknowledge:ai-knowledge-gradle-plugin:0.1.6'
        }
    }
}

if (aiKnowledgeEnabled) {
    apply plugin: 'org.aiknowledge.extractor'

    aiKnowledge {
        outputDirectory = layout.buildDirectory.dir('ai-knowledge')
        docsOutputDirectory = layout.projectDirectory.dir('docs/ai-knowledge')
        seedDirectory = layout.projectDirectory.dir('ai-knowledge')
        modelProfileDirectory = layout.projectDirectory.dir('ai-knowledge')
        failOnWarnings = false

        // Extractor 0.1.6 measured all eight capability working sets on 2026-07-12:
        // normalized debt 18.98, p90 working set 206,440 of 1,087,416 context tokens,
        // 693 linked type references and zero unresolved references. The 20.0 gate
        // leaves a 1.02-point margin while replacing the obsolete 371 class-count gate.
        maxCognitiveDebt = 20.0d

        maxMethodCognitiveComplexity = 65
        maxMethodCyclomaticComplexity = 35
        maxAverageMethodCognitiveComplexity = 4.0d
        maxAverageMethodCyclomaticComplexity = 4.0d
    }
} else {
    tasks.register('generateAiKnowledgeIndex') {
        group = 'documentation'
        description = 'Explains how to enable the AI Knowledge Extractor plugin.'
        doLast {
            throw new GradleException('AI knowledge extractor is disabled for this build.')
        }
    }
}
