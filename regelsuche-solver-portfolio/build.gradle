plugins {
    id 'java-library'
    id 'jacoco'
}

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    api project(':regelsuche-solver-ir')

    testImplementation libs.junit.jupiter
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy tasks.named('jacocoTestReport')
}

tasks.register('writeSolverPortfolioExample', JavaExec) {
    group = 'verification'
    description = 'Writes one deterministic capability-aware portfolio trace using system Z3.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'de.regelsuche.solver.portfolio.SolverPortfolioExampleMain'
    args layout.buildDirectory.dir('reports/solver-portfolio').get().asFile.absolutePath
}

tasks.register('verifySolverPortfolioEvidence', Exec) {
    group = 'verification'
    description = 'Runs solver portfolio tests and verifies the retained trace, schemas, hash links and semantic gates.'
    dependsOn tasks.named('test')
    dependsOn tasks.named('writeSolverPortfolioExample')
    dependsOn ':app:test'
    workingDir rootProject.projectDir
    commandLine 'python3',
        'scripts/verify-solver-portfolio.py',
        '--root',
        layout.buildDirectory.dir('reports/solver-portfolio').get().asFile.absolutePath,
        '--schemas',
        rootProject.file('docs/schemas').absolutePath
    inputs.file(rootProject.file('scripts/verify-solver-portfolio.py'))
    inputs.files(rootProject.fileTree('docs/schemas') {
        include 'regelsuche-solver-*.schema.json'
    })
}

jacoco {
    toolVersion = '0.8.13'
}

tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test')
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
}

tasks.named('check') {
    dependsOn tasks.named('jacocoTestReport')
}
