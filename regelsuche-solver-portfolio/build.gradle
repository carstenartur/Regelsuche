plugins {
    id 'java-library'
    id 'jacoco'
}

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    api project(':regelsuche-solver-ir')

    testImplementation libs.junit.jupiter
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy tasks.named('jacocoTestReport')
}

tasks.register('writeSolverPortfolioExample', JavaExec) {
    group = 'verification'
    description = 'Writes one deterministic capability-aware portfolio trace using system Z3.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'de.regelsuche.solver.portfolio.SolverPortfolioExampleMain'
    args layout.buildDirectory.dir('reports/solver-portfolio').get().asFile.absolutePath
}

jacoco {
    toolVersion = '0.8.13'
}

tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test')
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
}

tasks.named('check') {
    dependsOn tasks.named('jacocoTestReport')
}
