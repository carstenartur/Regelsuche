import org.gradle.api.tasks.testing.Test

def qualityRepositoryRoot = layout.projectDirectory
apply from: qualityRepositoryRoot.file('gradle/supply-chain-evidence.gradle')

def verificationEnvironmentDir = qualityRepositoryRoot.dir('.gradle/verification-python')
def verificationVenvDir = verificationEnvironmentDir.dir('venv')
def verificationRequirements = qualityRepositoryRoot.file('scripts/requirements-verification.txt')
def verificationConstraints = qualityRepositoryRoot.file('scripts/constraints-verification.txt')
def verificationStamp = verificationEnvironmentDir.file('environment.json')

def verificationPython = {
    def windowsPython = verificationVenvDir.file('Scripts/python.exe').asFile
    windowsPython.exists()
        ? windowsPython.absolutePath
        : verificationVenvDir.file('bin/python').asFile.absolutePath
}

def prepareVerificationEnvironment = tasks.register('prepareVerificationEnvironment', Exec) {
    group = 'verification setup'
    description = 'Creates the pinned checkout-local Python verification environment.'
    inputs.files(verificationRequirements, verificationConstraints)
    outputs.files(
        verificationVenvDir.file('pyvenv.cfg'),
        verificationStamp
    )
    doFirst {
        verificationEnvironmentDir.asFile.mkdirs()
    }
    commandLine(
        'python3',
        qualityRepositoryRoot.file('scripts/prepare-verification-environment.py').asFile.absolutePath,
        '--venv', verificationVenvDir.asFile.absolutePath,
        '--requirements', verificationRequirements.asFile.absolutePath,
        '--constraints', verificationConstraints.asFile.absolutePath,
        '--stamp', verificationStamp.asFile.absolutePath
    )
}

// Avoid every Test task acquiring a dependency on the external Python
// environment. This is added only to the focused tests that explicitly need it.
def applyVerificationPython = { Test test ->
    test.dependsOn(prepareVerificationEnvironment)
    test.doFirst {
        test.systemProperty('regelsuche.verification.python', verificationPython())
    }
}

def benchmarkContainerPath = qualityRepositoryRoot.file(
    'build/reports/comparative-benchmarks-container-1/benchmark/benchmark-run.json'
)
def independentReproductionExpectedPath = qualityRepositoryRoot.file(
    'build/reports/independent-reproduction/artifact-a/artifact/expected/qualified-walkthrough.json'
)

tasks.register('generateQualityPages', Exec) {
    group = 'documentation'
    description = 'Generates the README badge endpoint and static quality dashboard from checkout-owned evidence.'
    dependsOn(prepareVerificationEnvironment)
    inputs.file(qualityRepositoryRoot.file('scripts/generate-quality-pages.py'))
    inputs.file(qualityRepositoryRoot.file('config/quality/coverage-policy.json'))
    inputs.file(qualityRepositoryRoot.file('build/reports/quality/coverage/coverage-report.json'))
    inputs.file(qualityRepositoryRoot.file('config/quality/jmh-regression-policy-v2.json'))
    inputs.file(qualityRepositoryRoot.file('build/reports/jmh/jmh-regression-report.json'))
    inputs.file(qualityRepositoryRoot.file('build/reports/quality/ai-knowledge/ai-knowledge-regression-report.json'))
    inputs.file(qualityRepositoryRoot.file('build/reports/quality/complexity/complexity-trend-report.json'))
    inputs.file(qualityRepositoryRoot.file('build/reports/quality/slow-tests/slowest-tests-report.json'))
    inputs.file(qualityRepositoryRoot.file('build/reports/quality/visual-regression/visual-regression-report.json'))
    inputs.file(qualityRepositoryRoot.file('build/reports/quality/visual-regression/visual-regression-policy.json'))
    inputs.file(benchmarkContainerPath)
        .withPropertyName('comparativeBenchmarkContainerReport')
        .optional()
    inputs.file(independentReproductionExpectedPath)
        .withPropertyName('independentReproductionExpectedReport')
        .optional()
    inputs.file(qualityRepositoryRoot.file('build/reports/release-readiness-run-1/release-readiness-run.json'))
        .withPropertyName('releaseReadinessReport')
        .optional()
    outputs.files(
        qualityRepositoryRoot.file('build/reports/quality-pages/badge/quality.json'),
        qualityRepositoryRoot.file('build/reports/quality-pages/index.html')
    )
    doFirst {
        qualityRepositoryRoot.file('build/reports/quality-pages/badge').asFile.mkdirs()
    }
    commandLine(
        verificationPython(),
        qualityRepositoryRoot.file('scripts/generate-quality-pages.py').asFile.absolutePath,
        '--root', qualityRepositoryRoot.asFile.absolutePath
    )
}

tasks.register('verifyQualityPageInputs', Exec) {
    group = 'verification'
    description = 'Fails if the quality page inputs are incomplete, stale or contain unresolved placeholder evidence.'
    dependsOn(
        prepareVerificationEnvironment,
        'verifyCoverageRegression',
        'verifyJmhRegression',
        'verifyAiKnowledgeRegression',
        'verifyCognitiveComplexityTrend',
        'reportSlowestTests',
        'verifyVisualRegressionEnvironment'
    )
    inputs.file(qualityRepositoryRoot.file('scripts/verify-quality-page-inputs.py'))
    inputs.file(qualityRepositoryRoot.file('config/quality/coverage-policy.json'))
    inputs.file(qualityRepositoryRoot.file('build/reports/quality/coverage/coverage-report.json'))
    inputs.file(qualityRepositoryRoot.file('config/quality/jmh-regression-policy-v2.json'))
    inputs.file(qualityRepositoryRoot.file('build/reports/jmh/jmh-regression-report.json'))
    inputs.file(qualityRepositoryRoot.file('build/reports/quality/ai-knowledge/ai-knowledge-regression-report.json'))
    inputs.file(qualityRepositoryRoot.file('build/reports/quality/complexity/complexity-trend-report.json'))
    inputs.file(qualityRepositoryRoot.file('build/reports/quality/slow-tests/slowest-tests-report.json'))
    inputs.file(qualityRepositoryRoot.file('build/reports/quality/visual-regression/visual-regression-report.json'))
    inputs.file(qualityRepositoryRoot.file('build/reports/quality/visual-regression/visual-regression-policy.json'))
    inputs.file(benchmarkContainerPath)
        .withPropertyName('comparativeBenchmarkContainerReport')
        .optional()
    inputs.file(independentReproductionExpectedPath)
        .withPropertyName('independentReproductionExpectedReport')
        .optional()
    inputs.file(qualityRepositoryRoot.file('build/reports/release-readiness-run-1/release-readiness-run.json'))
        .withPropertyName('releaseReadinessReport')
        .optional()
    outputs.file(qualityRepositoryRoot.file('build/reports/quality/quality-page-inputs.json'))
    doFirst {
        qualityRepositoryRoot.file('build/reports/quality').asFile.mkdirs()
    }
    commandLine(
        verificationPython(),
        qualityRepositoryRoot.file('scripts/verify-quality-page-inputs.py').asFile.absolutePath,
        '--root', qualityRepositoryRoot.asFile.absolutePath,
        '--output', qualityRepositoryRoot.file('build/reports/quality/quality-page-inputs.json').asFile.absolutePath
    )
}

// Required by the AI Knowledge trend gate. On a fresh clone the generated
// reports may not yet exist, so bind them to their producing tasks explicitly.
// When inputs are absent Gradle will run the producer before evaluating the
// verifier, ensuring deterministic ordering in the ciCheck graph.
tasks.named('verifyAiKnowledgeRegression') {
    dependsOn('generateCognitiveComplexityReport', 'verifyKnowledgeBase')
    inputs.file(qualityRepositoryRoot.file('build/reports/cognitive-complexity/cognitive-complexity.json'))
    inputs.file(qualityRepositoryRoot.file('build/reports/ai-knowledge/ai-knowledge-report.json'))
}

// Run lightweight script tests before the report-producing tasks that rely on them.
tasks.named('verifyCognitiveComplexityTrend') {
    dependsOn('testQualityScriptVerifiers')
}
tasks.named('verifyAiKnowledgeRegression') {
    dependsOn('testQualityScriptVerifiers')
}

tasks.register('testQualityScriptVerifiers', Exec) {
    group = 'verification'
    description = 'Runs synthetic fail-closed tests for the checkout-owned quality verifier scripts.'
    dependsOn(prepareVerificationEnvironment)
    inputs.files(
        qualityRepositoryRoot.file('scripts/verify-cognitive-complexity-trend.py'),
        qualityRepositoryRoot.file('scripts/verify-ai-knowledge-regression.py'),
        qualityRepositoryRoot.file('scripts/test-quality-verifiers.py')
    )
    commandLine(
        verificationPython(),
        qualityRepositoryRoot.file('scripts/test-quality-verifiers.py').asFile.absolutePath
    )
}

def supplyChainReportDirectory = qualityRepositoryRoot.dir('build/reports/quality/supply-chain')
def supplyChainBom = supplyChainReportDirectory.file('bom.json')

tasks.register('testSupplyChainEvidenceVerifier', Exec) {
    group = 'verification'
    description = 'Runs synthetic fail-closed tests for the supply-chain evidence verifier.'
    dependsOn(prepareVerificationEnvironment)
    inputs.files(
        qualityRepositoryRoot.file('config/quality/supply-chain-policy.json'),
        qualityRepositoryRoot.file('scripts/verify-supply-chain-evidence.py'),
        qualityRepositoryRoot.file('scripts/test-supply-chain-evidence.py')
    )
    commandLine(
        verificationPython(),
        qualityRepositoryRoot.file('scripts/test-supply-chain-evidence.py').asFile.absolutePath
    )
}

tasks.register('verifySupplyChainInventory', Exec) {
    group = 'verification'
    description = 'Verifies and normalizes the aggregate CycloneDX dependency inventory.'
    dependsOn(
        prepareVerificationEnvironment,
        'testSupplyChainEvidenceVerifier',
        'cyclonedxBom'
    )
    inputs.files(
        qualityRepositoryRoot.file('config/quality/supply-chain-policy.json'),
        qualityRepositoryRoot.file('scripts/verify-supply-chain-evidence.py'),
        supplyChainBom
    )
    outputs.files(
        supplyChainReportDirectory.file('dependency-inventory.json'),
        supplyChainReportDirectory.file('supply-chain-evidence.json'),
        supplyChainReportDirectory.file('supply-chain-evidence.md')
    )
    commandLine(
        verificationPython(),
        qualityRepositoryRoot.file('scripts/verify-supply-chain-evidence.py').asFile.absolutePath,
        '--repository-root', qualityRepositoryRoot.asFile.absolutePath,
        '--bom', supplyChainBom.asFile.absolutePath,
        '--output', supplyChainReportDirectory.asFile.absolutePath
    )
}

def qualityGateReportTasks = [
    'verifyCoverageRegression',
    'verifyJmhRegression',
    'verifyAiKnowledgeRegression',
    'verifyCognitiveComplexityTrend',
    'reportSlowestTests',
    'verifyVisualRegressionEnvironment',
    'verifySupplyChainInventory'
]

tasks.register('qualityGateEvidence') {
    group = 'verification'
    description = 'Produces all checkout-owned quality-gate reports for artifact retention.'
    dependsOn(qualityGateReportTasks)
    outputs.files(
        qualityRepositoryRoot.file('build/reports/quality/coverage/coverage-report.json'),
        qualityRepositoryRoot.file('build/reports/jmh/jmh-regression-report.json'),
        qualityRepositoryRoot.file('build/reports/quality/ai-knowledge/ai-knowledge-regression-report.json'),
        qualityRepositoryRoot.file('build/reports/quality/complexity/complexity-trend-report.json'),
        qualityRepositoryRoot.file('build/reports/quality/slow-tests/slowest-tests-report.json'),
        qualityRepositoryRoot.file('build/reports/quality/visual-regression/visual-regression-report.json'),
        qualityRepositoryRoot.file('build/reports/quality/visual-regression/visual-regression-policy.json'),
        supplyChainReportDirectory.file('bom.json'),
        supplyChainReportDirectory.file('dependency-inventory.json'),
        supplyChainReportDirectory.file('supply-chain-evidence.json'),
        supplyChainReportDirectory.file('supply-chain-evidence.md')
    )
}

tasks.named('check') {
    dependsOn('verifyCoverageRegression')
    dependsOn('verifyJmhRegression')
    dependsOn('verifyAiKnowledgeRegression')
    dependsOn('verifyCognitiveComplexityTrend')
    dependsOn('verifyVisualRegressionEnvironment')
    dependsOn('verifySupplyChainInventory')
    finalizedBy('reportSlowestTests')
}

tasks.named('ciCheck') {
    dependsOn(
        'verifyQualityPageInputs',
        'qualityGateEvidence',
        'generateQualityPages'
    )
}

tasks.named('generateQualityPages') {
    mustRunAfter('verifyQualityPageInputs')
}
