/*
 * Finite checkout-owned non-visual quality gates for issue #514.
 *
 * GitHub Actions only provisions tools and calls ciCheck. Baselines,
 * thresholds, reports and failure decisions remain versioned in the checkout.
 */

def qualityRepositoryRoot = layout.projectDirectory
apply from: qualityRepositoryRoot.file('gradle/supply-chain-evidence.gradle')

def qualityVerificationVenv = layout.buildDirectory.dir('verification-venv')
def qualityVerificationPython = providers.provider {
    def executable = System.getProperty('os.name').toLowerCase(Locale.ROOT)
        .contains('windows') ? 'Scripts/python.exe' : 'bin/python'
    new File(qualityVerificationVenv.get().asFile, executable)
}

def verifyCoverageRegression = tasks.register('verifyCoverageRegression', Exec) {
    group = 'verification'
    description = 'Fails when aggregate/module JaCoCo floors regress or a covered module disappears.'
    dependsOn 'prepareVerificationEnvironment', 'test'
    mustRunAfter 'test'
    workingDir qualityRepositoryRoot
    inputs.file qualityRepositoryRoot.file('config/quality/coverage-policy.json')
    inputs.file qualityRepositoryRoot.file('scripts/verify-coverage-regression.py')
    outputs.file layout.buildDirectory.file('reports/quality/coverage-report.json')
    outputs.file layout.buildDirectory.file('reports/quality/coverage-report.md')
    outputs.upToDateWhen { false }
    doFirst {
        commandLine qualityVerificationPython.get().absolutePath,
            'scripts/verify-coverage-regression.py',
            '--root', qualityRepositoryRoot.asFile.absolutePath
    }
}

def verifyContainerImagePolicy = tasks.register('verifyContainerImagePolicy') {
    group = 'verification'
    description = 'Compatibility alias; Maven/JUnit owns the container-image policy contract.'
    dependsOn ':regelsuche-core:verifyMavenCoreReactor'
}

def testJmhRegressionVerifier = tasks.register('testJmhRegressionVerifier', Exec) {
    group = 'verification'
    description = 'Characterizes the JMH regression verifier with positive and fail-closed synthetic cases.'
    dependsOn 'prepareVerificationEnvironment'
    workingDir qualityRepositoryRoot
    inputs.file qualityRepositoryRoot.file('scripts/verify-jmh-regression-v2.py')
    inputs.file qualityRepositoryRoot.file('scripts/test-verify-jmh-regression-v2.py')
    outputs.upToDateWhen { false }
    doFirst {
        commandLine qualityVerificationPython.get().absolutePath,
            'scripts/test-verify-jmh-regression-v2.py',
            '--verifier', qualityRepositoryRoot.file('scripts/verify-jmh-regression-v2.py').asFile.absolutePath
    }
}

def verifyJmhRegression = tasks.register('verifyJmhRegression', Exec) {
    group = 'verification'
    description = 'Fails on missing, undeclared, contract-drifted or materially slower JMH benchmarks.'
    dependsOn 'prepareVerificationEnvironment', ':app:jmh', testJmhRegressionVerifier
    mustRunAfter ':app:jmh'
    workingDir qualityRepositoryRoot
    inputs.file qualityRepositoryRoot.file('config/quality/jmh-regression-policy-v2.json')
    inputs.file qualityRepositoryRoot.file('scripts/verify-jmh-regression-v2.py')
    inputs.file qualityRepositoryRoot.file('app/build/reports/jmh/result.json')
    outputs.file layout.buildDirectory.file('reports/quality/jmh-regression-report.json')
    outputs.file layout.buildDirectory.file('reports/quality/jmh-regression-report.md')
    outputs.upToDateWhen { false }
    doFirst {
        commandLine qualityVerificationPython.get().absolutePath,
            'scripts/verify-jmh-regression-v2.py',
            '--result', qualityRepositoryRoot.file('app/build/reports/jmh/result.json').asFile.absolutePath,
            '--policy', qualityRepositoryRoot.file('config/quality/jmh-regression-policy-v2.json').asFile.absolutePath,
            '--json-output', qualityRepositoryRoot.file('build/reports/quality/jmh-regression-report.json').asFile.absolutePath,
            '--markdown-output', qualityRepositoryRoot.file('build/reports/quality/jmh-regression-report.md').asFile.absolutePath
    }
}

def reportSlowTests = tasks.register('reportSlowTests') {
    group = 'reporting'
    description = 'Compatibility alias; regelsuche-quality Java/JUnit owns slow-test evidence.'
    dependsOn ':regelsuche-quality:reportSlowTests'
}

def supplyChainReportDirectory = qualityRepositoryRoot.dir('build/reports/quality/supply-chain')
def supplyChainBom = supplyChainReportDirectory.file('bom.json')

def testSupplyChainEvidenceVerifier = tasks.register('testSupplyChainEvidenceVerifier', Exec) {
    group = 'verification'
    description = 'Characterizes the supply-chain evidence verifier with positive and fail-closed synthetic cases.'
    dependsOn 'prepareVerificationEnvironment'
    workingDir qualityRepositoryRoot
    inputs.file qualityRepositoryRoot.file('config/quality/supply-chain-policy.json')
    inputs.file qualityRepositoryRoot.file('scripts/verify-supply-chain-evidence.py')
    inputs.file qualityRepositoryRoot.file('scripts/test-supply-chain-evidence.py')
    outputs.upToDateWhen { false }
    doFirst {
        commandLine qualityVerificationPython.get().absolutePath,
            '-B',
            'scripts/test-supply-chain-evidence.py'
    }
}

def verifySupplyChainInventory = tasks.register('verifySupplyChainInventory', Exec) {
    group = 'verification'
    description = 'Verifies and normalizes the aggregate CycloneDX dependency inventory.'
    dependsOn 'prepareVerificationEnvironment', 'cyclonedxBom', testSupplyChainEvidenceVerifier
    mustRunAfter 'cyclonedxBom'
    workingDir qualityRepositoryRoot
    inputs.file qualityRepositoryRoot.file('config/quality/supply-chain-policy.json')
    inputs.file qualityRepositoryRoot.file('scripts/verify-supply-chain-evidence.py')
    inputs.file supplyChainBom
    outputs.file supplyChainReportDirectory.file('dependency-inventory.json')
    outputs.file supplyChainReportDirectory.file('supply-chain-evidence.json')
    outputs.file supplyChainReportDirectory.file('supply-chain-evidence.md')
    outputs.upToDateWhen { false }
    doFirst {
        commandLine qualityVerificationPython.get().absolutePath,
            '-B',
            'scripts/verify-supply-chain-evidence.py',
            '--repository-root', qualityRepositoryRoot.asFile.absolutePath,
            '--bom', supplyChainBom.asFile.absolutePath,
            '--output', supplyChainReportDirectory.asFile.absolutePath
    }
}

tasks.matching { candidate -> candidate.name == 'check' }.configureEach {
    dependsOn verifyCoverageRegression,
        verifyContainerImagePolicy,
        verifyJmhRegression,
        verifySupplyChainInventory
}

tasks.matching { candidate -> candidate.name == 'ciCheck' }.configureEach {
    dependsOn reportSlowTests
}
