def aiKnowledgePython = providers.gradleProperty('pythonExecutable').getOrElse('python3')
def aiKnowledgeArtifactDirectory = rootProject.layout.buildDirectory.dir('ai-knowledge')
def aiKnowledgeVerifierScript = rootProject.layout.projectDirectory.file(
    'scripts/verify-ai-knowledge-artifacts.py')
def aiKnowledgeVerifierPath = aiKnowledgeVerifierScript.asFile.absolutePath
def aiKnowledgeArtifactPath = aiKnowledgeArtifactDirectory.get().asFile.absolutePath

def pluginLifecycle = tasks.named('aiKnowledgeCheck')
def pluginArtifactVerification = tasks.named('verifyAiKnowledgeArtifacts')

def verifyRegelsucheAiKnowledgeArtifacts = tasks.register(
    'verifyRegelsucheAiKnowledgeArtifacts',
    Exec
) {
    group = 'verification'
    description = 'Verifies generated AI knowledge evidence and Regelsuche context-footprint contracts.'
    dependsOn pluginLifecycle
    workingDir rootProject.projectDir
    commandLine aiKnowledgePython,
        aiKnowledgeVerifierPath,
        '--root', aiKnowledgeArtifactPath
    inputs.file(aiKnowledgeVerifierScript)
    inputs.dir(aiKnowledgeArtifactDirectory)
    outputs.file(rootProject.file(
        'build/ai-knowledge/verification-report.json'))
    outputs.upToDateWhen { false }
}

def verifyComplexityHotspots = tasks.register(
    'verifyComplexityHotspots',
    Exec
) {
    group = 'verification'
    description = 'Rejects new or materially worsened method-complexity hotspots without a finite exception.'
    dependsOn verifyRegelsucheAiKnowledgeArtifacts
    workingDir rootProject.projectDir
    commandLine aiKnowledgePython,
        rootProject.file('scripts/verify-complexity-hotspots.py').absolutePath,
        '--complexity', rootProject.file('build/ai-knowledge/complexity.json').absolutePath,
        '--policy', rootProject.file('config/quality/complexity-hotspots.json').absolutePath,
        '--json-output', rootProject.file('build/reports/quality/complexity-hotspot-report.json').absolutePath,
        '--markdown-output', rootProject.file('build/reports/quality/complexity-hotspot-report.md').absolutePath
    inputs.file(rootProject.file('scripts/verify-complexity-hotspots.py'))
    inputs.file(rootProject.file('config/quality/complexity-hotspots.json'))
    inputs.file(rootProject.file('ai-knowledge/complexity-baseline.json'))
    outputs.file(rootProject.file('build/reports/quality/complexity-hotspot-report.json'))
    outputs.file(rootProject.file('build/reports/quality/complexity-hotspot-report.md'))
    outputs.upToDateWhen { false }
}

tasks.register('verifyRegelsucheAiKnowledgeLifecycle') {
    group = 'verification'
    description = 'Runs the plugin-native lifecycle, structural artifact verifier and Regelsuche-specific quality gates.'
    dependsOn pluginArtifactVerification, verifyComplexityHotspots
}
