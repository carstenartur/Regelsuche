def aiKnowledgePython = providers.gradleProperty('pythonExecutable').getOrElse('python3')
def aiKnowledgeArtifactDirectory = rootProject.layout.buildDirectory.dir('ai-knowledge')
def aiKnowledgeVerifierScript = rootProject.layout.projectDirectory.file(
    'scripts/verify-ai-knowledge-artifacts.py')
def aiKnowledgeVerifierPath = aiKnowledgeVerifierScript.asFile.absolutePath
def aiKnowledgeArtifactPath = aiKnowledgeArtifactDirectory.get().asFile.absolutePath

def pluginLifecycle = tasks.named('aiKnowledgeCheck')
def pluginArtifactVerification = tasks.named('verifyAiKnowledgeArtifacts')

def verifyAiKnowledgeCoverageControls = tasks.register('verifyAiKnowledgeCoverageControls', Exec) {
    group = 'verification'
    description = 'Detects omitted preparation and replay boundaries in nonempty AI context packs.'
    workingDir rootProject.projectDir
    // A verification run must preserve the clean checkout required by the
    // source-bound reproduction artifact builder later in ciCheck.
    commandLine aiKnowledgePython, '-B', '-m', 'unittest', 'discover',
        '-s', 'scripts', '-p', 'test_ai_knowledge_coverage.py'
    inputs.files(aiKnowledgeVerifierScript,
        rootProject.file('scripts/test_ai_knowledge_coverage.py'),
        rootProject.file('config/ai-knowledge-capability-coverage.json'))
    outputs.upToDateWhen { false }
}

def verifyRegelsucheAiKnowledgeArtifacts = tasks.register(
    'verifyRegelsucheAiKnowledgeArtifacts',
    Exec
) {
    group = 'verification'
    description = 'Verifies generated AI knowledge evidence and Regelsuche context-footprint contracts.'
    dependsOn pluginLifecycle, verifyAiKnowledgeCoverageControls
    workingDir rootProject.projectDir
    commandLine aiKnowledgePython,
        aiKnowledgeVerifierPath,
        '--root', aiKnowledgeArtifactPath
    inputs.file(aiKnowledgeVerifierScript)
    inputs.file(rootProject.file('config/ai-knowledge-capability-coverage.json'))
    inputs.dir(aiKnowledgeArtifactDirectory)
    outputs.upToDateWhen { false }
}

def hotspotRuntime = configurations.dependencyScope('hotspotRuntime')
dependencies.add(hotspotRuntime.name, project(':regelsuche-quality'))
def hotspotClasspath = configurations.resolvable('hotspotClasspath') {
    extendsFrom hotspotRuntime.get()
    attributes {
        attribute(Usage.USAGE_ATTRIBUTE, objects.named(Usage, Usage.JAVA_RUNTIME))
        attribute(Category.CATEGORY_ATTRIBUTE, objects.named(Category, Category.LIBRARY))
        attribute(LibraryElements.LIBRARY_ELEMENTS_ATTRIBUTE, objects.named(LibraryElements, LibraryElements.JAR))
    }
}
def verifyComplexityHotspots = tasks.register('verifyComplexityHotspots', JavaExec) {
    group = 'verification'
    description = 'Rejects new or materially worsened method-complexity hotspots without a finite exception.'
    dependsOn verifyRegelsucheAiKnowledgeArtifacts
    classpath = files(hotspotClasspath)
    mainClass = 'de.regelsuche.quality.complexity.ComplexityHotspotReportMain'
    def measurement = rootProject.layout.buildDirectory.file('ai-knowledge/complexity.json')
    args measurement.get().asFile.absolutePath,
        rootProject.file('config/quality/complexity-hotspots.json').absolutePath,
        rootProject.layout.buildDirectory.dir('reports/quality').get().asFile.absolutePath
    inputs.file(measurement)
    inputs.file(rootProject.file('config/quality/complexity-hotspots.json'))
    inputs.file(rootProject.file('ai-knowledge/complexity-baseline.json'))
    outputs.file(rootProject.file('build/reports/quality/complexity-hotspot-report.json'))
    outputs.file(rootProject.file('build/reports/quality/complexity-hotspot-report.md'))
    outputs.upToDateWhen { false }
}

def verifyRegelsucheAiKnowledgeLifecycle = tasks.register(
    'verifyRegelsucheAiKnowledgeLifecycle'
) {
    group = 'verification'
    description = 'Runs the plugin-native lifecycle, structural artifact verifier and Regelsuche-specific quality gates.'
    dependsOn pluginArtifactVerification, verifyComplexityHotspots
}

// The root task remains the stable checkout/CI entrypoint. Its existing
// dependency runs the plugin-native lifecycle; this additional dependency adds
// the read-only structural and Regelsuche-specific post-verification stages.
rootProject.tasks.named('aiKnowledgeCheck') {
    dependsOn verifyRegelsucheAiKnowledgeLifecycle
}
