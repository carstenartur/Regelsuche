/* The exact matrix slice reuses the existing digest-pinned reproduction image.
 * Its Java process is isolated, offline and compares a separate artifact family;
 * no historical target-free or RREF-v1 evidence is regenerated by this task. */
def matrixMath = project(':regelsuche-math-algorithms')
def matrixReports = layout.buildDirectory.dir('reports/matrix-preparation')
def matrixHost = matrixReports.map { it.dir('host').asFile }
def matrixContainer = matrixReports.map { it.dir('container').asFile }
def matrixImageId = layout.buildDirectory.file(
    'reports/target-free-held-out-container-reproduction/container-image-id.txt')
def matrixMain = 'de.regelsuche.math.algorithms.linalg.MatrixPreparationQualification'

matrixMath.plugins.withId('java-library') {
    def host = matrixMath.tasks.register('matrixPreparationEvidence', JavaExec) {
        group = 'verification'
        description = 'Characterizes the three exact matrix profiles against direct scalar elimination.'
        dependsOn matrixMath.tasks.named('classes')
        classpath = matrixMath.sourceSets.main.runtimeClasspath
        mainClass = matrixMain
        timeout = java.time.Duration.ofMinutes(2)
        inputs.property('contract', 'regelsuche.matrix-preparation-qualification/v1')
        outputs.dir matrixHost
        doFirst {
            delete matrixHost.get()
            args = [matrixHost.get().absolutePath]
        }
    }
    matrixMath.tasks.named('check').configure { dependsOn host }

    def container = rootProject.tasks.register('runMatrixPreparationReproductionImage', Exec) {
        group = 'verification'
        description = 'Reproduces exact matrix evidence offline in the shared digest-pinned image.'
        dependsOn 'inspectTargetFreeHeldOutReproductionImage'
        inputs.file matrixImageId
        outputs.dir matrixContainer
        outputs.upToDateWhen { false }
        timeout = java.time.Duration.ofMinutes(3)
        doFirst {
            def output = matrixContainer.get()
            delete output
            if (!output.mkdirs()) throw new GradleException('Cannot create matrix reproduction output')
            output.setReadable(true, false)
            output.setWritable(true, false)
            output.setExecutable(true, false)
            def imageId = matrixImageId.get().asFile.getText('UTF-8').trim()
            if (!(imageId ==~ /sha256:[0-9a-f]{64}/)) throw new GradleException('Invalid reproduction image identity')
            commandLine 'docker', 'run', '--rm', '--network', 'none', '--platform', 'linux/amd64',
                '-v', "${output.absolutePath}:/out", '--entrypoint', 'java', imageId,
                '-cp', '/workspace/regelsuche-core/build/classes/java/main:' +
                    '/workspace/regelsuche-validation/build/classes/java/main:' +
                    '/workspace/regelsuche-math-algorithms/build/classes/java/main',
                matrixMain, '/out'
        }
    }

    rootProject.tasks.register('verifyMatrixPreparationReproduction', JavaExec) {
        group = 'verification'
        description = 'Requires complete byte-identical checkout, repeat and pinned-container matrix evidence.'
        dependsOn host, container
        classpath = matrixMath.sourceSets.main.runtimeClasspath
        mainClass = matrixMain
        timeout = java.time.Duration.ofMinutes(2)
        inputs.dir matrixHost
        inputs.dir matrixContainer
        outputs.upToDateWhen { false }
        doFirst { args = ['verify', matrixHost.get().absolutePath, matrixContainer.get().absolutePath] }
    }
}

tasks.matching { it.name == 'check' }.configureEach {
    dependsOn 'verifyMatrixPreparationReproduction'
}
