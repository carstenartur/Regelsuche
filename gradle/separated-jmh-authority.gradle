/*
 * Isolated JMH authority for CI critical-path reduction.
 *
 * The ordinary ciCheck graph keeps every benchmark dependency by default. CI
 * may set -PseparateJmhAuthority=true only when a separately required job runs
 * the jmhAuthority task from a fresh checkout. In that mode this script disables
 * the exact benchmark execution/validator tasks inside ciCheck; their complete
 * unchanged graph is executed by jmhAuthority on an otherwise idle runner.
 */

def separateJmhAuthority = providers.gradleProperty(
    'separateJmhAuthority').map { value -> value == 'true' }.getOrElse(false)

def rootJmhTaskNames = [
    'verifyJmhRegression',
    'verifyJmhBenchmark',
    'runJmhAllocationBenchmark',
    'verifyJmhAllocationBenchmark'
] as Set

def appJmhTaskNames = ['jmh'] as Set
def sympyJmhTaskNames = [
    'jmh',
    'verifySymPyFactorizationBenchmark'
] as Set

if (separateJmhAuthority) {
    tasks.matching { task -> rootJmhTaskNames.contains(task.name) }
        .configureEach {
            enabled = false
        }
    project(':app').tasks.matching { task ->
        appJmhTaskNames.contains(task.name)
    }.configureEach {
        enabled = false
    }
    project(':regelsuche-math-sympy').tasks.matching { task ->
        sympyJmhTaskNames.contains(task.name)
    }.configureEach {
        enabled = false
    }
}

tasks.register('jmhAuthority') {
    group = 'verification'
    description = 'Runs every JMH execution and its unchanged fail-closed validators on one isolated runner.'
    dependsOn 'verifyJmhRegression',
        'verifyJmhBenchmark',
        'verifyJmhAllocationBenchmark',
        ':regelsuche-math-sympy:verifySymPyFactorizationBenchmark'
    doFirst {
        if (separateJmhAuthority) {
            throw new GradleException(
                'jmhAuthority must run without -PseparateJmhAuthority=true')
        }
    }
}
