import org.gradle.api.tasks.Delete
import org.gradle.api.tasks.Exec

// Publishes the SDK by task dependency, then starts only the external consumers.
def sdkModules = [
    'regelsuche-core',
    'regelsuche-egraph',
    'regelsuche-search',
    'regelsuche-validation',
    'regelsuche-discovery',
    'regelsuche-discovery-sdk'
]
def publicationTaskPaths = sdkModules.collect {
    ":${it}:publishMavenJavaPublicationToStudentSdkRepository"
}
def sdkRepository = layout.buildDirectory
    .dir('student-sdk-repository')
    .get()
    .asFile
def reportDirectory = layout.buildDirectory
    .dir('reports/student-java-sdk')
    .get()
    .asFile
def windows = System.getProperty('os.name')
    .toLowerCase(Locale.ROOT)
    .contains('windows')
def pythonExecutable = windows ? 'python' : 'python3'
def gradleExecutable = file(windows ? 'gradlew.bat' : 'gradlew').absolutePath

// Fast filesystem regressions complement, but do not replace, the real Java build.
def verifySdkStarter = tasks.register('verifyStudentDiscoveryStarter', Exec) {
    group = 'verification'
    description = 'Tests starter generation and consumer cleanup boundaries.'
    workingDir rootDir
    environment 'PYTHONDONTWRITEBYTECODE', '1'
    commandLine(
        pythonExecutable, '-B', '-m', 'unittest', 'discover',
        '-s', file('scripts').absolutePath,
        '-p', 'test_student_discovery_*.py', '-v'
    )
    inputs.files(
        'scripts/create-student-discovery-domain.py',
        'scripts/verify-student-java-sdk-consumer.py',
        'scripts/test_student_discovery_starter.py',
        'scripts/test_student_discovery_consumer.py'
    )
}

def cleanSdkRepository = tasks.register(
    'cleanStudentSdkVerificationRepository',
    Delete
) {
    group = 'verification'
    description = 'Removes the checkout-owned SDK verification repository.'
    delete sdkRepository
}

gradle.projectsEvaluated {
    publicationTaskPaths.each { path ->
        tasks.getByPath(path).dependsOn(cleanSdkRepository)
    }
}

def verifySdkConsumer = tasks.register(
    'verifyStudentJavaSdkConsumer',
    Exec
) {
    group = 'verification'
    description = 'Verifies the published SDK through clean Java 25 consumers.'
    dependsOn publicationTaskPaths
    dependsOn verifySdkStarter
    workingDir rootDir
    commandLine(
        pythonExecutable,
        file('scripts/verify-student-java-sdk-consumer.py').absolutePath,
        '--repository-root', rootDir.absolutePath,
        '--gradle', gradleExecutable,
        '--published-repository', sdkRepository.absolutePath
    )
    inputs.file('release.properties')
    inputs.file('scripts/create-student-discovery-domain.py')
    inputs.file('scripts/verify-student-java-sdk-consumer.py')
    inputs.files('gradlew', 'gradlew.bat', 'gradle/wrapper/gradle-wrapper.jar',
        'gradle/wrapper/gradle-wrapper.properties')
    inputs.dir('examples/external-consumers/geometric-sequence-domain-java25')
    outputs.file(new File(reportDirectory, 'consumer-report.json'))
    outputs.upToDateWhen { false }
}

tasks.named('ciCheck') {
    dependsOn verifySdkConsumer
}
