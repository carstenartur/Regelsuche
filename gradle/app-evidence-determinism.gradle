/* Re-run evidence-producing tests and compare their retained JSON bytes. */

pluginManager.withPlugin('java') {
    def registerDeterminismContract = { String label, String reportDirectory,
            List<String> testPatterns ->
        def title = label.substring(0, 1).toUpperCase(Locale.ROOT) + label.substring(1)
        def currentEvidence = layout.buildDirectory.dir("reports/${reportDirectory}")
        def baselineEvidence = layout.buildDirectory.dir(
            "reports/evidence-baselines/${reportDirectory}")

        def snapshot = tasks.register("snapshot${title}Evidence", Sync) {
            dependsOn tasks.named('test')
            from(currentEvidence) {
                include '*.json'
            }
            into baselineEvidence
            doFirst {
                delete baselineEvidence.get().asFile
            }
        }

        def rerun = tasks.register("rerun${title}EvidenceTests", Test) {
            dependsOn snapshot, tasks.named('testClasses')
            testClassesDirs = sourceSets.test.output.classesDirs
            classpath = sourceSets.test.runtimeClasspath
            useJUnitPlatform()
            filter {
                testPatterns.each { pattern -> includeTestsMatching pattern }
            }
            outputs.upToDateWhen { false }
            onlyIf {
                gradle.taskGraph.hasTask(
                    ":app:verify${title}EvidenceDeterminism")
            }
        }

        tasks.register("verify${title}EvidenceDeterminism", Test) {
            group = 'verification'
            description = "Requires repeated ${reportDirectory} JSON evidence to be byte-identical."
            dependsOn rerun, tasks.named('testClasses')
            testClassesDirs = sourceSets.test.output.classesDirs
            classpath = sourceSets.test.runtimeClasspath
            useJUnitPlatform()
            filter {
                includeTestsMatching(
                    'de.regelsuche.plugin.PluginArtifactIndexEvidenceTest.'
                        + 'configuredEvidenceDirectoriesAreByteIdentical')
            }
            systemProperty 'regelsuche.byteIdentity.left',
                baselineEvidence.get().asFile.absolutePath
            systemProperty 'regelsuche.byteIdentity.right',
                currentEvidence.get().asFile.absolutePath
            systemProperty 'regelsuche.byteIdentity.include', '*.json'
            inputs.dir baselineEvidence
            inputs.dir currentEvidence
            outputs.upToDateWhen { false }
        }
    }

    registerDeterminismContract(
        'pluginArtifactIndex',
        'plugin-artifact-index',
        [
            'de.regelsuche.plugin.PluginArtifactIndexEvidenceTest',
            'de.regelsuche.plugin.PluginArtifactIndexSignatureTest',
        ])

    registerDeterminismContract(
        'pluginTrustStoreRevision',
        'plugin-trust-store-revision',
        [
            'de.regelsuche.plugin.PluginTrustStoreRevisionTest',
            'de.regelsuche.plugin.PluginTrustStoreRevisionStrictJsonTest',
        ])

    def generatedStaticReferencePage =
        layout.buildDirectory.dir('reports/static-reference-page')
    def verifyStaticReferencePageContract = tasks.register(
            'verifyStaticReferencePageContract', Test) {
        group = 'verification'
        description = 'Requires the generated static reference page to satisfy its Java/JUnit contract.'
        dependsOn tasks.named('generateStaticReferencePage'),
            tasks.named('testClasses')
        testClassesDirs = sourceSets.test.output.classesDirs
        classpath = sourceSets.test.runtimeClasspath
        useJUnitPlatform()
        filter {
            includeTestsMatching(
                'de.regelsuche.docs.StaticReferencePageContractTest')
        }
        systemProperty 'regelsuche.staticReferencePageDir',
            generatedStaticReferencePage.get().asFile.absolutePath
        inputs.dir generatedStaticReferencePage
        outputs.upToDateWhen { false }
    }

    rootProject.tasks.named('verifyStaticReferencePage').configure {
        dependsOn verifyStaticReferencePageContract
        actions.clear()
        description = 'Compatibility alias; Java/JUnit owns the static reference-page contract.'
    }
}
