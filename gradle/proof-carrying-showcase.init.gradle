gradle.projectsEvaluated {
    def root = gradle.rootProject
    def pythonExecutable = root.providers.gradleProperty('pythonExecutable').getOrElse('python3')
    def showcasePlan = 'research/showcase/proof-carrying-self-improvement/showcase-plan.json'

    def verifyContract = root.tasks.register('verifyProofCarryingShowcaseContract', Exec) {
        group = 'verification'
        description = 'Verifies the frozen, unexecuted proof-carrying self-improvement showcase contract and seed-ordering boundary.'
        workingDir root.rootDir
        commandLine pythonExecutable,
            'scripts/verify-proof-carrying-showcase-contract.py',
            showcasePlan
        inputs.file(showcasePlan)
        inputs.file('scripts/verify-proof-carrying-showcase-contract.py')
        inputs.file('scripts/derive-proof-carrying-showcase-seed.py')
        inputs.files(root.fileTree('docs/schemas') {
            include 'regelsuche-proof-carrying-showcase-*.schema.json'
        })
    }

    root.tasks.register('verifyProofCarryingShowcaseGenerator', Exec) {
        group = 'verification'
        description = 'Generates the synthetic 24-case showcase fixture and verifies deterministic seed-sensitive construction without consuming real public randomness.'
        dependsOn verifyContract
        workingDir root.rootDir
        commandLine pythonExecutable,
            'scripts/generate-proof-carrying-showcase-final-test.py',
            '--plan', showcasePlan,
            '--self-test'
        inputs.file(showcasePlan)
        inputs.file('scripts/generate-proof-carrying-showcase-cases.py')
        inputs.file('scripts/generate-proof-carrying-showcase-final-test.py')
        inputs.file('docs/schemas/regelsuche-proof-carrying-showcase-generated-final-test-v1.schema.json')
    }
}
