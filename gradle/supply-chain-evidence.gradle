import groovy.json.JsonOutput
import groovy.json.JsonSlurper
import java.net.URLEncoder
import java.nio.charset.StandardCharsets
import java.util.SortedMap
import java.util.SortedSet
import java.util.TreeMap
import java.util.TreeSet
import org.gradle.api.artifacts.component.ModuleComponentIdentifier
import org.gradle.api.artifacts.result.ResolvedDependencyResult

/*
 * Checkout-owned deterministic dependency inventory foundation for issue #514.
 *
 * Resolution is deliberately performed by one task owned by each project. This
 * gives Gradle the correct exclusive project lock under --parallel. The root
 * cyclonedxBom task only combines immutable JSON fragments and never resolves a
 * foreign project's configuration.
 *
 * The raw aggregate document is valid CycloneDX JSON and contains no generated
 * UUID or timestamp, so identical dependency graphs produce identical bytes
 * before the stricter repository normalizer runs.
 */

def supplyChainReportDirectory = layout.buildDirectory.dir('reports/quality/supply-chain')
def supplyChainBom = supplyChainReportDirectory.map { directory -> directory.file('bom.json') }
def supplyChainFragmentDirectory = supplyChainReportDirectory.map { directory ->
    directory.dir('fragments')
}

def encodePurlPart = { String value ->
    URLEncoder.encode(value, StandardCharsets.UTF_8)
        .replace('+', '%20')
}

def moduleReference = { identifier ->
    if (!(identifier instanceof ModuleComponentIdentifier)) {
        return null
    }
    def group = encodePurlPart(identifier.group)
    def module = encodePurlPart(identifier.module)
    def version = encodePurlPart(identifier.version)
    "pkg:maven/${group}/${module}@${version}"
}

def fragmentRegistrations = []
rootProject.allprojects
    .toList()
    .sort { left, right -> left.path <=> right.path }
    .each { candidateProject ->
        def fragmentId = candidateProject.path == ':'
            ? 'root'
            : candidateProject.path.substring(1).replace(':', '--')
        def fragmentFile = supplyChainFragmentDirectory
            .map { directory -> directory.file("${fragmentId}.json") }
            .get()
            .asFile
        def fragmentTask = candidateProject.tasks.register(
            'writeSupplyChainDependencyFragment'
        ) {
            group = 'reporting'
            description = 'Resolves this project dependency graph under its own Gradle project lock.'
            notCompatibleWithConfigurationCache(
                'The task intentionally resolves every declared graph of its owning project at execution time.')
            outputs.file(fragmentFile)
            outputs.upToDateWhen { false }

            doLast {
                SortedMap<String, Map<String, Object>> components =
                    new TreeMap<>()
                SortedMap<String, SortedSet<String>> dependencyEdges =
                    new TreeMap<>()
                SortedSet<String> projectRootDependencies =
                    new TreeSet<>()

                candidateProject.configurations
                    .findAll { configuration ->
                        configuration.canBeResolved
                            && !configuration.name.startsWith(
                                'detachedConfiguration')
                    }
                    .sort { left, right -> left.name <=> right.name }
                    .each { configuration ->
                        def resolutionResult =
                            configuration.incoming.resolutionResult
                        resolutionResult.allComponents.each { component ->
                            def identifier = component.id
                            def reference = moduleReference(identifier)
                            if (reference == null) {
                                return
                            }
                            components.putIfAbsent(reference, [
                                type: 'library',
                                'bom-ref': reference,
                                group: identifier.group,
                                name: identifier.module,
                                version: identifier.version,
                                purl: reference
                            ])
                            dependencyEdges.computeIfAbsent(reference) {
                                new TreeSet<>()
                            }
                        }
                        resolutionResult.allDependencies
                            .findAll { dependency ->
                                dependency instanceof ResolvedDependencyResult
                            }
                            .each { ResolvedDependencyResult dependency ->
                                def sourceReference =
                                    moduleReference(dependency.from.id)
                                def targetReference =
                                    moduleReference(dependency.selected.id)
                                if (targetReference == null) {
                                    return
                                }
                                if (sourceReference == null) {
                                    projectRootDependencies.add(
                                        targetReference)
                                } else if (sourceReference != targetReference) {
                                    dependencyEdges
                                        .computeIfAbsent(sourceReference) {
                                            new TreeSet<>()
                                        }
                                        .add(targetReference)
                                }
                            }
                    }

                def fragment = [
                    projectPath: candidateProject.path,
                    components: components.values().toList(),
                    dependencies: dependencyEdges.collect {
                        reference, targets ->
                        [ref: reference, dependsOn: targets.toList()]
                    },
                    rootDependencies: projectRootDependencies.toList()
                ]
                fragmentFile.parentFile.mkdirs()
                fragmentFile.setText(
                    JsonOutput.prettyPrint(JsonOutput.toJson(fragment))
                        + '\n',
                    'UTF-8')
            }
        }
        fragmentRegistrations.add([
            projectPath: candidateProject.path,
            file: fragmentFile,
            task: fragmentTask
        ])
    }

tasks.register('cyclonedxBom') {
    group = 'reporting'
    description = 'Generates a deterministic aggregate CycloneDX 1.6 inventory from project-local resolution fragments.'
    dependsOn fragmentRegistrations.collect { registration ->
        registration.task
    }
    notCompatibleWithConfigurationCache(
        'The task intentionally aggregates freshly resolved project dependency fragments.')
    inputs.files(fragmentRegistrations.collect { registration ->
        registration.file
    })
    outputs.file(supplyChainBom)

    doLast {
        SortedMap<String, Map<String, Object>> components = new TreeMap<>()
        SortedMap<String, SortedSet<String>> dependencyEdges = new TreeMap<>()
        SortedSet<String> aggregateRootDependencies = new TreeSet<>()
        def parser = new JsonSlurper()

        fragmentRegistrations
            .sort { left, right ->
                left.projectPath <=> right.projectPath
            }
            .each { registration ->
                def fragment = parser.parse(registration.file)
                if (fragment.projectPath != registration.projectPath) {
                    throw new GradleException(
                        "dependency fragment project mismatch: "
                            + registration.projectPath)
                }
                fragment.components.each { component ->
                    def reference = component['bom-ref']
                    def previous = components.putIfAbsent(
                        reference,
                        new LinkedHashMap<String, Object>(component))
                    if (previous != null && previous != component) {
                        throw new GradleException(
                            "conflicting dependency component: ${reference}")
                    }
                    dependencyEdges.computeIfAbsent(reference) {
                        new TreeSet<>()
                    }
                }
                fragment.dependencies.each { dependency ->
                    def reference = dependency.ref
                    dependencyEdges
                        .computeIfAbsent(reference) { new TreeSet<>() }
                        .addAll(dependency.dependsOn)
                }
                aggregateRootDependencies.addAll(
                    fragment.rootDependencies)
            }

        if (components.isEmpty()) {
            throw new GradleException('resolved dependency inventory is empty')
        }

        def projectVersion = rootProject.version.toString()
        if (projectVersion == 'unspecified') {
            projectVersion = 'development'
        }
        def rootReference =
            "pkg:maven/de.regelsuche/Regelsuche@${encodePurlPart(projectVersion)}"
        def dependencyEntries = [[
            ref: rootReference,
            dependsOn: aggregateRootDependencies.toList()
        ]]
        dependencyEntries.addAll(dependencyEdges.collect {
            reference, targets ->
            [ref: reference, dependsOn: targets.toList()]
        })

        def bom = [
            bomFormat: 'CycloneDX',
            specVersion: '1.6',
            version: 1,
            metadata: [
                component: [
                    type: 'application',
                    'bom-ref': rootReference,
                    group: 'de.regelsuche',
                    name: 'Regelsuche',
                    version: projectVersion,
                    purl: rootReference
                ],
                tools: [
                    components: [[
                        type: 'application',
                        group: 'de.regelsuche',
                        name: 'checkout-gradle-dependency-inventory',
                        version: '1'
                    ]]
                ]
            ],
            components: components.values().toList(),
            dependencies: dependencyEntries
        ]

        def outputFile = supplyChainBom.get().asFile
        outputFile.parentFile.mkdirs()
        outputFile.setText(
            JsonOutput.prettyPrint(JsonOutput.toJson(bom)) + '\n',
            'UTF-8')
    }
}
