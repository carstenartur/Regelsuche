plugins {
    id 'java-library'
    id 'jacoco'
}

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

dependencies {
    api project(':regelsuche-core')
    api project(':regelsuche-search')
    api project(':regelsuche-validation')

    implementation 'com.fasterxml.jackson.core:jackson-databind:2.22.2'

    testImplementation libs.junit.jupiter
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy tasks.named('jacocoTestReport')
}

jacoco {
    toolVersion = '0.8.13'
}

tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test')
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
}

def repositoryRootDirectory = rootProject.layout.projectDirectory
def repositoryRootPath = repositoryRootDirectory.asFile.absolutePath
def domainExportVerifier = repositoryRootDirectory.file(
    'scripts/verify-domain-discovery-export.py')
def domainExportVerifierPath = domainExportVerifier.asFile.absolutePath
def domainExportSchemas = [
    repositoryRootDirectory.file(
        'docs/schemas/regelsuche-discovery-domain-descriptor-v1.schema.json'),
    repositoryRootDirectory.file(
        'docs/schemas/regelsuche-domain-discovery-evidence-v1.schema.json'),
    repositoryRootDirectory.file(
        'docs/schemas/regelsuche-discovery-lifecycle-handoff-v1.schema.json'),
    repositoryRootDirectory.file(
        'docs/schemas/regelsuche-domain-discovery-export-v1.schema.json'),
    repositoryRootDirectory.file(
        'docs/schemas/regelsuche-domain-discovery-export-verification-v1.schema.json')
]
def domainExportReportDirectory = layout.buildDirectory.dir(
    'reports/domain-discovery-export')
def domainExportVerificationReportDirectory = layout.buildDirectory.dir(
    'reports/domain-discovery-export-verification')
def targetFreeRepresentationRunReportDirectory = layout.buildDirectory.dir(
    'reports/representation-discovery/target-free-run')
def targetFreeRepresentationEvaluationPlanReportDirectory =
    layout.buildDirectory.dir(
        'reports/representation-discovery/evaluation-plan')
def targetFreeRepresentationCandidateFreezeReportDirectory =
    layout.buildDirectory.dir(
        'reports/representation-discovery/candidate-freeze')
def targetFreeRepresentationQualificationReportDirectory =
    layout.buildDirectory.dir(
        'reports/representation-discovery/post-freeze-qualification')
def verificationVenvDirectory = rootProject.layout.buildDirectory.dir(
    'verification-venv')
def verificationPython = verificationVenvDirectory.map { directory ->
    def executable = System.getProperty('os.name').toLowerCase(Locale.ROOT)
        .contains('windows') ? 'Scripts/python.exe' : 'bin/python'
    new File(directory.asFile, executable)
}
def checkoutGitStatus = providers.exec {
    workingDir repositoryRootDirectory.asFile
    commandLine 'git', 'status', '--porcelain', '--untracked-files=normal'
}.standardOutput.asText.map { value -> value.trim() }
def checkoutHeadRevision = providers.exec {
    workingDir repositoryRootDirectory.asFile
    commandLine 'git', 'rev-parse', 'HEAD'
}.standardOutput.asText.map { value -> value.trim() }
def checkoutGitRevision = checkoutGitStatus.flatMap { status ->
    if (!status.isEmpty()) {
        throw new GradleException(
            'Cannot bind representation-discovery evidence to a dirty '
                + 'checkout. Commit, stash or remove local changes, or pass '
                + 'an explicit authoritative repository revision.')
    }
    checkoutHeadRevision
}
def targetFreeRepositoryRevision = providers
    .gradleProperty('regelsucheRepositoryRevision')
    .orElse(providers.environmentVariable(
        'REGELSUCHE_AUTHORITY_GITHUB_SHA'))
    .orElse(providers.environmentVariable('GITHUB_SHA'))
    .orElse(checkoutGitRevision)
    .map { value ->
        def revision = value.trim()
        if (!(revision ==~ /[0-9a-f]{40}/)) {
            throw new GradleException(
                'Representation-discovery repository revision must be a '
                    + 'lowercase 40-character Git commit SHA')
        }
        revision
    }

def verifyDomainDiscoveryExportEvidence = tasks.register(
    'verifyDomainDiscoveryExportEvidence',
    Exec
) {
    group = 'verification'
    description = 'Independently verifies generic domain export schemas, bytes, roots and representation boundaries.'
    dependsOn rootProject.tasks.named('prepareVerificationEnvironment'),
        tasks.named('test')
    workingDir repositoryRootDirectory
    inputs.file(domainExportVerifier)
    inputs.files(domainExportSchemas)
    inputs.dir(domainExportReportDirectory)
    inputs.dir(domainExportVerificationReportDirectory)
    doFirst {
        commandLine verificationPython.get().absolutePath,
            domainExportVerifierPath,
            '--repository-root', repositoryRootPath
    }
}

def generateTargetFreeRepresentationDiscoveryRun = tasks.register(
    'generateTargetFreeRepresentationDiscoveryRun',
    JavaExec
) {
    group = 'verification'
    description = 'Executes the target-free R2 bridge and binds it to one immutable discovery-run workspace.'
    dependsOn tasks.named('classes')
    timeout = java.time.Duration.ofMinutes(2)
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'de.regelsuche.discovery.representation.TargetFreeRepresentationDiscoveryRun'
    argumentProviders.add({
        [
            targetFreeRepositoryRevision.get(),
            targetFreeRepresentationRunReportDirectory.get()
                .asFile.absolutePath
        ]
    } as CommandLineArgumentProvider)
    inputs.property('repositoryRevision', targetFreeRepositoryRevision)
    outputs.dir(targetFreeRepresentationRunReportDirectory)
    doLast {
        def reportDirectory =
            targetFreeRepresentationRunReportDirectory.get()
        [
            'target-free-sympy-bridge.json',
            'run-workspace.json'
        ].each { fileName ->
            if (!reportDirectory.file(fileName).asFile.isFile()) {
                throw new GradleException(
                    "Missing target-free run artifact: ${fileName}")
            }
        }
    }
}

def generateTargetFreeRepresentationEvaluationPlan = tasks.register(
    'generateTargetFreeRepresentationEvaluationPlan',
    JavaExec
) {
    group = 'verification'
    description = 'Freezes the complete target-blind representation evaluation matrix without disclosing qualification content.'
    dependsOn tasks.named('classes')
    timeout = java.time.Duration.ofMinutes(1)
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'de.regelsuche.discovery.representation.TargetFreeRepresentationEvaluationPlan'
    argumentProviders.add({
        [
            targetFreeRepositoryRevision.get(),
            targetFreeRepresentationEvaluationPlanReportDirectory.get()
                .asFile.absolutePath
        ]
    } as CommandLineArgumentProvider)
    inputs.property('repositoryRevision', targetFreeRepositoryRevision)
    outputs.dir(targetFreeRepresentationEvaluationPlanReportDirectory)
    doLast {
        def plan = targetFreeRepresentationEvaluationPlanReportDirectory
            .get()
            .file('representation-discovery-plan.json')
            .asFile
        if (!plan.isFile()) {
            throw new GradleException(
                "Missing target-free evaluation plan: ${plan}")
        }
    }
}

def generateTargetFreeRepresentationCandidateFreeze = tasks.register(
    'generateTargetFreeRepresentationCandidateFreeze',
    JavaExec
) {
    group = 'verification'
    description = 'Executes all target-blind representation rows and freezes candidate batches before qualification.'
    dependsOn tasks.named('classes'),
        generateTargetFreeRepresentationEvaluationPlan
    timeout = java.time.Duration.ofMinutes(5)
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'de.regelsuche.discovery.representation.TargetFreeRepresentationCandidateFreeze'
    argumentProviders.add({
        [
            targetFreeRepositoryRevision.get(),
            targetFreeRepresentationCandidateFreezeReportDirectory.get()
                .asFile.absolutePath
        ]
    } as CommandLineArgumentProvider)
    inputs.property('repositoryRevision', targetFreeRepositoryRevision)
    outputs.dir(targetFreeRepresentationCandidateFreezeReportDirectory)
    doLast {
        def freeze = targetFreeRepresentationCandidateFreezeReportDirectory
            .get()
            .file('representation-discovery-candidate-freeze.json')
            .asFile
        if (!freeze.isFile()) {
            throw new GradleException(
                "Missing target-free candidate freeze: ${freeze}")
        }
    }
}

def generateTargetFreeRepresentationPostFreezeQualification = tasks.register(
    'generateTargetFreeRepresentationPostFreezeQualification',
    JavaExec
) {
    group = 'verification'
    description = 'Opens the sealed qualification only after the exact candidate-freeze artifact exists.'
    dependsOn tasks.named('classes'),
        generateTargetFreeRepresentationCandidateFreeze
    timeout = java.time.Duration.ofMinutes(5)
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'de.regelsuche.discovery.representation.TargetFreeRepresentationPostFreezeQualification'
    argumentProviders.add({
        [
            targetFreeRepositoryRevision.get(),
            targetFreeRepresentationCandidateFreezeReportDirectory.get()
                .file('representation-discovery-candidate-freeze.json')
                .asFile.absolutePath,
            targetFreeRepresentationQualificationReportDirectory.get()
                .asFile.absolutePath
        ]
    } as CommandLineArgumentProvider)
    inputs.property('repositoryRevision', targetFreeRepositoryRevision)
    inputs.file(targetFreeRepresentationCandidateFreezeReportDirectory.map {
        it.file('representation-discovery-candidate-freeze.json')
    })
    outputs.dir(targetFreeRepresentationQualificationReportDirectory)
    doLast {
        def qualification =
            targetFreeRepresentationQualificationReportDirectory.get()
                .file(
                    'representation-discovery-post-freeze-qualification.json')
                .asFile
        if (!qualification.isFile()) {
            throw new GradleException(
                "Missing target-free post-freeze qualification: "
                    + qualification)
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('jacocoTestReport'),
        verifyDomainDiscoveryExportEvidence,
        generateTargetFreeRepresentationDiscoveryRun,
        generateTargetFreeRepresentationEvaluationPlan,
        generateTargetFreeRepresentationCandidateFreeze,
        generateTargetFreeRepresentationPostFreezeQualification
}

rootProject.tasks.named('check') {
    dependsOn verifyDomainDiscoveryExportEvidence,
        generateTargetFreeRepresentationDiscoveryRun,
        generateTargetFreeRepresentationEvaluationPlan,
        generateTargetFreeRepresentationCandidateFreeze,
        generateTargetFreeRepresentationPostFreezeQualification
}

// Companion inputs are archived bytes. This lifecycle never generates a new
// candidate freeze or invokes the historical qualification runner.
def intrinsicFixtureDirectory = layout.projectDirectory.dir(
    'src/test/resources/de/regelsuche/discovery/representation/reference-independent-v1')
def intrinsicPlan = intrinsicFixtureDirectory.file('target-free-held-out-plan.json.gz')
def intrinsicFreeze = intrinsicFixtureDirectory.file('target-free-held-out-candidate-freeze.json.gz')
def intrinsicHistoricalQualification = intrinsicFixtureDirectory.file(
    'target-free-held-out-post-freeze-qualification.json.gz')
def intrinsicFreezeHash =
    'sha256:b4a8fd1dbc70a7fc5f59df61e9c6871f1be65c47df5441b017be7804e187090a'
// Select an explicit CI authority before evaluating the clean-checkout fallback.
def intrinsicRevision = providers.provider {
    def revision = providers.gradleProperty('regelsucheRepositoryRevision').orNull
        ?: providers.environmentVariable('REGELSUCHE_AUTHORITY_GITHUB_SHA').orNull
        ?: providers.environmentVariable('GITHUB_SHA').orNull
    if (!revision) {
        if (!checkoutGitStatus.get().isEmpty()) {
            throw new GradleException('Cannot bind validation companion evidence to a dirty checkout.')
        }
        revision = checkoutHeadRevision.get()
    }
    revision = revision.trim()
    if (!(revision ==~ /[0-9a-f]{40}/)) {
        throw new GradleException('Validation companion revision must be a full lowercase Git commit SHA.')
    }
    revision
}
def intrinsicReport = layout.buildDirectory.file(intrinsicRevision.map {
    "reports/reference-independent-candidate-validation/${it}/reference-independent-candidate-validation.json"
})
def intrinsicComparison = layout.buildDirectory.file(intrinsicRevision.map {
    "reports/reference-independent-candidate-validation/${it}/historical-comparison.json"
})
def intrinsicSchema = repositoryRootDirectory.file(
    'docs/schemas/regelsuche-reference-independent-candidate-validation-v1.schema.json')
def intrinsicSchemaVerifier = repositoryRootDirectory.file(
    'scripts/verify-reference-independent-validation-schema.py')
def intrinsicSchemaTests = repositoryRootDirectory.file(
    'scripts/test-reference-independent-validation-schema.py')
def intrinsicRunnerClass =
    'de.regelsuche.discovery.representation.ReferenceIndependentCandidateValidationRunner'

def intrinsicControls = tasks.register('referenceIndependentCandidateValidationControls', Test) {
    group = 'verification'
    description = 'Checks frozen-set, evidence, budget, timeout and reference-boundary controls.'
    dependsOn tasks.named('testClasses')
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    filter {
        includeTestsMatching '*ReferenceIndependent*'
        includeTestsMatching '*TargetFreeIntrinsicCandidateValidatorTest'
    }
}

def generateIntrinsicCompanion = tasks.register('generateReferenceIndependentCandidateValidation', JavaExec) {
    group = 'verification'
    description = 'Validates every candidate in the already-public archived 144-row matrix.'
    dependsOn tasks.named('classes')
    classpath = sourceSets.main.runtimeClasspath
    mainClass = intrinsicRunnerClass
    inputs.files(intrinsicPlan, intrinsicFreeze)
    inputs.property('candidateFreezeHash', intrinsicFreezeHash)
    inputs.property('implementationRevision', intrinsicRevision)
    outputs.file(intrinsicReport)
    timeout = java.time.Duration.ofMinutes(2)
    argumentProviders.add({
        ['run', intrinsicPlan.asFile.absolutePath, intrinsicFreeze.asFile.absolutePath,
            intrinsicFreezeHash, intrinsicRevision.get(), '4316', '8192', '5000',
            intrinsicReport.get().asFile.absolutePath]
    } as CommandLineArgumentProvider)
}

def replayIntrinsicCompanion = tasks.register('replayReferenceIndependentCandidateValidation', JavaExec) {
    group = 'verification'
    description = 'Recomputes all admitted oracle results and exact candidate/work bindings.'
    dependsOn generateIntrinsicCompanion
    classpath = sourceSets.main.runtimeClasspath
    mainClass = intrinsicRunnerClass
    inputs.files(intrinsicPlan, intrinsicFreeze, intrinsicReport)
    timeout = java.time.Duration.ofMinutes(2)
    argumentProviders.add({
        ['verify', intrinsicPlan.asFile.absolutePath, intrinsicFreeze.asFile.absolutePath,
            intrinsicFreezeHash, intrinsicReport.get().asFile.absolutePath]
    } as CommandLineArgumentProvider)
}

def compareIntrinsicHistory = tasks.register('compareReferenceIndependentValidationHistory', JavaExec) {
    group = 'verification'
    description = 'Joins historical reference labels only after independent validation is complete.'
    dependsOn replayIntrinsicCompanion
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'de.regelsuche.discovery.representation.ReferenceIndependentValidationHistoricalComparison'
    inputs.files(intrinsicReport, intrinsicHistoricalQualification)
    outputs.file(intrinsicComparison)
    argumentProviders.add({
        [intrinsicReport.get().asFile.absolutePath, intrinsicHistoricalQualification.asFile.absolutePath,
            intrinsicComparison.get().asFile.absolutePath]
    } as CommandLineArgumentProvider)
}

def checkIntrinsicSchema = tasks.register('verifyReferenceIndependentValidationSchema', Exec) {
    group = 'verification'
    dependsOn rootProject.tasks.named('prepareVerificationEnvironment'), generateIntrinsicCompanion
    workingDir repositoryRootDirectory
    inputs.files(intrinsicSchema, intrinsicSchemaVerifier, intrinsicReport)
    doFirst {
        commandLine verificationPython.get().absolutePath, intrinsicSchemaVerifier.asFile.absolutePath,
            '--schema', intrinsicSchema.asFile.absolutePath,
            '--companion', intrinsicReport.get().asFile.absolutePath
    }
}

def checkIntrinsicSchemaControls = tasks.register('testReferenceIndependentValidationSchema', Exec) {
    group = 'verification'
    dependsOn rootProject.tasks.named('prepareVerificationEnvironment'), intrinsicControls
    workingDir repositoryRootDirectory
    inputs.files(intrinsicSchema, intrinsicSchemaVerifier, intrinsicSchemaTests)
    inputs.file(layout.buildDirectory.file(
        'reports/reference-independent-candidate-validation/test/reference-independent-candidate-validation.json'))
    environment 'PYTHONDONTWRITEBYTECODE', '1'
    doFirst {
        commandLine verificationPython.get().absolutePath, intrinsicSchemaTests.asFile.absolutePath
    }
}

def verifyIntrinsicCompanion = tasks.register('verifyReferenceIndependentCandidateValidation') {
    group = 'verification'
    description = 'Verifies the complete archived-matrix companion, oracle replay, schema and controls.'
    dependsOn compareIntrinsicHistory, checkIntrinsicSchema, checkIntrinsicSchemaControls
}
tasks.named('check') { dependsOn verifyIntrinsicCompanion }
rootProject.tasks.named('check') { dependsOn verifyIntrinsicCompanion }
