plugins {
    id 'java-library'
    id 'jacoco'
}

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    api project(':regelsuche-core')
    api project(':regelsuche-search')
    api project(':regelsuche-validation')

    implementation 'com.fasterxml.jackson.core:jackson-databind:2.22.0'

    testImplementation libs.junit.jupiter
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy tasks.named('jacocoTestReport')
}

jacoco {
    toolVersion = '0.8.13'
}

tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test')
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
}

def repositoryRootDirectory = rootProject.layout.projectDirectory
def domainExportVerifier = repositoryRootDirectory.file(
    'scripts/verify-domain-discovery-export.py')
def domainExportSchemas = [
    repositoryRootDirectory.file(
        'docs/schemas/regelsuche-discovery-domain-descriptor-v1.schema.json'),
    repositoryRootDirectory.file(
        'docs/schemas/regelsuche-domain-discovery-evidence-v1.schema.json'),
    repositoryRootDirectory.file(
        'docs/schemas/regelsuche-discovery-lifecycle-handoff-v1.schema.json'),
    repositoryRootDirectory.file(
        'docs/schemas/regelsuche-domain-discovery-export-v1.schema.json'),
    repositoryRootDirectory.file(
        'docs/schemas/regelsuche-domain-discovery-export-verification-v1.schema.json')
]
def verificationPython = providers.provider {
    def executable = System.getProperty('os.name').toLowerCase(Locale.ROOT)
        .contains('windows') ? 'Scripts/python.exe' : 'bin/python'
    new File(rootProject.layout.buildDirectory
        .dir('verification-venv').get().asFile, executable)
}

def verifyDomainDiscoveryExportEvidence = tasks.register(
    'verifyDomainDiscoveryExportEvidence',
    Exec
) {
    group = 'verification'
    description = 'Independently verifies generic domain export schemas, bytes, roots and representation boundaries.'
    dependsOn rootProject.tasks.named('prepareVerificationEnvironment'),
        tasks.named('test')
    workingDir repositoryRootDirectory
    inputs.file(domainExportVerifier)
    inputs.files(domainExportSchemas)
    outputs.upToDateWhen { false }
    doFirst {
        commandLine verificationPython.get().absolutePath,
            domainExportVerifier.asFile.absolutePath,
            '--repository-root', repositoryRootDirectory.asFile.absolutePath
    }
}

tasks.named('check') {
    dependsOn tasks.named('jacocoTestReport'), verifyDomainDiscoveryExportEvidence
}

rootProject.tasks.named('check') {
    dependsOn verifyDomainDiscoveryExportEvidence
}
