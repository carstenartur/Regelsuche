plugins {
    id 'java-library'
    id 'jacoco'
}

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    api project(':regelsuche-core')
    api project(':regelsuche-search')
    api project(':regelsuche-validation')
    api project(':regelsuche-solver-ir')

    implementation 'com.fasterxml.jackson.core:jackson-databind:2.22.0'

    testImplementation libs.junit.jupiter
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy tasks.named('jacocoTestReport')
}

tasks.register('verifyEvolutionStudy', Exec) {
    group = 'verification'
    description = 'Verifies the frozen population study, nested splits and FINAL TEST boundary.'
    workingDir rootProject.projectDir
    commandLine 'python3',
        'scripts/verify-evolution-study.py',
        'research/evolution/evolution-study-source.json'
    inputs.file(rootProject.file('scripts/verify-evolution-study.py'))
    inputs.file(rootProject.file('research/evolution/evolution-study-source.json'))
    inputs.file(rootProject.file('research/benchmarks/candidate-independent/benchmark-source.json'))
    inputs.file(rootProject.file('docs/schemas/regelsuche-evolution-study-source-v1.schema.json'))
}

jacoco {
    toolVersion = '0.8.13'
}

tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test')
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
}

tasks.named('check') {
    dependsOn tasks.named('jacocoTestReport')
    dependsOn tasks.named('verifyEvolutionStudy')
}
