    inputs.file(rewriteProgramWorkVerifier)
    inputs.files(rewriteProgramWorkSchemas)
    inputs.dir(rewriteProgramWorkOutput)
    outputs.upToDateWhen { false }
    doFirst {
        commandLine verificationPython.get().absolutePath,
            rewriteProgramWorkVerifier.absolutePath,
            '--root', rewriteProgramWorkOutput.get().asFile.absolutePath,
            '--schemas', independentReviewSchemasPath
