plugins {
    id 'java-library'
    id 'jacoco'
}

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

dependencies {
    api project(':regelsuche-core')
    api project(':regelsuche-search')
    api project(':regelsuche-validation')
    api project(':regelsuche-solver-ir')
    api project(':regelsuche-math-algorithms')

    implementation 'com.fasterxml.jackson.core:jackson-databind:2.22.2'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.22.2'

    testImplementation libs.junit.jupiter
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy tasks.named('jacocoTestReport')
}

jacoco {
    toolVersion = '0.8.13'
}

tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test')
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
}

tasks.named('check') {
    dependsOn tasks.named('jacocoTestReport')
}

tasks.register('strategyTransferDemo', JavaExec) {
    group = 'application'
    description = 'Learns a bounded rule schedule and writes a replayable development comparison with HTML.'
    dependsOn tasks.named('classes')
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'de.regelsuche.evolution.TraceStrategyTransferExample'
    args layout.buildDirectory.dir('reports/strategy-transfer').get().asFile.absolutePath
}

tasks.register('learnedRuleBaseline', JavaExec) {
    group = 'verification'
    description = 'Writes the frozen BASE/NAIVE/RANKED/EXPERT branching and work diagnosis.'
    dependsOn tasks.named('classes')
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'de.regelsuche.evolution.LearnedRuleBaselineExperiment'
    args layout.buildDirectory.dir('reports/learned-rule-baseline').get().asFile.absolutePath
}

tasks.register('strategyDispatchDemo', JavaExec) {
    group = 'application'
    description = 'Writes the fixed comparison of trained conditional continuations with strong primitive controls.'
    dependsOn tasks.named('classes')
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'de.regelsuche.evolution.TraceStrategyDispatchExample'
    args layout.buildDirectory.dir('reports/strategy-dispatch').get().asFile.absolutePath
}

def evolutionStudyOutput = layout.buildDirectory.dir('reports/evolution-study-plan')
def writeEvolutionStudyPlan = tasks.register('writeEvolutionStudyPlan', JavaExec) {
    group = 'verification'
    description = 'Writes the preregistered NOT_STARTED evolution study and split contracts.'
    dependsOn tasks.named('classes')
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'de.regelsuche.evolution.EvolutionStudyPlanExample'
    args evolutionStudyOutput.get().asFile.absolutePath
    outputs.dir evolutionStudyOutput
}

def verificationEnvironment = rootProject.layout.buildDirectory.dir('verification-venv')
def verificationScript = rootProject.file('scripts/verify-evolution-study-contracts.py')
def splitManifestSchema = rootProject.file(
    'docs/schemas/regelsuche-evolution-split-manifest-v1.schema.json')
def studyPlanSchema = rootProject.file(
    'docs/schemas/regelsuche-evolution-study-plan-v1.schema.json')
def verificationPython = verificationEnvironment.map { directory ->
    def executable = System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows')
        ? 'Scripts/python.exe'
        : 'bin/python'
    new File(directory.asFile, executable)
}

def verifyEvolutionStudyContracts = tasks.register('verifyEvolutionStudyContracts', Exec) {
    group = 'verification'
    description = 'Validates the preregistered split and study-plan artifacts independently.'
    dependsOn rootProject.tasks.named('prepareVerificationEnvironment'), writeEvolutionStudyPlan
    workingDir rootProject.rootDir
    inputs.file(verificationScript)
    inputs.files(splitManifestSchema, studyPlanSchema)
    outputs.upToDateWhen { false }
    doFirst {
        commandLine verificationPython.get().absolutePath,
            verificationScript.absolutePath,
            '--root', evolutionStudyOutput.get().asFile.absolutePath
    }
}

def independentReviewOutput = layout.buildDirectory.dir(
    'reports/independent-review-protocol')
def independentReviewVerifier = rootProject.file(
    'scripts/verify-independent-interestingness-review.py')
def independentReviewPlanSchema = rootProject.file(
    'docs/schemas/regelsuche-independent-review-study-plan-v1.schema.json')
def independentReviewIntakeSchema = rootProject.file(
    'docs/schemas/regelsuche-independent-review-intake-v1.schema.json')
def independentReviewPacketSchemas = [
    'regelsuche-independent-review-blinded-packet-v1.schema.json',
    'regelsuche-independent-review-public-packet-manifest-v1.schema.json',
    'regelsuche-independent-review-private-assignment-manifest-v1.schema.json'
].collect { name -> rootProject.file("docs/schemas/${name}") }
def independentReviewSchemasPath = rootProject.file('docs/schemas').absolutePath

def verifyIndependentInterestingnessReview = tasks.register(
    'verifyIndependentInterestingnessReview',
    Exec
) {
    group = 'verification'
    description = 'Verifies frozen review-plan, privacy, split, hash and development-only intake contracts.'
    dependsOn rootProject.tasks.named('prepareVerificationEnvironment'),
        tasks.named('test')
    workingDir rootProject.rootDir
    inputs.file(independentReviewVerifier)
    inputs.files(independentReviewPlanSchema, independentReviewIntakeSchema)
    inputs.files(independentReviewPacketSchemas)
    inputs.dir(independentReviewOutput)
    outputs.upToDateWhen { false }
    doFirst {
        commandLine verificationPython.get().absolutePath,
            independentReviewVerifier.absolutePath,
            '--root', independentReviewOutput.get().asFile.absolutePath,
            '--schemas', independentReviewSchemasPath
    }
}

