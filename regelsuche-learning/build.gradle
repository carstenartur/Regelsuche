plugins {
    id 'java-library'
    id 'jacoco'
}

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    api project(':regelsuche-core')
    api project(':regelsuche-search')
    api project(':regelsuche-validation')
    api project(':regelsuche-solver-ir')

    implementation 'com.fasterxml.jackson.core:jackson-databind:2.22.0'

    testImplementation libs.junit.jupiter
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy tasks.named('jacocoTestReport')
}

jacoco {
    toolVersion = '0.8.13'
}

tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test')
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
}

tasks.named('check') {
    dependsOn tasks.named('jacocoTestReport')
}

def evolutionStudyOutput = layout.buildDirectory.dir('reports/evolution-study-plan')
def writeEvolutionStudyPlan = tasks.register('writeEvolutionStudyPlan', JavaExec) {
    group = 'verification'
    description = 'Writes the preregistered NOT_STARTED evolution study and split contracts.'
    dependsOn tasks.named('classes')
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'de.regelsuche.evolution.EvolutionStudyPlanExample'
    args evolutionStudyOutput.get().asFile.absolutePath
    outputs.dir evolutionStudyOutput
}

def verificationEnvironment = rootProject.layout.buildDirectory.dir('verification-venv')
def verificationScript = rootProject.file('scripts/verify-evolution-study-contracts.py')
def splitManifestSchema = rootProject.file(
    'docs/schemas/regelsuche-evolution-split-manifest-v1.schema.json')
def studyPlanSchema = rootProject.file(
    'docs/schemas/regelsuche-evolution-study-plan-v1.schema.json')
def verificationPython = verificationEnvironment.map { directory ->
    def executable = System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows')
        ? 'Scripts/python.exe'
        : 'bin/python'
    new File(directory.asFile, executable)
}

def verifyEvolutionStudyContracts = tasks.register('verifyEvolutionStudyContracts', Exec) {
    group = 'verification'
    description = 'Validates the preregistered split and study-plan artifacts independently.'
    dependsOn rootProject.tasks.named('prepareVerificationEnvironment'), writeEvolutionStudyPlan
    workingDir rootProject.rootDir
    inputs.file(verificationScript)
    inputs.files(splitManifestSchema, studyPlanSchema)
    outputs.upToDateWhen { false }
    doFirst {
        commandLine verificationPython.get().absolutePath,
            verificationScript.absolutePath,
            '--root', evolutionStudyOutput.get().asFile.absolutePath
    }
}

tasks.named('check') {
    dependsOn verifyEvolutionStudyContracts
}

rootProject.tasks.named('check') {
    dependsOn verifyEvolutionStudyContracts
}
