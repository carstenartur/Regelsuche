pluginManagement {
    def aiKnowledgeEnabled =
        System.getenv('AI_KNOWLEDGE_EXTRACTOR_ENABLED') == 'true' ||
        providers.gradleProperty('enableAiKnowledgeExtractor').orNull == 'true'
    def useLocalAiKnowledgeExtractor =
        providers.gradleProperty('useLocalAiKnowledgeExtractor').orNull == 'true'
    def aiKnowledgeExtractorVersion = providers
        .gradleProperty('aiKnowledgeExtractorVersion')
        .getOrElse('0.1.7')

    if (useLocalAiKnowledgeExtractor) {
        def checkout = file(providers
            .gradleProperty('aiKnowledgeExtractorCheckout')
            .getOrElse('../ai-knowledge-extractor'))
        if (!checkout.isDirectory()) {
            throw new GradleException(
                "Local AI Knowledge Extractor checkout does not exist: ${checkout}")
        }
        includeBuild(checkout)
    }

    plugins {
        id 'org.aiknowledge.extractor' version aiKnowledgeExtractorVersion
    }

    repositories {
        gradlePluginPortal()
        mavenCentral()
        if (aiKnowledgeEnabled && !useLocalAiKnowledgeExtractor) {
            maven {
                name = 'AiKnowledgeGitHubPackages'
                url = uri('https://maven.pkg.github.com/carstenartur/ai-knowledge-extractor')
                credentials {
                    username = providers.gradleProperty('gpr.user')
                        .orElse(providers.environmentVariable('GITHUB_ACTOR'))
                        .getOrElse('')
                    password = providers.gradleProperty('gpr.key')
                        .orElse(providers.environmentVariable('GITHUB_TOKEN'))
                        .getOrElse('')
                }
                content {
                    includeGroupByRegex 'org\\.aiknowledge(\\..*)?'
                }
            }
        }
    }
}

plugins {
    // Apply the foojay-resolver plugin to allow automatic download of JDKs
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

gradle.beforeProject { candidate ->
    if (candidate.path == ':') {
        candidate.apply from: new File(
            settingsDir,
            'gradle/discovery-challenge-verification.gradle')
        candidate.apply from: new File(
            settingsDir,
            'gradle/paper-foundation-verification.gradle')
        candidate.apply from: new File(
            settingsDir,
            'gradle/independent-reproduction-verification.gradle')
        candidate.apply from: new File(
            settingsDir,
            'gradle/candidate-independent-execution-verification.gradle')
    }
}

rootProject.name = 'Regelsuche'
include(
    'regelsuche-core',
    'regelsuche-egraph',
    'regelsuche-search',
    'regelsuche-validation',
    'regelsuche-solver-ir',
    'regelsuche-solver-portfolio',
    'regelsuche-math-algorithms',
    'regelsuche-math-jas',
    'regelsuche-persistence',
    'regelsuche-persistence-hibernate',
    'regelsuche-learning',
    'regelsuche-experiments',
    'regelsuche-autopilot',
    'regelsuche-release',
    'regelsuche-cli',
    'regelsuche-discovery',
    'regelsuche-benchmarks',
    'app'
)

if (System.getenv('AI_KNOWLEDGE_EXTRACTOR_ENABLED') == 'true' ||
        providers.gradleProperty('enableAiKnowledgeExtractor').orNull == 'true') {
    include 'ai-knowledge-verification'
}
