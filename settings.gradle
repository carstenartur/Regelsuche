pluginManagement {
    def aiKnowledgeExtractor = file('../ai-knowledge-extractor')
    if (aiKnowledgeExtractor.isDirectory()) {
        includeBuild(aiKnowledgeExtractor)
    }
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}

plugins {
    // Apply the foojay-resolver plugin to allow automatic download of JDKs
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

// Keep cross-module receipt generation modular without creating another
// GitHub Actions test graph. The script registers a root Gradle task and hooks
// it into the central `check` lifecycle before the root project is evaluated.
gradle.beforeProject { project ->
    if (project == gradle.rootProject) {
        project.apply from: new File(settingsDir,
            'gradle/development-pilots-verification.gradle')
    }
}

rootProject.name = 'Regelsuche'
include(
    'regelsuche-core',
    'regelsuche-egraph',
    'regelsuche-search',
    'regelsuche-validation',
    'regelsuche-solver-ir',
    'regelsuche-solver-portfolio',
    'regelsuche-math-algorithms',
    'regelsuche-math-jas',
    'regelsuche-persistence',
    'regelsuche-persistence-hibernate',
    'regelsuche-learning',
    'regelsuche-experiments',
    'regelsuche-autopilot',
    'regelsuche-release',
    'regelsuche-cli',
    'regelsuche-discovery',
    'regelsuche-benchmarks',
    'app'
)
