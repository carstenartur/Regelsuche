plugins {
    id 'java-library'
    id 'jacoco'
}

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

dependencies {
    api project(':regelsuche-core')
    implementation project(':regelsuche-search')
    implementation project(':regelsuche-validation')
    implementation project(':regelsuche-math-algorithms')
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.22.1'

    testImplementation libs.junit.jupiter
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.register('writeSolverIrExample', JavaExec) {
    group = 'verification'
    description = 'Writes canonical solver-neutral obligation and result examples.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'de.regelsuche.solver.ir.SolverIrExampleMain'
    args layout.buildDirectory.dir('reports/solver-ir').get().asFile.absolutePath
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy tasks.named('jacocoTestReport')
}

jacoco {
    toolVersion = '0.8.13'
}

tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test')
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
}

tasks.named('check') {
    dependsOn tasks.named('jacocoTestReport')
}
