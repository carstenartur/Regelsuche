# Optional Full Mode for Regelsuche.
#
# The killer-demo's STANDARD mode is the single-image flow:
#
#     docker build -t regelsuche .
#     docker run --rm -p 8080:8080 regelsuche
#
# That single image is enough to click through every demo, see the search
# graph, replays, identities and download the report bundle — no external
# services required.
#
# This Compose file is the OPTIONAL Full Mode for persistent, larger
# analyses backed by PostgreSQL plus an optional Neo4j server. Start with:
#
#     docker compose up --build
#
# and open http://localhost:8080. PostgreSQL is reachable on localhost:5432.
# Neo4j is reachable on bolt://localhost:7687 (browser UI on http://localhost:7474).
#
# To stop and keep the database volumes:
#     docker compose down
# To wipe PostgreSQL/Neo4j data:
#     docker compose down -v

services:
  app:
    build: .
    image: regelsuche
    ports:
      - "8080:8080"
    environment:
      # Full Mode: compact Discovery metadata in PostgreSQL, mathematical
      # provenance graph optionally in Neo4j, and JSON files as demo fallback.
      REGELSUCHE_PERSISTENCE_MODE: POSTGRESQL_WITH_JSON_FALLBACK
      POSTGRES_URL: jdbc:postgresql://postgres:5432/regelsuche
      POSTGRES_USER: regelsuche
      POSTGRES_PASSWORD: regelsuche-demo
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: regelsuche-demo
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: regelsuche
      POSTGRES_USER: regelsuche
      POSTGRES_PASSWORD: regelsuche-demo
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U regelsuche -d regelsuche"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  neo4j:
    image: neo4j:5-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/regelsuche-demo
      NEO4J_server_default__listen__address: 0.0.0.0
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p regelsuche-demo 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
    restart: unless-stopped

volumes:
  postgres-data:
  neo4j-data:
  neo4j-logs:
