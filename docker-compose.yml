# Optional Full Mode for Regelsuche.
#
# The killer-demo's STANDARD mode is the single-image flow:
#
#     docker build -t regelsuche .
#     docker run --rm -p 127.0.0.1:8080:8080 regelsuche
#
# That single image is enough to click through every demo, see the search
# graph, replays, identities and download the report bundle — no external
# services required.
#
# This Compose file is the OPTIONAL Full Mode for persistent, larger
# analyses backed by PostgreSQL plus an optional Neo4j server. Start with:
#
#     docker compose up --build
#
# and open http://localhost:8080. Published demo ports bind to 127.0.0.1 only.
# Optional services:
#     docker compose --profile neo4j up --build
#     docker compose --profile proof-worker up --build
#
# SECURITY: the application defaults to HTTP without authentication and the
# fallback credentials below are development-only. Keep the localhost binds,
# or put the deployment behind authenticated TLS, and replace every demo
# password before exposing any service beyond the local machine.
#
# To stop and keep the database volumes:
#     docker compose down
# To wipe PostgreSQL/Neo4j data:
#     docker compose down -v

services:
  app:
    build: .
    image: regelsuche
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      # Full Mode: compact Discovery metadata in PostgreSQL, mathematical
      # provenance graph optionally in Neo4j, and JSON files as demo fallback.
      REGELSUCHE_PERSISTENCE_MODE: POSTGRESQL_WITH_JSON_FALLBACK
      POSTGRES_URL: jdbc:postgresql://postgres:5432/regelsuche
      POSTGRES_USER: ${POSTGRES_USER:-regelsuche}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-regelsuche-demo}
      # Optional Neo4j graph provenance can be enabled by running the neo4j
      # profile and setting NEO4J_URI/NEO4J_USER/NEO4J_PASSWORD here.
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-regelsuche}
      POSTGRES_USER: ${POSTGRES_USER:-regelsuche}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-regelsuche-demo}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-regelsuche} -d $${POSTGRES_DB:-regelsuche}"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  neo4j:
    profiles: ["neo4j"]
    image: neo4j:5-community
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-regelsuche-demo}
      REGELSUCHE_HEALTHCHECK_USER: ${NEO4J_USER:-neo4j}
      REGELSUCHE_HEALTHCHECK_PASSWORD: ${NEO4J_PASSWORD:-regelsuche-demo}
      NEO4J_server_default__listen__address: 0.0.0.0
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u $${REGELSUCHE_HEALTHCHECK_USER} -p $${REGELSUCHE_HEALTHCHECK_PASSWORD} 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
    restart: unless-stopped

  proof-worker:
    profiles: ["proof-worker"]
    build:
      context: .
      dockerfile: Dockerfile.proof
    image: regelsuche-proof-worker
    environment:
      REGELSUCHE_PROOF_ARTIFACT_PATH: /opt/regelsuche/proof-artifacts
    volumes:
      - proof-artifacts:/opt/regelsuche/proof-artifacts
    restart: unless-stopped

volumes:
  postgres-data:
  neo4j-data:
  neo4j-logs:
  proof-artifacts:
