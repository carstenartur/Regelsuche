# Optional Full Mode for Regelsuche.
#
# The killer-demo's STANDARD mode is the single-image flow:
#
#     docker build -t regelsuche .
#     docker run --rm -p 8080:8080 regelsuche
#
# That single image is enough to click through every demo, see the search
# graph, replays, identities and download the report bundle — no external
# services required.
#
# This Compose file is the OPTIONAL Full Mode for persistent, larger
# analyses backed by a real Neo4j server. Start with:
#
#     docker compose up --build
#
# and open http://localhost:8080. Neo4j is reachable on bolt://localhost:7687
# (browser UI on http://localhost:7474).
#
# To stop and keep the Neo4j volume:
#     docker compose down
# To wipe Neo4j data:
#     docker compose down -v

services:
  app:
    build: .
    image: regelsuche
    ports:
      - "8080:8080"
    environment:
      # Switch the app's persistence layer from JSON_FILE (default Docker
      # mode) to the remote Neo4j shipped with this compose file.
      REGELSUCHE_PERSISTENCE_MODE: REMOTE_NEO4J
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: regelsuche-demo
    depends_on:
      neo4j:
        condition: service_healthy
    restart: unless-stopped

  neo4j:
    image: neo4j:5-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/regelsuche-demo
      NEO4J_server_default__listen__address: 0.0.0.0
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p regelsuche-demo 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
    restart: unless-stopped

volumes:
  neo4j-data:
  neo4j-logs:
