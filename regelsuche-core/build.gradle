plugins {
    id 'java-library'
    id 'jacoco'
}

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.22.1'
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:2.22.1'
    testImplementation libs.junit.jupiter
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy tasks.named('jacocoTestReport')
}

jacoco {
    toolVersion = '0.8.13'
}

tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test')
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
}

tasks.named('check') {
    dependsOn tasks.named('jacocoTestReport')
}

def mavenExecutable = System.getProperty('os.name')
    .toLowerCase(Locale.ROOT)
    .contains('windows') ? 'mvn.cmd' : 'mvn'

def verifyMavenCoreReactor = tasks.register('verifyMavenCoreReactor', Exec) {
    group = 'verification'
    description = 'Runs the focused Maven/JUnit build-contract slice; the complete product and Docker reactor is verified once by mvn -Pfull verify.'
    workingDir rootProject.rootDir
    commandLine mavenExecutable,
        '--batch-mode',
        '--no-transfer-progress',
        '--file',
        rootProject.file('pom.xml').absolutePath,
        '--projects',
        'maven-build-contract',
        'test'
    inputs.file rootProject.file('pom.xml')
    inputs.files rootProject.files(
        'regelsuche-core/pom.xml',
        'regelsuche-egraph/pom.xml',
        'regelsuche-search/pom.xml',
        'regelsuche-validation/pom.xml',
        'regelsuche-math-algorithms/pom.xml',
        'maven-build-contract/pom.xml'
    )
    outputs.upToDateWhen { false }
}

rootProject.tasks.named('check') {
    dependsOn verifyMavenCoreReactor
}
