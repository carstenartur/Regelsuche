packId: sympy-trigonometry
displayName: SymPy Trigonometry
sourceProject: SymPy
sourceUrl: https://github.com/sympy/sympy/blob/fe935ceb303891d1f8bea4c03b19fd9ec9464b02/sympy/simplify/fu.py
sourceVersion: "1.14.0"
sourceReference: SymPy tag 1.14.0 at commit fe935ceb303891d1f8bea4c03b19fd9ec9464b02; selected fu.py and trigsimp.py identities were manually reviewed and independently reimplemented.
license: BSD-3-Clause
enabledByDefault: false
maturity: EXPERIMENTAL
categories:
  - trigonometry
  - sympy-derived
rules:
  - id: sympy.trig.pythagorean
    derivationType: REIMPLEMENTED_RULE
    status: VALIDATED
    searchEffects:
      - SIMPLIFYING
    riskLevel: low
    recognition: ARITHMETIC_AC
    rule:
      from: "add(pow(sin(?X), 2), pow(cos(?X), 2))"
      to: "1"
    validation:
      examples:
        - from: "add(pow(sin(t), 2), pow(cos(t), 2))"
          to: "1"
  - id: sympy.trig.sin_double
    derivationType: REIMPLEMENTED_RULE
    status: VALIDATED
    searchEffects:
      - EXPANDING
    riskLevel: low
    rule:
      from: "sin(mul(2, ?X))"
      to: "mul(2, mul(sin(?X), cos(?X)))"
    validation:
      examples:
        - from: "sin(mul(2, t))"
          to: "mul(2, mul(sin(t), cos(t)))"
  - id: sympy.trig.cos_double
    derivationType: REIMPLEMENTED_RULE
    status: VALIDATED
    searchEffects:
      - EXPANDING
    riskLevel: low
    rule:
      from: "cos(mul(2, ?X))"
      to: "sub(pow(cos(?X), 2), pow(sin(?X), 2))"
    validation:
      examples:
        - from: "cos(mul(2, t))"
          to: "sub(pow(cos(t), 2), pow(sin(t), 2))"
  - id: sympy.trig.tan_def
    sourceReference: sympy/simplify/fu.py TR2 at tag 1.14.0 commit fe935ceb303891d1f8bea4c03b19fd9ec9464b02; exact first-power tangent definition only.
    derivationType: REIMPLEMENTED_RULE
    status: VALIDATED
    searchEffects:
      - NORMALIZING
      - EXPANDING
    riskLevel: low
    rule:
      from: "tan(?X)"
      to: "div(sin(?X), cos(?X))"
    validation:
      examples:
        - from: "tan(t)"
          to: "div(sin(t), cos(t))"
  - id: sympy.trig.sec_def
    sourceReference: sympy/simplify/fu.py TR1 at tag 1.14.0 commit fe935ceb303891d1f8bea4c03b19fd9ec9464b02; secant branch independently reimplemented.
    derivationType: REIMPLEMENTED_RULE
    status: VALIDATED
    searchEffects:
      - NORMALIZING
      - EXPANDING
    riskLevel: low
    rule:
      from: "sec(?X)"
      to: "1 / cos(?X)"
    validation:
      examples:
        - from: "sec(t)"
          to: "1 / cos(t)"
  - id: sympy.trig.csc_def
    sourceReference: sympy/simplify/fu.py TR1 at tag 1.14.0 commit fe935ceb303891d1f8bea4c03b19fd9ec9464b02; cosecant branch independently reimplemented.
    derivationType: REIMPLEMENTED_RULE
    status: VALIDATED
    searchEffects:
      - NORMALIZING
      - EXPANDING
    riskLevel: low
    rule:
      from: "csc(?X)"
      to: "1 / sin(?X)"
    validation:
      examples:
        - from: "csc(t)"
          to: "1 / sin(t)"
  - id: sympy.trig.cot_def
    sourceReference: sympy/simplify/fu.py TR2 at tag 1.14.0 commit fe935ceb303891d1f8bea4c03b19fd9ec9464b02; cotangent branch independently reimplemented.
    derivationType: REIMPLEMENTED_RULE
    status: VALIDATED
    searchEffects:
      - NORMALIZING
      - EXPANDING
    riskLevel: low
    rule:
      from: "cot(?X)"
      to: "cos(?X) / sin(?X)"
    validation:
      examples:
        - from: "cot(t)"
          to: "cos(t) / sin(t)"
  - id: sympy.trig.sin_sum
    derivationType: REIMPLEMENTED_RULE
    status: REVIEWED
    searchEffects:
      - EXPANDING
    riskLevel: medium
    rule:
      from: "sin(add(?A, ?B))"
      to: "add(mul(sin(?A), cos(?B)), mul(cos(?A), sin(?B)))"
    validation:
      examples:
        - from: "sin(add(u, v))"
          to: "add(mul(sin(u), cos(v)), mul(cos(u), sin(v)))"
  - id: sympy.trig.sin_diff
    derivationType: REIMPLEMENTED_RULE
    status: REVIEWED
    searchEffects:
      - EXPANDING
    riskLevel: medium
    rule:
      from: "sin(sub(?A, ?B))"
      to: "sub(mul(sin(?A), cos(?B)), mul(cos(?A), sin(?B)))"
    validation:
      examples:
        - from: "sin(sub(u, v))"
          to: "sub(mul(sin(u), cos(v)), mul(cos(u), sin(v)))"
  - id: sympy.trig.cos_sum
    derivationType: REIMPLEMENTED_RULE
    status: REVIEWED
    searchEffects:
      - EXPANDING
    riskLevel: medium
    rule:
      from: "cos(add(?A, ?B))"
      to: "sub(mul(cos(?A), cos(?B)), mul(sin(?A), sin(?B)))"
    validation:
      examples:
        - from: "cos(add(u, v))"
          to: "sub(mul(cos(u), cos(v)), mul(sin(u), sin(v)))"
  - id: sympy.trig.cos_diff
    derivationType: REIMPLEMENTED_RULE
    status: REVIEWED
    searchEffects:
      - EXPANDING
    riskLevel: medium
    rule:
      from: "cos(sub(?A, ?B))"
      to: "add(mul(cos(?A), cos(?B)), mul(sin(?A), sin(?B)))"
    validation:
      examples:
        - from: "cos(sub(u, v))"
          to: "add(mul(cos(u), cos(v)), mul(sin(u), sin(v)))"
