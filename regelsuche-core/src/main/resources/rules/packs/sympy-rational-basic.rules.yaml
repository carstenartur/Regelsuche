categories:
  - rational-simplification
rules:
  - id: sympy.rational.partial_fraction_adjacent
    sourceReference: Standard adjacent-factor partial fraction identity, retained as candidate pending denominator assumptions.
    derivationType: REIMPLEMENTED_RULE
    status: CANDIDATE
    searchEffects:
      - BRIDGING
    riskLevel: high
    rule:
      from: "1/(?A*(?A+1))"
      to: "1/?A - 1/(?A+1)"
  - id: sympy.rational.rationalize_sqrt_denominator
    sourceReference: Standard radical-denominator rationalization identity, retained as candidate pending nonzero denominator assumptions.
    derivationType: REIMPLEMENTED_RULE
    status: CANDIDATE
    searchEffects:
      - BRIDGING
    riskLevel: high
    rule:
      from: "1/(sqrt(?A)+?B)"
      to: "(sqrt(?A)-?B)/(?A-?B^2)"
