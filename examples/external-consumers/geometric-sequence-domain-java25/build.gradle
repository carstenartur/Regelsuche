plugins {
    id 'application'
}

repositories {
    maven {
        url = uri(providers.gradleProperty('regelsucheRepository')
            .orElse(layout.projectDirectory.dir('repository').asFile.absolutePath)
            .get())
    }
    mavenCentral()
}

def regelsucheVersion = providers.gradleProperty('regelsucheVersion')
    .getOrElse('0.4.0-SNAPSHOT')

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

dependencies {
    implementation "de.regelsuche:regelsuche-discovery-sdk:${regelsucheVersion}"

    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'example.GeometricSequenceExample'
}

tasks.named('test') {
    useJUnitPlatform()
}
