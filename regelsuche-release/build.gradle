plugins {
    id 'java-library'
    id 'application'
    id 'jacoco'
}

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    mainClass = 'de.regelsuche.release.ReleaseReadinessMain'
}

dependencies {
    api project(':regelsuche-autopilot')
    api project(':regelsuche-discovery')
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.22.0'

    testImplementation libs.junit.jupiter
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

def hiddenRuleReport = project(':app').layout.buildDirectory
    .file('reports/hidden-rule-pilot/report.json')

project(':app').tasks.named('test') {
    outputs.file(hiddenRuleReport)
}

tasks.register('runReleaseReadiness', JavaExec) {
    group = 'verification'
    description = 'Evaluates all Regelsuche 0.2 evidence profiles fail-closed.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = application.mainClass
    args layout.buildDirectory.dir('reports/release-readiness')
        .get().asFile.absolutePath
}

tasks.register('runReleaseReadinessWithHiddenRuleEvidence', JavaExec) {
    group = 'verification'
    description = 'Evaluates release profiles with retained hidden-rule benchmark evidence.'
    dependsOn ':app:test'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = application.mainClass
    args layout.buildDirectory.dir('reports/release-readiness')
        .get().asFile.absolutePath,
        '--hidden-rule-report',
        hiddenRuleReport.get().asFile.absolutePath
}

tasks.register('runQualifiedReleaseReadiness', JavaExec) {
    group = 'verification'
    description = 'Runs independent candidate qualification and evaluates release profiles.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = application.mainClass
    args layout.buildDirectory.dir('reports/release-readiness-qualified')
        .get().asFile.absolutePath,
        '--qualify-candidate'
}

tasks.register('runQualifiedReleaseReadinessWithHiddenRuleEvidence', JavaExec) {
    group = 'verification'
    description = 'Runs hidden-rule binding and independent candidate qualification.'
    dependsOn ':app:test'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = application.mainClass
    args layout.buildDirectory.dir('reports/release-readiness-qualified')
        .get().asFile.absolutePath,
        '--hidden-rule-report',
        hiddenRuleReport.get().asFile.absolutePath,
        '--qualify-candidate'
}

tasks.register('verifyAutonomousCampaignRelease', JavaExec) {
    group = 'verification'
    description = 'Fails unless the qualified AUTONOMOUS_CAMPAIGN profile is ready.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = application.mainClass
    args layout.buildDirectory.dir('reports/release-readiness-verification')
        .get().asFile.absolutePath,
        '--qualify-candidate',
        '--require-ready'
}


tasks.register('runDomainGenericQualification', JavaExec) {
    group = 'verification'
    description = 'Runs the separate fail-closed multi-domain discovery qualification.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'de.regelsuche.release.DomainGenericQualificationMain'
    args layout.buildDirectory.dir('reports/domain-generic-qualification')
        .get().asFile.absolutePath
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy tasks.named('jacocoTestReport')
}

jacoco {
    toolVersion = '0.8.13'
}

tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test')
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
}

tasks.named('check') {
    dependsOn tasks.named('jacocoTestReport')
}

def autonomousDiscoveryWalkthroughOutput = providers.gradleProperty('walkthroughOutput')
    .orElse(layout.buildDirectory.dir('reports/autonomous-discovery-walkthrough')
        .map { it.asFile.absolutePath })

tasks.register('runAutonomousDiscoveryWalkthrough', JavaExec) {
    group = 'verification'
    description = 'Generate the qualified autonomous-discovery result card and evidence walkthrough.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'de.regelsuche.release.AutonomousDiscoveryWalkthroughMain'
    args autonomousDiscoveryWalkthroughOutput.get()
    def repositoryRevision = providers.gradleProperty('repositoryRevision').orNull
    if (repositoryRevision != null && !repositoryRevision.isBlank()) {
        args '--repository-revision', repositoryRevision
    }
}
