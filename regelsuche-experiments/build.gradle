plugins {
    id 'java-library'
    id 'jacoco'
}

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

dependencies {
    api project(':regelsuche-search')
    api project(':regelsuche-validation')
    api project(':regelsuche-discovery')

    testImplementation project(':regelsuche-math-algorithms')
    testImplementation libs.junit.jupiter
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy tasks.named('jacocoTestReport')
}

jacoco {
    toolVersion = '0.8.13'
}

tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test')
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
}

def historicalRediscoveryReportDirectory = layout.buildDirectory.dir(
    'reports/historical-rediscovery')
def historicalWitnessPruningReportDirectory = layout.buildDirectory.dir(
    'reports/historical-rediscovery-witness-pruning')
def historicalProductionSearchComparisonReportDirectory = layout.buildDirectory.dir(
    'reports/historical-rediscovery-production-search-comparison')
def historicalEqualWorkSearchComparisonReportDirectory = layout.buildDirectory.dir(
    'reports/historical-rediscovery-equal-work-search-comparison')
def historicalRewriteArchitectureDecisionReportDirectory = layout.buildDirectory.dir(
    'reports/historical-rewrite-architecture-decision')
def historicalRediscoveryOutputArgument =
    historicalRediscoveryReportDirectory.map { it.asFile.absolutePath }
def historicalEqualWorkOutputArgument =
    historicalEqualWorkSearchComparisonReportDirectory.map {
        it.asFile.absolutePath
    }
def historicalAtlasRunFile = historicalRediscoveryReportDirectory.map {
    it.file('historical-rediscovery-run.json')
}
def historicalAtlasJsonFile = historicalRediscoveryReportDirectory.map {
    it.file('historical-rediscovery-atlas.json')
}
def historicalWitnessPruningFile = historicalWitnessPruningReportDirectory.map {
    it.file('witness-pruning-diagnostic.json')
}
def historicalProductionSearchComparisonFile =
    historicalProductionSearchComparisonReportDirectory.map {
        it.file('production-search-comparison.json')
    }
def historicalEqualWorkSearchComparisonFile =
    historicalEqualWorkSearchComparisonReportDirectory.map {
        it.file('equal-work-search-comparison.json')
    }

def generateHistoricalRediscoveryAtlas = tasks.register(
    'generateHistoricalRediscoveryAtlas', JavaExec) {
    group = 'verification'
    description = 'Executes the frozen historical atlas, witness diagnosis and production-search comparison.'
    dependsOn tasks.named('classes')
    timeout = java.time.Duration.ofMinutes(10)
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'de.regelsuche.benchmark.DiscoveryExperimentRunner'
    argumentProviders.add({
        ['historical-rediscovery', historicalRediscoveryOutputArgument.get()]
    } as CommandLineArgumentProvider)
    inputs.file(layout.projectDirectory.file(
        'src/main/resources/de/regelsuche/benchmark/historical-rediscovery-corpus.json'))
    outputs.dir(historicalRediscoveryReportDirectory)
    outputs.dir(historicalWitnessPruningReportDirectory)
    outputs.dir(historicalProductionSearchComparisonReportDirectory)
    doLast {
        def comparison = historicalProductionSearchComparisonReportDirectory.get()
            .file('production-search-comparison.json').asFile
        if (!comparison.isFile()) {
            throw new GradleException('Missing production-search comparison artifact')
        }
    }
}

def generateHistoricalEqualWorkSearchComparison = tasks.register(
    'generateHistoricalEqualWorkSearchComparison', JavaExec) {
    group = 'verification'
    description = 'Executes fixed admitted-work checkpoints for the historical search-policy control.'
    dependsOn generateHistoricalRediscoveryAtlas
    dependsOn tasks.named('testClasses')
    timeout = java.time.Duration.ofMinutes(10)
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'de.regelsuche.benchmark.HistoricalEqualWorkSearchComparison'
    argumentProviders.add({
        [
            'equal-work-search-comparison',
            historicalEqualWorkOutputArgument.get()
        ]
    } as CommandLineArgumentProvider)
    inputs.file(layout.projectDirectory.file(
        'src/main/resources/de/regelsuche/benchmark/historical-rediscovery-corpus.json'))
    outputs.dir(historicalEqualWorkSearchComparisonReportDirectory)
    doLast {
        def report = historicalEqualWorkSearchComparisonReportDirectory.get()
            .file('equal-work-search-comparison.json').asFile
        if (!report.isFile()) {
            throw new GradleException('Missing equal-work search comparison artifact')
        }
    }
}

def generateHistoricalRewriteArchitectureDecision = tasks.register(
    'generateHistoricalRewriteArchitectureDecision', JavaExec) {
    group = 'verification'
    description = 'Derives the evidence-bound rewrite architecture decision from retained historical diagnostics.'
    dependsOn generateHistoricalEqualWorkSearchComparison
    dependsOn tasks.named('testClasses')
    timeout = java.time.Duration.ofMinutes(1)
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'de.regelsuche.benchmark.HistoricalRewriteArchitectureDecision'
    argumentProviders.add({
        [
            'rewrite-architecture-decision',
            historicalAtlasRunFile.get().asFile.absolutePath,
            historicalAtlasJsonFile.get().asFile.absolutePath,
            historicalWitnessPruningFile.get().asFile.absolutePath,
            historicalProductionSearchComparisonFile.get().asFile.absolutePath,
            historicalEqualWorkSearchComparisonFile.get().asFile.absolutePath,
            historicalRewriteArchitectureDecisionReportDirectory.get()
                .asFile.absolutePath
        ]
    } as CommandLineArgumentProvider)
    inputs.files(
        historicalAtlasRunFile,
        historicalAtlasJsonFile,
        historicalWitnessPruningFile,
        historicalProductionSearchComparisonFile,
        historicalEqualWorkSearchComparisonFile)
    outputs.dir(historicalRewriteArchitectureDecisionReportDirectory)
    doLast {
        def decision = historicalRewriteArchitectureDecisionReportDirectory.get()
            .file('rewrite-architecture-decision.json').asFile
        if (!decision.isFile()) {
            throw new GradleException('Missing rewrite architecture decision artifact')
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('jacocoTestReport')
    dependsOn generateHistoricalRediscoveryAtlas
    dependsOn generateHistoricalEqualWorkSearchComparison
    dependsOn generateHistoricalRewriteArchitectureDecision
}

// The repository merge gate invokes the root check rather than every
// subproject check. Bind the retained experiment chain explicitly so CI cannot
// pass without executing the atlas and its fail-closed downstream decisions.
rootProject.tasks.named('check') {
    dependsOn generateHistoricalRediscoveryAtlas
    dependsOn generateHistoricalEqualWorkSearchComparison
    dependsOn generateHistoricalRewriteArchitectureDecision
}
