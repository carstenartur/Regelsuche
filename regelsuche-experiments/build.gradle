plugins {
    id 'java-library'
    id 'jacoco'
}

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

dependencies {
    api project(':regelsuche-search')
    api project(':regelsuche-validation')
    api project(':regelsuche-discovery')

    testImplementation project(':regelsuche-math-algorithms')
    testImplementation libs.junit.jupiter
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy tasks.named('jacocoTestReport')
}

jacoco {
    toolVersion = '0.8.13'
}

tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test')
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
}

def historicalRediscoveryReportDirectory = layout.buildDirectory.dir(
    'reports/historical-rediscovery')
def historicalWitnessPruningReportDirectory = layout.buildDirectory.dir(
    'reports/historical-rediscovery-witness-pruning')
def historicalProductionSearchComparisonReportDirectory = layout.buildDirectory.dir(
    'reports/historical-production-search-comparison')
def historicalRediscoveryOutputArgument =
    historicalRediscoveryReportDirectory.map { it.asFile.absolutePath }
def historicalWitnessPruningOutputArgument =
    historicalWitnessPruningReportDirectory.map { it.asFile.absolutePath }
def historicalProductionSearchComparisonOutputArgument =
    historicalProductionSearchComparisonReportDirectory.map {
        it.asFile.absolutePath
    }

def generateHistoricalRediscoveryAtlas = tasks.register(
    'generateHistoricalRediscoveryAtlas', JavaExec) {
    group = 'verification'
    description = 'Executes the frozen historical reachability atlas and witness-prefix diagnosis.'
    dependsOn tasks.named('classes')
    timeout = java.time.Duration.ofMinutes(10)
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'de.regelsuche.benchmark.DiscoveryExperimentRunner'
    argumentProviders.add({
        ['historical-rediscovery', historicalRediscoveryOutputArgument.get()]
    } as CommandLineArgumentProvider)
    inputs.file(layout.projectDirectory.file(
        'src/main/resources/de/regelsuche/benchmark/historical-rediscovery-corpus.json'))
    outputs.dir(historicalRediscoveryReportDirectory)
    outputs.dir(historicalWitnessPruningReportDirectory)
}

def generateHistoricalProductionSearchComparison = tasks.register(
    'generateHistoricalProductionSearchComparison', JavaExec) {
    group = 'verification'
    description = 'Compares scalar and structural-diversity retention of frozen oracle witnesses.'
    dependsOn generateHistoricalRediscoveryAtlas
    timeout = java.time.Duration.ofMinutes(10)
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'de.regelsuche.benchmark.HistoricalProductionSearchComparison'
    argumentProviders.add({
        [
            historicalRediscoveryOutputArgument.get(),
            historicalWitnessPruningOutputArgument.get(),
            historicalProductionSearchComparisonOutputArgument.get()
        ]
    } as CommandLineArgumentProvider)
    inputs.dir(historicalRediscoveryReportDirectory)
    inputs.dir(historicalWitnessPruningReportDirectory)
    outputs.dir(historicalProductionSearchComparisonReportDirectory)
}

tasks.named('check') {
    dependsOn tasks.named('jacocoTestReport')
    dependsOn generateHistoricalProductionSearchComparison
}

// The repository merge gate invokes the root check rather than every
// subproject check. Bind the retained experiments explicitly so CI cannot pass
// without executing the atlas, witness diagnosis and matched-budget comparison.
rootProject.tasks.named('check') {
    dependsOn generateHistoricalProductionSearchComparison
}
