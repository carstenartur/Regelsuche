<svg xmlns="http://www.w3.org/2000/svg" width="600" height="199" viewBox="0 0 600 199" role="img" aria-labelledby="title description"><title id="title">Candidate-slot allocation</title><desc id="description">Full observation batch (dark) and paired observations (light), with exact counts shown in this order.</desc><rect width="600" height="199" fill="white"/><g font-family="sans-serif" font-size="15" fill="#172e3b"><text x="12" y="24" font-weight="bold">Candidate slots allocated to the full batch / pair</text><g><title>Feedback: full batch 11 slots, paired observations 1 slots</title><text x="12" y="64">Feedback</text><rect x="176" y="48" width="291.5" height="22" fill="#275878"/><rect x="467.5" y="48" width="26.5" height="22" fill="#b9d6e3"/><text x="510" y="64">11 / 1</text></g><g><title>Equal candidate slots: full batch 6 slots, paired observations 6 slots</title><text x="12" y="112">Equal candidate slots</text><rect x="176" y="96" width="159" height="22" fill="#275878"/><rect x="335" y="96" width="159" height="22" fill="#b9d6e3"/><text x="510" y="112">6 / 6</text></g><g><title>No feedback: full batch 11 slots, paired observations 1 slots</title><text x="12" y="160">No feedback</text><rect x="176" y="144" width="291.5" height="22" fill="#275878"/><rect x="467.5" y="144" width="26.5" height="22" fill="#b9d6e3"/><text x="510" y="160">11 / 1</text></g></g></svg>
